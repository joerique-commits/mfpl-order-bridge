<!doctype html>
<html><head><meta charset="utf-8"><title>Order Bridge Login Test</title>
<style>
body{font-family:sans-serif;max-width:500px;margin:40px auto;padding:0 20px;}
input{width:100%;box-sizing:border-box;padding:8px;margin-top:4px;font-size:14px;}
button{margin-top:16px;padding:10px 18px;font-weight:600;}
pre{margin-top:16px;padding:12px;background:#f0f0f0;border-radius:6px;white-space:pre-wrap;word-break:break-word;}
</style></head>
<body>
<h2>Order Bridge - Live Login Test</h2>
<p>This page is served from the live site itself, so it's same-origin with the API - no CORS concerns. Enter credentials and click Test; nothing here leaves your browser except the request to /api/auth/login.</p>
<label>Email<input id="email" type="email" value="joe@magari.in"></label>
<label>Password<input id="password" type="password"></label>
<button id="go">Test login</button>
<pre id="out"></pre>
<script>
document.getElementById('go').addEventListener('click', async () => {
  const out = document.getElementById('out');
  out.textContent = 'Sending...';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
    });
    const text = await res.text();
    let pretty = text;
    try { pretty = JSON.stringify(JSON.parse(text), null, 2); } catch(e) {}
    out.textContent = 'HTTP ' + res.status + '\n\n' + pretty;
  } catch (e) {
    out.textContent = 'Request failed: ' + e.message;
  }
});
</script>
</body></html>
