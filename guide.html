<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Order Bridge Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: one guide, three views — a team manual (task cards with numbered steps), the swimlane workflow map, and one rules table every manual points into. Start screen picks language, then team. Accent is the yellow of the factory's paper job card. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --ink: #1f2a2e;
  --ink-soft: #55636a;
  --line: #d9ddd6;
  --accent: #f2c200;
  --accent-ink: #3a2f00;
  --focus: #1c6dd0;
  --l-customer: #e8eef6; --l-sales: #eaf3ec; --l-supply: #e9eef8; --l-factory: #fbf3d8; --l-accounts: #f3ebf6; --l-approver: #f8ebe7; --l-admin: #eceeee;
  --d-customer: #3c6aa8; --d-sales: #2f7d4a; --d-supply: #3557a8; --d-factory: #9a7400; --d-accounts: #7d4c96; --d-approver: #b0503a; --d-admin: #4d5a60;
  --font-display: "Archivo", "Noto Sans Kannada", "Noto Sans Devanagari", "Nirmala UI", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", "Noto Sans Kannada", "Noto Sans Devanagari", "Nirmala UI", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b1d; --panel: #1f2629; --ink: #e8ecea; --ink-soft: #a3b0b4; --line: #34403f; --accent: #f2c200; --accent-ink: #1d1700; --focus: #6ea8ff;
  --l-customer: #1f2a38; --l-sales: #1d2c22; --l-supply: #1e2536; --l-factory: #2e2914; --l-accounts: #2a2131; --l-approver: #33231f; --l-admin: #262c2e;
  --d-customer: #8db5ea; --d-sales: #7fcf98; --d-supply: #93acf0; --d-factory: #f2c200; --d-accounts: #c9a3de; --d-approver: #f0a08c; --d-admin: #b5c0c4;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161b1d; --panel: #1f2629; --ink: #e8ecea; --ink-soft: #a3b0b4; --line: #34403f; --accent: #f2c200; --accent-ink: #1d1700; --focus: #6ea8ff;
  --l-customer: #1f2a38; --l-sales: #1d2c22; --l-supply: #1e2536; --l-factory: #2e2914; --l-accounts: #2a2131; --l-approver: #33231f; --l-admin: #262c2e;
  --d-customer: #8db5ea; --d-sales: #7fcf98; --d-supply: #93acf0; --d-factory: #f2c200; --d-accounts: #c9a3de; --d-approver: #f0a08c; --d-admin: #b5c0c4;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; }
.brand { font: 800 17px/1 var(--font-display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .sq { width: 14px; height: 18px; background: var(--accent); border-radius: 2px; display: inline-block; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { background: transparent; border: 0; padding: 7px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
.tabs button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.langsw { margin-left: auto; display: flex; gap: 4px; }
.langsw button { border: 1px solid var(--line); background: transparent; padding: 5px 10px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.langsw button[aria-pressed="true"] { border-color: var(--ink); background: var(--accent); color: var(--accent-ink); }

.view { padding-block: 22px 56px; }
.eyebrow { font: 600 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1 { font: 800 clamp(26px, 3.4vw, 40px)/1.08 var(--font-display); margin: 6px 0 0; letter-spacing: -.01em; text-wrap: balance; }
h1 .tag { display: inline-block; background: var(--accent); color: var(--accent-ink); padding: 0 .28em; border-radius: 3px; }
.lede { max-width: 64ch; color: var(--ink-soft); margin: 8px 0 0; }
.notice { margin: 14px 0 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 14px; max-width: 80ch; font-size: 14.5px; }

/* start screen */
.start { max-width: 880px; margin: 0 auto; padding-block: 48px 64px; }
.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 22px; }
.pick button { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px 18px; cursor: pointer; display: grid; gap: 4px; }
.pick button:hover { border-color: var(--ink); }
.pick .big { font: 700 24px/1.15 var(--font-display); }
.pick .small { color: var(--ink-soft); font-size: 14px; }
.pick button[data-lane] { border-left: 6px solid var(--lc); }
.step-ind { font: 600 13px var(--font-mono); color: var(--ink-soft); margin-bottom: 4px; }
.linkbtn { background: none; border: 0; color: var(--focus); cursor: pointer; padding: 0; font-weight: 600; text-decoration: underline; }

/* manual */
.mhead { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; }
.roles { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 6px; }
.chip { font-weight: 600; font-size: 14px; border: 1.5px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ink-soft)); display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.mgrid { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; margin-top: 16px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.toc b { display: block; font: 700 13px var(--font-display); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; margin: 4px 4px 8px; }
.toc a { display: block; padding: 5px 6px; border-radius: 5px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.3; }
.toc a:hover { background: var(--bg); }
.day { background: var(--lt); border: 1px solid var(--line); border-left: 6px solid var(--lc); border-radius: 10px; padding: 14px 18px; }
.day h2 { font: 700 19px/1.2 var(--font-display); margin: 0 0 6px; }
.day ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; scroll-margin-top: 90px; }
.task h3 { font: 700 19px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.task .when { color: var(--ink-soft); font-size: 14px; margin: 3px 0 8px; }
.where { font: 500 13px/1.4 var(--font-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; display: inline-block; margin-bottom: 8px; word-break: break-word; }
.task ol { margin: 0; padding-left: 22px; display: grid; gap: 5px; max-width: 78ch; }
.btnname { font-weight: 700; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ref { font: 600 12.5px var(--font-mono); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
.mapref { font: 600 12.5px var(--font-mono); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; cursor: pointer; }

/* rules */
.rtable { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.rtable th, .rtable td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--line); }
.rtable th { font: 700 13px var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); background: var(--bg); border-top: 0; }
.rtable td.id { font: 700 13px var(--font-mono); white-space: nowrap; }
.rtable tr.hl td { background: var(--accent); color: var(--accent-ink); }
.rtable td.who { font-size: 13.5px; color: var(--ink-soft); white-space: nowrap; }
.tablewrap { overflow-x: auto; margin-top: 16px; border-radius: 10px; }
.rtable tr { scroll-margin-top: 90px; }

/* map */
.mmain { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; margin-top: 16px; }
.mapbox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.map { display: grid; grid-template-columns: 132px repeat(5, minmax(170px, 1fr)); min-width: 1000px; }
.map .sh { background: var(--panel); padding: 12px 10px 10px; border-bottom: 2px solid var(--ink); }
.map .sh b { display: block; font: 700 15px/1.15 var(--font-display); }
.map .sh span { font-size: 12.5px; color: var(--ink-soft); }
.map .corner { border-bottom: 2px solid var(--ink); }
.lane { padding: 12px 10px; border-top: 1px solid var(--line); font: 700 14px/1.2 var(--font-display); color: var(--lc); background: var(--lt); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.lane small { font: 400 12px var(--font-body); color: var(--ink-soft); }
.cell { border-top: 1px solid var(--line); border-left: 1px dashed var(--line); padding: 8px; display: flex; flex-direction: column; gap: 7px; background: var(--lt); min-height: 54px; }
.step { text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--lc); border-radius: 6px; padding: 7px 9px 8px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: start; transition: opacity .15s, transform .15s; }
.step .n { font: 700 12px/1 var(--font-mono); background: var(--ink); color: var(--bg); border-radius: 4px; padding: 4px 5px; margin-top: 1px; }
.step .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.step .w { grid-column: 2; font: 400 11.5px/1.35 var(--font-mono); color: var(--ink-soft); }
.step:hover { transform: translateY(-1px); }
.step[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.map.filtered .step.dim { opacity: .22; }
.map.filtered .lane.dim { opacity: .45; }
.opt { font: 600 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
aside.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; }
.detail .who { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--lc); }
.detail .who i { width: 9px; height: 9px; border-radius: 50%; background: var(--lc); }
.detail h2 { font: 700 21px/1.15 var(--font-display); margin: 6px 0 8px; text-wrap: balance; }
.detail ul { margin: 0 0 10px; padding-left: 18px; display: grid; gap: 5px; }
.detail .next { border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }
.navbtns { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.navbtns button { font-weight: 600; font-size: 13px; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.navbtns button:disabled { opacity: .35; cursor: default; }
.lower { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 22px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.box h3 { font: 700 17px/1.2 var(--font-display); margin: 0 0 4px; }
.box .sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 10px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.flow li { display: grid; grid-template-columns: 112px 1fr; gap: 8px; font-size: 14px; align-items: baseline; }
.flow .r { font: 600 12px var(--font-mono); color: var(--lc); text-transform: uppercase; letter-spacing: .04em; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
footer { color: var(--ink-soft); font-size: 13px; padding-block: 0 32px; }

[data-lane="customer"] { --lc: var(--d-customer); --lt: var(--l-customer); }
[data-lane="sales"] { --lc: var(--d-sales); --lt: var(--l-sales); }
[data-lane="supply"] { --lc: var(--d-supply); --lt: var(--l-supply); }
[data-lane="factory"] { --lc: var(--d-factory); --lt: var(--l-factory); }
[data-lane="accounts"] { --lc: var(--d-accounts); --lt: var(--l-accounts); }
[data-lane="approver"] { --lc: var(--d-approver); --lt: var(--l-approver); }
[data-lane="admin"] { --lc: var(--d-admin); --lt: var(--l-admin); }

.stage-m { display: none; }
@media (max-width: 1100px) { .mmain { grid-template-columns: minmax(0, 1fr); } aside.detail { position: static; } }
@media (max-width: 820px) { .mgrid { grid-template-columns: minmax(0, 1fr); } .toc { position: static; } .langsw { margin-left: 0; } }
@media (max-width: 700px) {
  .mapbox { border: 0; background: transparent; overflow: visible; }
  .map { display: flex; flex-direction: column; min-width: 0; }
  .map .sh, .map .corner, .lane { display: none; }
  .map .stage-m { display: block; font: 700 16px/1.2 var(--font-display); margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
  .cell { background: transparent; border: 0; padding: 0 0 6px; min-height: 0; }
  .cell:empty { display: none; }
  .step .w::before { content: attr(data-who) " · "; color: var(--lc); font-weight: 500; }
  .flow li { grid-template-columns: 1fr; gap: 0; }
  .rtable td.who { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { .step { transition: none; } .step:hover { transform: none; } }
</style>
</head><body>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="brand"><span class="sq"></span><span id="brandName">Order Bridge Guide</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="langsw" id="langsw" role="group" aria-label="Language"></div>
  </div>
</div>
<main id="app"></main>
<script>
const DATA = {"en": {"ui": {"pickLang": "Choose your language", "pickLangSub": "You can change it any time from the top bar.", "pickRole": "Which team are you in?", "pickRoleSub": "This opens your team's manual. Every team's manual is one tap away.", "step1": "Step 1 of 2", "step2": "Step 2 of 2", "back": "Change language", "tabManual": "My manual", "tabMap": "Workflow map", "tabRules": "Rules", "draftLang": "This translation is a first draft and is being reviewed. If anything is unclear, the English version is the reference.", "manualTitle": "manual", "yourDay": "Your day", "tasks": "Tasks", "seeMap": "Map step", "rulesTitle": "Rules", "rulesSub": "The rules every manual refers to. Click a rule number in a manual to jump here.", "thRule": "#", "thWhat": "Rule", "thWho": "Applies to", "mapTitle1": "From sales order to ", "mapTitle2": "delivered", "mapSub": "Who does what, in which screen, and who it goes to next. Pick a team to see its steps; click any step for the details.", "showFor": "Show steps for", "openManual": "Manual", "everyone": "Everyone", "next": "Next:", "prev": "← Previous", "nextB": "Next →", "stepW": "Step", "ifNeeded": "if needed", "footer": "Order Bridge · mfpl-order-bridge.edgeone.dev · Guide as of 13 Nov 2026. Screen and button names are shown in English, as in the app.", "dates": "Live from Mon 2 Nov 2026 · all order tracking is done in Order Bridge", "goLive": "From 2 Nov 2026 all order tracking happens only in Order Bridge. The old Upholstery Tag Station is retired: its tags (15 Sep – 31 Oct) were brought in, and new tags are made here."}, "lanes": {"customer": ["Customer", "site form only"], "sales": ["Sales", ""], "supply": ["Supply Chain", ""], "factory": ["Factory", "Production"], "accounts": ["Accounts", ""], "approver": ["COO / Director", "approvals"], "admin": ["Admin / MIS", ""]}, "blurb": {"sales": "PO requests, client dates, factory date requests, clarifications, stock blocks, SO revisions, site details, dispatch slots, payments.", "supply": "POs in the ERP, the Unmatched list, stock, furnishings, QC report tick, warehouse receipt, bookings, dispatch and delivery.", "factory": "Clarifications, job cards, factory dates, furnishings receipt, tagging finished goods.", "accounts": "SO revision sign-off, payment confirmation, approvals, invoice and e-way bill.", "approver": "SO revision approvals and dispatches with a balance due.", "admin": "Daily data, users, permissions, locations, keys, job card imports and backups."}, "rules": {"R1": ["Sales", "A SKU needs its client date before it can be sent for a PO. Choose 45, 60, 75, 90 or 120 days (counted from the request date, then fixed) or pick a date."], "R2": ["Sales", "Only SKUs on the SO can be requested. Anything not on the SO goes through SO Revision Request."], "R3": ["Supply", "Supply doesn't type PO numbers. After \"Mark PO raised in ERP\", the next data refresh finds the PO line and links it. Anything that can't be matched shows in PO Progress Tracker › Unmatched."], "R4": ["Factory, Sales", "The factory can raise clarifications for 15 working days from the PO date. Production starts only when no clarification is open."], "R5": ["Factory, Sales", "Factory date: within 20 days of an MFPL PO the factory agrees to the client date or proposes its own date, for one SKU or the whole PO. Sales accepts, or rejects and suggests a date. The factory can send one second proposal; after that, sales' final date binds. With no answer in 20 days, the client date minus 5 days is taken automatically."], "R6": ["Everyone", "There are 5 days between the two dates: factory date + 5 = the date the goods can reach the client. Sales see dates on the client side, the factory sees its own date, and Supply and Admin see both."], "R7": ["Factory, Sales", "Changing a confirmed factory date: the factory can request a deviation until 10 days before that date (one request at a time). In the last 10 days the date is locked. A SKU date may be later than the PO's date: once sales accepts it, that SKU follows its own date and the PO date stays the limit for the PO's other SKUs. An admin can allow the factory one more deviation request, even inside the last 10 days; sales still accepts or rejects it."], "R8": ["Everyone", "Delay risk is flagged on MFPL factory POs: will miss the client date; stages behind (under 30 / 15 / 7 days left and polishing, factory QC or packing not started); fabric not sent while the job card is at Post Frame or later; no job card 15 days after the PO; factory date more than 75 days after the PO."], "R9": ["Sales, Supply", "An approved stock block counts that SKU as covered, so no PO is needed for it. If a PO line for the same code + FIN (for example AARA → AARAFIN) appears on the same SO, the block shows \"Issued to factory — FIN PO …\", stops counting as blocked stock, and the FIN line follows the normal factory flow. When that SKU is dispatched to the customer through Order Bridge (marked dispatched), the block shows \"Dispatched to customer\" with the date and stops counting as blocked; a part dispatch leaves the rest blocked."], "R10": ["Factory, Supply", "A scanned job card is never saved unchecked. Check every field against the photo, especially the amber ones. Photographing the card again updates the same card; dates and signatures once saved stay."], "R11": ["Everyone", "The job card stage shown in PO Progress Tracker and Order Deadlines is the furthest stage that has both a start date, an end date and at least one signature."], "R12": ["Supply, Sales", "A furniture SKU made by the factory is ready for a dispatch or installation slot only when Supply has ticked \"QC report generated\" for it in Order Deadlines (after packing is closed). Its warehouse tags can only be made after the tick. A furniture SKU with no job card stays not ready until it is ticked."], "R13": ["Supply, Factory", "Furnishings and warehouse tags move whole: no part quantities. Challan and receipt numbers are made by the app; reprint challans from the Logbook."], "R14": ["Supply, Admin", "\"Mark dispatched\" stays locked until the Dispatch Day checks are complete. Only an admin can override, with a reason of 3 or more words that is logged. Dispatch Day to-dos appear from 48 hours before the dispatch date; the checks can be done earlier."], "R15": ["Sales, COO / Director, Accounts", "If more than ₹1 is unpaid at dispatch, a COO / Director must approve. The link is valid for 48 hours; rejecting needs a comment; Accounts then validates. If the unpaid amount grows past what was approved, a new approval is needed."], "R16": ["Accounts", "The invoice and e-way bill step opens once Supply's ERP numbers are in and the payment is settled: fully paid and confirmed; nothing received but approval validated; or part paid and confirmed with approval validated for the rest. The invoice number is always required. The e-way bill is 12 digits, or \"Not required\" with a reason."], "R17": ["Sales, Supply", "Dispatch and installation can't be requested on blocked dates, and only in the windows set in Slot settings. A dispatch after the client date needs a reason. The tracking link can be a link or NA; without one, give the transport POC."], "R18": ["Sales, Customer", "Each site-details link belongs to one SO. Each piece is checked with 5 inches added to every side: against the lift, or with no lift, against the stairs (its smallest side must pass the stair width and it must fit the landing length, breadth and height). A piece that doesn't fit needs an override reason of 3 or more words."], "R19": ["Everyone", "The page updates itself: other people's changes appear within 2 minutes, and at once when you come back to the tab. It waits while you are typing. New ERP data, and PO requests added or linked by others, show a bar asking you to refresh. ERP data is as fresh as the last daily upload. In every CSV download, SO and PO numbers keep all their digits in Excel."], "R20": ["Sales, Supply, Accounts, COO / Director", "An SO revision needs the COO / Director's approval first. Then Accounts reconciles the order value and advance and approves (the revised SO is raised in the ERP). Then Supply confirms the PO cancellation. The revision stays open until Supply confirms."], "R21": ["Everyone", "POs raised before 2 Nov 2026: their SKU details were shared by email, so only their dates can be revised here, within these rules. Their 20-day factory window and the 15-day job card check count from 2 Nov. Their fabric is judged by the tags on the PO line: no tag means no fabric needed."], "R22": ["Factory, Supply", "Material readiness (PO Progress Tracker › Readiness C0–C4) is shared by the factory and supply. Each open factory SKU line gets C0–C4 and a \"Next\" label saying whose move it is: Factory (job card, raw material, confirming fabric received), Supply (logging or sending fabric) or Sales (fabric details missing). The raw-material tick follows the latest line the factory writes in the job card's Material Used table: \"RM Available\" ticks it, \"RM Not Available\" unticks it. To change it, cross out the old line and write the new one below; the next scan picks it up. Each line shows the date of the scan it comes from."], "R23": ["Sales, Admin, Factory, Supply", "Changing fabric, finish, cane weave or stone after the PO is raised: sales asks an admin to reopen the field, with a reason; the admin accepts or rejects, with a reason. A field can only be reopened while the job card shows no work on its stage — Upholstery for fabric, Polishing for finish and stone, Post Frame for cane weave (no job card = no work yet). Sales changes only the reopened fields and saves; the factory and supply both press \"Seen revised spec\". Before the PO is raised, an admin can send a request back to draft instead."], "R24": ["Admin, Factory, Supply", "Corrections to furnishings tags, warehouse tags and job cards: an admin proposes the change with a reason; the team that owns the record accepts or rejects it with a reason — supply for furnishings tags, the factory for warehouse tags and job cards. Nothing changes until it is accepted. A tag that has already moved can only be voided (then log a new one). Quantities are never edited. If printed details change, reprint the tag. A later job card scan keeps an admin correction and shows both values."]}, "man": {"sales": {"day": ["Open the Dashboard: your to-dos are under \"Needs action\"; the bell also shows notices, such as fabric sent to or received at the factory.", "Check new SOs in PO Progress Tracker and send their SKUs for PO.", "Answer the factory's date proposals and clarifications.", "Keep Last Mile moving: site details, dispatch slots, Dispatch Day payments."], "tasks": [{"id": "s-req", "t": "Send a SKU for PO", "when": "For every SKU on a new SO that isn't on a PO yet.", "where": "PO Progress Tracker › open the SO › Still to raise", "steps": ["Open ⟦PO Progress Tracker⟧ and click the SO (use the ⟦No PO raised⟧ or ⟦Part PO raised⟧ filters).", "On the SKU, press ⟦Start PO request⟧.", "Fill in the fabric (the material SKU fills itself), polish / finish, stone if any, and design instructions. Add site requirements if needed. Cane weave (NA, Round Hole, German Mesh or Other) and stone (NA, a stone from the list, Stone sent by client, or Other) are required too.", "Set the Committed date to client.", "Press ⟦Send to supply for PO⟧. To drop an unsent draft, press ⟦Discard draft⟧."], "rules": ["R1", "R2"], "map": [2]}, {"id": "s-cd", "t": "Set or change a client date", "when": "On SKUs already on a PO, or for all lines of an SO at once.", "where": "PO Progress Tracker › SO › Committed date to client", "steps": ["Open the SO and set the date for the line, or use \"Committed date to client — all lines on a PO\" and ⟦Apply to every line⟧.", "Order Deadlines and the delay-risk checks measure the factory date against this date."], "rules": ["R1", "R6", "R21"], "map": [2]}, {"id": "s-dl", "t": "Answer the factory's date proposal", "when": "When the factory proposes a date or asks for a deviation (it appears in Needs action).", "where": "Order Deadlines › SO › PO › SKU", "steps": ["Open the to-do. The proposal shows the date, the reason and who sent it.", "Press ⟦Accept⟧, or ⟦Reject & suggest a date⟧ with the date you can commit to the client.", "After the factory's second proposal, press ⟦Accept⟧ or ⟦Reject & set the final date⟧: your final date binds.", "A SKU may get a date later than its PO's date. If you accept it, that SKU follows its own date; the other SKUs keep the PO date."], "rules": ["R5", "R6", "R7"], "map": [8]}, {"id": "s-clar", "t": "Answer a clarification", "when": "When the factory raises one (it appears in Needs action).", "where": "PO Progress Tracker › order", "steps": ["Open the order from the to-do.", "Reply to the question. The factory closes the clarification when it's clear."], "rules": ["R4"], "map": [5]}, {"id": "s-sb", "t": "Block stock instead of raising a PO", "when": "When the item is already in a warehouse.", "where": "Stock Block Station › Request a stock block", "steps": ["Choose the Sales order, Article and Warehouse.", "Enter the Quantity to block and a Reason.", "Press ⟦Submit request⟧. Supply approves or rejects it.", "If the stock is later sent to the factory on a FIN PO, the block shows \"Issued to factory\"."], "rules": ["R9"]}, {"id": "s-rev", "t": "Revise an SO", "when": "Quantity change, extra discount, design change or new SKU, client detail change, or splitting the SO for part POs.", "where": "SO Revision Request › Raise a revision request", "steps": ["Enter the Old SO number and the new SO(s).", "Choose the Reason for Revision and write the Background Details.", "Press ⟦Create approval link for COO / Director⟧ and send the link (copy or WhatsApp).", "If it is sent back, fix it and resubmit."], "rules": ["R20"]}, {"id": "s-reopen", "t": "Change fabric, finish, cane weave or stone after the PO", "when": "The customer changes their mind after the PO is raised.", "where": "PO Progress Tracker › SKU line › Spec revisions", "steps": ["Open the SKU line. Under Spec revisions, tick the fields to change (a field is greyed out once the factory has started that stage) and write the reason. Press ⟦Ask admin to reopen⟧.", "When an admin reopens them, change only those fields in the form and press ⟦Save revision⟧ — or ⟦Cancel — keep the old details⟧.", "The factory and supply then acknowledge the revised spec; you can see when they do."], "rules": ["R23"]}, {"id": "s-site", "t": "Get site details from the customer", "when": "Before booking the dispatch.", "where": "Last Mile Ops › Site Details", "steps": ["Choose the Sales order.", "Press ⟦Copy link⟧ and send it to the customer on WhatsApp.", "When the customer submits, the details appear under \"Site details by sales order\"."], "rules": ["R18"], "map": [15, 16]}, {"id": "s-slot", "t": "Request a dispatch slot or installation", "when": "When the goods are ready, or when the customer wants a date.", "where": "Last Mile Ops › Dispatch / Installation", "steps": ["Open the Dispatch tab (or Installation) and choose the Sales order.", "Pick a date and window, and the items. The Ready? column shows what is ready; a factory-made furniture SKU is ready only after Supply's QC report tick.", "If a piece is too large for the lift or stairs, leave it out or give an override reason.", "Submit. Supply approves the booking and assigns the vendor."], "rules": ["R12", "R17", "R18"], "map": [17]}, {"id": "s-dd", "t": "Run the Dispatch Day payment check", "when": "Before every dispatch. The to-do appears 48 hours before the dispatch date; you can start earlier.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Choose the Sales order and its Dispatch slot, then ⟦Start Dispatch Day check⟧.", "The balance is prefilled. Add each payment received (amount, date, mode, transaction details) and submit to Accounts.", "If anything stays unpaid, write a reason and create the COO / Director approval link; share it.", "If Accounts sends a payment back, correct it and resubmit."], "rules": ["R14", "R15"], "map": [19]}, {"id": "s-csv", "t": "Download a list", "when": "When you need the orders in Excel.", "where": "PO Progress Tracker", "steps": ["Pick the filter chip and search you want.", "Press ⟦Download lines CSV⟧: one row per SKU line of the SOs on screen, with your dates, the job card stage and delay risk."], "rules": ["R19"]}]}, "supply": {"day": ["Open the Dashboard: to-dos under \"Needs action\".", "Mark POs raised in the ERP; clear the Unmatched list after each data refresh.", "Track factory dates in Order Deadlines; tick \"QC report generated\" for packed furniture SKUs. Check Readiness C0–C4 with the factory.", "Furnishings in and out; warehouse receipts.", "Approve bookings, enter ERP dispatch numbers, mark dispatched and delivered."], "tasks": [{"id": "u-po", "t": "Mark a PO as raised", "when": "After you raise the PO in the ERP for a request from Sales.", "where": "PO Progress Tracker › request", "steps": ["Raise the PO in the ERP as usual.", "Open the request and press ⟦Mark PO raised in ERP⟧. Don't type the PO number.", "The next data refresh links the PO line to the request."], "rules": ["R3"], "map": [3]}, {"id": "u-cover", "t": "Close a SKU that needs no new PO", "when": "The SKU is already on another PO, supplied from stock, or removed from the order.", "where": "PO Progress Tracker › SO › Still to raise", "steps": ["Press ⟦Already on a PO⟧ and pick the PO line, or ⟦No PO needed⟧ with the reason.", "Undo is available if you picked wrong."], "rules": ["R9"], "map": [3]}, {"id": "u-um", "t": "Clear the Unmatched list", "when": "After each data refresh.", "where": "PO Progress Tracker › Unmatched", "steps": ["Work through each section: requests waiting for a PO line, loose matches to confirm or reject, PO lines with no matching SKU, quantity mismatches.", "Link by picking from the lists. Use \"Not for an SO SKU\" to dismiss a PO line that isn't for a SKU."], "rules": ["R3"]}, {"id": "u-dl", "t": "Follow factory dates", "when": "Daily.", "where": "Order Deadlines", "steps": ["Sales and the factory agree the dates; you see both the client date and the factory date on every line.", "Use the list or the calendar, and the delay-risk column, to chase what is late."], "rules": ["R5", "R6", "R8"], "map": [8]}, {"id": "u-cat", "t": "Check material readiness (C0–C4)", "when": "Daily, with the factory.", "where": "PO Progress Tracker › Readiness C0–C4", "steps": ["Press ⟦Mine · Supply to act⟧ to see the lines waiting on supply: fabric with no tag yet, or tagged but not sent to the factory.", "Open a sales order to see each line's job card, raw material, fabric and category. The factory sees the same view and owns the raw-material tick."], "rules": ["R22"]}, {"id": "u-qc", "t": "Tick \"QC report generated\"", "when": "When the QC report is done for a furniture SKU whose job card shows packing closed.", "where": "Order Deadlines › SO › PO › SKU", "steps": ["Open the SKU line. Under the job card stage, tick ⟦QC report generated⟧. Nothing else needs to be entered.", "The SKU becomes ready for a dispatch or installation slot, and its warehouse tags can be made.", "A furniture SKU with no job card can be ticked when its QC report is done. Untick if it was ticked by mistake; every tick is recorded."], "rules": ["R12"], "map": [12]}, {"id": "u-sb", "t": "Approve or release a stock block", "when": "When Sales or the factory requests one.", "where": "Stock Block Station › Requests", "steps": ["Press ⟦Approve⟧ or ⟦Reject⟧.", "Press ⟦Release⟧ when the block is no longer needed. A block issued to the factory on a FIN PO shows the FIN PO and can't be released. A block whose SKU has been dispatched to the customer shows \"Dispatched to customer\"."], "rules": ["R9"]}, {"id": "u-rev", "t": "Check an SO revision", "when": "After Accounts approves the revision (the revised SO is raised in the ERP).", "where": "SO Revision Request", "steps": ["Check that the PO on the old SO is cancelled (or that none needs cancelling).", "Write a note and press ⟦Mark done⟧. The revision stays open until you do."], "rules": ["R20"]}, {"id": "u-ack", "t": "Acknowledge a revised spec", "when": "Needs action shows \"Revised spec to acknowledge\".", "where": "PO Progress Tracker › SKU line", "steps": ["Open it and check the before / after table.", "Press ⟦Seen revised spec⟧. If old fabric tags are listed, return or re-use that fabric."], "rules": ["R23"]}, {"id": "u-fin", "t": "Log furnishings and print tags", "when": "When fabric or furnishings arrive.", "where": "Furnishings Tag Station › Intake", "steps": ["Choose the Furnishings PO and the upholstery / material (or tick Fabric sent by client, or MFPL Direct Order).", "Enter quantity and unit, then the Furniture PO and product it is for. Choose Received at: where the delivery arrived (it shows as Logged in the Logbook).", "Press ⟦Add to log & generate tag⟧ and stick the tag on the roll."], "rules": ["R13"], "map": [9]}, {"id": "u-fdis", "t": "Send furnishings to the factory", "when": "When the factory needs the material.", "where": "Furnishings Tag Station › Dispatch", "steps": ["Scan each tag (⟦Scan a tag⟧) or type the tag ID and press ⟦Add⟧.", "Choose the Dispatcher address and the Receiver address.", "Generate the challan. It opens for printing; reprint any time from the Logbook. Sales get a notice."], "rules": ["R13"], "map": [10]}, {"id": "u-wrec", "t": "Receive goods at the warehouse", "when": "When a factory consignment arrives.", "where": "Warehouse Tag Station › Receipt", "steps": ["Scan or type each tag, or tick tags in transit.", "Press ⟦Add selected to receipt⟧ and confirm."], "rules": ["R13"], "map": [14]}, {"id": "u-book", "t": "Approve a dispatch or installation booking", "when": "When Sales requests a slot.", "where": "Last Mile Ops › Dispatch / Installation", "steps": ["Choose the vendor (In-house fleet/ Milk Run, APML, Installco Wify, Other) or installation crew (Installco Wify, MFPL, Other). For Other, type the name.", "Add the tracking link or NA, or the transport POC's name and number.", "Press ⟦Approve⟧ (or ⟦Reject⟧)."], "rules": ["R17"], "map": [18]}, {"id": "u-erp", "t": "Enter ERP dispatch numbers", "when": "For every Dispatch Day check, in parallel with the payment step.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Enter the dispatch sheet number, the dispatch PO (pick from PO Summary or type) and the installation PO if needed."], "rules": ["R14", "R16"], "map": [22]}, {"id": "u-dis", "t": "Dispatch and confirm delivery", "when": "On the dispatch day, after the checks.", "where": "Last Mile Ops › Dispatch", "steps": ["Press ⟦Print packing list⟧ for the truck.", "Press ⟦Mark dispatched⟧. It stays locked until the Dispatch Day checks are done.", "After delivery: upload the handover photo (POD) and press Mark delivered. If there is no usable photo, tick that the POD was received and give a reason.", "For installations: Mark installation completed, or \"Installed on the same visit\"."], "rules": ["R14"], "map": [24]}, {"id": "u-jc", "t": "Capture a job card (when needed)", "when": "Supply can capture job cards too.", "where": "Job Card Station › Capture & review", "steps": ["See the Factory manual: \"Capture a job card\"."], "rules": ["R10"], "map": [6]}, {"id": "u-corr", "t": "Accept or reject a correction", "when": "The Furnishings Tag Station shows Corrections.", "where": "Furnishings Tag Station › Corrections", "steps": ["Compare “Now” with “Corrected”.", "Press ⟦Accept⟧, or write the reason and press ⟦Reject⟧. If it asks, print the new tag and replace the old label."], "rules": ["R24"]}]}, "factory": {"day": ["Open the Dashboard: to-dos and the Production delay risk tiles. The bell tells you about each new MFPL PO and how many days are left to give your date.", "Review new POs and raise clarifications early.", "Agree or propose factory dates within 20 days of each PO.", "Photograph job cards as stages are filled in. Write the raw material status on the card (RM Available / RM Not Available).", "Receive furnishings; tag and send finished goods to the warehouse."], "tasks": [{"id": "f-dl", "t": "Agree or propose the factory date", "when": "Within 20 days of a new MFPL PO. The bell shows the days left, with a reminder at 5 days.", "where": "Order Deadlines › SO › PO", "steps": ["For the whole PO or one SKU, press ⟦Agree to …⟧ to take the client date minus 5 days, or ⟦Propose a date⟧.", "For a proposal, give the date and a reason and press ⟦Send to sales⟧. Sales accept, or reject and suggest a date.", "If sales suggest a date, press ⟦Accept sales' date⟧ or ⟦Send second proposal⟧. After that, sales' final date binds.", "If you don't answer within 20 days, the client date minus 5 days is taken and you get a notice."], "rules": ["R5", "R6", "R21"], "map": [7]}, {"id": "f-dev", "t": "Ask for a later date (deviation)", "when": "When a confirmed date can't be met, until 10 days before it.", "where": "Order Deadlines › SKU or PO", "steps": ["Press ⟦Request a deviation⟧, give the new date and the reason, and send it to sales.", "You may ask for a SKU date later than the PO's date or later than any date already recorded. If sales accept, that SKU follows its new date.", "In the last 10 days before the date it is locked."], "rules": ["R7"], "map": [7]}, {"id": "f-clar", "t": "Raise or close a clarification", "when": "Within 15 working days of the PO date.", "where": "PO Progress Tracker › order", "steps": ["Open the order and press ⟦Raise clarification⟧. Write the question.", "When Sales has answered, press ⟦Close clarification⟧."], "rules": ["R4"], "map": [4]}, {"id": "f-jc", "t": "Capture a job card", "when": "When production starts, and again each time more stages are filled in.", "where": "Job Card Station › Capture & review", "steps": ["Press ⟦Take photo⟧ (or ⟦Upload image⟧). Photograph the whole card, flat, in good light.", "Wait a few seconds while it is read. Then check every field against the photo, especially the ones outlined in amber.", "Link the card to its PO line (search by PO number, customer or article).", "Save. Photograph the same card again later: it updates the card, it doesn't duplicate it.", "A stage counts as done when it has a start date, an end date and at least one signature.", "Raw material: write its status as a line in the card's Material Used table — \"RM Available\" or \"RM Not Available\". When it changes, cross out the old line and write the new one below. The tick follows the latest line; check it before saving."], "rules": ["R10", "R11", "R22"], "map": [6]}, {"id": "f-cat", "t": "Check material readiness (C0–C4)", "when": "Daily, with supply.", "where": "PO Progress Tracker › Readiness C0–C4", "steps": ["Press ⟦Mine · Factory to act⟧ to see the lines waiting on the factory: no job card, raw material not confirmed, or fabric to confirm as received.", "Open a sales order to see each line's job card, raw material (with the date of the scan), fabric and category. Do your part; supply sees the same view."], "rules": ["R22"]}, {"id": "f-fr", "t": "Confirm furnishings received", "when": "When a furnishings challan arrives.", "where": "Furnishings Tag Station › Receiving", "steps": ["Scan each tag (⟦Scan a tag⟧) or type the tag ID and press ⟦Look up⟧.", "Check \"Received at\" (it starts on the challan's destination) and confirm. Sales get a notice."], "rules": ["R13"], "map": [11]}, {"id": "f-wt", "t": "Tag finished goods", "when": "When a piece is packed and Supply has ticked its QC report.", "where": "Warehouse Tag Station › Intake", "steps": ["Enter the PO number and choose the Article SKU (SO and customer fill themselves).", "If the screen says the QC report is not confirmed yet, ask Supply to tick it in Order Deadlines first.", "Enter the number of packets for this piece. Tick \"needs installation\" if it does.", "Press ⟦Generate tag & log intake⟧, then ⟦Print⟧."], "rules": ["R12", "R1 ್ಸ್‌ಗೆ ಕ್ಲೈಂಟ್ ಡೇಟ್ ಕಾಣುತ್ತೆ, ಫ್ಯಾಕ್ಟರಿಗೆ ತನ್ನ ಡೇಟ್, ಸಪ್ಲೈ ಮತ್ತು ಅಡ್ಮಿನ್‌ಗೆ ಎರಡೂ."], "R7": ["ಫ್ಯಾಕ್ಟರಿ, ಸೇಲ್ಸ್", "ಫಿಕ್ಸ್ ಆದ ಫ್ಯಾಕ್ಟರಿ ಡೇಟ್ ಬದಲಾಯಿಸಬೇಕಾದರೆ: ಆ ಡೇಟ್‌ಗೆ 10 ದಿನ ಮುಂಚೆವರೆಗೆ ಫ್ಯಾಕ್ಟರಿ ಡೀವಿಯೇಷನ್ ಕೇಳಬಹುದು (ಒಂದು ಸಲಕ್ಕೆ ಒಂದೇ ರಿಕ್ವೆಸ್ಟ್). ಕೊನೆಯ 10 ದಿನ ಡೇಟ್ ಲಾಕ್ ಆಗಿರುತ್ತೆ. ಒಂದು SKU-ದ ಡೇಟ್ PO ಡೇಟ್‌ಗಿಂತ ತಡವಾಗಿರಬಹುದು: ಸೇಲ್ಸ್ ಒಪ್ಪಿದರೆ ಆ SKU ತನ್ನ ಡೇಟ್ ಪ್ರಕಾರ ಹೋಗುತ್ತೆ, PO-ದ ಬೇರೆ SKU-ಗಳಿಗೆ PO ಡೇಟೇ ಲಿಮಿಟ್. ಅಡ್ಮಿನ್ ಫ್ಯಾಕ್ಟರಿಗೆ ಇನ್ನೊಂದು ಡೀವಿಯೇಷನ್ ಕೇಳೋಕೆ ಅವಕಾಶ ಕೊಡಬಹುದು, ಕೊನೆಯ 10 ದಿನದಲ್ಲೂ; ಒಪ್ಪೋದು ಬಿಡೋದು ಆಗಲೂ ಸೇಲ್ಸ್‌ದೇ."], "R8": ["ಎಲ್ಲರೂ", "MFPL ಫ್ಯಾಕ್ಟರಿ PO-ಗಳಲ್ಲಿ ತಡ ಆಗೋ ಅಪಾಯ ತೋರಿಸುತ್ತೆ: ಕ್ಲೈಂಟ್ ಡೇಟ್ ತಪ್ಪುತ್ತೆ ಅಂತ ಕಂಡಾಗ; ಸ್ಟೇಜ್‌ಗಳು ಹಿಂದೆ ಇದ್ದಾಗ (30 / 15 / 7 ದಿನಕ್ಕಿಂತ ಕಡಿಮೆ ಉಳಿದಿದೆ, ಪಾಲಿಶಿಂಗ್, ಫ್ಯಾಕ್ಟರಿ QC ಅಥವಾ ಪ್ಯಾಕಿಂಗ್ ಶುರುವಾಗಿಲ್ಲ); ಜಾಬ್ ಕಾರ್ಡ್ Post Frame ಅಥವಾ ಅದರ ನಂತರ ತಲುಪಿದೆ ಆದರೆ ಬಟ್ಟೆ ಕಳಿಸಿಲ್ಲ; PO ಆಗಿ 15 ದಿನ ಆದರೂ ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲ; ಫ್ಯಾಕ್ಟರಿ ಡೇಟ್ PO-ಆದ 75 ದಿನಕ್ಕಿಂತ ಜಾಸ್ತಿ ಆಮೇಲೆ."], "R9": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ", "ಅಪ್ರೂವ್ ಆದ ಸ್ಟಾಕ್ ಬ್ಲಾಕ್ ಇದ್ದರೆ ಆ SKU-ಗೆ ಮಾಲು ಇದೆ ಅಂತ ತಗೊಳ್ಳುತ್ತೆ, PO ಬೇಕಿಲ್ಲ. ಅದೇ SO-ನಲ್ಲಿ ಅದೇ ಕೋಡ್ + FIN (ಉದಾ. AARA → AARAFIN) ಇರೋ PO ಲೈನ್ ಬಂದರೆ, ಬ್ಲಾಕ್ ಮೇಲೆ \"Issued to factory — FIN PO …\" ಅಂತ ಕಾಣುತ್ತೆ, ಅದನ್ನ ಬ್ಲಾಕ್ ಸ್ಟಾಕ್ ಅಂತ ಎಣಿಸಲ್ಲ, FIN ಲೈನ್ ಮಾಮೂಲಿ ಫ್ಯಾಕ್ಟರಿ ತರಹ ಹೋಗುತ್ತೆ. ಆ SKU Order Bridge ಮೂಲಕ ಕಸ್ಟಮರ್‌ಗೆ ಡಿಸ್ಪ್ಯಾಚ್ ಆದರೆ (dispatched ಮಾರ್ಕ್ ಆದರೆ), ಬ್ಲಾಕ್ ಮೇಲೆ ಡೇಟ್ ಜೊತೆ \"Dispatched to customer\" ಅಂತ ಕಾಣುತ್ತೆ, ಅದನ್ನ ಬ್ಲಾಕ್ ಸ್ಟಾಕ್ ಅಂತ ಎಣಿಸಲ್ಲ; ಸ್ವಲ್ಪ ಮಾತ್ರ ಡಿಸ್ಪ್ಯಾಚ್ ಆದರೆ ಉಳಿದದ್ದು ಬ್ಲಾಕ್ ಆಗೇ ಇರುತ್ತೆ."], "R10": ["ಫ್ಯಾಕ್ಟರಿ, ಸಪ್ಲೈ", "ಸ್ಕ್ಯಾನ್ ಮಾಡಿದ ಜಾಬ್ ಕಾರ್ಡ್ ಚೆಕ್ ಮಾಡದೆ ಸೇವ್ ಆಗಲ್ಲ. ಪ್ರತಿ ಫೀಲ್ಡ್ ಅನ್ನು ಫೋಟೋ ಜೊತೆ ಹೋಲಿಸಿ ನೋಡಿ, ಮುಖ್ಯವಾಗಿ ಹಳದಿ ಬಣ್ಣದಲ್ಲಿ ಇರೋವು. ಅದೇ ಕಾರ್ಡ್‌ನ ಫೋಟೋ ಮತ್ತೆ ತೆಗೆದರೆ ಅದೇ ಕಾರ್ಡ್ ಅಪ್‌ಡೇಟ್ ಆಗುತ್ತೆ; ಮುಂಚೆ ಸೇವ್ ಮಾಡಿದ ಡೇಟ್‌ಗಳು, ಸೈನ್‌ಗಳು ಹೋಗಲ್ಲ."], "R11": ["ಎಲ್ಲರೂ", "PO Progress Tracker ಮತ್ತು Order Deadlines-ನಲ್ಲಿ ಕಾಣೋ ಜಾಬ್ ಕಾರ್ಡ್ ಸ್ಟೇಜ್: ಶುರುವಾದ ಡೇಟ್, ಮುಗಿದ ಡೇಟ್ ಮತ್ತು ಕನಿಷ್ಠ ಒಂದು ಸೈನ್ — ಈ ಮೂರೂ ಇರೋ ಕೊನೆಯ ಸ್ಟೇಜ್."], "R12": ["ಸಪ್ಲೈ, ಸೇಲ್ಸ್", "ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿ ಮಾಡಿದ ಫರ್ನಿಚರ್ SKU ಡಿಸ್ಪ್ಯಾಚ್ ಸ್ಲಾಟ್ ಅಥವಾ ಇನ್‌ಸ್ಟಾಲೇಶನ್‌ಗೆ ರೆಡಿ ಆಗೋದು ಸಪ್ಲೈ Order Deadlines-ನಲ್ಲಿ \"QC report generated\" ಟಿಕ್ ಮಾಡಿದಾಗ ಮಾತ್ರ (ಪ್ಯಾಕಿಂಗ್ ಆದ ಮೇಲೆ). ಆ ಟಿಕ್ ಆದ ಮೇಲೇ ವೇರ್‌ಹೌಸ್ ಟ್ಯಾಗ್ ಮಾಡಬಹುದು. ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲದ ಫರ್ನಿಚರ್ SKU ಕೂಡ ಟಿಕ್ ಆಗೋವರೆಗೆ ರೆಡಿ ಅಲ್ಲ."], "R13": ["ಸಪ್ಲೈ, ಫ್ಯಾಕ್ಟರಿ", "ಫರ್ನಿಶಿಂಗ್ ಮತ್ತು ವೇರ್‌ಹೌಸ್ ಟ್ಯಾಗ್ ಪೂರ್ತಿಯಾಗಿ ಮಾತ್ರ ಮುಂದೆ ಹೋಗುತ್ತೆ — ಅರ್ಧ ಕ್ವಾಂಟಿಟಿ ಆಗಲ್ಲ. ಚಲನ್ ಮತ್ತು ರಸೀದಿ ನಂಬರ್‌ಗಳನ್ನು ಆ್ಯಪ್ ತಾನೇ ಮಾಡುತ್ತೆ; ಚಲನ್ ಮತ್ತೆ ಪ್ರಿಂಟ್ ಬೇಕಾದರೆ Logbook-ನಿಂದ ತೆಗೆಯಿರಿ."], "R14": ["ಸಪ್ಲೈ, ಅಡ್ಮಿನ್", "Dispatch Day-ದ ಚೆಕ್‌ಗಳೆಲ್ಲ ಮುಗಿಯೋವರೆಗೆ \"Mark dispatched\" ಲಾಕ್ ಆಗಿರುತ್ತೆ. ಅಡ್ಮಿನ್ ಮಾತ್ರ ಓವರ್‌ರೈಡ್ ಮಾಡಬಹುದು, 3 ಅಥವಾ ಜಾಸ್ತಿ ಪದಗಳ ಕಾರಣ ಬರೆದು; ಅದು ರೆಕಾರ್ಡ್‌ಗೆ ಹೋಗುತ್ತೆ. Dispatch Day ಕೆಲಸ ಡಿಸ್ಪ್ಯಾಚ್ ಡೇಟ್‌ಗೆ 48 ಗಂಟೆ ಮುಂಚೆ ಬರುತ್ತೆ; ಚೆಕ್‌ಗಳನ್ನು ಅದಕ್ಕೂ ಮುಂಚೆ ಮಾಡಬಹುದು."], "R15": ["ಸೇಲ್ಸ್, COO / ಡೈರೆಕ್ಟರ್, ಅಕೌಂಟ್ಸ್", "ಡಿಸ್ಪ್ಯಾಚ್ ಟೈಮ್‌ನಲ್ಲಿ ₹1-ಕ್ಕಿಂತ ಜಾಸ್ತಿ ಬಾಕಿ ಇದ್ದರೆ COO / ಡೈರೆಕ್ಟರ್ ಅಪ್ರೂವ್ ಮಾಡಬೇಕು. ಲಿಂಕ್ 48 ಗಂಟೆ ಮಾತ್ರ; ರಿಜೆಕ್ಟ್ ಮಾಡಬೇಕಾದರೆ ಕಮೆಂಟ್ ಬರೆಯಬೇಕು; ಆಮೇಲೆ ಅಕೌಂಟ್ಸ್ ಚೆಕ್ ಮಾಡಿ ಕನ್ಫರ್ಮ್ ಮಾಡುತ್ತೆ. ಬಾಕಿ ಹಣ ಅಪ್ರೂವ್ ಆದ ಹಣಕ್ಕಿಂತ ಜಾಸ್ತಿ ಆದರೆ ಮತ್ತೆ ಅಪ್ರೂವಲ್ ಬೇಕು."], "R16": ["ಅಕೌಂಟ್ಸ್", "ಸಪ್ಲೈಯ ERP ನಂಬರ್‌ಗಳು ಬಂದು ಪೇಮೆಂಟ್ ಮುಗಿದರೆ ಇನ್‌ವಾಯ್ಸ್, ಇ-ವೇ ಬಿಲ್ ಸ್ಟೆಪ್ ತೆರೆಯುತ್ತೆ. ಮುಗಿದಿದೆ ಅಂದರೆ: ಪೂರ್ತಿ ಹಣ ಬಂದು ಕನ್ಫರ್ಮ್ ಆಗಿದೆ; ಅಥವಾ ಏನೂ ಬಂದಿಲ್ಲ ಆದರೆ ಅಪ್ರೂವಲ್ ಚೆಕ್ ಆಗಿದೆ; ಅಥವಾ ಸ್ವಲ್ಪ ಬಂದು ಕನ್ಫರ್ಮ್ ಆಗಿದೆ, ಬಾಕಿಗೆ ಅಪ್ರೂವಲ್ ಚೆಕ್ ಆಗಿದೆ. ಇನ್‌ವಾಯ್ಸ್ ನಂಬರ್ ಯಾವಾಗಲೂ ಬೇಕು. ಇ-ವೇ ಬಿಲ್ 12 ಅಂಕಿ ಇರಬೇಕು, ಇಲ್ಲವೇ ಕಾರಣ ಬರೆದು \"Not required\" ಆರಿಸಿ."], "R17": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ", "ಬ್ಲಾಕ್ ಮಾಡಿದ ಡೇಟ್‌ಗಳಲ್ಲಿ ಡಿಸ್ಪ್ಯಾಚ್ ಅಥವಾ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಕೇಳೋಕೆ ಆಗಲ್ಲ; Slot settings-ನಲ್ಲಿ ಇಟ್ಟಿರೋ ಟೈಮ್‌ನಲ್ಲಿ ಮಾತ್ರ. ಕ್ಲೈಂಟ್ ಡೇಟ್ ಆದ ಮೇಲೆ ಡಿಸ್ಪ್ಯಾಚ್ ಮಾಡೋಕೆ ಕಾರಣ ಬೇಕು. ಟ್ರ್ಯಾಕಿಂಗ್ ಲಿಂಕ್‌ಗೆ ಲಿಂಕ್ ಅಥವಾ NA ಹಾಕಬಹುದು; ಲಿಂಕ್ ಇಲ್ಲದಿದ್ದರೆ ಟ್ರಾನ್ಸ್‌ಪೋರ್ಟ್ POC ವಿವರ ಹಾಕಿ."], "R18": ["ಸೇಲ್ಸ್, ಕಸ್ಟಮರ್", "ಪ್ರತಿ ಸೈಟ್ ಡೀಟೇಲ್ಸ್ ಲಿಂಕ್ ಒಂದು SO-ಗೆ ಮಾತ್ರ. ಪ್ರತಿ ಪೀಸ್ ಅನ್ನು ಎಲ್ಲಾ ಕಡೆ 5 ಇಂಚು ಜಾಸ್ತಿ ಮಾಡಿ ನೋಡ್ತಾರೆ: ಲಿಫ್ಟ್ ಇದ್ದರೆ ಲಿಫ್ಟ್ ಜೊತೆ, ಲಿಫ್ಟ್ ಇಲ್ಲದಿದ್ದರೆ ಮೆಟ್ಟಿಲು ಜೊತೆ (ಅತಿ ಚಿಕ್ಕ ಬದಿ ಮೆಟ್ಟಿಲಿನ ಅಗಲದಲ್ಲಿ ಹೋಗಬೇಕು, ಮತ್ತು ಪೀಸ್ ಲ್ಯಾಂಡಿಂಗ್‌ನ ಉದ್ದ, ಅಗಲ, ಎತ್ತರದೊಳಗೆ ಹಿಡಿಸಬೇಕು). ಹಿಡಿಸದ ಪೀಸ್‌ಗೆ 3 ಅಥವಾ ಜಾಸ್ತಿ ಪದಗಳ ಓವರ್‌ರೈಡ್ ಕಾರಣ ಬೇಕು."], "R19": ["ಎಲ್ಲರೂ", "ಪೇಜ್ ತಾನಾಗೇ  "R2": ["सेल्स", "PO सिर्फ़ उन्हीं SKU का माँग सकते हैं जो SO में हैं। जो SO में नहीं है, उसके लिए SO Revision Request डालनी होगी।"], "R3": ["सप्लाई", "सप्लाई को PO नंबर टाइप नहीं करना है। \"Mark PO raised in ERP\" दबाएँ, अगले डेटा रिफ़्रेश में PO लाइन अपने-आप ढूँढकर जुड़ जाएगी। जो न जुड़े, वो PO Progress Tracker › Unmatched में दिखेगी।"], "R4": ["फ़ैक्टरी, सेल्स", "PO की तारीख से 15 वर्किंग डे तक फ़ैक्टरी सवाल पूछ सकती है। जब कोई सवाल बाकी न हो, तभी प्रोडक्शन शुरू होगा।"], "R5": ["फ़ैक्टरी, सेल्स", "फ़ैक्टरी तारीख: MFPL PO आने के 20 दिन के अंदर फ़ैक्टरी या तो क्लाइंट की तारीख मान ले, या अपनी तारीख बताए — एक SKU के लिए या पूरे PO के लिए। सेल्स उसे मान लेगी, या मना करके दूसरी तारीख बताएगी। फ़ैक्टरी एक बार और तारीख बता सकती है; उसके बाद सेल्स जो आख़िरी तारीख रखेगी, वही पक्की। 20 दिन में जवाब न आए तो क्लाइंट तारीख से 5 दिन पहले की तारीख अपने-आप लग जाएगी।"], "R6": ["सब लोग", "दोनों तारीखों में 5 दिन का फ़र्क है: फ़ैक्टरी तारीख + 5 दिन = क्लाइंट तक माल पहुँचाने की तारीख। सेल्स को क्लाइंट की तारीख दिखती है, फ़ैक्टरी को अपनी, और सप्लाई व एडमिन को दोनों।"], "R7": ["फ़ैक्टरी, सेल्स", "पक्की फ़ैक्टरी तारीख बदलनी हो तो: उस तारीख से 10 दिन पहले तक फ़ैक्टरी डेविएशन माँग सकती है (एक बार में एक ही रिक्वेस्ट)। आख़िरी 10 दिन तारीख लॉक रहती है। किसी SKU की तारीख PO की तारीख से बाद की भी हो सकती है: सेल्स मान ले तो वो SKU अपनी तारीख से चलेगा, PO के बाकी SKU के लिए PO की तारीख ही हद है। एडमिन फ़ैक्टरी को एक और डेविएशन माँगने दे सकता है, आख़िरी 10 दिनों में भी; मानना या न मानना फिर भी सेल्स का फ़ैसला है।"], "R8": ["सब लोग", "MFPL फ़ैक्टरी PO पर देरी का ख़तरा दिखेगा जब: क्लाइंट तारीख छूटती दिखे; स्टेज पीछे चल रहे हों (30 / 15 / 7 दिन से कम बचे और पॉलिशिंग, फ़ैक्टरी QC या पैकिंग शुरू न हुई हो); जॉब कार्ड Post Frame या उसके बाद पहुँच गया पर कपड़ा नहीं भेजा; PO के 15 दिन बाद भी जॉब कार्ड नहीं; फ़ैक्टरी तारीख PO से 75 दिन से ज़्यादा बाद की।"], "R9": ["सेल्स, सप्लाई", "अप्रूव हुआ स्टॉक ब्लॉक हो तो उस SKU का माल मौजूद माना जाएगा, PO की ज़रूरत नहीं। अगर उसी SO में उसी कोड + FIN (जैसे AARA → AARAFIN) वाली PO लाइन आ जाए, तो ब्लॉक पर \"Issued to factory — FIN PO …\" दिखेगा, उसे ब्लॉक स्टॉक नहीं गिना जाएगा, और FIN लाइन आम फ़ैक्टरी वाले तरीके से चलेगी। जब वो SKU Order Bridge से कस्टमर को डिस्पैच हो जाए (dispatched मार्क हो), तो ब्लॉक पर तारीख के साथ \"Dispatched to customer\" दिखेगा और उसे ब्लॉक स्टॉक नहीं गिना जाएगा; थोड़ा ही डिस्पैच हुआ तो बाकी ब्लॉक रहेगा।"], "R10": ["फ़ैक्टरी, सप्लाई", "स्कैन किया जॉब कार्ड बिना चेक किए सेव नहीं होगा। हर फ़ील्ड को फ़ोटो से मिलाएँ, ख़ासकर पीले रंग वाले। उसी कार्ड की फ़ोटो दोबारा लेंगे तो वही कार्ड अपडेट होगा; पहले सेव की गई तारीखें और साइन नहीं मिटेंगे।"], "R11": ["सब लोग", "PO Progress Tracker और Order Deadlines में जो जॉब कार्ड स्टेज दिखता है: वो सबसे आख़िरी स्टेज जिसमें शुरू की तारीख, ख़त्म की तारीख और कम से कम एक साइन — तीनों हों।"], "R12": ["सप्लाई, सेल्स", "फ़ैक्टरी में बना फ़र्नीचर SKU डिस्पैच स्लॉट या इंस्टॉलेशन के लिए तभी तैयार माना जाएगा जब सप्लाई Order Deadlines में \"QC report generated\" टिक करे (पैकिंग के बाद)। इस टिक के बाद ही वेयरहाउस टैग बन सकता है। बिना जॉब कार्ड वाला फ़र्नीचर SKU भी टिक होने तक तैयार नहीं माना जाएगा।"], "R13": ["सप्लाई, फ़ैक्टरी", "फ़र्निशिंग और वेयरहाउस टैग पूरे के पूरे ही आगे जाते हैं — आधी मात्रा नहीं चलेगी। चालान और रसीद नंबर ऐप ख़ुद बनाता है; चालान दोबारा प्रिंट करना हो तो Logbook से निकाल लें।"], "R14": ["सप्लाई, एडमिन", "Dispatch Day के सारे चेक पूरे होने तक \"Mark dispatched\" लॉक रहेगा। सिर्फ़ एडमिन इसे ओवरराइड कर सकता है, 3 या ज़्यादा शब्दों का कारण लिखकर; ये रिकॉर्ड में जाता है। Dispatch Day का काम डिस्पैच तारीख से 48 घंटे पहले दिखेगा; चेक उससे पहले भी कर सकते हैं।"], "R15": ["सेल्स, COO / डायरेक्टर, अकाउंट्स", "डिस्पैच के समय ₹1 से ज़्यादा बाकी हो तो COO / डायरेक्टर का अप्रूवल चाहिए। लिंक 48 घंटे चलता है; मना करना हो तो कमेंट लिखना होगा; फिर अकाउंट्स चेक करके पक्का करेगा। बाकी रकम अप्रूव की गई रकम से बढ़ जाए तो दोबारा अप्रूवल लेना होगा।"], "R16": ["अकाउंट्स", "सप्लाई के ERP नंबर आ जाएँ और पेमेंट निपट जाए, तब इनवॉइस और ई-वे बिल वाला स्टेप खुलता है। निपटना मतलब: पूरा पैसा मिला और कन्फ़र्म हुआ; या कुछ नहीं मिला पर अप्रूवल चेक हो गया; या कुछ मिला और कन्फ़र्म हुआ, बाकी पर अप्रूवल चेक हो गया। इनवॉइस नंबर हमेशा चाहिए। ई-वे बिल 12 अंक का हो, या कारण लिखकर \"Not required\" चुनें।"], "R17": ["सेल्स, सप्लाई", "ब्लॉक की गई तारीखों पर डिस्पैच या इंस्टॉलेशन नहीं माँग सकते; सिर्फ़ Slot settings में रखे टाइम पर ही। क्लाइंट तारीख के बाद डिस्पैच के लिए कारण देना होगा। ट्रैकिंग लिंक में लिंक या NA डाल सकते हैं; लिंक न हो तो ट्रांसपोर्ट POC की जानकारी डालें।"], "R18": ["सेल्स, कस्टमर", "हर साइट डिटेल्स लिंक सिर्फ़ एक SO का होता है। हर पीस को हर तरफ़ 5 इंच बढ़ाकर नापा जाता है: लिफ़्ट हो तो लिफ़्ट से, लिफ़्ट न हो तो सीढ़ी से (सबसे छोटी साइड सीढ़ी की चौड़ाई में आनी चाहिए, और पीस लैंडिंग की लंबाई, चौड़ाई, ऊँचाई में समाना चाहिए)। जो पीस न समाए, उसके लिए 3 या ज़्यादा शब्दों का ओवरराइड कारण चाहिए।"], "R19": ["सब लोग", "पेज ख़ुद अपडेट होता है: दूसरों के बदलाव 2 मिनट के अंदर आ जाते हैं, और टैब पर लौटते ही तुरंत भी। आप टाइप कर रहे हों तो ये रुककर इंतज़ार करता है। नया ERP डेटा आए, या कोई और PO रिक्वेस्ट जोड़े या लिंक करे, तो रिफ़्रेश करने के लिए एक पट्टी दिखेगी। आप जो ERP डेटा देखते हैं, वो आख़िरी अपलोड वाले दिन का है। CSV डाउनलोड करने पर SO और PO नंबर के सारे अंक Excel में सही आते हैं।"], "R20": ["सेल्स, सप्लाई, अकाउंट्स, COO / डायरेक्टर", "SO रिवीज़न के लिए पहले COO / डायरेक्टर का अप्रूवल चाहिए। फिर अकाउंट्स ऑर्डर की रकम और एडवांस मिलाकर अप्रूव करेगा (नया SO ERP में बनता है)। फिर सप्लाई PO कैंसल होने की पुष्टि करेगी। जब तक सप्लाई पुष्टि न करे, रिवीज़न खुला रहेगा।"], "R21": ["सब लोग", "2 नवंबर 2026 से पहले बने PO: इनकी SKU जानकारी ईमेल से दी गई थी, इसलिए यहाँ इन नियमों के अंदर सिर्फ़ इनकी तारीखें बदल सकते हैं। इनका 20 दिन का फ़ैक्टरी टाइम और 15 दिन का जॉब कार्ड चेक 2 नवंबर से गिना जाएगा। कपड़ा चाहिए या नहीं, ये PO लाइन के टैग से तय होगा: टैग नहीं तो कपड़ा नहीं।"], "R22": ["फ़ैक्टरी, सप्लाई", "मटीरियल रेडीनेस (PO Progress Tracker › Readiness C0–C4) फ़ैक्टरी और सप्लाई दोनों देखते हैं। हर खुली फ़ैक्टरी SKU लाइन पर C0–C4 और \"Next\" लिखा होता है कि अब किसकी बारी है: फ़ैक्टरी (जॉब कार्ड, रॉ मटीरियल, कपड़ा मिलने की पुष्टि), सप्लाई (कपड़े की एंट्री या भेजना) या सेल्स (कपड़े की जानकारी नहीं भरी)। रॉ मटीरियल का टिक जॉब कार्ड की Material Used टेबल में फ़ैक्टरी की लिखी आख़िरी लाइन से चलता है: \"RM Available\" लिखा तो टिक लगेगा, \"RM Not Available\" लिखा तो टिक हटेगा। बदलना हो तो पुरानी लाइन काटें और नीचे नई लिखें; अगली स्कैन में आ जाएगा। हर लाइन पर उस स्कैन की तारीख दिखती है।"], "R23": ["सेल्स, एडमिन, फ़ैक्टरी, सप्लाई", "PO बनने के बाद कपड़ा, फ़िनिश, केन वीव या पत्थर बदलना: सेल्स कारण लिखकर एडमिन से वो फ़ील्ड खुलवाती है; एडमिन कारण के साथ हाँ या ना करता है। फ़ील्ड तभी खुलेगी जब जॉब कार्ड में उसका स्टेज शुरू न हुआ हो — कपड़े के लिए अपहोल्स्ट्री, फ़िनिश और पत्थर के लिए पॉलिशिंग, केन वीव के लिए पोस्ट फ़्रेम (जॉब कार्ड नहीं = काम शुरू नहीं)। सेल्स सिर्फ़ खुली फ़ील्ड बदलकर सेव करती है; फिर फ़ैक्टरी और सप्लाई दोनों \"Seen revised spec\" दबाते हैं। PO बनने से पहले एडमिन रिक्वेस्ट को वापस ड्राफ़्ट में भेज सकता है।"], "R24": ["एडमिन, फ़ैक्टरी, सप्लाई", "फ़र्निशिंग टैग, वेयरहाउस टैग और जॉब कार्ड में सुधार: एडमिन कारण लिखकर बदलाव भेजता है; जिस टीम का रिकॉर्ड है वो कारण के साथ मानती या ठुकराती है — फ़र्निशिंग टैग के लिए सप्लाई, वेयरहाउस टैग और जॉब कार्ड के लिए फ़ैक्टरी। माने जाने तक कुछ नहीं बदलता। जो टैग आगे जा चुका है उसे सिर्फ़ रद्द (void) किया जा सकता है, फिर नया बनाएँ। मात्रा कभी नहीं बदलती। छपी जानकारी बदले तो टैग दोबारा छापें। बाद की जॉब कार्ड स्कैन एडमिन का सुधार नहीं मिटाती, दोनों वैल्यू दिखाती है।"]}, "man": {"sales": {"day": ["Dashboard खोलें: आपके काम \"Needs action\" में होंगे; घंटी वाले आइकन में सूचनाएँ भी दिखेंगी — जैसे कपड़ा फ़ैक्टरी भेजा गया, या वहाँ पहुँच गया।", "PO Progress Tracker में नए SO देखें और उनके SKU PO के लिए भेजें।", "फ़ैक्टरी जो तारीखें और सवाल भेजे, उनका जवाब दें।", "आख़िरी चरण आगे बढ़ाएँ: साइट की जानकारी, डिस्पैच स्लॉट, Dispatch Day पेमेंट।"], "tasks": [{"id": "s-req", "t": "SKU को PO के लिए भेजें", "when": "नए SO के हर उस SKU के लिए जिसका अभी PO नहीं बना।", "steps": ["⟦PO Progress Tracker⟧ खोलें और SO पर क्लिक करें ( ്ലോക്ക് ചെയ്ത സ്റ്റോക്കായി എണ്ണില്ല; കുറച്ച് മാത്രം ഡിസ്പാച്ച് ചെയ്താൽ ബാക്കി ബ്ലോക്കിൽ തന്നെ നിൽക്കും."], "R10": ["ഫാക്ടറി, സപ്ലൈ", "സ്കാൻ ചെയ്ത ജോബ് കാർഡ് പരിശോധിക്കാതെ സേവ് ആകില്ല. ഓരോ ഫീൽഡും ഫോട്ടോയുമായി ഒത്തുനോക്കുക, പ്രത്യേകിച്ച് മഞ്ഞ നിറത്തിൽ കാണിക്കുന്നവ. അതേ കാർഡിന്റെ ഫോട്ടോ വീണ്ടും എടുത്താൽ അതേ കാർഡ് അപ്ഡേറ്റ് ആകും; നേരത്തെ സേവ് ചെയ്ത തീയതികളും ഒപ്പുകളും പോകില്ല."], "R11": ["എല്ലാവരും", "PO Progress Tracker-ലും Order Deadlines-ലും കാണുന്ന ജോബ് കാർഡ് സ്റ്റേജ്: തുടങ്ങിയ തീയതി, തീർന്ന തീയതി, ചുരുങ്ങിയത് ഒരു ഒപ്പ് — ഇവ മൂന്നും ഉള്ള ഏറ്റവും അവസാനത്തെ സ്റ്റേജ്."], "R12": ["സപ്ലൈ, സെയിൽസ്", "ഫാക്ടറിയിൽ ഉണ്ടാക്കിയ ഫർണിച്ചർ SKU ഡിസ്പാച്ച് സ്ലോട്ടിനോ ഇൻസ്റ്റലേഷനോ റെഡി ആകുന്നത് സപ്ലൈ Order Deadlines-ൽ \"QC report generated\" ടിക്ക് ചെയ്യുമ്പോൾ മാത്രമാണ് (പാക്കിംഗ് കഴിഞ്ഞ ശേഷം). ആ ടിക്ക് കഴിഞ്ഞിട്ടേ വെയർഹൗസ് ടാഗ് ഉണ്ടാക്കാനും പറ്റും. ജോബ് കാർഡ് ഇല്ലാത്ത ഫർണിച്ചർ SKU-വും ടിക്ക് ചെയ്യുന്നതുവരെ റെഡി അല്ല."], "R13": ["സപ്ലൈ, ഫാക്ടറി", "ഫർണിഷിംഗും വെയർഹൗസ് ടാഗും മുഴുവനായി മാത്രം നീങ്ങും — പാതി അളവ് പറ്റില്ല. ചലാൻ, രസീത് നമ്പറുകൾ ആപ്പ് തന്നെ ഉണ്ടാക്കും; ചലാൻ വീണ്ടും പ്രിന്റ് ചെയ്യണമെങ്കിൽ Logbook-ൽ നിന്ന് എടുക്കാം."], "R14": ["സപ്ലൈ, അഡ്മിൻ", "Dispatch Day-യിലെ ചെക്കുകൾ മുഴുവൻ കഴിയുന്നതുവരെ \"Mark dispatched\" ലോക്ക് ആയിരിക്കും. അഡ്മിന് മാത്രം ഓവർറൈഡ് ചെയ്യാം, 3 വാക്കോ അതിൽ കൂടുതലോ ഉള്ള ഒരു കാരണം കൊടുത്ത്; അത് രേഖയിൽ വരും. Dispatch Day ടു-ഡൂ ഡിസ്പാച്ച് തീയതിക്ക് 48 മണിക്കൂർ മുമ്പ് വരും; ചെക്കുകൾ അതിനു മുമ്പേ ചെയ്യാം."], "R15": ["സെയിൽസ്, COO / ഡയറക്ടർ, അക്കൗണ്ട്സ്", "ഡിസ്പാച്ച് സമയത്ത് ₹1-ൽ കൂടുതൽ ബാക്കിയുണ്ടെങ്കിൽ COO / ഡയറക്ടർ അപ്രൂവ് ചെയ്യണം. ലിങ്കിന് 48 മണിക്കൂർ കാലാവധി; റിജക്ട് ചെയ്യണമെങ്കിൽ ഒരു കമന്റ് വേണം; പിന്നെ അക്കൗണ്ട്സ് അത് ശരിയാണെന്ന് ഉറപ്പിക്കും. ബാക്കി തുക അപ്രൂവ് ചെയ്ത തുകയിൽ കൂടിയാൽ വീണ്ടും അപ്രൂവൽ വേണം."], "R16": ["അക്കൗണ്ട്സ്", "സപ്ലൈയുടെ ERP നമ്പറുകൾ വന്ന് പേയ്മെന്റ് തീർന്നാൽ ഇൻവോയ്സ്, ഇ-വേ ബിൽ സ്റ്റെപ്പ് തുറക്കും. തീർന്നു എന്ന് പറയുന്നത്: മുഴുവൻ തുക കിട്ടി സ്ഥിരീകരിച്ചു; അല്ലെങ്കിൽ ഒന്നും കിട്ടിയില്ല പക്ഷേ അപ്രൂവൽ ഉറപ്പിച്ചു; അല്ലെങ്കിൽ കുറച്ച് കിട്ടി സ nts": {"day": ["Dashboard തുറക്കുക: ടു-ഡൂകൾ \"Needs action\"-ൽ ഉണ്ടാകും (സ്ഥിരീകരിക്കേണ്ട പേയ്മെന്റുകൾ, ഉറപ്പിക്കേണ്ട അപ്രൂവലുകൾ, കൊടുക്കേണ്ട ഇൻവോയ്സുകൾ). Dispatch Day ടു-ഡൂ ഡിസ്പാച്ച് തീയതിക്ക് 48 മണിക്കൂർ മുമ്പ് വരും.", "അക്കൗണ്ട്സിന്റെ അപ്രൂവൽ കാത്തുനിൽക്കുന്ന SO റിവിഷനുകൾ തീർക്കുക.", "പേയ്മെന്റ് പ്ലാൻ ചെയ്യുമ്പോൾ Payables & Flushout നോക്കുക."], "tasks": [{"id": "a-rev", "t": "SO റിവിഷൻ അപ്രൂവ് ചെയ്യുക അല്ലെങ്കിൽ റിജക്ട് ചെയ്യുക", "when": "COO / ഡയറക്ടർ അപ്രൂവ് ചെയ്ത ശേഷം.", "steps": ["വാല്യൂ ചെക്കും അഡ്വാൻസ് ചെക്കും ചെയ്യുക: ഒറിജിനൽ ഓർഡർ തുകയും കിട്ടിയ അഡ്വാൻസുമായി ഒത്തുനോക്കുക.", "⟦Approve⟧ അമർത്തുക (അല്ലെങ്കിൽ ⟦Reject⟧, അല്ലെങ്കിൽ ⟦Send back to sales⟧). നിങ്ങൾ അപ്രൂവ് ചെയ്ത ശേഷം സപ്ലൈ PO ക്യാൻസൽ സ്ഥിരീകരിക്കും."]}, {"id": "a-pay", "t": "പേയ്മെന്റ് സ്ഥിരീകരിക്കുക", "when": "സെയിൽസ് ഒരു Dispatch Day പേയ്മെന്റ് സബ്മിറ്റ് ചെയ്യുമ്പോൾ.", "steps": ["കണ്ടുപിടിക്കാൻ ⟦Needs my action⟧ ഫിൽട്ടർ ഉപയോഗിക്കുക.", "പേയ്മെന്റ് ബാങ്കുമായി ഒത്തുനോക്കുക. കിട്ടി എന്ന് സ്ഥിരീകരിക്കുക, അല്ലെങ്കിൽ കാരണം എഴുതി സെയിൽസിന് തിരിച്ചയയ്ക്കുക."]}, {"id": "a-val", "t": "COO / ഡയറക്ടർ അപ്രൂവൽ ശരിയാണെന്ന് ഉറപ്പിക്കുക", "when": "ബാക്കി തുകയുള്ള ഒരു ഡിസ്പാച്ചിന് അപ്രൂവൽ കിട്ടുമ്പോൾ.", "steps": ["ആ രേഖ തുറന്ന് അപ്രൂവൽ ശരിയാണെന്ന് ഉറപ്പിക്കുക."]}, {"id": "a-inv", "t": "ഇൻവോയ്സും ഇ-വേ ബില്ലും കൊടുക്കുക", "when": "ഇൻവോയ്സ് സ്റ്റെപ്പ് തുറക്കുമ്പോൾ.", "steps": ["ഇൻവോയ്സ് നമ്പർ കൊടുക്കുക.", "12 അക്ക ഇ-വേ ബിൽ കൊടുക്കുക, അല്ലെങ്കിൽ \"Not required\" തിരഞ്ഞെടുത്ത് കാരണം എഴുതുക.", "സേവ് ചെയ്താൽ സപ്ലൈക്ക് ഡിസ്പാച്ച് തുറക്കും, ഇത് പാക്കിംഗ് ലിസ്റ്റിലും പ്രിന്റ് ആകും."]}, {"id": "a-pf", "t": "Payables & Flushout വായിക്കുക", "when": "പേയ്മെന്റും പിരിവും പ്ലാൻ ചെയ്യുമ്പോൾ.", "steps": ["1 · Payable by vendor: ഒരു വെണ്ടർ തുറന്നാൽ അതിന്റെ PO-കൾ കാണാം.", "2 · ഇനിയും PO ഉണ്ടാക്കാൻ ബാക്കിയുള്ള SO-കൾ.", "3 · PO മുഴുവൻ ആയെങ്കിലും തുക പിരിക്കാൻ ബാക്കിയുള്ള SO-കൾ.", "4 · Payables for Flushout: ഫാക്ടറി തീയതി സ്ഥിരീകരിച്ച, PO മുഴുവൻ ആയ SO-കൾ."]}]}, "approver": {"day": ["അപ്രൂവൽ ലിങ്ക് കിട്ടുമ്പോഴോ, \"Needs action\"-ൽ ഒരു അപ് // Deep links: #sales #supply #factory #accounts #approver #admin (manual), #map, #rules. Optional language first: #kn-sales.
(function readHash(){
  const h = decodeURIComponent((location.hash || '').slice(1)).toLowerCase();
  h.split(/[-_]/).forEach(p => { if (LANGS.some(l => l.id === p)) S.lang = p; if (ROLES.includes(p)) { S.role = p; S.view = 'manual'; } if (p === 'map') S.view = 'map'; if (p === 'rules') S.view = 'rules'; if (p === 'production') { S.role = 'factory'; S.view = 'manual'; } });
})();

function render(){
  document.documentElement.lang = S.lang || 'en';
  if (!S.lang) return renderStartLang();
  if (!S.role && S.view === 'manual') return renderStartRole();
  bar.hidden = false;
  document.getElementById('tabs').innerHTML = [['manual', u('tabManual')], ['map', u('tabMap')], ['rules', u('tabRules')]].map(([v, l]) => `<button data-view="${v}" aria-current="${S.view === v}">${esc(l)}</button>`).join('');
  document.getElementById('langsw').innerHTML = LANGS.map(l => `<button data-lang="${l.id}" aria-pressed="${S.lang === l.id}" title="${esc(l.name)}">${esc(l.native)}</button>`).join('');
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { S.lang = b.dataset.lang; store.set('obg_lang', S.lang); render(); });
  const dl = S.lang === 'en' ? '' : ((DATA[S.lang] || {}).ui || {}).draftLang;
  const notice = dl ? `<p class="notice">${esc(dl)}</p>` : '';
  if (S.view === 'map') renderMap(notice); else if (S.view === 'rules') renderRules(notice); else renderManual(notice);
}

function renderStartLang(){
  bar.hidden = true;
  const E = DATA.en.ui;
  app.innerHTML = `<div class="wrap"><section class="start">
    <div class="step-ind">${esc(E.step1)}</div>
    <div class="eyebrow">Magari Furniture · Order Bridge</div>
    <h1>${esc(E.pickLang)}<br><span style="font-weight:600;font-size:.7em;">${['kn','hi','ml'].map(l => esc((DATA[l] && DATA[l].ui && DATA[l].ui.pickLang) || '')).filter(Boolean).join(' · ')}</span></h1>
    <p class="lede">${esc(E.pickLangSub)}</p>
    <div class="pick">${LANGS.map(l => `<button data-pick-lang="${l.id}"><span class="big">${esc(l.native)}</span><span class="small">${esc(l.name)}</span></button>`).join('')}</div>
  </section></div>`;
  app.querySelectorAll('[data-pick-lang]').forEach(b => b.onclick = () => { S.lang = b.dataset.pickLang; store.set('obg_lang', S.lang); render(); window.scrollTo(0, 0); });
}
function renderStartRole(){
  bar.hidden = true;
  app.innerHTML = `<div class="wrap"><section class="start">
    <div class="step-ind">${esc(u('step2'))} · <button class="linkbtn" id="backLang">${esc(u('back'))}</button></div>
    <h1>${esc(u('pickRole'))}</h1>
    <p class="lede">${esc(u('pickRoleSub'))}</p>
    <div class="pick">${ROLES.map(r => `<button data-pick-role="${r}" data-lane="${r}"><span class="big">${esc(laneName(r))}</span><span class="small">${esc(D().blurb[r])}</span></button>`).join('')}</div>
    <p class="lede" style="margin-top:22px;"><button class="linkbtn" id="goMap">${esc(u('tabMap'))}</button> · <button class="linkbtn" id="goRules">${esc(u('tabRules'))}</button></p>
  </section></div>`;
  app.querySelector('#backLang').onclick = () => { S.lang = null; render(); };
  app.querySelectorAll('[data-pick-role]').forEach(b => b.onclick = () => { S.role = b.dataset.pickRole; store.set('obg_role', S.role); S.view = 'manual'; render(); window.scrollTo(0, 0); });
  app.querySelector('#goMap').onclick = () => { S.view = 'map'; render(); };
  app.querySelector('#goRules').onclick = () => { S.view = 'rules'; render(); };
}

function renderManual(notice){
  const M = D().man[S.role];
  app.innerHTML = `<div class="wrap view" data-lane="${S.role}">
    <div class="mhead"><div><div class="eyebrow">Order Bridge · ${esc(u('tabManual'))}</div><h1>${esc(laneName(S.role))} ${esc(u('manualTitle'))}</h1></div><div class="mono" style="color:var(--ink-soft);">${esc(u('dates'))}</div></div>
    ${notice}
    <div class="roles" role="group">${ROLES.map(r => `<button class="chip" data-role-chip="${r}" style="--c:var(--d-${r})" aria-pressed="${S.role === r}"><i></i>${esc(laneName(r))}</button>`).join('')}</div>
    <div class="mgrid">
      <nav class="toc" aria-label="${esc(u('tasks'))}"><b>${esc(u('tasks'))}</b>${M.tasks.map(t => `<a href="#" data-goto="${t.id}">${btn(t.t)}</a>`).join('')}</nav>
      <div style="min-width:0;">
        <div class="day"><h2>${esc(u('yourDay'))}</h2><ul>${M.day.map(x => `<li>${btn(x)}</li>`).join('')}</ul>${S.role !== 'approver' ? `<p style="margin:8px 0 0;font-size:14px;color:var(--ink-soft);">${esc(u('goLive'))}</p>` : ''}</div>
        ${M.tasks.map(t => `<article class="task" id="task-${t.id}">
          <h3>${btn(t.t)}</h3><div class="when">${btn(t.when)}</div>
          <div class="where">${esc(t.where)}</div>
          <ol>${t.steps.map(x => `<li>${btn(x)}</li>`).join('')}</ol>
          ${(t.rules && t.rules.length) || (t.map && t.map.length) ? `<div class="refs">${(t.rules || []).map(r => `<button class="ref" data-rule="${r}">${r}</button>`).join('')}${(t.map || []).map(n => `<button class="mapref" data-mapstep="${n}">${esc(u('seeMap'))} ${n}</button>`).join('')}</div>` : ''}
        </article>`).join('')}
      </div>
    </div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
  app.querySelectorAll('[data-role-chip]').forEach(b => b.onclick = () => { S.role = b.dataset.roleChip; store.set('obg_role', S.role); render(); });
  app.querySelectorAll('[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById('task-' + a.dataset.goto); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); });
  wireRefs();
}
function wireRefs(){
  app.querySelectorAll('[data-rule]').forEach(b => b.onclick = () => { S.view = 'rules'; S.hlRule = b.dataset.rule; render(); const row = document.getElementById('rule-' + S.hlRule); if (row) row.scrollIntoView({ block:'center' }); });
  app.querySelectorAll('[data-mapstep]').forEach(b => b.onclick = () => { S.view = 'map'; S.sel = +b.dataset.mapstep; S.mapRole = 'all'; render(); window.scrollTo(0, 0); });
}

function renderRules(notice){
  const R = D().rules;
  app.innerHTML = `<div class="wrap view">
    <div class="eyebrow">Order Bridge</div><h1>${esc(u('rulesTitle'))}</h1><p class="lede">${esc(u('rulesSub'))}</p>${notice}
    <div class="tablewrap"><table class="rtable"><thead><tr><th>${esc(u('thRule'))}</th><th>${esc(u('thWhat'))}</th><th>${esc(u('thWho'))}</th></tr></thead>
      <tbody>${Object.keys(DATA.en.rules).map(id => `<tr id="rule-${id}" class="${S.hlRule === id ? 'hl' : ''}"><td class="id">${id}</td><td>${btn(R[id][1])}</td><td class="who">${esc(R[id][0])}</td></tr>`).join('')}</tbody></table></div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
}

function renderMap(notice){
  const X = D(), Bx = X.boxes, stg = X.stages;
  app.innerHTML = `<div class="wrap view">
    <div class="mhead"><div><div class="eyebrow">Magari Furniture · Order Bridge</div><h1>${esc(u('mapTitle1'))}<span class="tag">${esc(u('mapTitle2'))}</span></h1><p class="lede">${esc(u('mapSub'))}</p></div><div class="mono" style="color:var(--ink-soft);max-width:300px;">${esc(u('dates'))}</div></div>
    ${notice}
    <div class="roles" role="group"><span style="font-weight:600;color:var(--ink-soft);font-size:13px;align-self:center;">${esc(u('showFor'))}</span>
      <button class="chip" data-maprole="all" aria-pressed="${S.mapRole === 'all'}">${esc(u('everyone'))}</button>
      ${ROLES.map(r => `<button class="chip" data-maprole="${r}" style="--c:var(--d-${r})" aria-pressed="${S.mapRole === r}"><i></i>${esc(laneName(r))}</button>`).join('')}</div>
    <div class="mmain"><div class="mapbox"><div class="map ${S.mapRole !== 'all' ? 'filtered' : ''}" id="map"></div></div><aside class="detail" id="detail" aria-live="polite"></aside></div>
    <div class="lower">
      <section class="box"><h3>${esc(Bx.sbTitle)}</h3><p class="sub">${esc(Bx.sbSub)}</p>
        <ol class="flow"><li data-lane="sales"><span class="r">${esc(Bx.sb1r)}</span><span>${esc(Bx.sb1)}</span></li><li data-lane="supply"><span class="r">${esc(Bx.sb2r)}</span><span>${esc(Bx.sb2)}</span></li></ol></section>
      <section class="box"><h3>${esc(Bx.srTitle)}</h3><p class="sub">${esc(Bx.srSub)}</p>
        <ol class="flow"><li data-lane="sales"><span class="r">${esc(Bx.sr1r)}</span><span>${esc(Bx.sr1)}</span></li><li data-lane="approver"><span class="r">${esc(Bx.sr2r)}</span><span>${esc(Bx.sr2)}</span></li><li data-lane="supply"><span class="r">${esc(Bx.sr3r)}</span><span>${esc(Bx.sr3)}</span></li><li data-lane="accounts"><span class="r">${esc(Bx.sr4r)}</span><span>${esc(Bx.sr4)}</span></li></ol></section>
      <section class="box"><h3>${esc(Bx.evTitle)}</h3><ul style="margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;">${Bx.ev.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
    </div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
  const map = document.getElementById('map');
  let h = '<div class="corner"></div>' + stg.map((s, i) => `<div class="sh"><b>${i + 1}. ${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('');
  LANE_KEYS.forEach(k => {
    const [nm, sub] = X.lanes[k];
    h += `<div class="lane ${S.mapRole !== 'all' && S.mapRole !== k ? 'dim' : ''}" data-lane="${k}">${esc(nm)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
    stg.forEach((_, si) => {
      const steps = STEPS.filter(s => s.l === k && s.s === si);
      h += `<div class="cell" data-lane="${k}" data-stage="${si}">${steps.map(s => { const x = X.steps[s.n - 1]; return `<button class="step ${S.mapRole !== 'all' && s.l !== S.mapRole ? 'dim' : ''}" data-n="${s.n}" data-lane="${s.l}" aria-pressed="${s.n === S.sel}"><span class="n">${s.n}</span><span class="t">${esc(x.t)}${s.opt ? ` <span class="opt">${esc(u('ifNeeded'))}</span>` : ''}</span><span class="w" data-who="${esc(laneName(s.l))}">${esc(x.w)}</span></button>`; }).join('')}</div>`;
    });
  });
  map.innerHTML = h;
  if (window.matchMedia('(max-width: 700px)').matches){
    stg.forEach((s, si) => { const hd = document.createElement('div'); hd.className = 'stage-m'; hd.textContent = `${si + 1}. ${s[0]}`; hd.style.order = si * 100; map.appendChild(hd); });
    map.querySelectorAll('.cell').forEach(c => { const first = Math.min(...[...c.querySelectorAll('.step')].map(b => +b.dataset.n), 99); c.style.order = (+c.dataset.stage) * 100 + first; });
  }
  map.querySelectorAll('.step').forEach(b => b.onclick = () => { S.sel = +b.dataset.n; renderMap(notice); if (window.matchMedia('(max-width: 1100px)').matches) document.getElementById('detail').scrollIntoView({ behavior:'smooth', block:'start' }); });
  app.querySelectorAll('[data-maprole]').forEach(b => b.onclick = () => { S.mapRole = b.dataset.maprole; if (S.mapRole !== 'all'){ const f = STEPS.find(s => s.l === S.mapRole); if (f && STEPS[S.sel - 1].l !== S.mapRole) S.sel = f.n; } renderMap(notice); });
  const s = STEPS[S.sel - 1], x = X.steps[s.n - 1];
  const list = S.mapRole === 'all' ? STEPS : STEPS.filter(y => y.l === S.mapRole);
  const idx = list.indexOf(s);
  const det = document.getElementById('detail'); det.setAttribute('data-lane', s.l);
  const mr = s.l === 'customer' ? 'sales' : s.l;
  const manualTask = X.man[mr].tasks.find(t => (t.map || []).includes(s.n));
  det.innerHTML = `<div class="who"><i></i>${esc(u('stepW'))} ${s.n} · ${esc(laneName(s.l))}</div><h2>${esc(x.t)}</h2><div class="where">${esc(x.w)}</div>
    <ul>${x.d.map(y => `<li>${esc(y)}</li>`).join('')}</ul><div class="next"><b>${esc(u('next'))}</b> ${esc(x.next)}</div>
    <div class="refs">${(DATA.en.stepRules[s.n] || []).map(r => `<button class="ref" data-rule="${r}">${r}</button>`).join('')}${manualTask ? `<button class="mapref" data-manual="${mr}|${manualTask.id}">${esc(u('openManual'))}: ${esc(laneName(mr))} › ${btn(manualTask.t)}</button>` : ''}</div>
    <div class="navbtns"><button id="prevStep" ${idx <= 0 ? 'disabled' : ''}>${esc(u('prev'))}</button><button id="nextStep" ${idx < 0 || idx >= list.length - 1 ? 'disabled' : ''}>${esc(u('nextB'))}</button></div>`;
  det.querySelector('#prevStep').onclick = () => { if (idx > 0){ S.sel = list[idx - 1].n; renderMap(notice); } };
  det.querySelector('#nextStep').onclick = () => { if (idx >= 0 && idx < list.length - 1){ S.sel = list[idx + 1].n; renderMap(notice); } };
  det.querySelectorAll('[data-manual]').forEach(b => b.onclick = () => { const [r, id] = b.dataset.manual.split('|'); S.role = r; store.set('obg_role', r); S.view = 'manual'; render(); const el = document.getElementById('task-' + id); if (el) el.scrollIntoView({ block:'start' }); });
  wireRefs();
}

render();

</script>
</body></html>
