<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Order Bridge Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: one guide, three views — a team manual (task cards with numbered steps), the swimlane workflow map, and one rules table every manual points into. Start screen picks language, then team. Accent is the yellow of the factory's paper job card. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --ink: #1f2a2e;
  --ink-soft: #55636a;
  --line: #d9ddd6;
  --accent: #f2c200;
  --accent-ink: #3a2f00;
  --focus: #1c6dd0;
  --l-customer: #e8eef6; --l-sales: #eaf3ec; --l-supply: #e9eef8; --l-factory: #fbf3d8; --l-accounts: #f3ebf6; --l-approver: #f8ebe7; --l-admin: #eceeee;
  --d-customer: #3c6aa8; --d-sales: #2f7d4a; --d-supply: #3557a8; --d-factory: #9a7400; --d-accounts: #7d4c96; --d-approver: #b0503a; --d-admin: #4d5a60;
  --font-display: "Archivo", "Noto Sans Kannada", "Noto Sans Devanagari", "Nirmala UI", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", "Noto Sans Kannada", "Noto Sans Devanagari", "Nirmala UI", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b1d; --panel: #1f2629; --ink: #e8ecea; --ink-soft: #a3b0b4; --line: #34403f; --accent: #f2c200; --accent-ink: #1d1700; --focus: #6ea8ff;
  --l-customer: #1f2a38; --l-sales: #1d2c22; --l-supply: #1e2536; --l-factory: #2e2914; --l-accounts: #2a2131; --l-approver: #33231f; --l-admin: #262c2e;
  --d-customer: #8db5ea; --d-sales: #7fcf98; --d-supply: #93acf0; --d-factory: #f2c200; --d-accounts: #c9a3de; --d-approver: #f0a08c; --d-admin: #b5c0c4;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161b1d; --panel: #1f2629; --ink: #e8ecea; --ink-soft: #a3b0b4; --line: #34403f; --accent: #f2c200; --accent-ink: #1d1700; --focus: #6ea8ff;
  --l-customer: #1f2a38; --l-sales: #1d2c22; --l-supply: #1e2536; --l-factory: #2e2914; --l-accounts: #2a2131; --l-approver: #33231f; --l-admin: #262c2e;
  --d-customer: #8db5ea; --d-sales: #7fcf98; --d-supply: #93acf0; --d-factory: #f2c200; --d-accounts: #c9a3de; --d-approver: #f0a08c; --d-admin: #b5c0c4;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; }
.brand { font: 800 17px/1 var(--font-display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .sq { width: 14px; height: 18px; background: var(--accent); border-radius: 2px; display: inline-block; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { background: transparent; border: 0; padding: 7px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
.tabs button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.langsw { margin-left: auto; display: flex; gap: 4px; }
.langsw button { border: 1px solid var(--line); background: transparent; padding: 5px 10px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.langsw button[aria-pressed="true"] { border-color: var(--ink); background: var(--accent); color: var(--accent-ink); }

.view { padding-block: 22px 56px; }
.eyebrow { font: 600 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1 { font: 800 clamp(26px, 3.4vw, 40px)/1.08 var(--font-display); margin: 6px 0 0; letter-spacing: -.01em; text-wrap: balance; }
h1 .tag { display: inline-block; background: var(--accent); color: var(--accent-ink); padding: 0 .28em; border-radius: 3px; }
.lede { max-width: 64ch; color: var(--ink-soft); margin: 8px 0 0; }
.notice { margin: 14px 0 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 14px; max-width: 80ch; font-size: 14.5px; }

/* start screen */
.start { max-width: 880px; margin: 0 auto; padding-block: 48px 64px; }
.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 22px; }
.pick button { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px 18px; cursor: pointer; display: grid; gap: 4px; }
.pick button:hover { border-color: var(--ink); }
.pick .big { font: 700 24px/1.15 var(--font-display); }
.pick .small { color: var(--ink-soft); font-size: 14px; }
.pick button[data-lane] { border-left: 6px solid var(--lc); }
.step-ind { font: 600 13px var(--font-mono); color: var(--ink-soft); margin-bottom: 4px; }
.linkbtn { background: none; border: 0; color: var(--focus); cursor: pointer; padding: 0; font-weight: 600; text-decoration: underline; }

/* manual */
.mhead { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; }
.roles { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 6px; }
.chip { font-weight: 600; font-size: 14px; border: 1.5px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ink-soft)); display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.mgrid { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; margin-top: 16px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.toc b { display: block; font: 700 13px var(--font-display); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; margin: 4px 4px 8px; }
.toc a { display: block; padding: 5px 6px; border-radius: 5px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.3; }
.toc a:hover { background: var(--bg); }
.day { background: var(--lt); border: 1px solid var(--line); border-left: 6px solid var(--lc); border-radius: 10px; padding: 14px 18px; }
.day h2 { font: 700 19px/1.2 var(--font-display); margin: 0 0 6px; }
.day ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; scroll-margin-top: 90px; }
.task h3 { font: 700 19px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.task .when { color: var(--ink-soft); font-size: 14px; margin: 3px 0 8px; }
.where { font: 500 13px/1.4 var(--font-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; display: inline-block; margin-bottom: 8px; word-break: break-word; }
.task ol { margin: 0; padding-left: 22px; display: grid; gap: 5px; max-width: 78ch; }
.btnname { font-weight: 700; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ref { font: 600 12.5px var(--font-mono); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
.mapref { font: 600 12.5px var(--font-mono); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; cursor: pointer; }

/* rules */
.rtable { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.rtable th, .rtable td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--line); }
.rtable th { font: 700 13px var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); background: var(--bg); border-top: 0; }
.rtable td.id { font: 700 13px var(--font-mono); white-space: nowrap; }
.rtable tr.hl td { background: var(--accent); color: var(--accent-ink); }
.rtable td.who { font-size: 13.5px; color: var(--ink-soft); white-space: nowrap; }
.tablewrap { overflow-x: auto; margin-top: 16px; border-radius: 10px; }
.rtable tr { scroll-margin-top: 90px; }

/* map */
.mmain { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; margin-top: 16px; }
.mapbox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.map { display: grid; grid-template-columns: 132px repeat(5, minmax(170px, 1fr)); min-width: 1000px; }
.map .sh { background: var(--panel); padding: 12px 10px 10px; border-bottom: 2px solid var(--ink); }
.map .sh b { display: block; font: 700 15px/1.15 var(--font-display); }
.map .sh span { font-size: 12.5px; color: var(--ink-soft); }
.map .corner { border-bottom: 2px solid var(--ink); }
.lane { padding: 12px 10px; border-top: 1px solid var(--line); font: 700 14px/1.2 var(--font-display); color: var(--lc); background: var(--lt); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.lane small { font: 400 12px var(--font-body); color: var(--ink-soft); }
.cell { border-top: 1px solid var(--line); border-left: 1px dashed var(--line); padding: 8px; display: flex; flex-direction: column; gap: 7px; background: var(--lt); min-height: 54px; }
.step { text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--lc); border-radius: 6px; padding: 7px 9px 8px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: start; transition: opacity .15s, transform .15s; }
.step .n { font: 700 12px/1 var(--font-mono); background: var(--ink); color: var(--bg); border-radius: 4px; padding: 4px 5px; margin-top: 1px; }
.step .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.step .w { grid-column: 2; font: 400 11.5px/1.35 var(--font-mono); color: var(--ink-soft); }
.step:hover { transform: translateY(-1px); }
.step[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.map.filtered .step.dim { opacity: .22; }
.map.filtered .lane.dim { opacity: .45; }
.opt { font: 600 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
aside.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; }
.detail .who { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--lc); }
.detail .who i { width: 9px; height: 9px; border-radius: 50%; background: var(--lc); }
.detail h2 { font: 700 21px/1.15 var(--font-display); margin: 6px 0 8px; text-wrap: balance; }
.detail ul { margin: 0 0 10px; padding-left: 18px; display: grid; gap: 5px; }
.detail .next { border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }
.navbtns { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.navbtns button { font-weight: 600; font-size: 13px; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.navbtns button:disabled { opacity: .35; cursor: default; }
.lower { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 22px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.box h3 { font: 700 17px/1.2 var(--font-display); margin: 0 0 4px; }
.box .sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 10px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.flow li { display: grid; grid-template-columns: 112px 1fr; gap: 8px; font-size: 14px; align-items: baseline; }
.flow .r { font: 600 12px var(--font-mono); color: var(--lc); text-transform: uppercase; letter-spacing: .04em; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
footer { color: var(--ink-soft); font-size: 13px; padding-block: 0 32px; }

[data-lane="customer"] { --lc: var(--d-customer); --lt: var(--l-customer); }
[data-lane="sales"] { --lc: var(--d-sales); --lt: var(--l-sales); }
[data-lane="supply"] { --lc: var(--d-supply); --lt: var(--l-supply); }
[data-lane="factory"] { --lc: var(--d-factory); --lt: var(--l-factory); }
[data-lane="accounts"] { --lc: var(--d-accounts); --lt: var(--l-accounts); }
[data-lane="approver"] { --lc: var(--d-approver); --lt: var(--l-approver); }
[data-lane="admin"] { --lc: var(--d-admin); --lt: var(--l-admin); }

.stage-m { display: none; }
@media (max-width: 1100px) { .mmain { grid-template-columns: minmax(0, 1fr); } aside.detail { position: static; } }
@media (max-width: 820px) { .mgrid { grid-template-columns: minmax(0, 1fr); } .toc { position: static; } .langsw { margin-left: 0; } }
@media (max-width: 700px) {
  .mapbox { border: 0; background: transparent; overflow: visible; }
  .map { display: flex; flex-direction: column; min-width: 0; }
  .map .sh, .map .corner, .lane { display: none; }
  .map .stage-m { display: block; font: 700 16px/1.2 var(--font-display); margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
  .cell { background: transparent; border: 0; padding: 0 0 6px; min-height: 0; }
  .cell:empty { display: none; }
  .step .w::before { content: attr(data-who) " · "; color: var(--lc); font-weight: 500; }
  .flow li { grid-template-columns: 1fr; gap: 0; }
  .rtable td.who { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { .step { transition: none; } .step:hover { transform: none; } }
</style>
</head><body>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="brand"><span class="sq"></span><span id="brandName">Order Bridge Guide</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="langsw" id="langsw" role="group" aria-label="Language"></div>
  </div>
</div>
<main id="app"></main>
<script>
const DATA = {"en": {"ui": {"pickLang": "Choose your language", "pickLangSub": "You can change it any time from the top bar.", "pickRole": "Which team are you in?", "pickRoleSub": "This opens your team's manual. Every team's manual is one tap away.", "step1": "Step 1 of 2", "step2": "Step 2 of 2", "back": "Change language", "tabManual": "My manual", "tabMap": "Workflow map", "tabRules": "Rules", "draftLang": "This translation is a first draft and is being reviewed. If anything is unclear, the English version is the reference.", "manualTitle": "manual", "yourDay": "Your day", "tasks": "Tasks", "seeMap": "Map step", "rulesTitle": "Rules", "rulesSub": "The rules every manual refers to. Click a rule number in a manual to jump here.", "thRule": "#", "thWhat": "Rule", "thWho": "Applies to", "mapTitle1": "From sales order to ", "mapTitle2": "delivered", "mapSub": "Who does what, in which screen, and who it goes to next. Pick a team to see its steps; click any step for the details.", "showFor": "Show steps for", "openManual": "Manual", "everyone": "Everyone", "next": "Next:", "prev": "← Previous", "nextB": "Next →", "stepW": "Step", "ifNeeded": "if needed", "footer": "Order Bridge · mfpl-order-bridge.edgeone.dev · Guide as of 22 Nov 2026. Screen and button names are shown in English, as in the app.", "dates": "Live from Mon 2 Nov 2026 · all order tracking is done in Order Bridge", "goLive": "From 2 Nov 2026 all order tracking happens only in Order Bridge. The old Upholstery Tag Station is retired: its tags (15 Sep – 31 Oct) were brought in, and new tags are made here."}, "lanes": {"customer": ["Customer", "site form only"], "sales": ["Sales", ""], "supply": ["Supply Chain", ""], "factory": ["Factory", "Production"], "accounts": ["Accounts", ""], "approver": ["COO / Director", "approvals"], "admin": ["Admin / MIS", ""]}, "blurb": {"sales": "PO requests, client dates, factory date requests, clarifications, stock blocks, SO revisions, site details, dispatch slots, payments. SO approval requests.", "supply": "POs in the ERP, the Unmatched list, stock, furnishings, QC report tick, warehouse receipt, bookings, dispatch and delivery.", "factory": "Clarifications, job cards, factory dates, furnishings receipt, tagging finished goods.", "accounts": "SO revision sign-off, payment confirmation, approvals, invoice and e-way bill. SO approval confirmation.", "approver": "SO revision approvals and dispatches with a balance due. SO approvals (discount, freight, advance).", "admin": "Daily data, users, permissions, locations, keys, job card imports and backups. SO approval policy, Keep SOs, usage."}, "rules": {"R1": ["Sales", "A SKU needs its client date before it can be sent for a PO. Choose 45, 60, 75, 90 or 120 days (counted from the request date, then fixed) or pick a date."], "R2": ["Sales", "Only SKUs on the SO can be requested. Anything not on the SO goes through SO Revision Request."], "R3": ["Supply", "Supply doesn't type PO numbers. After \"Mark PO raised in ERP\", the next data refresh finds the PO line and links it. Anything that can't be matched shows in PO Progress Tracker › Unmatched."], "R4": ["Factory, Sales", "The factory can raise clarifications for 15 working days from the PO date. Production starts only when no clarification is open."], "R5": ["Factory, Sales", "Factory date: within 20 days of an MFPL PO the factory agrees to the client date or proposes its own date, for one SKU or the whole PO. Sales accepts, or rejects and suggests a date. The factory can send one second proposal; after that, sales' final date binds. With no answer in 20 days, the client date minus 5 days is taken automatically."], "R6": ["Everyone", "There are 5 days between the two dates: factory date + 5 = the date the goods can reach the client. Sales see dates on the client side, the factory sees its own date, and Supply and Admin see both."], "R7": ["Factory, Sales", "Changing a confirmed factory date: the factory can request a deviation until 10 days before that date (one request at a time). In the last 10 days the date is locked. A SKU date may be later than the PO's date: once sales accepts it, that SKU follows its own date and the PO date stays the limit for the PO's other SKUs. An admin can allow the factory one more deviation request, even inside the last 10 days; sales still accepts or rejects it."], "R8": ["Everyone", "Delay risk is flagged on MFPL factory POs: will miss the client date; stages behind (under 30 / 15 / 7 days left and polishing, factory QC or packing not started); fabric not sent while the job card is at Post Frame or later; no job card 15 days after the PO; factory date more than 75 days after the PO."], "R9": ["Sales, Supply", "An approved stock block counts that SKU as covered, so no PO is needed for it. If a PO line for the same code + FIN (for example AARA → AARAFIN) appears on the same SO, the block shows \"Issued to factory — FIN PO …\", stops counting as blocked stock, and the FIN line follows the normal factory flow. When that SKU is dispatched to the customer through Order Bridge (marked dispatched), the block shows \"Dispatched to customer\" with the date and stops counting as blocked; a part dispatch leaves the rest blocked."], "R10": ["Factory, Supply", "A scanned job card is never saved unchecked. Check every field against the photo, especially the amber ones. Photographing the card again updates the same card; dates and signatures once saved stay."], "R11": ["Everyone", "The job card stage shown in PO Progress Tracker and Order Deadlines is the furthest stage that has both a start date, an end date and at least one signature."], "R12": ["Supply, Sales", "A furniture SKU made by the factory is ready for a dispatch or installation slot only when Supply has ticked \"QC report generated\" for it in Order Deadlines AND its job card shows packing done. The tick opens once the job card’s Factory-QC stage has a start date. Its warehouse tags follow the same rule. A furniture SKU with no job card can’t be ticked by Supply; an admin can tick it with a reason."], "R13": ["Supply, Factory", "Furnishings and warehouse tags move whole: no part quantities. Challan and receipt numbers are made by the app; reprint challans from the Logbook."], "R14": ["Supply, Admin", "\"Mark dispatched\" stays locked until the Dispatch Day checks are complete. Only an admin can override, with a reason of 3 or more words that is logged. Dispatch Day to-dos appear from 48 hours before the dispatch date; the checks can be done earlier."], "R15": ["Sales, COO / Director, Accounts", "If more than ₹1 is unpaid at dispatch, a COO / Director must approve. The link is valid for 48 hours; rejecting needs a comment; Accounts then validates. If the unpaid amount grows past what was approved, a new approval is needed."], "R16": ["Accounts", "The invoice and e-way bill step opens once Supply's ERP numbers are in and the payment is settled: fully paid and confirmed; nothing received but approval validated; or part paid and confirmed with approval validated for the rest. The invoice number is always required. The e-way bill is 12 digits, or \"Not required\" with a reason."], "R17": ["Sales, Supply", "Dispatch and installation can't be requested on blocked dates, and only in the windows set in Slot settings. A dispatch after the client date needs a reason. The tracking link can be a link or NA; without one, give the transport POC."], "R18": ["Sales, Customer", "Each site-details link belongs to one SO. Each piece is checked with 5 inches added to every side: against the lift, or with no lift, against the stairs (its smallest side must pass the stair width and it must fit the landing length, breadth and height). A piece that doesn't fit needs an override reason of 3 or more words."], "R19": ["Everyone", "The page updates itself: other people's changes appear within 2 minutes, and at once when you come back to the tab. It waits while you are typing. New ERP data, and PO requests added or linked by others, show a bar asking you to refresh. ERP data is as fresh as the last daily upload. In every CSV download, SO and PO numbers keep all their digits in Excel."], "R20": ["Sales, Supply, Accounts, COO / Director", "An SO revision needs the COO / Director's approval first. Then Accounts reconciles the order value and advance and approves (the revised SO is raised in the ERP). Then Supply confirms the PO cancellation. The revision stays open until Supply confirms."], "R21": ["Everyone", "POs raised before 2 Nov 2026: their SKU details were shared by email, so only their dates can be revised here, within these rules. Their 20-day factory window and the 15-day job card check count from 2 Nov. Their fabric is judged by the tags on the PO line: no tag means no fabric needed."], "R22": ["Factory, Supply", "Material readiness (PO Progress Tracker › Readiness C0–C4) is shared by the factory and supply. Each open factory SKU line gets C0–C4 and a \"Next\" label saying whose move it is: Factory (job card, raw material, confirming fabric received), Supply (logging or sending fabric) or Sales (fabric details missing). The raw-material tick follows the latest line the factory writes in the job card's Material Used table: \"RM Available\" ticks it, \"RM Not Available\" unticks it. To change it, cross out the old line and write the new one below; the next scan picks it up. Each line shows the date of the scan it comes from."], "R23": ["Sales, Admin, Factory, Supply", "Changing fabric, finish, cane weave or stone after the PO is raised: sales asks an admin to reopen the field, with a reason; the admin accepts or rejects, with a reason. A field can only be reopened while the job card shows no work on its stage — Upholstery for fabric, Polishing for finish and stone, Post Frame for cane weave (no job card = no work yet). Sales changes only the reopened fields and saves; the factory and supply both press \"Seen revised spec\". Before the PO is raised, an admin can send a request back to draft instead."], "R24": ["Admin, Factory, Supply", "Corrections to furnishings tags, warehouse tags and job cards: an admin proposes the change with a reason; the team that owns the record accepts or rejects it with a reason — supply for furnishings tags, the factory for warehouse tags and job cards. Nothing changes until it is accepted. A tag that has already moved can only be voided (then log a new one). Quantities are never edited. If printed details change, reprint the tag. A later job card scan keeps an admin correction and shows both values."], "R25": ["Sales, SO approver, COO / Director, Accounts", "Every new SO goes through SO Approval Request before it goes ahead. Sales upload the draft SO PDF from the ERP — its figures can’t be typed or changed in Order Bridge. Discount (on the discounted lines): up to the sales limit is fine; up to the SO approver limit needs an SO approver; above that, COO / Director. Freight: the SO must have a freight line of at least the ready-reckoner rate for the store, the distance band of the delivery PIN and the number of furniture pieces (above the largest band, extra trucks); missing, lower, or outside city limits needs COO / Director. Advance: at least the minimum % (70%) of the basic value including freight, or COO / Director. One request goes to the most senior approver needed, who decides each item with a note. Accounts confirm only when every approval is in and every payment is marked received. The limits, rates and PIN bands are set by admin."], "R26": ["Sales, Supply, Admin", "Booking changes: sales change a booking supply hasn’t approved yet themselves; on an approved booking sales ask and supply approves or declines — until then nothing changes. Supply and admin change bookings directly. No changes after dispatch. Every change needs a reason, a new date is checked for room, and the history stays on the booking. A status set by mistake can be undone with a reason: supply within 24 hours, admin any time; undoing Delivered is admin only."], "R27": ["Admin", "A Delivery Challan’s From / To can be corrected by admin only while none of its tags has been received. The challan keeps its number, is marked Revised, and the reprint says what changed. After receipt: void and log again."], "R28": ["Admin", "The Open SOs list leaves out every SO that isn’t on it. Admin can keep named SOs with a reason; one missing from the PI Revenue Report gets a basic row from PO Summary. It comes off the keep list once both the Open SOs list and the PI Revenue Report include it."], "R29": ["Everyone", "Order Bridge records which pages each person opens and for how long (never what they type). Only admins see it, under Usage; it is kept for 90 days."], "R30": ["Sales, Supply, Factory", "The client sheet carries only what the client must confirm: article, quantity, fabric, finish, cane, stone, design, site work, site mapping, notes and the clarifications sales tick. Never prices, dates, PO numbers or internal names. “Client confirmed” is optional: it records the date and where the confirmation is (no file is kept) and shows on the PO line for everyone. If any of those details change afterwards, the line shows “Changed since client confirmed” and what changed, until sales get it confirmed again. Clarification answers may be shown to the client, so write them as you would to a client."], "R31": ["Sales, SO approver, COO / Director, Accounts", "Every commission to an architect, designer or middleman needs approval: an SO approver up to the admin’s limit, above it (or while it isn’t set) the COO / Director. It is worked out on the pre-GST value after discount, without freight; the approver also sees discount + commission together. Changing the amount or who is paid after approval asks again. Bank account and PAN are shown in full only to accounts, admin and whoever entered them. New or changed bank details stay “Unverified” until someone in accounts other than the person who entered them checks them — never pay to unverified details; it doesn’t hold up confirming the SO. A revised SO must be named on an SO Revision request, and accounts can’t confirm it until the COO / Director has approved that revision."]}, "man": {"sales": {"day": ["Open the Dashboard: your to-dos are under \"Needs action\"; the bell also shows notices, such as fabric sent to or received at the factory.", "Check new SOs in PO Progress Tracker and send their SKUs for PO.", "Answer the factory's date proposals and clarifications.", "Keep Last Mile moving: site details, dispatch slots, Dispatch Day payments."], "tasks": [{"id": "s-req", "t": "Send a SKU for PO", "when": "For every SKU on a new SO that isn't on a PO yet.", "where": "PO Progress Tracker › open the SO › Still to raise", "steps": ["Open ⟦PO Progress Tracker⟧ and click the SO (use the ⟦No PO raised⟧ or ⟦Part PO raised⟧ filters).", "On the SKU, press ⟦Start PO request⟧.", "Fill in the fabric (the material SKU fills itself), polish / finish, stone if any, and design instructions. Add site requirements if needed. Cane weave (NA, Round Hole, German Mesh or Other) and stone (NA, a stone from the list, Stone sent by client, or Other) are required too.", "Set the Committed date to client.", "Press ⟦Send to supply for PO⟧. To drop an unsent draft, press ⟦Discard draft⟧."], "rules": ["R1", "R2"], "map": [5]}, {"id": "s-cd", "t": "Set or change a client date", "when": "On SKUs already on a PO, or for all lines of an SO at once.", "where": "PO Progress Tracker › SO › Committed date to client", "steps": ["Open the SO and set the date for the line, or use \"Committed date to client — all lines on a PO\" and ⟦Apply to every line⟧.", "Order Deadlines and the delay-risk checks measure the factory date against this date."], "rules": ["R1", "R6", "R21"], "map": [5]}, {"id": "s-dl", "t": "Answer the factory's date proposal", "when": "When the factory proposes a date or asks for a deviation (it appears in Needs action).", "where": "Order Deadlines › SO › PO › SKU", "steps": ["Open the to-do. The proposal shows the date, the reason and who sent it.", "Press ⟦Accept⟧, or ⟦Reject & suggest a date⟧ with the date you can commit to the client.", "After the factory's second proposal, press ⟦Accept⟧ or ⟦Reject & set the final date⟧: your final date binds.", "A SKU may get a date later than its PO's date. If you accept it, that SKU follows its own date; the other SKUs keep the PO date."], "rules": ["R5", "R6", "R7"], "map": [11]}, {"id": "s-clar", "t": "Answer a clarification", "when": "When the factory raises one (it appears in Needs action).", "where": "PO Progress Tracker › order", "steps": ["Open the order from the to-do.", "Reply to the question. The factory closes the clarification when it's clear."], "rules": ["R4"], "map": [8]}, {"id": "s-sb", "t": "Block stock instead of raising a PO", "when": "When the item is already in a warehouse.", "where": "Stock Block Station › Request a stock block", "steps": ["Choose the Sales order, Article and Warehouse.", "Enter the Quantity to block and a Reason.", "Press ⟦Submit request⟧. Supply approves or rejects it.", "If the stock is later sent to the factory on a FIN PO, the block shows \"Issued to factory\"."], "rules": ["R9"]}, {"id": "s-rev", "t": "Revise an SO", "when": "Quantity change, extra discount, design change or new SKU, client detail change, or splitting the SO for part POs.", "where": "SO Revision Request › Raise a revision request", "steps": ["Enter the Old SO number and the new SO(s).", "Choose the Reason for Revision and write the Background Details.", "Press ⟦Create approval link for COO / Director⟧ and send the link (copy or WhatsApp).", "If it is sent back, fix it and resubmit."], "rules": ["R20"]}, {"id": "s-reopen", "t": "Change fabric, finish, cane weave or stone after the PO", "when": "The customer changes their mind after the PO is raised.", "where": "PO Progress Tracker › SKU line › Spec revisions", "steps": ["Open the SKU line. Under Spec revisions, tick the fields to change (a field is greyed out once the factory has started that stage) and write the reason. Press ⟦Ask admin to reopen⟧.", "When an admin reopens them, change only those fields in the form and press ⟦Save revision⟧ — or ⟦Cancel — keep the old details⟧.", "The factory and supply then acknowledge the revised spec; you can see when they do."], "rules": ["R23"]}, {"id": "s-site", "t": "Get site details from the customer", "when": "Before booking the dispatch.", "where": "Last Mile Ops › Site Details", "steps": ["Choose the Sales order.", "Press ⟦Copy link⟧ and send it to the customer on WhatsApp.", "When the customer submits, the details appear under \"Site details by sales order\"."], "rules": ["R18"], "map": [18, 19]}, {"id": "s-slot", "t": "Request a dispatch slot or installation", "when": "When the goods are ready, or when the customer wants a date.", "where": "Last Mile Ops › Dispatch / Installation", "steps": ["Open the Dispatch tab (or Installation) and choose the Sales order.", "Pick a date and window, and the items. The Ready? column shows what is ready; a factory-made furniture SKU is ready only after Supply's QC report tick.", "If a piece is too large for the lift or stairs, leave it out or give an override reason.", "Submit. Supply approves the booking and assigns the vendor."], "rules": ["R12", "R17", "R18"], "map": [20]}, {"id": "s-dd", "t": "Run the Dispatch Day payment check", "when": "Before every dispatch. The to-do appears 48 hours before the dispatch date; you can start earlier.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Choose the Sales order and its Dispatch slot, then ⟦Start Dispatch Day check⟧.", "The balance is prefilled. Add each payment received (amount, date, mode, transaction details) and submit to Accounts.", "If anything stays unpaid, write a reason and create the COO / Director approval link; share it.", "If Accounts sends a payment back, correct it and resubmit."], "rules": ["R14", "R15"], "map": [22]}, {"id": "s-csv", "t": "Download a list", "when": "When you need the orders in Excel.", "where": "PO Progress Tracker", "steps": ["Pick the filter chip and search you want.", "Press ⟦Download lines CSV⟧: one row per SKU line of the SOs on screen, with your dates, the job card stage and delay risk."], "rules": ["R19"]}, {"id": "s-soap", "t": "Send a new SO for approval", "when": "For every new SO, before it goes ahead — instead of emailing accounts.", "where": "SO Approval Request › New request", "steps": ["Download the draft SO / proforma invoice PDF from the ERP and choose it under ⟦New request⟧. Order Bridge reads every line and the totals; to change a figure, fix the SO in the ERP and upload it again.", "If the SO has no delivery PIN, type it. Add each advance payment: amount, date, mode and UTR / reference.", "Check the three cards — Discount, Freight, Advance. For each one that needs approval, write the reason.", "Press ⟦Send request⟧. If it needs approval, press ⟦Create approval link⟧ and send it on WhatsApp; the approver signs in to open it.", "Rejected, or sent back by accounts? Open the request and press ⟦Upload a revised PDF / change payments or reasons⟧. Approvals that still cover the new version stay."], "rules": ["R25", "R31"], "map": [2]}, {"id": "s-soappr", "t": "Approve an SO discount (SO approvers only)", "when": "If admin has made you an SO approver and a request is waiting for you.", "where": "SO Approval Request › Requests · approval link", "steps": ["Open it from Needs action or the link.", "Check the discount and the list of SKUs that carry no discount, then ⟦Approve⟧ or ⟦Reject⟧ with a note.", "You only get requests whose biggest approval is in the SO approver band; anything larger goes to COO / Director.", "You can’t approve a request you raised yourself; it goes to another SO approver or the COO / Director."], "rules": ["R25"]}, {"id": "s-bkchg", "t": "Change or reschedule a booking", "when": "The customer wants another day, or the site details on a booking are wrong.", "where": "Last Mile Ops › Dispatch / Installation › the booking", "steps": ["Press ⟦Change⟧ (supply hasn’t approved it yet) or ⟦Request a change⟧ (approved booking).", "Change the date / window, address, PIN, map link, site contact or notes and give a reason. After the client date, it asks why.", "On an approved booking supply decides — the answer comes in Needs action. ⟦Withdraw request⟧ until then."], "rules": ["R26"]}, {"id": "s-csheet", "t": "Get the client to confirm the SKU details", "when": "Before the SKUs go into production — instead of sending the CSV.", "steps": ["Fill in the details for each SKU (fabric, finish, stone, cane, design, site). Drafts count.", "On the SO row press ⟦Client sheet⟧. Every SKU with details is ticked — untick any you don’t want on it. Tick the answered clarifications the client should see.", "⟦Print / save as PDF⟧ for a sheet with a sign-off block, or ⟦Download Excel⟧. No prices, dates, PO numbers or internal names go on it.", "When the client confirms, set the date, say where the confirmation is (for example “signed sheet on WhatsApp from Mr Menon”) and press ⟦Mark client confirmed⟧.", "If a detail changes later, the SKU shows “Changed since client confirmed” and what changed. Send the sheet again and mark it confirmed again."], "rules": ["R30"], "where": "PO Progress Tracker › the SO row › Client sheet"}, {"id": "s-comm", "t": "Add an architect’s commission, or say the SO is revised", "when": "While sending the SO for approval, if someone is paid for bringing the client, or the SO replaces an earlier one.", "steps": ["Answer “Is this a revised SO?”. If yes, the SO Revision request (old SO → this SO) must exist first; the old SO’s commission is brought in to compare. Add the customer’s PO number if there is one.", "In the Commission card press ⟦Add commission⟧ and pick the person from the saved list. Not there yet? ⟦Save a new architect / designer…⟧: name, mobile, bank account (twice), IFSC, bank, branch, PAN, state, address, and GSTIN if they are registered.", "Enter the commission as a % or a ₹ amount. It is worked out on the pre-GST value after discount, without freight. Give a reason — every commission needs approval.", "If you change the commission or who gets it after it was approved, it goes back for approval."], "rules": ["R31"], "where": "SO Approval Request › New request › Commission"}, {"id": "s-namedappr", "where": "SO Revision Request · Last Mile Ops › Dispatch Day", "t": "Approve an SO revision or a part-paid dispatch (if admin named you)", "when": "When admin has named you as an approver and you get the notice or a link.", "steps": ["Open the link, or the notice under the bell. You decide with your own login — no separate approver login needed.", "Read the details, add a comment, and press ⟦Approve⟧ (or ⟦Send back to sales⟧ / ⟦Reject⟧). The next team gets it straight away.", "You can’t approve a request you raised yourself: it shows “You raised …” and waits for another approver or the COO / Director."]}]}, "supply": {"day": ["Open the Dashboard: to-dos under \"Needs action\".", "Mark POs raised in the ERP; clear the Unmatched list after each data refresh.", "Track factory dates in Order Deadlines; tick \"QC report generated\" once a furniture SKU’s job card is in Factory-QC. Check Readiness C0–C4 with the factory.", "Furnishings in and out; warehouse receipts.", "Approve bookings, enter ERP dispatch numbers, mark dispatched and delivered."], "tasks": [{"id": "u-po", "t": "Mark a PO as raised", "when": "After you raise the PO in the ERP for a request from Sales.", "where": "PO Progress Tracker › request", "steps": ["Raise the PO in the ERP as usual.", "Open the request and press ⟦Mark PO raised in ERP⟧. Don't type the PO number.", "The next data refresh links the PO line to the request."], "rules": ["R3"], "map": [6]}, {"id": "u-cover", "t": "Close a SKU that needs no new PO", "when": "The SKU is already on another PO, supplied from stock, or removed from the order.", "where": "PO Progress Tracker › SO › Still to raise", "steps": ["Press ⟦Already on a PO⟧ and pick the PO line, or ⟦No PO needed⟧ with the reason.", "Undo is available if you picked wrong."], "rules": ["R9"], "map": [6]}, {"id": "u-um", "t": "Clear the Unmatched list", "when": "After each data refresh.", "where": "PO Progress Tracker › Unmatched", "steps": ["Work through each section: requests waiting for a PO line, loose matches to confirm or reject, PO lines with no matching SKU, quantity mismatches.", "Link by picking from the lists. Use \"Not for an SO SKU\" to dismiss a PO line that isn't for a SKU."], "rules": ["R3"]}, {"id": "u-dl", "t": "Follow factory dates", "when": "Daily.", "where": "Order Deadlines", "steps": ["Sales and the factory agree the dates; you see both the client date and the factory date on every line.", "Use the list or the calendar, and the delay-risk column, to chase what is late."], "rules": ["R5", "R6", "R8"], "map": [11]}, {"id": "u-cat", "t": "Check material readiness (C0–C4)", "when": "Daily, with the factory.", "where": "PO Progress Tracker › Readiness C0–C4", "steps": ["Press ⟦Mine · Supply to act⟧ to see the lines waiting on supply: fabric with no tag yet, or tagged but not sent to the factory.", "Open a sales order to see each line's job card, raw material, fabric and category. The factory sees the same view and owns the raw-material tick."], "rules": ["R22"]}, {"id": "u-qc", "t": "Tick \"QC report generated\"", "when": "When the QC report is done for a furniture SKU whose job card has a Factory-QC start date.", "where": "Order Deadlines › SO › PO › SKU", "steps": ["Open the SKU line. Under the job card stage, tick ⟦QC report generated⟧. Nothing else needs to be entered.", "The SKU becomes ready for a dispatch or installation slot, and its warehouse tags can be made.", "The SKU becomes ready for slots and warehouse tags only once the job card also shows packing done (“Ready once packed”). A SKU with no job card can’t be ticked — link a job card first; only an admin can tick it, with a reason. Untick if ticked by mistake; every tick is recorded."], "rules": ["R12"], "map": [15]}, {"id": "u-sb", "t": "Approve or release a stock block", "when": "When Sales or the factory requests one.", "where": "Stock Block Station › Requests", "steps": ["Press ⟦Approve⟧ or ⟦Reject⟧.", "Press ⟦Release⟧ when the block is no longer needed. A block issued to the factory on a FIN PO shows the FIN PO and can't be released. A block whose SKU has been dispatched to the customer shows \"Dispatched to customer\"."], "rules": ["R9"]}, {"id": "u-rev", "t": "Check an SO revision", "when": "After Accounts approves the revision (the revised SO is raised in the ERP).", "where": "SO Revision Request", "steps": ["Check that the PO on the old SO is cancelled (or that none needs cancelling).", "Write a note and press ⟦Mark done⟧. The revision stays open until you do."], "rules": ["R20"]}, {"id": "u-ack", "t": "Acknowledge a revised spec", "when": "Needs action shows \"Revised spec to acknowledge\".", "where": "PO Progress Tracker › SKU line", "steps": ["Open it and check the before / after table.", "Press ⟦Seen revised spec⟧. If old fabric tags are listed, return or re-use that fabric."], "rules": ["R23"]}, {"id": "u-fin", "t": "Log furnishings and print tags", "when": "When fabric or furnishings arrive.", "where": "Furnishings Tag Station › Intake", "steps": ["Choose the Furnishings PO and the upholstery / material (or tick Fabric sent by client, or MFPL Direct Order).", "Enter quantity and unit, then the Furniture PO and product it is for. Choose Received at: where the delivery arrived (it shows as Logged in the Logbook).", "Press ⟦Add to log & generate tag⟧ and stick the tag on the roll."], "rules": ["R13"], "map": [12]}, {"id": "u-fdis", "t": "Send furnishings to the factory", "when": "When the factory needs the material.", "where": "Furnishings Tag Station › Dispatch", "steps": ["Scan each tag (⟦Scan a tag⟧) or type the tag ID and press ⟦Add⟧.", "Choose the Dispatcher address and the Receiver address.", "Generate the challan. It opens for printing; reprint any time from the Logbook. Sales get a notice."], "rules": ["R13"], "map": [13]}, {"id": "u-wrec", "t": "Receive goods at the warehouse", "when": "When a factory consignment arrives.", "where": "Warehouse Tag Station › Receipt", "steps": ["Scan or type each tag, or tick tags in transit.", "Press ⟦Add selected to receipt⟧ and confirm."], "rules": ["R13"], "map": [17]}, {"id": "u-book", "t": "Approve a dispatch or installation booking", "when": "When Sales requests a slot.", "where": "Last Mile Ops › Dispatch / Installation", "steps": ["Choose the vendor (In-house fleet/ Milk Run, APML, Installco Wify, Other) or installation crew (Installco Wify, MFPL, Other). For Other, type the name.", "Add the tracking link or NA, or the transport POC's name and number.", "Press ⟦Approve⟧ (or ⟦Reject⟧)."], "rules": ["R17"], "map": [21]}, {"id": "u-erp", "t": "Enter ERP dispatch numbers", "when": "For every Dispatch Day check, in parallel with the payment step.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Enter the dispatch sheet number, the dispatch PO (pick from PO Summary or type) and the installation PO if needed."], "rules": ["R14", "R16"], "map": [25]}, {"id": "u-dis", "t": "Dispatch and confirm delivery", "when": "On the dispatch day, after the checks.", "where": "Last Mile Ops › Dispatch", "steps": ["Press ⟦Print packing list⟧ for the truck.", "Press ⟦Mark dispatched⟧. It stays locked until the Dispatch Day checks are done.", "After delivery: upload the handover photo (POD) and press Mark delivered. If there is no usable photo, tick that the POD was received and give a reason.", "For installations: Mark installation completed, or \"Installed on the same visit\"."], "rules": ["R14"], "map": [27]}, {"id": "u-jc", "t": "Capture a job card (when needed)", "when": "Supply can capture job cards too.", "where": "Job Card Station › Capture & review", "steps": ["See the Factory manual: \"Capture a job card\"."], "rules": ["R10"], "map": [9]}, {"id": "u-corr", "t": "Accept or reject a correction", "when": "The Furnishings Tag Station shows Corrections.", "where": "Furnishings Tag Station › Corrections", "steps": ["Compare “Now” with “Corrected”.", "Press ⟦Accept⟧, or write the reason and press ⟦Reject⟧. If it asks, print the new tag and replace the old label."], "rules": ["R24"]}, {"id": "u-bkchg", "t": "Answer a booking change, or undo a status", "when": "Sales ask to change a booking, or a status was set by mistake.", "where": "Last Mile Ops › Dispatch / Installation", "steps": ["A change request shows under the booking with old → new. Press ⟦Approve change⟧, or write a reason and ⟦Decline⟧. If the new slot is full, decline it or change the booking yourself.", "⟦Change⟧ works directly on any booking before dispatch, with a reason.", "Dispatched, Cancelled, Not approved or Installation completed by mistake? Press ⟦Undo …⟧ within 24 hours and give a reason. After that, ask an admin.", "A booking that says “Freight was charged for … but the site is …” needs the freight checked with sales and accounts before dispatch."], "rules": ["R26", "R25"]}]}, "factory": {"day": ["Open the Dashboard: to-dos and the Production delay risk tiles. The bell tells you about each new MFPL PO and how many days are left to give your date.", "Review new POs and raise clarifications early.", "Agree or propose factory dates within 20 days of each PO.", "Photograph job cards as stages are filled in. Write the raw material status on the card (RM Available / RM Not Available).", "Receive furnishings; tag and send finished goods to the warehouse."], "tasks": [{"id": "f-dl", "t": "Agree or propose the factory date", "when": "Within 20 days of a new MFPL PO. The bell shows the days left, with a reminder at 5 days.", "where": "Order Deadlines › SO › PO", "steps": ["For the whole PO or one SKU, press ⟦Agree to …⟧ to take the client date minus 5 days, or ⟦Propose a date⟧.", "For a proposal, give the date and a reason and press ⟦Send to sales⟧. Sales accept, or reject and suggest a date.", "If sales suggest a date, press ⟦Accept sales' date⟧ or ⟦Send second proposal⟧. After that, sales' final date binds.", "If you don't answer within 20 days, the client date minus 5 days is taken and you get a notice."], "rules": ["R5", "R6", "R21"], "map": [10]}, {"id": "f-dev", "t": "Ask for a later date (deviation)", "when": "When a confirmed date can't be met, until 10 days before it.", "where": "Order Deadlines › SKU or PO", "steps": ["Press ⟦Request a deviation⟧, give the new date and the reason, and send it to sales.", "You may ask for a SKU date later than the PO's date or later than any date already recorded. If sales accept, that SKU follows its new date.", "In the last 10 days before the date it is locked."], "rules": ["R7"], "map": [10]}, {"id": "f-clar", "t": "Raise or close a clarification", "when": "Within 15 working days of the PO date.", "where": "PO Progress Tracker › order", "steps": ["Open the order and press ⟦Raise clarification⟧. Write the question.", "When Sales has answered, press ⟦Close clarification⟧."], "rules": ["R4"], "map": [7]}, {"id": "f-jc", "t": "Capture a job card", "when": "When production starts, and again each time more stages are filled in.", "where": "Job Card Station › Capture & review", "steps": ["Press ⟦Take photo⟧ (or ⟦Upload image⟧). Photograph the whole card, flat, in good light.", "Wait a few seconds while it is read. Then check every field against the photo, especially the ones outlined in amber.", "Link the card to its PO line (search by PO number, customer or article).", "Save. Photograph the same card again later: it updates the card, it doesn't duplicate it.", "A stage counts as done when it has a start date, an end date and at least one signature.", "Raw material: write its status as a line in the card's Material Used table — \"RM Available\" or \"RM Not Available\". When it changes, cross out the old line and write the new one below. The tick follows the latest line; check it before saving."], "rules": ["R10", "R11", "R22"], "map": [9]}, {"id": "f-cat", "t": "Check material readiness (C0–C4)", "when": "Daily, with supply.", "where": "PO Progress Tracker › Readiness C0–C4", "steps": ["Press ⟦Mine · Factory to act⟧ to see the lines waiting on the factory: no job card, raw material not confirmed, or fabric to confirm as received.", "Open a sales order to see each line's job card, raw material (with the date of the scan), fabric and category. Do your part; supply sees the same view."], "rules": ["R22"]}, {"id": "f-fr", "t": "Confirm furnishings received", "when": "When a furnishings challan arrives.", "where": "Furnishings Tag Station › Receiving", "steps": ["Scan each tag (⟦Scan a tag⟧) or type the tag ID and press ⟦Look up⟧.", "Check \"Received at\" (it starts on the challan's destination) and confirm. Sales get a notice."], "rules": ["R13"], "map": [14]}, {"id": "f-wt", "t": "Tag finished goods", "when": "When a piece is packed and Supply has ticked its QC report.", "where": "Warehouse Tag Station › Intake", "steps": ["Enter the PO number and choose the Article SKU (SO and customer fill themselves).", "If the screen says the QC report is not confirmed yet, ask Supply to tick it in Order Deadlines first.", "Enter the number of packets for this piece. Tick \"needs installation\" if it does.", "Press ⟦Generate tag & log intake⟧, then ⟦Print⟧."], "rules": ["R12", "R13"], "map": [16]}, {"id": "f-wd", "t": "Send finished goods to the warehouse", "when": "For each consignment.", "where": "Warehouse Tag Station › Dispatch", "steps": ["Scan every tag leaving in this consignment, or tick them under \"Tags awaiting dispatch\".", "Press ⟦Add selected to dispatch⟧ and confirm.", "Print the ⟦Delivery challan⟧ and ⟦Packing list⟧ for the truck."], "rules": ["R13"], "map": [16]}, {"id": "f-sb", "t": "Request a stock block", "when": "When stock in a warehouse can be used for an order.", "where": "Stock Block Station", "steps": ["Same form as Sales: Sales order, Article, Warehouse, Quantity, Reason, then Submit request."], "rules": ["R9"]}, {"id": "f-ack", "t": "Acknowledge a revised spec", "when": "Needs action shows \"Revised spec to acknowledge\".", "where": "PO Progress Tracker › SKU line", "steps": ["Open it and check the before / after table.", "Press ⟦Seen revised spec⟧ (add a note if needed). Work to the new spec."], "rules": ["R23"]}, {"id": "f-corr", "t": "Accept or reject a correction", "when": "The Warehouse Tag Station or Job Card Station shows Corrections.", "where": "Warehouse Tag Station / Job Card Station › Corrections", "steps": ["Compare “Now” with “Corrected”.", "Press ⟦Accept⟧, or write the reason and press ⟦Reject⟧. If it asks, print the new tag and replace the old label."], "rules": ["R24"]}, {"id": "f-nojc", "t": "Find SKUs on factory POs with no job card", "when": "Each morning, to see what has no job card yet.", "steps": ["The first box under Orders in Production counts SKU lines on POs raised to MFPL that aren’t dispatched yet through Last Mile Ops, and how many of them have a job card.", "Click it to list the SKUs without a job card, oldest PO first. Click a row to open the PO line.", "“Active job cards” still counts every job card, including ones not linked to a PO."], "where": "Dashboard › Orders in Production › SKUs on factory POs"}, {"id": "f-jcrm", "where": "Job Card Station › Dashboard", "t": "See which job cards still need raw material", "when": "Daily, or before planning the week.", "steps": ["Open Job Card Station › Dashboard. The RM availability column shows each card: “Available & blocked” (who ticked it and when), “Card says not available” (the line read from the card) or “Not confirmed”.", "Tick ⟦RM not confirmed⟧ to see only the cards still waiting on raw material.", "Press ⟦CSV⟧ for the list in Excel; it has RM available & blocked (Yes / No), confirmed by, confirmed on and the RM line on the card."]}, {"id": "f-jclink", "where": "Job Card Station › Dashboard", "t": "Link an unlinked job card to its PO line", "when": "When the dashboard shows a card as “unlinked” (Unlinked only filter).", "steps": ["Open Job Card Station › Dashboard and tick ⟦Unlinked only⟧. Press ⟦Link⟧ on a card (factory and admin only).", "If the card’s work order matches a PO, its SKU lines are listed and the one matching the card’s product code is already picked. Check it is the right SKU — a PO can have several.", "If the card’s PO isn’t found (misread number, or not in the ERP upload yet), search by PO, client or article and pick the line.", "Press ⟦Confirm link⟧. If another card is already on that line you’ll see a note — fine when the quantity is split across cards. To change a link later, open the card in Capture & review."]}]}, "accounts": {"day": ["Open the Dashboard: to-dos under \"Needs action\" (payments to confirm, approvals to validate, invoices to enter). Dispatch Day to-dos appear 48 hours before the dispatch date.", "Sign off SO revisions waiting for Accounts.", "Check Payables & Flushout when planning payments."], "tasks": [{"id": "a-rev", "t": "Approve or reject an SO revision", "when": "After the COO / Director approves it.", "where": "SO Revision Request", "steps": ["Do the value check and the advance check: reconcile against the original order value and the advance collected.", "Press ⟦Approve⟧ (or ⟦Reject⟧, or ⟦Send back to sales⟧). Once you approve, supply confirms the PO cancellation."], "rules": ["R20"]}, {"id": "a-pay", "t": "Confirm a payment", "when": "When Sales submits a Dispatch Day payment.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Use the ⟦Needs my action⟧ filter to find it.", "Check the payment against the bank. Confirm the receipt, or send it back to Sales with a reason."], "rules": ["R15", "R16"], "map": [23]}, {"id": "a-val", "t": "Validate a COO / Director approval", "when": "When a dispatch with a balance due has been approved.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Open the record and validate the approval."], "rules": ["R15", "R16"], "map": [23]}, {"id": "a-inv", "t": "Enter the invoice and e-way bill", "when": "When the invoice step opens.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Enter the invoice number.", "Enter the 12-digit e-way bill, or choose \"Not required\" and give the reason.", "Saving unlocks the dispatch for Supply and prints on the packing list."], "rules": ["R16"], "map": [26]}, {"id": "a-pf", "t": "Read Payables & Flushout", "when": "When planning payments and collections.", "where": "Payables & Flushout", "steps": ["1 · Payable by vendor: expand a vendor to see its POs.", "2 · SOs with POs still to be raised.", "3 · Fully raised SOs with balance collectible.", "4 · Payables for Flushout: fully raised SOs with a confirmed factory date."], "rules": ["R6", "R19"]}, {"id": "a-soap", "t": "Check and confirm an SO approval request", "when": "As soon as sales send one — it shows in Needs action.", "where": "SO Approval Request › Requests", "steps": ["Press ⟦Mark received⟧ on each advance payment once it is in the bank.", "When every approval is in and every payment is received, approve the SO in the ERP and press ⟦Confirm SO approved⟧. Otherwise write what’s wrong and ⟦Send back to sales⟧.", "⟦ERP SOs without a request⟧ lists SOs in the PI export that never came through Order Bridge."], "rules": ["R25", "R31"], "map": [4]}, {"id": "a-arch", "t": "Verify an architect’s bank details", "when": "Before any commission is paid, and whenever details are changed.", "steps": ["Unverified ones are listed first. You see the full account number, IFSC and PAN.", "Check them against the architect’s cancelled cheque or bank letter and PAN copy, then press ⟦I checked these — verify⟧ twice. Someone other than the person who entered them must verify.", "If anyone changes the bank details later, they show “Unverified” again. Don’t pay a commission to unverified details. This doesn’t stop you confirming the SO."], "rules": ["R31"], "where": "SO Approval Request › Architects & designers"}]}, "approver": {"day": ["You only need Order Bridge when you get an approval link, or when \"Needs action\" shows a pending approval — SO revisions, SO approvals or a dispatch with a balance due."], "tasks": [{"id": "p-rev", "t": "Decide on an SO revision", "when": "When Sales sends you an approval link.", "where": "Approval link · SO Revision Request", "steps": ["Open the link and sign in.", "Review the old and new SO(s), values, client, reason and background. A \"Client differs\" warning means the new SO is for a different client.", "Write a comment, then Approve, Send back to sales, or Reject."], "rules": ["R20"]}, {"id": "p-dd", "t": "Approve a dispatch with a balance due", "when": "When more than ₹1 is unpaid at dispatch.", "where": "Approval link · Last Mile Ops › Dispatch Day", "steps": ["Open the link, or Dispatch Day: with one pending approval the card opens by itself; otherwise press \"Review and decide\".", "Approve, or Reject with a comment. The link is valid for 48 hours."], "rules": ["R15"], "map": [24]}, {"id": "p-soap", "t": "Decide an SO approval request", "when": "A discount above the SO approver band, a freight line missing or below the ready reckoner, or an advance below the minimum.", "where": "Approval link · SO Approval Request", "steps": ["Open the link or SO Approval Request › Requests.", "Each item shows its figures and the sales reason: discount with the SKUs not discounted, freight against the ready reckoner, advance against the minimum.", "⟦Approve⟧ or ⟦Reject⟧ each item; rejecting needs a note."], "rules": ["R25", "R31"], "map": [3]}]}, "admin": {"day": ["MIS: upload the day's ERP exports once a day, and again when someone asks.", "Check Admin Uploads: data date, job card reading, last automatic backup."], "tasks": [{"id": "m-exp", "t": "Upload the daily ERP exports", "when": "Once a day, and on request.", "where": "Admin Uploads › Daily exports", "steps": ["Press ⟦Choose export files⟧ and pick the day's exports (the first time: the full set; after that, only those that changed).", "Check the table: each file shows what it was read as, rows and the latest date. Unrecognised files are skipped. The Open SOs list, Revised SO mapping and Drop SOs list are read too when included.", "Press ⟦Build & publish⟧. Everyone gets the new data when they reload.", "If Daily exports fails, upload order-bridge-data.json (from build_from_folder.py) in the data file card instead."], "rules": ["R19", "R21"], "map": [1]}, {"id": "m-jci", "t": "Import job cards read from photos", "when": "When a batch of job card photos has been read into a file.", "where": "Admin Uploads › Import job cards read by Claude", "steps": ["Pick the job-cards JSON file. The card shows how many are new and how many are already here.", "Press ⟦Import job card(s)⟧. New cards are added; for a card already here, no saved date, signature or raw-material tick is removed."], "rules": ["R10"]}, {"id": "m-users", "t": "Manage users", "when": "Joiners, leavers, forgotten passwords.", "where": "User Permissions › Users & access", "steps": ["Add a user with name, email, user type and a temporary password, then ⟦Add user⟧.", "Forgotten password: ⟦Reset password⟧, keep or change the suggested one, ⟦Set password⟧, and tell the person.", "Leaver: ⟦Deactivate⟧ (click twice). It can be undone with ⟦Reactivate⟧."]}, {"id": "m-perm", "t": "Set who sees and edits each menu", "when": "When a team's access needs to change.", "where": "User Permissions › Menu visibility / Edit access", "steps": ["Tick or untick per team. Changes apply to everyone at once."]}, {"id": "m-loc", "t": "Keep challan addresses current", "when": "When a location, address or contact changes.", "where": "Furnishings Tag Station › Locations", "steps": ["Edit the dispatcher and receiver locations: name, full address, POC name and phone. These print on new challans."], "rules": ["R13"]}, {"id": "m-appr", "t": "Keep the COO / Director list current", "when": "When an approver changes.", "where": "SO Revision Request › COO / Director approver logins", "steps": ["⟦Add approver⟧ or ⟦Remove⟧. Approvers also need a user account with the approver type."]}, {"id": "m-slot", "t": "Set dispatch windows and blocked dates", "when": "Holidays, stock-take, capacity changes.", "where": "Last Mile Ops › Slot settings", "steps": ["⟦Add a window⟧ for slot times; ⟦Block date⟧ for days with no dispatch or installation."], "rules": ["R17"]}, {"id": "m-ai", "t": "Look after job card reading", "when": "If people report that reading is slow or used up.", "where": "Admin Uploads › Job card reading (AI)", "steps": ["Each key shows today's readings and which models are resting and until when.", "Press ⟦Test⟧ to check a key. Recent readings show which model answered and how long it took."]}, {"id": "m-bk", "t": "Backups", "when": "Automatic every 2 weeks; by hand before big changes.", "where": "Admin Uploads › Backup of saved work / Automatic backup", "steps": ["⟦Download backup⟧ saves everything people have entered, as one file.", "The automatic backup runs every other Monday on the office computer and copies to the shared folder. The card warns if 16 days pass without one."]}, {"id": "m-ovr", "t": "Override a dispatch lock or revise a date", "when": "Only in exceptions.", "where": "Last Mile Ops › Dispatch · Order Deadlines", "steps": ["Dispatch: ⟦Override and allow dispatch⟧ with a reason of 3 or more words. It is logged on the record.", "Dates: an admin can start a date revision on any PO or SKU in Order Deadlines; sales still accept or counter.", "Factory date inside the last 10 days: press ⟦Allow the factory one more deviation⟧ with a reason. Sales still accepts or rejects."], "rules": ["R14", "R7"]}, {"id": "m-rev", "t": "Reopen fields or send a request back", "when": "Sales asks to reopen fields, or a request went to supply by mistake.", "where": "PO Progress Tracker › SKU line", "steps": ["Reopen request: check which stages have started and when the job card was last scanned. Tick the fields and press ⟦Reopen the ticked fields⟧, or write the reason and press ⟦Reject⟧.", "Sent to supply but no PO yet: write a reason and press ⟦Send back to draft⟧."], "rules": ["R23"]}, {"id": "m-corr", "t": "Correct a tag or job card", "when": "A tag or job card has a wrong detail.", "where": "Furnishings logbook / Warehouse log / Job card page", "steps": ["Press ⟦Correct⟧ on the row in the Furnishings logbook or Warehouse log, or on the job card page. Change only what's wrong, write the reason and send it.", "A tag that has already moved can only be voided. The owning team accepts or rejects; the month’s counts per team are on Admin Uploads."], "rules": ["R24"]}, {"id": "m-asst", "t": "Look up an order or run a report in the Assistant", "when": "You want everything about one order on a single page, or a ready report for MIS, factory, supply or sales.", "where": "Assistant (menu)", "steps": ["Open ⟦Assistant⟧ and type an SO or PO number (the last few digits are enough), a job card number, or part of a customer name. The page shows POs, dates, job card stage, fabric, packages, dispatch and history. ⟦Copy as text⟧ copies it for an email or message.", "The first page also lists reports (orders and values, collections by SO date, weekly plan, raw material pending, fabric pending, easiest to flush out, flushout by week, deadline deviations). Open one, click an SO or PO number to see that order, and use ⟦Download CSV⟧ for Excel.", "Reports now cover planning too: waiting for a factory date, no job card yet, job cards by stage, open backlog by vendor, fabric not filled in, open lines with stock in hand, and what moved today.", "Beyond the ready reports you can ask anything about orders, lines or job cards (“how many lines have raw material pending, by site?”). The AI only chooses what to look up; Order Bridge works out every figure, and shows the table under the answer. ⟦find⟧-style questions also search remarks, clarifications and materials used.", "To switch on questions in your own words and email drafts, open ⟦Settings⟧ in the Assistant and paste a free AI key (Google Gemini first, Groq as back-up). Names, amounts and phone numbers are hidden from the AI, and every figure still comes from Order Bridge. The same page shows the last 100 questions and today's use.", "It never changes orders or other saved work. Only admins see it for now. To give a team access, tick ⟦Assistant⟧ for that team under User Permissions › Menu visibility; they then see only what their own menu allows."]}, {"id": "m-soap", "t": "Set the SO approval policy", "when": "Before sales start, and whenever a policy or a rate changes.", "where": "SO Approval Request › Settings", "steps": ["Discount bands (sales, SO approver; above that COO / Director), minimum advance %, how long approval links last, and “Requests required from”.", "Freight: the freight article codes and words, the units counted as pieces and the code prefixes that aren’t (fabric, stone, services).", "Ready reckoner: pick the city and edit distance bands (up to km), piece bands (with the length limit) and rates; add or remove bands.", "Paste each store’s Google Maps link, then ⟦Fill the PIN table from the store location⟧. Fix PINs marked “to check”; a PIN not listed counts as outside city limits.", "SO approvers are now chosen in User Permissions › Approvals (with SO Revision and Dispatch Day). Every change to these settings is logged at the bottom."], "rules": ["R25", "R31"]}, {"id": "m-keep", "t": "Keep an SO the Open SOs list leaves out", "when": "An older SO still needs a dispatch, but it isn’t on the Open SOs list.", "where": "Admin Uploads › Daily exports › Keep SOs", "steps": ["Type the SO number and a reason, then ⟦Keep & rebuild⟧. The data is rebuilt from the stored exports.", "If the SO isn’t in the PI Revenue Report, it gets a basic row from PO Summary (customer, date, PO lines — no PI figures).", "It comes off the list by itself once the Open SOs list and the PI Revenue Report include it; ⟦Remove⟧ takes it off by hand."], "rules": ["R28"]}, {"id": "m-usage", "t": "See how Order Bridge is used", "when": "To see which menus get used and where people get stuck.", "where": "Usage (menu)", "steps": ["Pick 7, 30 or 90 days and a team.", "Menus by active time; Where people get stuck (long visits, error messages, unsaved forms, back and forth, repeated clicks — click a row for people and messages); People; Daily use.", "Time pauses after 2 minutes without a click or key. “Stuck” needs 2–3 weeks of visits per page."], "rules": ["R29"]}, {"id": "m-chfix", "t": "Correct a Delivery Challan", "when": "A challan went with the wrong From or To.", "where": "Furnishings Tag Station › Logbook › Delivery Challans", "steps": ["Press ⟦Correct⟧ on the challan, choose the right From / To, give a reason and press ⟦Save correction⟧.", "Print the revised copy that opens and replace the old one.", "Once any tag on it is received it can’t be corrected — void and log again instead. Admins can also ⟦Undo …⟧ any booking status at any time, including Delivered."], "rules": ["R27", "R26"]}, {"id": "m-comm", "t": "Set the commission limit", "when": "Once, and when the policy changes.", "steps": ["Set the % up to which an SO approver can approve a commission. Above it, or while it is blank, it goes to the COO / Director.", "The % is the commission ÷ the pre-GST value after discount, without freight. Every change is logged under the settings."], "rules": ["R31"], "where": "SO Approval Request › Settings › Commission"}, {"id": "m-size", "t": "Check data size and limits", "when": "Weekly, and whenever the Dashboard shows a “Data size” warning.", "steps": ["Open Admin › Usage. The first card shows four limits: server storage (1 GB), the largest saved piece (25 MB), what is downloaded at sign-in (about 25 MB) and browser storage (about 5 MB).", "Each shows how full it is, “OK”, “Watch” or “Act now”, and how fast it grew over the last week, with when it would reach “Act now” at that rate.", "When anything shows “Watch” or “Act now”, the Dashboard warns every admin. Follow the “What to do” line and tell Claude which limit it is, well before it reaches the limit."], "where": "Admin › Usage › Data size and limits"}, {"id": "m-hist", "t": "Find who changed something, and put back an earlier version", "when": "When something looks wrong, went missing, or someone asks who changed it.", "steps": ["Open Admin › History. It lists every change saved in the chosen dates (7 days to start, up to 31 at a time): who, when, which record and which fields. It is kept for 90 days.", "Narrow it by person, area, what happened (added, changed, removed, put back, refused) or an SO, PO, job card or record number.", "Click a row for that record’s full timeline, with each field’s old and new value.", "To undo a mistake, press ⟦Put back this version⟧ on the version you want, twice. It only works if nobody has changed the record since you opened it, and the put-back is itself recorded."], "where": "Admin › History"}, {"id": "m-apprs", "where": "User Permissions › Approvals", "t": "Choose who approves what", "when": "When someone else should approve SO approvals, SO revisions or dispatches without full payment, or someone leaves.", "steps": ["Open User Permissions › Approvals. Each approval shows what it covers and its default: the COO / Director logins approve SO revisions, part-paid dispatches and the larger SO approvals; nobody is named for the SO approver level until you add someone.", "Pick a person under the approval and press ⟦Add⟧. They can approve it from their own login, from any team. Press × twice to remove someone.", "If a person’s team can’t open that screen, a warning appears. Press ⟦Give view access … only⟧ to let them open just that screen; you can remove it later from the same page.", "Nobody can approve a request they raised — it waits for another approver or the COO / Director. Every change is listed under Changes and in History. The discount and commission limits (%) stay in SO Approval Request › Settings."]}]}}, "stages": [["Order to PO", "SKU details, PO raised"], ["Production plan", "review, dates, job card"], ["Materials", "furnishings to the factory"], ["Packed & stored", "QC, factory to warehouse"], ["Delivery", "site, slot, checks, dispatch"]], "steps": [{"s": 0, "l": "admin", "t": "Refresh the ERP data", "w": "Admin Uploads › Daily exports", "d": ["Upload the day's exports and press Build & publish. Only exports that changed need uploading.", "Also on request, when someone needs fresh data during the day."], "next": "Everyone sees new SOs, PO numbers and stock after they reload."}, {"s": 0, "l": "sales", "t": "Send the new SO for approval", "w": "SO Approval Request › New request", "d": ["Upload the draft SO PDF; add the delivery PIN and advance payments.", "Discount, freight and advance are checked against the policy."], "next": "Anything over a limit goes to the SO approver or COO / Director; accounts see it at once."}, {"s": 0, "l": "approver", "t": "Decide the SO approval", "w": "Approval link · SO Approval Request", "d": ["Approve or reject each item with a note."], "next": "If something is rejected, sales revise; otherwise it waits for accounts."}, {"s": 0, "l": "accounts", "t": "Confirm the SO", "w": "SO Approval Request › Requests", "d": ["Mark payments received; when every approval is in, confirm."], "next": "The SO is approved in the ERP and shows up in the next data refresh."}, {"s": 0, "l": "sales", "t": "Send each SKU for PO", "w": "PO Progress Tracker › SO › Start PO request", "d": ["Fill in fabric, finish and stone details.", "Set the client date.", "Press Send to supply for PO."], "next": "Supply Chain gets a to-do to raise the PO."}, {"s": 0, "l": "supply", "t": "Raise the PO in the ERP, mark it raised", "w": "PO Progress Tracker › request › Mark PO raised in ERP", "d": ["No PO number is typed: the next data refresh links the PO line.", "Unmatched lines go to PO Progress Tracker › Unmatched."], "next": "The PO is confirmed; the factory's review and 20-day date window start."}, {"s": 1, "l": "factory", "t": "Review the PO; raise clarifications", "w": "PO Progress Tracker › order › Raise clarification", "d": ["Ask Sales about anything unclear, within 15 working days of the PO date."], "next": "Sales answers."}, {"s": 1, "l": "sales", "t": "Answer clarifications", "w": "PO Progress Tracker › order", "d": ["Reply on the order; the factory closes the clarification."], "next": "Production can start."}, {"s": 1, "l": "factory", "t": "Capture the job card", "w": "Job Card Station › Capture & review", "d": ["Photo is read automatically; check every field, link the PO line, Save.", "Photograph again as stages fill in. Supply Chain can capture too."], "next": "The stage shows on the PO line and in Order Deadlines."}, {"s": 1, "l": "factory", "t": "Agree or propose the factory date", "w": "Order Deadlines", "d": ["Within 20 days of the PO: agree to the client date, or propose a date with a reason.", "Later changes are deviation requests, until 10 days before the date."], "next": "Sales accepts or counters."}, {"s": 1, "l": "sales", "t": "Accept or counter the factory's date", "w": "Order Deadlines › Accept / Reject & suggest", "d": ["Accept, or reject and suggest a date; after the second proposal, set the final date."], "next": "The date drives delay risk, slots and Payables & Flushout."}, {"s": 2, "l": "supply", "t": "Log furnishings and print tags", "w": "Furnishings Tag Station › Intake", "d": ["Log each furnishing against its PO, or as client-supplied.", "Add to log & generate tag."], "next": "Ready to send to the factory."}, {"s": 2, "l": "supply", "t": "Send furnishings with a challan", "w": "Furnishings Tag Station › Dispatch", "d": ["Scan the tags, pick dispatcher and receiver; the challan prints."], "next": "Sales get a notice; the factory confirms receipt."}, {"s": 2, "l": "factory", "t": "Confirm furnishings received", "w": "Furnishings Tag Station › Receiving", "d": ["Scan or look up the tag and confirm."], "next": "Sales get a notice; material is on the factory floor."}, {"s": 3, "l": "supply", "t": "Tick \"QC report generated\"", "w": "Order Deadlines › SKU", "d": ["Once the job card’s Factory-QC has started and the QC report is done."], "next": "The SKU is ready for a slot and for warehouse tags."}, {"s": 3, "l": "factory", "t": "Tag finished goods, send to warehouse", "w": "Warehouse Tag Station › Intake, Dispatch", "d": ["Tag each packed piece; tick if installation is needed.", "Dispatch with delivery challan and packing list."], "next": "Supply Chain receives it."}, {"s": 3, "l": "supply", "t": "Receive at the warehouse", "w": "Warehouse Tag Station › Receipt", "d": ["Confirm the tagged pieces that arrived."], "next": "Ready for a dispatch slot."}, {"s": 4, "l": "sales", "t": "Get site details from the customer", "w": "Last Mile Ops › Site Details › Copy link", "d": ["Send the SO's link to the customer on WhatsApp."], "next": "The customer fills in the form."}, {"s": 4, "l": "customer", "t": "Fill in the site details form", "w": "Link from Sales · no sign-in", "d": ["Address, site contact, access, lift or stairs and landing size; review, then submit."], "next": "Sales and Supply see the details."}, {"s": 4, "l": "sales", "t": "Request a dispatch slot and installation", "w": "Last Mile Ops › Dispatch, Installation", "d": ["Request the date and window; add an installation visit if needed. Supply can request too.", "Pieces are checked against the lift or stairs with 5 inches added."], "next": "Supply Chain approves the booking."}, {"s": 4, "l": "supply", "t": "Approve the booking, assign a vendor", "w": "Last Mile Ops › Dispatch", "d": ["Choose the vendor or crew; add a tracking link (or NA) or POC."], "next": "Dispatch Day checks begin."},
