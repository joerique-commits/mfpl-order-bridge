<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Order Bridge Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: one guide, three views — a team manual (task cards with numbered steps), the swimlane workflow map, and one rules table every manual points into. Start screen picks language, then team. Accent is the yellow of the factory's paper job card. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --ink: #1f2a2e;
  --ink-soft: #55636a;
  --line: #d9ddd6;
  --accent: #f2c200;
  --accent-ink: #3a2f00;
  --focus: #1c6dd0;
  --l-customer: #e8eef6; --l-sales: #eaf3ec; --l-supply: #e9eef8; --l-factory: #fbf3d8; --l-accounts: #f3ebf6; --l-approver: #f8ebe7; --l-admin: #eceeee;
  --d-customer: #3c6aa8; --d-sales: #2f7d4a; --d-supply: #3557a8; --d-factory: #9a7400; --d-accounts: #7d4c96; --d-approver: #b0503a; --d-admin: #4d5a60;
  --font-display: "Archivo", "Noto Sans Kannada", "Noto Sans Devanagari", "Nirmala UI", "Arial Narrow", Arial, sans-serif;
  --font-body: "Source Sans 3", "Noto Sans Kannada", "Noto Sans Devanagari", "Nirmala UI", "Segoe UI", Roboto, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161b1d; --panel: #1f2629; --ink: #e8ecea; --ink-soft: #a3b0b4; --line: #34403f; --accent: #f2c200; --accent-ink: #1d1700; --focus: #6ea8ff;
  --l-customer: #1f2a38; --l-sales: #1d2c22; --l-supply: #1e2536; --l-factory: #2e2914; --l-accounts: #2a2131; --l-approver: #33231f; --l-admin: #262c2e;
  --d-customer: #8db5ea; --d-sales: #7fcf98; --d-supply: #93acf0; --d-factory: #f2c200; --d-accounts: #c9a3de; --d-approver: #f0a08c; --d-admin: #b5c0c4;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #161b1d; --panel: #1f2629; --ink: #e8ecea; --ink-soft: #a3b0b4; --line: #34403f; --accent: #f2c200; --accent-ink: #1d1700; --focus: #6ea8ff;
  --l-customer: #1f2a38; --l-sales: #1d2c22; --l-supply: #1e2536; --l-factory: #2e2914; --l-accounts: #2a2131; --l-approver: #33231f; --l-admin: #262c2e;
  --d-customer: #8db5ea; --d-sales: #7fcf98; --d-supply: #93acf0; --d-factory: #f2c200; --d-accounts: #c9a3de; --d-approver: #f0a08c; --d-admin: #b5c0c4;
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15.5px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding-block: 10px; }
.brand { font: 800 17px/1 var(--font-display); letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand .sq { width: 14px; height: 18px; background: var(--accent); border-radius: 2px; display: inline-block; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { background: transparent; border: 0; padding: 7px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; color: var(--ink-soft); }
.tabs button[aria-current="true"] { background: var(--ink); color: var(--bg); }
.langsw { margin-left: auto; display: flex; gap: 4px; }
.langsw button { border: 1px solid var(--line); background: transparent; padding: 5px 10px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; }
.langsw button[aria-pressed="true"] { border-color: var(--ink); background: var(--accent); color: var(--accent-ink); }

.view { padding-block: 22px 56px; }
.eyebrow { font: 600 12px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
h1 { font: 800 clamp(26px, 3.4vw, 40px)/1.08 var(--font-display); margin: 6px 0 0; letter-spacing: -.01em; text-wrap: balance; }
h1 .tag { display: inline-block; background: var(--accent); color: var(--accent-ink); padding: 0 .28em; border-radius: 3px; }
.lede { max-width: 64ch; color: var(--ink-soft); margin: 8px 0 0; }
.notice { margin: 14px 0 0; background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 10px 14px; max-width: 80ch; font-size: 14.5px; }

/* start screen */
.start { max-width: 880px; margin: 0 auto; padding-block: 48px 64px; }
.pick { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 22px; }
.pick button { text-align: left; background: var(--panel); border: 1.5px solid var(--line); border-radius: 10px; padding: 16px 18px; cursor: pointer; display: grid; gap: 4px; }
.pick button:hover { border-color: var(--ink); }
.pick .big { font: 700 24px/1.15 var(--font-display); }
.pick .small { color: var(--ink-soft); font-size: 14px; }
.pick button[data-lane] { border-left: 6px solid var(--lc); }
.step-ind { font: 600 13px var(--font-mono); color: var(--ink-soft); margin-bottom: 4px; }
.linkbtn { background: none; border: 0; color: var(--focus); cursor: pointer; padding: 0; font-weight: 600; text-decoration: underline; }

/* manual */
.mhead { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: flex-end; justify-content: space-between; }
.roles { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 6px; }
.chip { font-weight: 600; font-size: 14px; border: 1.5px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--ink-soft)); display: inline-block; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.mgrid { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; margin-top: 16px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.toc b { display: block; font: 700 13px var(--font-display); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; margin: 4px 4px 8px; }
.toc a { display: block; padding: 5px 6px; border-radius: 5px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.3; }
.toc a:hover { background: var(--bg); }
.day { background: var(--lt); border: 1px solid var(--line); border-left: 6px solid var(--lc); border-radius: 10px; padding: 14px 18px; }
.day h2 { font: 700 19px/1.2 var(--font-display); margin: 0 0 6px; }
.day ul { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.task { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-top: 14px; scroll-margin-top: 90px; }
.task h3 { font: 700 19px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.task .when { color: var(--ink-soft); font-size: 14px; margin: 3px 0 8px; }
.where { font: 500 13px/1.4 var(--font-mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; display: inline-block; margin-bottom: 8px; word-break: break-word; }
.task ol { margin: 0; padding-left: 22px; display: grid; gap: 5px; max-width: 78ch; }
.btnname { font-weight: 700; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ref { font: 600 12.5px var(--font-mono); background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 4px; padding: 3px 7px; cursor: pointer; }
.mapref { font: 600 12.5px var(--font-mono); background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; cursor: pointer; }

/* rules */
.rtable { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.rtable th, .rtable td { text-align: left; vertical-align: top; padding: 10px 12px; border-top: 1px solid var(--line); }
.rtable th { font: 700 13px var(--font-display); text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); background: var(--bg); border-top: 0; }
.rtable td.id { font: 700 13px var(--font-mono); white-space: nowrap; }
.rtable tr.hl td { background: var(--accent); color: var(--accent-ink); }
.rtable td.who { font-size: 13.5px; color: var(--ink-soft); white-space: nowrap; }
.tablewrap { overflow-x: auto; margin-top: 16px; border-radius: 10px; }
.rtable tr { scroll-margin-top: 90px; }

/* map */
.mmain { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; margin-top: 16px; }
.mapbox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.map { display: grid; grid-template-columns: 132px repeat(5, minmax(170px, 1fr)); min-width: 1000px; }
.map .sh { background: var(--panel); padding: 12px 10px 10px; border-bottom: 2px solid var(--ink); }
.map .sh b { display: block; font: 700 15px/1.15 var(--font-display); }
.map .sh span { font-size: 12.5px; color: var(--ink-soft); }
.map .corner { border-bottom: 2px solid var(--ink); }
.lane { padding: 12px 10px; border-top: 1px solid var(--line); font: 700 14px/1.2 var(--font-display); color: var(--lc); background: var(--lt); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.lane small { font: 400 12px var(--font-body); color: var(--ink-soft); }
.cell { border-top: 1px solid var(--line); border-left: 1px dashed var(--line); padding: 8px; display: flex; flex-direction: column; gap: 7px; background: var(--lt); min-height: 54px; }
.step { text-align: left; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--lc); border-radius: 6px; padding: 7px 9px 8px; cursor: pointer; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: start; transition: opacity .15s, transform .15s; }
.step .n { font: 700 12px/1 var(--font-mono); background: var(--ink); color: var(--bg); border-radius: 4px; padding: 4px 5px; margin-top: 1px; }
.step .t { font-weight: 600; font-size: 14px; line-height: 1.25; }
.step .w { grid-column: 2; font: 400 11.5px/1.35 var(--font-mono); color: var(--ink-soft); }
.step:hover { transform: translateY(-1px); }
.step[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--accent); }
.map.filtered .step.dim { opacity: .22; }
.map.filtered .lane.dim { opacity: .45; }
.opt { font: 600 10.5px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-soft); }
aside.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px 18px; }
.detail .who { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--lc); }
.detail .who i { width: 9px; height: 9px; border-radius: 50%; background: var(--lc); }
.detail h2 { font: 700 21px/1.15 var(--font-display); margin: 6px 0 8px; text-wrap: balance; }
.detail ul { margin: 0 0 10px; padding-left: 18px; display: grid; gap: 5px; }
.detail .next { border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }
.navbtns { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; }
.navbtns button { font-weight: 600; font-size: 13px; background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.navbtns button:disabled { opacity: .35; cursor: default; }
.lower { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 22px; }
.box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.box h3 { font: 700 17px/1.2 var(--font-display); margin: 0 0 4px; }
.box .sub { color: var(--ink-soft); font-size: 13.5px; margin: 0 0 10px; }
.flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.flow li { display: grid; grid-template-columns: 112px 1fr; gap: 8px; font-size: 14px; align-items: baseline; }
.flow .r { font: 600 12px var(--font-mono); color: var(--lc); text-transform: uppercase; letter-spacing: .04em; }
.mono { font-family: var(--font-mono); font-size: 12.5px; }
footer { color: var(--ink-soft); font-size: 13px; padding-block: 0 32px; }

[data-lane="customer"] { --lc: var(--d-customer); --lt: var(--l-customer); }
[data-lane="sales"] { --lc: var(--d-sales); --lt: var(--l-sales); }
[data-lane="supply"] { --lc: var(--d-supply); --lt: var(--l-supply); }
[data-lane="factory"] { --lc: var(--d-factory); --lt: var(--l-factory); }
[data-lane="accounts"] { --lc: var(--d-accounts); --lt: var(--l-accounts); }
[data-lane="approver"] { --lc: var(--d-approver); --lt: var(--l-approver); }
[data-lane="admin"] { --lc: var(--d-admin); --lt: var(--l-admin); }

.stage-m { display: none; }
@media (max-width: 1100px) { .mmain { grid-template-columns: minmax(0, 1fr); } aside.detail { position: static; } }
@media (max-width: 820px) { .mgrid { grid-template-columns: minmax(0, 1fr); } .toc { position: static; } .langsw { margin-left: 0; } }
@media (max-width: 700px) {
  .mapbox { border: 0; background: transparent; overflow: visible; }
  .map { display: flex; flex-direction: column; min-width: 0; }
  .map .sh, .map .corner, .lane { display: none; }
  .map .stage-m { display: block; font: 700 16px/1.2 var(--font-display); margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid var(--ink); }
  .cell { background: transparent; border: 0; padding: 0 0 6px; min-height: 0; }
  .cell:empty { display: none; }
  .step .w::before { content: attr(data-who) " · "; color: var(--lc); font-weight: 500; }
  .flow li { grid-template-columns: 1fr; gap: 0; }
  .rtable td.who { white-space: normal; }
}
@media (prefers-reduced-motion: reduce) { .step { transition: none; } .step:hover { transform: none; } }
</style>
</head><body>
<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="brand"><span class="sq"></span><span id="brandName">Order Bridge Guide</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="langsw" id="langsw" role="group" aria-label="Language"></div>
  </div>
</div>
<main id="app"></main>
<script>
const DATA = {"en": {"ui": {"pickLang": "Choose your language", "pickLangSub": "You can change it any time from the top bar.", "pickRole": "Which team are you in?", "pickRoleSub": "This opens your team's manual. Every team's manual is one tap away.", "step1": "Step 1 of 2", "step2": "Step 2 of 2", "back": "Change language", "tabManual": "My manual", "tabMap": "Workflow map", "tabRules": "Rules", "draftLang": "This translation is a first draft and is being reviewed. If anything is unclear, the English version is the reference.", "manualTitle": "manual", "yourDay": "Your day", "tasks": "Tasks", "seeMap": "Map step", "rulesTitle": "Rules", "rulesSub": "The rules every manual refers to. Click a rule number in a manual to jump here.", "thRule": "#", "thWhat": "Rule", "thWho": "Applies to", "mapTitle1": "From sales order to ", "mapTitle2": "delivered", "mapSub": "Who does what, in which screen, and who it goes to next. Pick a team to see its steps; click any step for the details.", "showFor": "Show steps for", "openManual": "Manual", "everyone": "Everyone", "next": "Next:", "prev": "← Previous", "nextB": "Next →", "stepW": "Step", "ifNeeded": "if needed", "footer": "Order Bridge · mfpl-order-bridge.edgeone.dev · Guide as of 2 Nov 2026. Screen and button names are shown in English, as in the app.", "dates": "Live from Mon 2 Nov 2026 · all order tracking is done in Order Bridge", "goLive": "From 2 Nov 2026 all order tracking happens only in Order Bridge. The old Upholstery Tag Station is retired: its tags (15 Sep – 31 Oct) were brought in, and new tags are made here."}, "lanes": {"customer": ["Customer", "site form only"], "sales": ["Sales", ""], "supply": ["Supply Chain", ""], "factory": ["Factory", "Production"], "accounts": ["Accounts", ""], "approver": ["COO / Director", "approvals"], "admin": ["Admin / MIS", ""]}, "blurb": {"sales": "PO requests, client dates, factory date requests, clarifications, stock blocks, SO revisions, site details, dispatch slots, payments.", "supply": "POs in the ERP, the Unmatched list, stock, furnishings, QC report tick, warehouse receipt, bookings, dispatch and delivery.", "factory": "Clarifications, job cards, factory dates, furnishings receipt, tagging finished goods.", "accounts": "SO revision sign-off, payment confirmation, approvals, invoice and e-way bill.", "approver": "SO revision approvals and dispatches with a balance due.", "admin": "Daily data, users, permissions, locations, keys, job card imports and backups."}, "rules": {"R1": ["Sales", "A SKU needs its client date before it can be sent for a PO. Choose 45, 60, 75, 90 or 120 days (counted from the request date, then fixed) or pick a date."], "R2": ["Sales", "Only SKUs on the SO can be requested. Anything not on the SO goes through SO Revision Request."], "R3": ["Supply", "Supply doesn't type PO numbers. After \"Mark PO raised in ERP\", the next data refresh finds the PO line and links it. Anything that can't be matched shows in PO Progress Tracker › Unmatched."], "R4": ["Factory, Sales", "The factory can raise clarifications for 15 working days from the PO date. Production starts only when no clarification is open."], "R5": ["Factory, Sales", "Factory date: within 20 days of an MFPL PO the factory agrees to the client date or proposes its own date, for one SKU or the whole PO. Sales accepts, or rejects and suggests a date. The factory can send one second proposal; after that, sales' final date binds. With no answer in 20 days, the client date minus 5 days is taken automatically."], "R6": ["Everyone", "There are 5 days between the two dates: factory date + 5 = the date the goods can reach the client. Sales see dates on the client side, the factory sees its own date, and Supply and Admin see both."], "R7": ["Factory, Sales", "Changing a confirmed factory date: the factory can request a deviation until 10 days before that date (one request at a time). In the last 10 days the date is locked. A SKU date may be later than the PO's date: once sales accepts it, that SKU follows its own date and the PO date stays the limit for the PO's other SKUs."], "R8": ["Everyone", "Delay risk is flagged on MFPL factory POs: will miss the client date; stages behind (under 30 / 15 / 7 days left and polishing, factory QC or packing not started); fabric not sent while the job card is at Post Frame or later; no job card 15 days after the PO; factory date more than 75 days after the PO."], "R9": ["Sales, Supply", "An approved stock block counts that SKU as covered, so no PO is needed for it. If a PO line for the same code + FIN (for example AARA → AARAFIN) appears on the same SO, the block shows \"Issued to factory — FIN PO …\", stops counting as blocked stock, and the FIN line follows the normal factory flow."], "R10": ["Factory, Supply", "A scanned job card is never saved unchecked. Check every field against the photo, especially the amber ones. Photographing the card again updates the same card; dates and signatures once saved stay."], "R11": ["Everyone", "The job card stage shown in PO Progress Tracker and Order Deadlines is the furthest stage that has both a start date, an end date and at least one signature."], "R12": ["Supply, Sales", "A furniture SKU made by the factory is ready for a dispatch or installation slot only when Supply has ticked \"QC report generated\" for it in Order Deadlines (after packing is closed). Its warehouse tags can only be made after the tick. A furniture SKU with no job card stays not ready until it is ticked."], "R13": ["Supply, Factory", "Furnishings and warehouse tags move whole: no part quantities. Challan and receipt numbers are made by the app; reprint challans from the Logbook."], "R14": ["Supply, Admin", "\"Mark dispatched\" stays locked until the Dispatch Day checks are complete. Only an admin can override, with a reason of 3 or more words that is logged. Dispatch Day to-dos appear from 48 hours before the dispatch date; the checks can be done earlier."], "R15": ["Sales, COO / Director, Accounts", "If more than ₹1 is unpaid at dispatch, a COO / Director must approve. The link is valid for 48 hours; rejecting needs a comment; Accounts then validates. If the unpaid amount grows past what was approved, a new approval is needed."], "R16": ["Accounts", "The invoice and e-way bill step opens once Supply's ERP numbers are in and the payment is settled: fully paid and confirmed; nothing received but approval validated; or part paid and confirmed with approval validated for the rest. The invoice number is always required. The e-way bill is 12 digits, or \"Not required\" with a reason."], "R17": ["Sales, Supply", "Dispatch and installation can't be requested on blocked dates, and only in the windows set in Slot settings. A dispatch after the client date needs a reason. The tracking link can be a link or NA; without one, give the transport POC."], "R18": ["Sales, Customer", "Each site-details link belongs to one SO. Each piece is checked with 5 inches added to every side: against the lift, or with no lift, against the stairs (its smallest side must pass the stair width and it must fit the landing length, breadth and height). A piece that doesn't fit needs an override reason of 3 or more words."], "R19": ["Everyone", "The page updates itself: other people's changes appear within 2 minutes, and at once when you come back to the tab. It waits while you are typing. New ERP data, and PO requests added or linked by others, show a bar asking you to refresh. ERP data is as fresh as the last daily upload. In every CSV download, SO and PO numbers keep all their digits in Excel."], "R20": ["Sales, Supply, Accounts, COO / Director", "An SO revision needs the COO / Director's approval first, then Supply's PO-cancellation check, then Accounts' approval after reconciling the order value and advance."], "R21": ["Everyone", "POs raised before 2 Nov 2026: their SKU details were shared by email, so only their dates can be revised here, within these rules. Their 20-day factory window and the 15-day job card check count from 2 Nov. Their fabric is judged by the tags on the PO line: no tag means no fabric needed."]}, "man": {"sales": {"day": ["Open the Dashboard: your to-dos are under \"Needs action\"; the bell also shows notices, such as fabric sent to or received at the factory.", "Check new SOs in PO Progress Tracker and send their SKUs for PO.", "Answer the factory's date proposals and clarifications.", "Keep Last Mile moving: site details, dispatch slots, Dispatch Day payments."], "tasks": [{"id": "s-req", "t": "Send a SKU for PO", "when": "For every SKU on a new SO that isn't on a PO yet.", "where": "PO Progress Tracker › open the SO › Still to raise", "steps": ["Open ⟦PO Progress Tracker⟧ and click the SO (use the ⟦No PO raised⟧ or ⟦Part PO raised⟧ filters).", "On the SKU, press ⟦Start PO request⟧.", "Fill in the fabric (the material SKU fills itself), polish / finish, stone if any, and design instructions. Add site requirements if needed.", "Set the Committed date to client.", "Press ⟦Send to supply for PO⟧. To drop an unsent draft, press ⟦Discard draft⟧."], "rules": ["R1", "R2"], "map": [2]}, {"id": "s-cd", "t": "Set or change a client date", "when": "On SKUs already on a PO, or for all lines of an SO at once.", "where": "PO Progress Tracker › SO › Committed date to client", "steps": ["Open the SO and set the date for the line, or use \"Committed date to client — all lines on a PO\" and ⟦Apply to every line⟧.", "Order Deadlines and the delay-risk checks measure the factory date against this date."], "rules": ["R1", "R6", "R21"], "map": [2]}, {"id": "s-dl", "t": "Answer the factory's date proposal", "when": "When the factory proposes a date or asks for a deviation (it appears in Needs action).", "where": "Order Deadlines › SO › PO › SKU", "steps": ["Open the to-do. The proposal shows the date, the reason and who sent it.", "Press ⟦Accept⟧, or ⟦Reject & suggest a date⟧ with the date you can commit to the client.", "After the factory's second proposal, press ⟦Accept⟧ or ⟦Reject & set the final date⟧: your final date binds.", "A SKU may get a date later than its PO's date. If you accept it, that SKU follows its own date; the other SKUs keep the PO date."], "rules": ["R5", "R6", "R7"], "map": [8]}, {"id": "s-clar", "t": "Answer a clarification", "when": "When the factory raises one (it appears in Needs action).", "where": "PO Progress Tracker › order", "steps": ["Open the order from the to-do.", "Reply to the question. The factory closes the clarification when it's clear."], "rules": ["R4"], "map": [5]}, {"id": "s-sb", "t": "Block stock instead of raising a PO", "when": "When the item is already in a warehouse.", "where": "Stock Block Station › Request a stock block", "steps": ["Choose the Sales order, Article and Warehouse.", "Enter the Quantity to block and a Reason.", "Press ⟦Submit request⟧. Supply approves or rejects it.", "If the stock is later sent to the factory on a FIN PO, the block shows \"Issued to factory\"."], "rules": ["R9"]}, {"id": "s-rev", "t": "Revise an SO", "when": "Quantity change, extra discount, design change or new SKU, client detail change, or splitting the SO for part POs.", "where": "SO Revision Request › Raise a revision request", "steps": ["Enter the Old SO number and the new SO(s).", "Choose the Reason for Revision and write the Background Details.", "Press ⟦Create approval link for COO / Director⟧ and send the link (copy or WhatsApp).", "If it is sent back, fix it and resubmit."], "rules": ["R20"]}, {"id": "s-site", "t": "Get site details from the customer", "when": "Before booking the dispatch.", "where": "Last Mile Ops › Site Details", "steps": ["Choose the Sales order.", "Press ⟦Copy link⟧ and send it to the customer on WhatsApp.", "When the customer submits, the details appear under \"Site details by sales order\"."], "rules": ["R18"], "map": [15, 16]}, {"id": "s-slot", "t": "Request a dispatch slot or installation", "when": "When the goods are ready, or when the customer wants a date.", "where": "Last Mile Ops › Dispatch / Installation", "steps": ["Open the Dispatch tab (or Installation) and choose the Sales order.", "Pick a date and window, and the items. The Ready? column shows what is ready; a factory-made furniture SKU is ready only after Supply's QC report tick.", "If a piece is too large for the lift or stairs, leave it out or give an override reason.", "Submit. Supply approves the booking and assigns the vendor."], "rules": ["R12", "R17", "R18"], "map": [17]}, {"id": "s-dd", "t": "Run the Dispatch Day payment check", "when": "Before every dispatch. The to-do appears 48 hours before the dispatch date; you can start earlier.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Choose the Sales order and its Dispatch slot, then ⟦Start Dispatch Day check⟧.", "The balance is prefilled. Add each payment received (amount, date, mode, transaction details) and submit to Accounts.", "If anything stays unpaid, write a reason and create the COO / Director approval link; share it.", "If Accounts sends a payment back, correct it and resubmit."], "rules": ["R14", "R15"], "map": [19]}, {"id": "s-csv", "t": "Download a list", "when": "When you need the orders in Excel.", "where": "PO Progress Tracker", "steps": ["Pick the filter chip and search you want.", "Press ⟦Download lines CSV⟧: one row per SKU line of the SOs on screen, with your dates, the job card stage and delay risk."], "rules": ["R19"]}]}, "supply": {"day": ["Open the Dashboard: to-dos under \"Needs action\".", "Mark POs raised in the ERP; clear the Unmatched list after each data refresh.", "Track factory dates in Order Deadlines; tick \"QC report generated\" for packed furniture SKUs.", "Furnishings in and out; warehouse receipts.", "Approve bookings, enter ERP dispatch numbers, mark dispatched and delivered."], "tasks": [{"id": "u-po", "t": "Mark a PO as raised", "when": "After you raise the PO in the ERP for a request from Sales.", "where": "PO Progress Tracker › request", "steps": ["Raise the PO in the ERP as usual.", "Open the request and press ⟦Mark PO raised in ERP⟧. Don't type the PO number.", "The next data refresh links the PO line to the request."], "rules": ["R3"], "map": [3]}, {"id": "u-cover", "t": "Close a SKU that needs no new PO", "when": "The SKU is already on another PO, supplied from stock, or removed from the order.", "where": "PO Progress Tracker › SO › Still to raise", "steps": ["Press ⟦Already on a PO⟧ and pick the PO line, or ⟦No PO needed⟧ with the reason.", "Undo is available if you picked wrong."], "rules": ["R9"], "map": [3]}, {"id": "u-um", "t": "Clear the Unmatched list", "when": "After each data refresh.", "where": "PO Progress Tracker › Unmatched", "steps": ["Work through each section: requests waiting for a PO line, loose matches to confirm or reject, PO lines with no matching SKU, quantity mismatches.", "Link by picking from the lists. Use \"Not for an SO SKU\" to dismiss a PO line that isn't for a SKU."], "rules": ["R3"]}, {"id": "u-dl", "t": "Follow factory dates", "when": "Daily.", "where": "Order Deadlines", "steps": ["Sales and the factory agree the dates; you see both the client date and the factory date on every line.", "Use the list or the calendar, and the delay-risk column, to chase what is late."], "rules": ["R5", "R6", "R8"], "map": [8]}, {"id": "u-qc", "t": "Tick \"QC report generated\"", "when": "When the QC report is done for a furniture SKU whose job card shows packing closed.", "where": "Order Deadlines › SO › PO › SKU", "steps": ["Open the SKU line. Under the job card stage, tick ⟦QC report generated⟧. Nothing else needs to be entered.", "The SKU becomes ready for a dispatch or installation slot, and its warehouse tags can be made.", "A furniture SKU with no job card can be ticked when its QC report is done. Untick if it was ticked by mistake; every tick is recorded."], "rules": ["R12"], "map": [12]}, {"id": "u-sb", "t": "Approve or release a stock block", "when": "When Sales or the factory requests one.", "where": "Stock Block Station › Requests", "steps": ["Press ⟦Approve⟧ or ⟦Reject⟧.", "Press ⟦Release⟧ when the block is no longer needed. A block issued to the factory on a FIN PO shows the FIN PO and can't be released."], "rules": ["R9"]}, {"id": "u-rev", "t": "Check an SO revision", "when": "After the COO / Director approves it.", "where": "SO Revision Request", "steps": ["Check the PO cancellation on the old SO.", "Press ⟦Mark done⟧, or ⟦Send back to sales⟧ with a note."], "rules": ["R20"]}, {"id": "u-fin", "t": "Log furnishings and print tags", "when": "When fabric or furnishings arrive.", "where": "Furnishings Tag Station › Intake", "steps": ["Choose the Furnishings PO and the upholstery / material (or tick Fabric sent by client, or MFPL Direct Order).", "Enter quantity and unit, then the Furniture PO and product it is for.", "Press ⟦Add to log & generate tag⟧ and stick the tag on the roll."], "rules": ["R13"], "map": [9]}, {"id": "u-fdis", "t": "Send furnishings to the factory", "when": "When the factory needs the material.", "where": "Furnishings Tag Station › Dispatch", "steps": ["Scan each tag (⟦Scan a tag⟧) or type the tag ID and press ⟦Add⟧.", "Choose the Dispatcher address and the Receiver address.", "Generate the challan. It opens for printing; reprint any time from the Logbook. Sales get a notice."], "rules": ["R13"], "map": [10]}, {"id": "u-wrec", "t": "Receive goods at the warehouse", "when": "When a factory consignment arrives.", "where": "Warehouse Tag Station › Receipt", "steps": ["Scan or type each tag, or tick tags in transit.", "Press ⟦Add selected to receipt⟧ and confirm."], "rules": ["R13"], "map": [14]}, {"id": "u-book", "t": "Approve a dispatch or installation booking", "when": "When Sales requests a slot.", "where": "Last Mile Ops › Dispatch / Installation", "steps": ["Choose the vendor (In-house fleet/ Milk Run, APML, Installco Wify, Other) or installation crew (Installco Wify, MFPL, Other). For Other, type the name.", "Add the tracking link or NA, or the transport POC's name and number.", "Press ⟦Approve⟧ (or ⟦Reject⟧)."], "rules": ["R17"], "map": [18]}, {"id": "u-erp", "t": "Enter ERP dispatch numbers", "when": "For every Dispatch Day check, in parallel with the payment step.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Enter the dispatch sheet number, the dispatch PO (pick from PO Summary or type) and the installation PO if needed."], "rules": ["R14", "R16"], "map": [22]}, {"id": "u-dis", "t": "Dispatch and confirm delivery", "when": "On the dispatch day, after the checks.", "where": "Last Mile Ops › Dispatch", "steps": ["Press ⟦Print packing list⟧ for the truck.", "Press ⟦Mark dispatched⟧. It stays locked until the Dispatch Day checks are done.", "After delivery: upload the handover photo (POD) and press Mark delivered. If there is no usable photo, tick that the POD was received and give a reason.", "For installations: Mark installation completed, or \"Installed on the same visit\"."], "rules": ["R14"], "map": [24]}, {"id": "u-jc", "t": "Capture a job card (when needed)", "when": "Supply can capture job cards too.", "where": "Job Card Station › Capture & review", "steps": ["See the Factory manual: \"Capture a job card\"."], "rules": ["R10"], "map": [6]}]}, "factory": {"day": ["Open the Dashboard: to-dos and the Production delay risk tiles. The bell tells you about each new MFPL PO and how many days are left to give your date.", "Review new POs and raise clarifications early.", "Agree or propose factory dates within 20 days of each PO.", "Photograph job cards as stages are filled in.", "Receive furnishings; tag and send finished goods to the warehouse."], "tasks": [{"id": "f-dl", "t": "Agree or propose the factory date", "when": "Within 20 days of a new MFPL PO. The bell shows the days left, with a reminder at 5 days.", "where": "Order Deadlines › SO › PO", "steps": ["For the whole PO or one SKU, press ⟦Agree to …⟧ to take the client date minus 5 days, or ⟦Propose a date⟧.", "For a proposal, give the date and a reason and press ⟦Send to sales⟧. Sales accept, or reject and suggest a date.", "If sales suggest a date, press ⟦Accept sales' date⟧ or ⟦Send second proposal⟧. After that, sales' final date binds.", "If you don't answer within 20 days, the client date minus 5 days is taken and you get a notice."], "rules": ["R5", "R6", "R21"], "map": [7]}, {"id": "f-dev", "t": "Ask for a later date (deviation)", "when": "When a confirmed date can't be met, until 10 days before it.", "where": "Order Deadlines › SKU or PO", "steps": ["Press ⟦Request a deviation⟧, give the new date and the reason, and send it to sales.", "You may ask for a SKU date later than the PO's date or later than any date already recorded. If sales accept, that SKU follows its new date.", "In the last 10 days before the date it is locked."], "rules": ["R7"], "map": [7]}, {"id": "f-clar", "t": "Raise or close a clarification", "when": "Within 15 working days of the PO date.", "where": "PO Progress Tracker › order", "steps": ["Open the order and press ⟦Raise clarification⟧. Write the question.", "When Sales has answered, press ⟦Close clarification⟧."], "rules": ["R4"], "map": [4]}, {"id": "f-jc", "t": "Capture a job card", "when": "When production starts, and again each time more stages are filled in.", "where": "Job Card Station › Capture & review", "steps": ["Press ⟦Take photo⟧ (or ⟦Upload image⟧). Photograph the whole card, flat, in good light.", "Wait a few seconds while it is read. Then check every field against the photo, especially the ones outlined in amber.", "Link the card to its PO line (search by PO number, customer or article).", "Save. Photograph the same card again later: it updates the card, it doesn't duplicate it.", "A stage counts as done when it has a start date, an end date and at least one signature."], "rules": ["R10", "R11"], "map": [6]}, {"id": "f-fr", "t": "Confirm furnishings received", "when": "When a furnishings challan arrives.", "where": "Furnishings Tag Station › Receiving", "steps": ["Scan each tag (⟦Scan a tag⟧) or type the tag ID and press ⟦Look up⟧.", "Check \"Received at\" (it starts on the challan's destination) and confirm. Sales get a notice."], "rules": ["R13"], "map": [11]}, {"id": "f-wt", "t": "Tag finished goods", "when": "When a piece is packed and Supply has ticked its QC report.", "where": "Warehouse Tag Station › Intake", "steps": ["Enter the PO number and choose the Article SKU (SO and customer fill themselves).", "If the screen says the QC report is not confirmed yet, ask Supply to tick it in Order Deadlines first.", "Enter the number of packets for this piece. Tick \"needs installation\" if it does.", "Press ⟦Generate tag & log intake⟧, then ⟦Print⟧."], "rules": ["R12", "R13"], "map": [13]}, {"id": "f-wd", "t": "Send finished goods to the warehouse", "when": "For each consignment.", "where": "Warehouse Tag Station › Dispatch", "steps": ["Scan every tag leaving in this consignment, or tick them under \"Tags awaiting dispatch\".", "Press ⟦Add selected to dispatch⟧ and confirm.", "Print the ⟦Delivery challan⟧ and ⟦Packing list⟧ for the truck."], "rules": ["R13"], "map": [13]}, {"id": "f-sb", "t": "Request a stock block", "when": "When stock in a warehouse can be used for an order.", "where": "Stock Block Station", "steps": ["Same form as Sales: Sales order, Article, Warehouse, Quantity, Reason, then Submit request."], "rules": ["R9"]}]}, "accounts": {"day": ["Open the Dashboard: to-dos under \"Needs action\" (payments to confirm, approvals to validate, invoices to enter). Dispatch Day to-dos appear 48 hours before the dispatch date.", "Sign off SO revisions waiting for Accounts.", "Check Payables & Flushout when planning payments."], "tasks": [{"id": "a-rev", "t": "Approve or reject an SO revision", "when": "After the COO / Director has approved and Supply has checked the PO cancellation.", "where": "SO Revision Request", "steps": ["Reconcile the revision against the original order value and the advance collected.", "Press ⟦Approve⟧ or ⟦Reject⟧, or ⟦Send back to sales⟧."], "rules": ["R20"]}, {"id": "a-pay", "t": "Confirm a payment", "when": "When Sales submits a Dispatch Day payment.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Use the ⟦Needs my action⟧ filter to find it.", "Check the payment against the bank. Confirm the receipt, or send it back to Sales with a reason."], "rules": ["R15", "R16"], "map": [20]}, {"id": "a-val", "t": "Validate a COO / Director approval", "when": "When a dispatch with a balance due has been approved.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Open the record and validate the approval."], "rules": ["R15", "R16"], "map": [20]}, {"id": "a-inv", "t": "Enter the invoice and e-way bill", "when": "When the invoice step opens.", "where": "Last Mile Ops › Dispatch Day", "steps": ["Enter the invoice number.", "Enter the 12-digit e-way bill, or choose \"Not required\" and give the reason.", "Saving unlocks the dispatch for Supply and prints on the packing list."], "rules": ["R16"], "map": [23]}, {"id": "a-pf", "t": "Read Payables & Flushout", "when": "When planning payments and collections.", "where": "Payables & Flushout", "steps": ["1 · Payable by vendor: expand a vendor to see its POs.", "2 · SOs with POs still to be raised.", "3 · Fully raised SOs with balance collectible.", "4 · Payables for Flushout: fully raised SOs with a confirmed factory date."], "rules": ["R6", "R19"]}]}, "approver": {"day": ["You only need Order Bridge when you get an approval link, or when \"Needs action\" shows a pending approval."], "tasks": [{"id": "p-rev", "t": "Decide on an SO revision", "when": "When Sales sends you an approval link.", "where": "Approval link · SO Revision Request", "steps": ["Open the link and sign in.", "Review the old and new SO(s), values, client, reason and background. A \"Client differs\" warning means the new SO is for a different client.", "Write a comment, then Approve, Send back to sales, or Reject."], "rules": ["R20"]}, {"id": "p-dd", "t": "Approve a dispatch with a balance due", "when": "When more than ₹1 is unpaid at dispatch.", "where": "Approval link · Last Mile Ops › Dispatch Day", "steps": ["Open the link, or Dispatch Day: with one pending approval the card opens by itself; otherwise press \"Review and decide\".", "Approve, or Reject with a comment. The link is valid for 48 hours."], "rules": ["R15"], "map": [21]}]}, "admin": {"day": ["MIS: upload the day's ERP exports once a day, and again when someone asks.", "Check Admin Uploads: data date, job card reading, last automatic backup."], "tasks": [{"id": "m-exp", "t": "Upload the daily ERP exports", "when": "Once a day, and on request.", "where": "Admin Uploads › Daily exports", "steps": ["Press ⟦Choose export files⟧ and pick the day's exports (the first time: the full set; after that, only those that changed).", "Check the table: each file shows what it was read as, rows and the latest date. Unrecognised files are skipped. The Open SOs list, Revised SO mapping and Drop SOs list are read too when included.", "Press ⟦Build & publish⟧. Everyone gets the new data when they reload.", "If Daily exports fails, upload order-bridge-data.json (from build_from_folder.py) in the data file card instead."], "rules": ["R19", "R21"], "map": [1]}, {"id": "m-jci", "t": "Import job cards read from photos", "when": "When a batch of job card photos has been read into a file.", "where": "Admin Uploads › Import job cards read by Claude", "steps": ["Pick the job-cards JSON file. The card shows how many are new and how many are already here.", "Press ⟦Import job card(s)⟧. New cards are added; for a card already here, no saved date, signature or raw-material tick is removed."], "rules": ["R10"]}, {"id": "m-users", "t": "Manage users", "when": "Joiners, leavers, forgotten passwords.", "where": "User Permissions › Users & access", "steps": ["Add a user with name, email, user type and a temporary password, then ರಿ ದಿನಾಂಕ + 5 = ಸರಕು ಕ್ಲೈಂಟ್ ತಲುಪಬಹುದಾದ ದಿನ. ಸೇಲ್ಸ್‌ಗೆ ಕ್ಲೈಂಟ್ ಕಡೆಯ ದಿನಾಂಕ, ಫ್ಯಾಕ್ಟರಿಗೆ ತನ್ನ ದಿನಾಂಕ, ಸಪ್ಲೈ ಮತ್ತು ಅಡ್ಮಿನ್‌ಗೆ ಎರಡೂ ಕಾಣುತ್ತವೆ."], "R7": ["ಫ್ಯಾಕ್ಟರಿ, ಸೇಲ್ಸ್", "ದೃಢಪಟ್ಟ ಫ್ಯಾಕ್ಟರಿ ದಿನಾಂಕ ಬದಲಿಸುವುದು: ಆ ದಿನಾಂಕಕ್ಕೆ 10 ದಿನ ಮೊದಲವರೆಗೆ ಫ್ಯಾಕ್ಟರಿ ಡೀವಿಯೇಷನ್ ಕೇಳಬಹುದು (ಒಂದು ಸಮಯಕ್ಕೆ ಒಂದು ವಿನಂತಿ). ಕೊನೆಯ 10 ದಿನಗಳಲ್ಲಿ ದಿನಾಂಕ ಲಾಕ್. ಒಂದು SKU ದಿನಾಂಕ PO ದಿನಾಂಕಕ್ಕಿಂತ ತಡವಾಗಿರಬಹುದು: ಸೇಲ್ಸ್ ಒಪ್ಪಿದರೆ ಆ SKU ತನ್ನದೇ ದಿನಾಂಕ ಅನುಸರಿಸುತ್ತದೆ, POನ ಇತರ SKUಗಳಿಗೆ PO ದಿನಾಂಕವೇ ಮಿತಿ."], "R8": ["ಎಲ್ಲರೂ", "MFPL ಫ್ಯಾಕ್ಟರಿ POಗಳಲ್ಲಿ ತಡದ ಅಪಾಯ ಸೂಚಿಸಲಾಗುತ್ತದೆ: ಕ್ಲೈಂಟ್ ದಿನಾಂಕ ತಪ್ಪುತ್ತದೆ; ಹಂತಗಳು ಹಿಂದೆ (30 / 15 / 7 ದಿನಕ್ಕಿಂತ ಕಡಿಮೆ ಉಳಿದಿದ್ದು ಪಾಲಿಷಿಂಗ್, ಫ್ಯಾಕ್ಟರಿ QC ಅಥವಾ ಪ್ಯಾಕಿಂಗ್ ಆರಂಭವಾಗಿಲ್ಲ); ಜಾಬ್ ಕಾರ್ಡ್ Post Frame ಅಥವಾ ಮುಂದೆ ಇದ್ದರೂ ಬಟ್ಟೆ ಕಳುಹಿಸಿಲ್ಲ; PO ಆದ 15 ದಿನಗಳ ನಂತರವೂ ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲ; ಫ್ಯಾಕ್ಟರಿ ದಿನಾಂಕ PO‌ನಿಂದ 75 ದಿನಕ್ಕಿಂತ ಹೆಚ್ಚು ನಂತರ."], "R9": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ", "ಅನುಮೋದಿತ ಸ್ಟಾಕ್ ಬ್ಲಾಕ್ ಆ SKUವನ್ನು ಒಳಗೊಂಡಿದೆ ಎಂದು ಪರಿಗಣಿಸುತ್ತದೆ, ಹಾಗಾಗಿ PO ಬೇಕಿಲ್ಲ. ಅದೇ SOನಲ್ಲಿ ಅದೇ ಕೋಡ್ + FIN (ಉದಾ. AARA → AARAFIN) PO ಲೈನ್ ಬಂದರೆ, ಬ್ಲಾಕ್ \"Issued to factory — FIN PO …\" ತೋರಿಸುತ್ತದೆ, ಬ್ಲಾಕ್ ಸ್ಟಾಕ್‌ನಲ್ಲಿ ಎಣಿಸುವುದಿಲ್ಲ, ಮತ್ತು FIN ಲೈನ್ ಸಾಮಾನ್ಯ ಫ್ಯಾಕ್ಟರಿ ಕ್ರಮ ಅನುಸರಿಸುತ್ತದೆ."], "R10": ["ಫ್ಯಾಕ್ಟರಿ, ಸಪ್ಲೈ", "ಸ್ಕ್ಯಾನ್ ಮಾಡಿದ ಜಾಬ್ ಕಾರ್ಡ್ ಪರಿಶೀಲಿಸದೆ ಉಳಿಸುವುದಿಲ್ಲ. ಪ್ರತಿ ಫೀಲ್ಡ್ ಅನ್ನು ಫೋಟೋದೊಂದಿಗೆ ಹೋಲಿಸಿ, ವಿಶೇಷವಾಗಿ ಹಳದಿ ಗುರುತಿನವು. ಕಾರ್ಡ್‌ನ ಮತ್ತೊಂದು ಫೋಟೋ ಅದೇ ಕಾರ್ಡ್ ಅಪ್‌ಡೇಟ್ ಮಾಡುತ್ತದೆ; ಉಳಿಸಿದ ದಿನಾಂಕ ಮತ್ತು ಸಹಿಗಳು ಉಳಿಯುತ್ತವೆ."], "R11": ["ಎಲ್ಲರೂ", "PO Progress Tracker ಮತ್ತು Order Deadlinesನಲ್ಲಿ ಕಾಣುವ ಜಾಬ್ ಕಾರ್ಡ್ ಹಂತ = ಆರಂಭ ದಿನಾಂಕ, ಮುಕ್ತಾಯ ದಿನಾಂಕ ಮತ್ತು ಕನಿಷ್ಠ ಒಂದು ಸಹಿ ಇರುವ ಅತ್ಯಂತ ಮುಂದಿನ ಹಂತ."], "R12": ["ಸಪ್ಲೈ, ಸೇಲ್ಸ್", "ಫ್ಯಾಕ್ಟರಿಯಲ್ಲಿ ತಯಾರಾದ ಫರ್ನಿಚರ್ SKU ಡಿಸ್ಪ್ಯಾಚ್ ಅಥವಾ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಸ್ಲಾಟ್‌ಗೆ ಸಿದ್ಧ ಎನ್ನುವುದು, ಸಪ್ಲೈ Order Deadlinesನಲ್ಲಿ ಅದಕ್ಕೆ \"QC report generated\" ಟಿಕ್ ಮಾಡಿದಾಗ ಮಾತ್ರ (ಪ್ಯಾಕಿಂಗ್ ಮುಗಿದ ನಂತರ). ಅದರ ಗೋದಾಮು ಟ್ಯಾಗ್‌ಗಳೂ ಟಿಕ್ ನಂತರವೇ. ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲದ ಫರ್ನಿಚರ್ SKU ಟಿಕ್ ಆಗುವವರೆಗೆ ಸಿದ್ಧವಲ್ಲ."], "R13": ["ಸಪ್ಲೈ, ಫ್ಯಾಕ್ಟರಿ", "ಫರ್ನಿಶಿಂಗ್ ಮತ್ತು ಗೋದಾಮು ಟ್ಯಾಗ್‌ಗಳು ಪೂರ್ಣವಾಗಿ ಚಲಿಸುತ್ತವೆ: ಭಾಗ ಪ್ರಮಾಣ ಇಲ್ಲ. ಚಲನ್ ಮತ್ತು ರಸೀದಿ ಸಂಖ್ಯೆಗಳನ್ನು ಆ್ಯಪ್ ಮಾಡುತ್ತದೆ; ಚಲನ್ Logbookನಿಂದ ಮರುಮುದ್ರಿಸಿ."], "R14": ["ಸಪ್ಲೈ, ಅಡ್ಮಿನ್", "Dispatch Day ಪರಿಶೀಲನೆ ಮುಗಿಯುವವರೆಗೆ \"Mark dispatched\" ಲಾಕ್. ಅಡ್ಮಿನ್ ಮಾತ್ರ 3 ಅಥವಾ ಹೆಚ್ಚು ಪದಗಳ ಕಾರಣದೊಂದಿಗೆ ಓವರ್‌ರೈಡ್ ಮಾಡಬಹುದು, ಅದು ದಾಖಲಾಗುತ್ತದೆ. Dispatch Day ಟು-ಡೂಗಳು ಡಿಸ್ಪ್ಯಾಚ್ ದಿನಾಂಕಕ್ಕೆ 48 ಗಂಟೆ ಮೊದಲು ಕಾಣುತ್ತವೆ; ಪರಿಶೀಲನೆ ಮೊದಲೇ ಮಾಡಬಹುದು."], "R15": ["ಸೇಲ್ಸ್, COO / ಡೈರೆಕ್ಟರ್, ಅಕೌಂಟ್ಸ್", "ಡಿಸ್ಪ್ಯಾಚ್ ವೇಳೆ ₹1ಕ್ಕಿಂತ ಹೆಚ್ಚು ಬಾಕಿ ಇದ್ದರೆ COO / ಡೈರೆಕ್ಟರ್ ಅನುಮೋದನೆ ಬೇಕು. ಲಿಂಕ್ 48 ಗಂಟೆ ಮಾನ್ಯ; ತಿರಸ್ಕರಿಸಲು ಟಿಪ್ಪಣಿ ಬೇಕು; ನಂತರ ಅಕೌಂಟ್ಸ್ ದೃಢೀಕರಿಸುತ್ತದೆ. ಬಾಕಿ ಅನುಮೋದಿತ ಮೊತ್ತಕ್ಕಿಂತ ಹೆಚ್ಚಾದರೆ ಹೊಸ ಅನುಮೋದನೆ ಬೇಕು."], "R16": ["ಅಕೌಂಟ್ಸ್", "ಸಪ್ಲೈಯ ERP ಸಂಖ್ಯೆಗಳು ಬಂದು ಪಾವತಿ ಇತ್ಯರ್ಥವಾದಾಗ ಇನ್‌ವಾಯ್ಸ್ ಮತ್ತು ಇ-ವೇ ಬಿಲ್ ಹಂತ ತೆರೆಯುತ್ತದೆ: ಪೂರ್ಣ ಪಾವತಿ ದೃಢಪಟ್ಟಿದೆ; ಏನೂ ಬಂದಿಲ್ಲ ಆದರೆ ಅನುಮೋದನೆ ದೃಢಪಟ್ಟಿದೆ; ಅಥವಾ ಭಾಗ ಪಾವತಿ ದೃಢಪಟ್ಟು ಉಳಿದದ್ದಕ್ಕೆ ಅನುಮೋದನೆ ದೃಢಪಟ್ಟಿದೆ. ಇನ್‌ವಾಯ್ಸ್ ಸಂಖ್ಯೆ ಯಾವಾಗಲೂ ಬೇಕು. ಇ-ವೇ ಬಿಲ್ 12 ಅಂಕಿಗಳು, ಅಥವಾ ಕಾರಣದೊಂದಿಗೆ \"Not required\"."], "R17": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ", "ಬ್ಲಾಕ್ ಮಾಡಿದ ದಿನಾಂಕಗಳಲ್ಲಿ ಡಿಸ್ಪ್ಯಾಚ್ ಅಥವಾ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ವಿನಂತಿಸಲಾಗದು, ಮತ್ತು Slot settingsನ ಸಮಯದಲ್ಲಿ ಮಾತ್ರ. ಕ್ಲೈಂಟ್ ದಿನಾಂಕದ ನಂತರದ ಡಿಸ್ಪ್ಯಾಚ್‌ಗೆ ಕಾರಣ ಬೇಕು. ಟ್ರ್ಯಾಕಿಂಗ್ ಲಿಂಕ್ ಆಗಿ ಲಿಂಕ್ ಅಥವಾ NA ಕೊಡಬಹುದು; ಲಿಂಕ್ ಇಲ್ಲದಿದ್ದರೆ ಸಾರಿಗೆ POC ಕೊಡಿ."], "R18": ["ಸೇಲ್ಸ್, ಗ್ರಾಹಕ", "ಪ್ರತಿ ಸೈಟ್-ವಿವರ ಲಿಂಕ್ ಒಂದೇ SOಗೆ ಸೇರಿದ್ದು. ಪ್ರತಿ ತುಂಡನ್ನು ಪ್ರತಿ ಬದಿಗೆ 5 ಇಂಚು ಸೇರಿಸಿ ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ: ಲಿಫ್ಟ್‌ನೊಂದಿಗೆ, ಅಥವಾ ಲಿಫ್ಟ್ ಇಲ್ಲದಿದ್ದರೆ ಮೆಟ್ಟಿಲುಗಳೊಂದಿಗೆ (ಅದರ ಅತಿ ಚಿಕ್ಕ ಬದಿ ಮೆಟ್ಟಿಲಿನ ಅಗಲದಲ್ಲಿ ಹಾದುಹೋಗಬೇಕು ಮತ್ತು ಲ್ಯಾಂಡಿಂಗ್‌ನ ಉದ್ದ, ಅಗಲ, ಎತ್ತರದಲ್ಲಿ ಹಿಡಿಸಬೇಕು). ಹಿಡಿಸದ ತುಂಡಿಗೆ 3 ಅಥವಾ ಹೆಚ್ಚು ಪದಗಳ ಓವರ್‌ರೈಡ್ ಕಾರಣ ಬೇಕು."], "R19": ["ಎಲ್ಲರೂ", "ಪುಟ ತಾನಾಗಿ ಅಪ್‌ಡೇಟ್ ಆಗುತ್ತದೆ: ಇತರರ ಬದಲಾವಣೆಗಳು 2 ನಿಮಿಷಗಳೊಳಗೆ ಕಾಣುತ್ತವೆ, ಟ್ಯಾಬ್‌ಗೆ ಹಿಂತಿರುಗಿದ ತಕ್ಷಣವೂ. ನೀವು ಟೈಪ್ ಮಾಡುತ್ತಿರುವಾಗ ಅದು ಕಾಯುತ್ತದೆ. ಹೊಸ ERP ಡೇಟಾ, ಮತ್ತು ಇತರರು ಸೇರಿಸಿದ ಅಥವಾ ಜೋಡಿಸಿದ PO ವಿನಂತಿಗಳು, ರಿಫ್ರೆಶ್ ಮಾಡಲು ಒಂದು ಪಟ್ಟಿ ತೋರಿಸುತ್ತವೆ. ERP ಡೇಟಾ ಕೊನೆಯ ದೈನಂದಿನ ಅಪ್‌ಲೋಡ್‌ನಷ್ಟು ಹೊಸದು. ಪ್ರತಿ CSV ಡೌನ್‌ಲೋಡ್‌ನಲ್ಲಿ SO ಮತ್ತು PO ಸಂಖ್ಯೆಗಳು Excelನಲ್ಲಿ ಎಲ್ಲಾ ಅಂಕಿಗಳೊಂದಿಗೆ ಉಳಿಯುತ್ತವೆ."], "R20": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ, ಅಕೌಂಟ್ಸ್, COO / ಡೈರೆಕ್ಟರ್", "SO ಪರಿಷ್ಕರಣೆಗೆ ಮೊದಲು COO / ಡೈರೆಕ್ಟರ್ ಅನುಮೋದನೆ, ನಂತರ ಸಪ್ಲೈಯ ारीख, ख़त्म की तारीख और कम से कम एक हस्ताक्षर हो।"], "R12": ["सप्लाई, सेल्स", "फ़ैक्टरी में बना फ़र्नीचर SKU डिस्पैच या इंस्टॉलेशन स्लॉट के लिए तभी तैयार है जब सप्लाई ने Order Deadlines में उसके लिए \"QC report generated\" टिक किया हो (पैकिंग बंद होने के बाद)। उसके वेयरहाउस टैग भी टिक के बाद ही बन सकते हैं। बिना जॉब कार्ड वाला फ़र्नीचर SKU टिक होने तक तैयार नहीं माना जाता।"], "R13": ["सप्लाई, फ़ैक्टरी", "फ़र्निशिंग और वेयरहाउस टैग पूरे चलते हैं: आंशिक मात्रा नहीं। चालान और रसीद नंबर ऐप बनाता है; चालान Logbook से दोबारा प्रिंट करें।"], "R14": ["सप्लाई, एडमिन", "Dispatch Day जाँच पूरी होने तक \"Mark dispatched\" लॉक रहता है। केवल एडमिन 3 या ज़्यादा शब्दों के कारण के साथ ओवरराइड कर सकता है, जो दर्ज होता है। Dispatch Day के टू-डू डिस्पैच तारीख से 48 घंटे पहले दिखते हैं; जाँच पहले भी की जा सकती है।"], "R15": ["सेल्स, COO / डायरेक्टर, अकाउंट्स", "डिस्पैच के समय ₹1 से ज़्यादा बकाया हो तो COO / डायरेक्टर का अनुमोदन ज़रूरी है। लिंक 48 घंटे मान्य है; अस्वीकार करने पर टिप्पणी ज़रूरी है; फिर अकाउंट्स पुष्टि करता है। बकाया मंज़ूर राशि से बढ़ जाए तो नया अनुमोदन चाहिए।"], "R16": ["अकाउंट्स", "इनवॉइस और ई-वे बिल का चरण तब खुलता है जब सप्लाई के ERP नंबर आ जाएँ और भुगतान निपट जाए: पूरा भुगतान और पुष्टि; कुछ नहीं मिला पर अनुमोदन की पुष्टि; या आंशिक भुगतान की पुष्टि और बाकी का अनुमोदन। इनवॉइस नंबर हमेशा ज़रूरी है। ई-वे बिल 12 अंकों का है, या कारण सहित \"Not required\"।"], "R17": ["सेल्स, सप्लाई", "ब्लॉक की गई तारीखों पर डिस्पैच या इंस्टॉलेशन का अनुरोध नहीं हो सकता, और केवल Slot settings की विंडो में। क्लाइंट तारीख के बाद डिस्पैच के लिए कारण चाहिए। ट्रैकिंग लिंक में लिंक या NA दे सकते हैं; लिंक न हो तो ट्रांसपोर्ट POC दें।"], "R18": ["सेल्स, ग्राहक", "हर साइट-विवरण लिंक एक SO का होता है। हर पीस की हर तरफ़ 5 इंच जोड़कर जाँच होती है: लिफ़्ट से, या लिफ़्ट न हो तो सीढ़ियों से (उसकी सबसे छोटी तरफ़ सीढ़ी की चौड़ाई से निकलनी चाहिए और वह लैंडिंग की लंबाई, चौड़ाई और ऊँचाई में आना चाहिए)। जो पीस न समाए उसके लिए 3 या ज़्यादा शब्दों का ओवरराइड कारण चाहिए।"], "R19": ["सभी", "पेज अपने-आप अपडेट होता ह ു ക്ലാരിഫിക്കേഷനും ബാക്കിയില്ലെങ്കിൽ മാത്രമേ പ്രൊഡക്ഷൻ തുടങ്ങൂ."], "R5": ["ഫാക്ടറി, സെയിൽസ്", "ഫാക്ടറി തീയതി: MFPL PO വന്ന് 20 ദിവസത്തിനുള്ളിൽ ഫാക്ടറി ഒന്നുകിൽ ക്ലയന്റ് തീയതി സമ്മതിക്കണം, അല്ലെങ്കിൽ സ്വന്തം തീയതി പറയണം — ഒരു SKU-യ്ക്കോ PO മുഴുവനായോ. സെയിൽസ് അത് സമ്മതിക്കും, അല്ലെങ്കിൽ റിജക്ട് ചെയ്ത് വേറെ തീയതി പറയും. ഫാക്ടറിക്ക് ഒരു തവണ കൂടി തീയതി പറയാം; അതിനുശേഷം സെയിൽസ് പറയുന്ന അവസാന തീയതിയാണ് അന്തിമം. 20 ദിവസത്തിനുള്ളിൽ മറുപടി ഇല്ലെങ്കിൽ ക്ലയന്റ് തീയതിയിൽ നിന്ന് 5 ദിവസം കുറച്ച തീയതി തനിയെ എടുക്കും."], "R6": ["എല്ലാവരും", "രണ്ട് തീയതികൾക്കിടയിൽ 5 ദിവസത്തെ വ്യത്യാസമുണ്ട്: ഫാക്ടറി തീയതി + 5 = സാധനം ക്ലയന്റിന് എത്തിക്കാവുന്ന തീയതി. സെയിൽസ് കാണുന്നത് ക്ലയന്റിന്റെ തീയതി, ഫാക്ടറി കാണുന്നത് സ്വന്തം തീയതി, സപ്ലൈയും അഡ്മിനും രണ്ടും കാണും."], "R7": ["ഫാക്ടറി, സെയിൽസ്", "സ്ഥിരീകരിച്ച ഫാക്ടറി തീയതി മാറ്റണമെങ്കിൽ: ആ തീയതിക്ക് 10 ദിവസം മുമ്പ് വരെ ഫാക്ടറിക്ക് ഡീവിയേഷൻ ചോദിക്കാം (ഒരു സമയത്ത് ഒരു റിക്വസ്റ്റ് മാത്രം). അവസാന 10 ദിവസം തീയതി ലോക്ക് ആയിരിക്കും. ഒരു SKU-യുടെ തീയതി PO-യുടെ തീയതിയേക്കാൾ വൈകിയതാകാം: സെയിൽസ് സമ്മതിച്ചാൽ ആ SKU അതിന്റെ സ്വന്തം തീയതി അനുസരിച്ച് പോകും, PO-യിലെ ബാക്കി SKU-കൾക്ക് PO തീയതി തന്നെയാണ് പരിധി."], "R8": ["എല്ലാവരും", "MFPL ഫാക്ടറി PO-കളിൽ വൈകൽ സാധ്യത കാണിക്കും: ക്ലയന്റ് തീയതി തെറ്റുമെന്ന് കാണുമ്പോൾ; സ്റ്റേജുകൾ പിന്നിലായാൽ (30 / 15 / 7 ദിവസത്തിൽ കുറവ് ബാക്കി, പോളിഷിംഗോ ഫാക്ടറി QC-യോ പാക്കിംഗോ തുടങ്ങിയിട്ടില്ല); ജോബ് കാർഡ് Post Frame-ലോ അതിനുശേഷമോ എത്തിയിട്ടും തുണി അയച്ചിട്ടില്ല; PO കഴിഞ്ഞ് 15 ദിവസമായിട്ടും ജോബ് കാർഡ് ഇല്ല; ഫാക്ടറി തീയതി PO-യ്ക്ക് ശേഷം 75 ദിവസത്തിൽ കൂടുതൽ."], "R9": ["സെയിൽസ്, സപ്ലൈ", "അപ്രൂവ് ചെയ്ത സ്റ്റോക്ക് ബ്ലോക്ക് ഉണ്ടെങ്കിൽ ആ SKU-യ്ക്ക് സാധനം ഉണ്ടെന്ന് കണക്കാക്കും, PO വേണ്ട. അതേ SO-യിൽ അതേ കോഡ് + FIN (ഉദാ. AARA → AARAFIN) ഉള്ള PO ലൈൻ വന്നാൽ, ബ്ലോക്കിൽ \"Issued to factory — FIN PO …\" എന്ന് കാണിക്കും, അത് ബ്ലോക്ക് ചെയ്ത സ്റ്റോക്കായി എണ്ണില്ല, FIN ലൈൻ പതിവ് ഫാക്ടറി രീതിയിൽ പോകും."], "R10": ["ഫാക്ടറി, സപ്ലൈ", "സ്കാൻ ചെയ്ത ജോബ് കാർഡ് പരിശോധിക്കാതെ സേവ് ആകില്ല. ഓരോ ഫീൽഡും ഫോട്ടോയുമായി ഒത്തുനോക്കുക, പ്രത്യേകിച്ച് മഞ്ഞ നിറത്തിൽ കാണിക്കുന്നവ. അതേ കാർഡിന്റെ ഫോട്ടോ വീണ്ടും എടുത്താൽ അതേ കാർഡ് അപ്ഡേറ്റ് ആകും; നേരത്തെ സേവ് ചെയ്ത തീയതികളും ഒപ്പുകളും പോകില്ല."], "R11": ["എല്ലാവരും", "PO Progress Tracker-ലും Order Deadlines-ലും കാണുന്ന ജോബ് കാർഡ് സ്റ്റേജ്: തുടങ്ങിയ തീയതി, തീർന്ന തീയതി, ചുരുങ്ങിയത് ഒരു ഒപ്പ് — ഇവ മൂന്നും ഉള്ള ഏറ്റവും അവസാനത്തെ സ്റ്റേജ്."], "R12": ["സപ്ലൈ, സെയിൽസ്", "ഫാക്ടറിയിൽ ഉണ്ടാക്കിയ ഫർണിച്ചർ SKU ഡിസ്പാച്ച് സ്ലോട്ടിനോ ഇൻസ്റ്റലേഷനോ റെഡി ആകുന്നത് സപ്ലൈ Order Deadlines-ൽ \"QC report generated\" ടിക്ക് ചെയ്യുമ്പോൾ മാത്രമാണ് (പാക്കിംഗ് കഴിഞ്ഞ ശേഷം). ആ ടിക്ക് കഴിഞ്ഞിട്ടേ വെയർഹൗസ് ടാഗ് ഉണ്ടാക്കാനും പറ്റും. ജോബ് കാർഡ് ഇല്ലാത്ത ഫർണിച്ചർ SKU-വും ടിക്ക് ചെയ്യുന്നതുവരെ റെഡി അല്ല."], "R13": ["സപ്ലൈ, ഫാക്ടറി", "ഫർണിഷിംഗും വെയർഹൗസ് ടാഗും മുഴുവനായി മാത്രം നീങ്ങും — പാതി അളവ് പറ്റില്ല. ചലാൻ, രസീത് നമ്പറുകൾ ആപ്പ് തന്നെ ഉണ്ടാക്കും; ചലാൻ വീണ്ടും പ്രിന്റ് ചെയ്യണമെങ്കിൽ Logbook-ൽ നിന്ന് എടുക്കാം."], "R14": ["സപ്ലൈ, അഡ്മിൻ", "Dispatch Day-യിലെ ചെക്കുകൾ മുഴുവൻ കഴിയുന്നതുവരെ \"Mark dispatched\" ലോക്ക് ആയിരിക്കും. അഡ്മിന് മാത്രം ഓവർറൈഡ് ചെയ്യാം, 3 വാക്കോ അതിൽ കൂടുതലോ ഉള്ള ഒരു കാരണം കൊടുത്ത്; അത് രേഖയിൽ വരും. Dispatch Day ടു-ഡൂ ഡിസ്പാച്ച് തീയതിക്ക് 48 മണിക്കൂർ മുമ്പ് വരും; ചെക്കുകൾ അതിനു മുമ്പേ ചെയ്യാം."], "R15": ["സെയിൽസ്, COO / ഡയറക്ടർ, അക്കൗണ്ട്സ്", "ഡിസ്പാച്ച് സമയത്ത് ₹1-ൽ കൂടുതൽ ബാക്കിയുണ്ടെങ്കിൽ COO / ഡയറക്ടർ അപ്രൂവ് ചെയ്യണം. ലിങ്കിന് 48 മണിക്കൂർ കാലാവധി; റിജക്ട് ചെയ്യണമെങ്കിൽ ഒരു കമന്റ് വേണം; പിന്നെ അക്കൗണ്ട്സ് അത് ശരിയാണെന്ന് ഉറപ്പിക്കും. ബാക്കി തുക അപ്രൂവ് ചെയ്ത തുകയിൽ കൂടിയാൽ വീണ്ടും അപ്രൂവൽ വേണം."], "R16": ["അക്കൗണ്ട്സ്", "സപ്ലൈയുടെ ERP നമ്പറുകൾ വന്ന് പേയ്മെന്റ് തീർന്നാൽ ഇൻവോയ്സ്, ഇ-വേ ബിൽ സ്റ്റെപ്പ് തുറക്കും. തീർന്നു എന്ന് പറയുന്നത്: മുഴുവൻ തുക കിട്ടി സ്ഥിരീകരിച്ചു; അല്ലെങ്കിൽ ഒന്നും കിട്ടിയില്ല പക്ഷേ അപ്രൂവൽ ഉറപ്പിച്ചു; അല്ലെങ്കിൽ കുറച്ച് കിട്ടി സ്ഥിരീകരിച്ച്, ബാക്കിക്ക് അപ്രൂവൽ ഉറപ്പിച്ചു. ഇൻവോയ്സ് നമ്പർ എപ്പോഴും വേണം. ഇ-വേ ബിൽ 12 അക്കം വേണം, അല്ലെങ്കിൽ കാരണം എഴുതി \"Not required\" കൊടുക്കണം."], "R17": ["സെയിൽസ്, സപ്ലൈ", "ബ്ലോക്ക് ചെയ്ത തീയതികളിൽ ഡിസ്പാച്ചോ ഇൻസ്റ്റലേഷനോ ചോദിക്കാൻ പറ്റില്ല; Slot setting const LANE_KEYS = ['customer','sales','supply','factory','accounts','approver','admin'];
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch(e){} } };
const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const btn = s => esc(s).replace(/⟦(.+?)⟧/g, '<span class="btnname">$1</span>');   // escaped text with button names marked
const S = { lang: store.get('obg_lang'), role: store.get('obg_role'), view: 'manual', mapRole: 'all', sel: 2, hlRule: null };
if (S.lang && !LANGS.some(l => l.id === S.lang)) S.lang = null;
// merged content for a language: the language's own text over English
function merge(a, b){
  if (b == null) return a;
  if (Array.isArray(a)) return a.map((x, i) => (x && typeof x === 'object' && !Array.isArray(x) && x.id && Array.isArray(b)) ? merge(x, b.find(y => y && y.id === x.id) || b[i]) : merge(x, Array.isArray(b) ? b[i] : undefined));
  if (a && typeof a === 'object'){ const o = {}; Object.keys(a).forEach(k => o[k] = merge(a[k], b[k])); return o; }
  return (typeof b === 'string' && b.trim()) || typeof b === 'number' || typeof b === 'boolean' ? b : a;
}
const CACHE = {};
const D = () => CACHE[S.lang] || (CACHE[S.lang] = S.lang === 'en' ? DATA.en : merge(DATA.en, DATA[S.lang] || {}));
const u = k => D().ui[k];
const laneName = k => D().lanes[k][0];
const STEPS = DATA.en.steps.map((s, i) => Object.assign({ n:i + 1 }, s));
const app = document.getElementById('app'), bar = document.getElementById('bar');

// Deep links: #sales #supply #factory #accounts #approver #admin (manual), #map, #rules. Optional language first: #kn-sales.
(function readHash(){
  const h = decodeURIComponent((location.hash || '').slice(1)).toLowerCase();
  h.split(/[-_]/).forEach(p => { if (LANGS.some(l => l.id === p)) S.lang = p; if (ROLES.includes(p)) { S.role = p; S.view = 'manual'; } if (p === 'map') S.view = 'map'; if (p === 'rules') S.view = 'rules'; if (p === 'production') { S.role = 'factory'; S.view = 'manual'; } });
})();

function render(){
  document.documentElement.lang = S.lang || 'en';
  if (!S.lang) return renderStartLang();
  if (!S.role && S.view === 'manual') return renderStartRole();
  bar.hidden = false;
  document.getElementById('tabs').innerHTML = [['manual', u('tabManual')], ['map', u('tabMap')], ['rules', u('tabRules')]].map(([v, l]) => `<button data-view="${v}" aria-current="${S.view === v}">${esc(l)}</button>`).join('');
  document.getElementById('langsw').innerHTML = LANGS.map(l => `<button data-lang="${l.id}" aria-pressed="${S.lang === l.id}" title="${esc(l.name)}">${esc(l.native)}</button>`).join('');
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { S.view = b.dataset.view; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { S.lang = b.dataset.lang; store.set('obg_lang', S.lang); render(); });
  const notice = S.lang === 'en' ? '' : `<p class="notice">${esc(u('draftLang'))}</p>`;
  if (S.view === 'map') renderMap(notice); else if (S.view === 'rules') renderRules(notice); else renderManual(notice);
}

function renderStartLang(){
  bar.hidden = true;
  const E = DATA.en.ui;
  app.innerHTML = `<div class="wrap"><section class="start">
    <div class="step-ind">${esc(E.step1)}</div>
    <div class="eyebrow">Magari Furniture · Order Bridge</div>
    <h1>${esc(E.pickLang)}<br><span style="font-weight:600;font-size:.7em;">${['kn','hi','ml'].map(l => esc((DATA[l] && DATA[l].ui && DATA[l].ui.pickLang) || '')).filter(Boolean).join(' · ')}</span></h1>
    <p class="lede">${esc(E.pickLangSub)}</p>
    <div class="pick">${LANGS.map(l => `<button data-pick-lang="${l.id}"><span class="big">${esc(l.native)}</span><span class="small">${esc(l.name)}</span></button>`).join('')}</div>
  </section></div>`;
  app.querySelectorAll('[data-pick-lang]').forEach(b => b.onclick = () => { S.lang = b.dataset.pickLang; store.set('obg_lang', S.lang); render(); window.scrollTo(0, 0); });
}
function renderStartRole(){
  bar.hidden = true;
  app.innerHTML = `<div class="wrap"><section class="start">
    <div class="step-ind">${esc(u('step2'))} · <button class="linkbtn" id="backLang">${esc(u('back'))}</button></div>
    <h1>${esc(u('pickRole'))}</h1>
    <p class="lede">${esc(u('pickRoleSub'))}</p>
    <div class="pick">${ROLES.map(r => `<button data-pick-role="${r}" data-lane="${r}"><span class="big">${esc(laneName(r))}</span><span class="small">${esc(D().blurb[r])}</span></button>`).join('')}</div>
    <p class="lede" style="margin-top:22px;"><button class="linkbtn" id="goMap">${esc(u('tabMap'))}</button> · <button class="linkbtn" id="goRules">${esc(u('tabRules'))}</button></p>
  </section></div>`;
  app.querySelector('#backLang').onclick = () => { S.lang = null; render(); };
  app.querySelectorAll('[data-pick-role]').forEach(b => b.onclick = () => { S.role = b.dataset.pickRole; store.set('obg_role', S.role); S.view = 'manual'; render(); window.scrollTo(0, 0); });
  app.querySelector('#goMap').onclick = () => { S.view = 'map'; render(); };
  app.querySelector('#goRules').onclick = () => { S.view = 'rules'; render(); };
}

function renderManual(notice){
  const M = D().man[S.role];
  app.innerHTML = `<div class="wrap view" data-lane="${S.role}">
    <div class="mhead"><div><div class="eyebrow">Order Bridge · ${esc(u('tabManual'))}</div><h1>${esc(laneName(S.role))} ${esc(u('manualTitle'))}</h1></div><div class="mono" style="color:var(--ink-soft);">${esc(u('dates'))}</div></div>
    ${notice}
    <div class="roles" role="group">${ROLES.map(r => `<button class="chip" data-role-chip="${r}" style="--c:var(--d-${r})" aria-pressed="${S.role === r}"><i></i>${esc(laneName(r))}</button>`).join('')}</div>
    <div class="mgrid">
      <nav class="toc" aria-label="${esc(u('tasks'))}"><b>${esc(u('tasks'))}</b>${M.tasks.map(t => `<a href="#" data-goto="${t.id}">${btn(t.t)}</a>`).join('')}</nav>
      <div style="min-width:0;">
        <div class="day"><h2>${esc(u('yourDay'))}</h2><ul>${M.day.map(x => `<li>${btn(x)}</li>`).join('')}</ul>${S.role !== 'approver' ? `<p style="margin:8px 0 0;font-size:14px;color:var(--ink-soft);">${esc(u('goLive'))}</p>` : ''}</div>
        ${M.tasks.map(t => `<article class="task" id="task-${t.id}">
          <h3>${btn(t.t)}</h3><div class="when">${btn(t.when)}</div>
          <div class="where">${esc(t.where)}</div>
          <ol>${t.steps.map(x => `<li>${btn(x)}</li>`).join('')}</ol>
          ${(t.rules && t.rules.length) || (t.map && t.map.length) ? `<div class="refs">${(t.rules || []).map(r => `<button class="ref" data-rule="${r}">${r}</button>`).join('')}${(t.map || []).map(n => `<button class="mapref" data-mapstep="${n}">${esc(u('seeMap'))} ${n}</button>`).join('')}</div>` : ''}
        </article>`).join('')}
      </div>
    </div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
  app.querySelectorAll('[data-role-chip]').forEach(b => b.onclick = () => { S.role = b.dataset.roleChip; store.set('obg_role', S.role); render(); });
  app.querySelectorAll('[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById('task-' + a.dataset.goto); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); });
  wireRefs();
}
function wireRefs(){
  app.querySelectorAll('[data-rule]').forEach(b => b.onclick = () => { S.view = 'rules'; S.hlRule = b.dataset.rule; render(); const row = document.getElementById('rule-' + S.hlRule); if (row) row.scrollIntoView({ block:'center' }); });
  app.querySelectorAll('[data-mapstep]').forEach(b => b.onclick = () => { S.view = 'map'; S.sel = +b.dataset.mapstep; S.mapRole = 'all'; render(); window.scrollTo(0, 0); });
}

function renderRules(notice){
  const R = D().rules;
  app.innerHTML = `<div class="wrap view">
    <div class="eyebrow">Order Bridge</div><h1>${esc(u('rulesTitle'))}</h1><p class="lede">${esc(u('rulesSub'))}</p>${notice}
    <div class="tablewrap"><table class="rtable"><thead><tr><th>${esc(u('thRule'))}</th><th>${esc(u('thWhat'))}</th><th>${esc(u('thWho'))}</th></tr></thead>
      <tbody>${Object.keys(DATA.en.rules).map(id => `<tr id="rule-${id}" class="${S.hlRule === id ? 'hl' : ''}"><td class="id">${id}</td><td>${btn(R[id][1])}</td><td class="who">${esc(R[id][0])}</td></tr>`).join('')}</tbody></table></div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
}

function renderMap(notice){
  const X = D(), Bx = X.boxes, stg = X.stages;
  app.innerHTML = `<div class="wrap view">
    <div class="mhead"><div><div class="eyebrow">Magari Furniture · Order Bridge</div><h1>${esc(u('mapTitle1'))}<span class="tag">${esc(u('mapTitle2'))}</span></h1><p class="lede">${esc(u('mapSub'))}</p></div><div class="mono" style="color:var(--ink-soft);max-width:300px;">${esc(u('dates'))}</div></div>
    ${notice}
    <div class="roles" role="group"><span style="font-weight:600;color:var(--ink-soft);font-size:13px;align-self:center;">${esc(u('showFor'))}</span>
      <button class="chip" data-maprole="all" aria-pressed="${S.mapRole === 'all'}">${esc(u('everyone'))}</button>
      ${ROLES.map(r => `<button class="chip" data-maprole="${r}" style="--c:var(--d-${r})" aria-pressed="${S.mapRole === r}"><i></i>${esc(laneName(r))}</button>`).join('')}</div>
    <div class="mmain"><div class="mapbox"><div class="map ${S.mapRole !== 'all' ? 'filtered' : ''}" id="map"></div></div><aside class="detail" id="detail" aria-live="polite"></aside></div>
    <div class="lower">
      <section class="box"><h3>${esc(Bx.sbTitle)}</h3><p class="sub">${esc(Bx.sbSub)}</p>
        <ol class="flow"><li data-lane="sales"><span class="r">${esc(Bx.sb1r)}</span><span>${esc(Bx.sb1)}</span></li><li data-lane="supply"><span class="r">${esc(Bx.sb2r)}</span><span>${esc(Bx.sb2)}</span></li></ol></section>
      <section class="box"><h3>${esc(Bx.srTitle)}</h3><p class="sub">${esc(Bx.srSub)}</p>
        <ol class="flow"><li data-lane="sales"><span class="r">${esc(Bx.sr1r)}</span><span>${esc(Bx.sr1)}</span></li><li data-lane="approver"><span class="r">${esc(Bx.sr2r)}</span><span>${esc(Bx.sr2)}</span></li><li data-lane="supply"><span class="r">${esc(Bx.sr3r)}</span><span>${esc(Bx.sr3)}</span></li><li data-lane="accounts"><span class="r">${esc(Bx.sr4r)}</span><span>${esc(Bx.sr4)}</span></li></ol></section>
      <section class="box"><h3>${esc(Bx.evTitle)}</h3><ul style="margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;">${Bx.ev.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
    </div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
  const map = document.getElementById('map');
  let h = '<div class="corner"></div>' + stg.map((s, i) => `<div class="sh"><b>${i + 1}. ${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('');
  LANE_KEYS.forEach(k => {
    const [nm, sub] = X.lanes[k];
    h += `<div class="lane ${S.mapRole !== 'all' && S.mapRole !== k ? 'dim' : ''}" data-lane="${k}">${esc(nm)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
    stg.forEach((_, si) => {
      const steps = STEPS.filter(s => s.l === k && s.s === si);
      h += `<div class="cell" data-lane="${k}" data-stage="${si}">${steps.map(s => { const x = X.steps[s.n - 1]; return `<button class="step ${S.mapRole !== 'all' && s.l !== S.mapRole ? 'dim' : ''}" data-n="${s.n}" data-lane="${s.l}" aria-pressed="${s.n === S.sel}"><span class="n">${s.n}</span><span class="t">${esc(x.t)}${s.opt ? ` <span class="opt">${esc(u('ifNeeded'))}</span>` : ''}</span><span class="w" data-who="${esc(laneName(s.l))}">${esc(x.w)}</span></button>`; }).join('')}</div>`;
    });
  });
  map.innerHTML = h;
  if (window.matchMedia('(max-width: 700px)').matches){
    stg.forEach((s, si) => { const hd = document.createElement('div'); hd.className = 'stage-m'; hd.textContent = `${si + 1}. ${s[0]}`; hd.style.order = si * 100; map.appendChild(hd); });
    map.querySelectorAll('.cell').forEach(c => { const first = Math.min(...[...c.querySelectorAll('.step')].map(b => +b.dataset.n), 99); c.style.order = (+c.dataset.stage) * 100 + first; });
  }
  map.querySelectorAll('.step').forEach(b => b.onclick = () => { S.sel = +b.dataset.n; renderMap(notice); if (window.matchMedia('(max-width: 1100px)').matches) document.getElementById('detail').scrollIntoView({ behavior:'smooth', block:'start' }); });
  app.querySelectorAll('[data-maprole]').forEach(b => b.onclick = () => { S.mapRole = b.dataset.maprole; if (S.mapRole !== 'all'){ const f = STEPS.find(s => s.l === S.mapRole); if (f && STEPS[S.sel - 1].l !== S.mapRole) S.sel = f.n; } renderMap(notice); });
  const s = STEPS[S.sel - 1], x = X.steps[s.n - 1];
  const list = S.mapRole === 'all' ? STEPS : STEPS.filter(y => y.l === S.mapRole);
  const idx = list.indexOf(s);
  const det = document.getElementById('detail'); det.setAttribute('data-lane', s.l);
  const mr = s.l === 'customer' ? 'sales' : s.l;
  const manualTask = X.man[mr].tasks.find(t => (t.map || []).includes(s.n));
  det.innerHTML = `<div class="who"><i></i>${esc(u('stepW'))} ${s.n} · ${esc(laneName(s.l))}</div><h2>${esc(x.t)}</h2><div class="where">${esc(x.w)}</div>
    <ul>${x.d.map(y => `<li>${esc(y)}</li>`).join('')}</ul><div class="next"><b>${esc(u('next'))}</b> ${esc(x.next)}</div>
    <div class="refs">${(DATA.en.stepRules[s.n] || []).map(r => `<button class="ref" data-rule="${r}">${r}</button>`).join('')}${manualTask ? `<button class="mapref" data-manual="${mr}|${manualTask.id}">${esc(u('openManual'))}: ${esc(laneName(mr))} › ${btn(manualTask.t)}</button>` : ''}</div>
    <div class="navbtns"><button id="prevStep" ${idx <= 0 ? 'disabled' : ''}>${esc(u('prev'))}</button><button id="nextStep" ${idx < 0 || idx >= list.length - 1 ? 'disabled' : ''}>${esc(u('nextB'))}</button></div>`;
  det.querySelector('#prevStep').onclick = () => { if (idx > 0){ S.sel = list[idx - 1].n; renderMap(notice); } };
  det.querySelector('#nextStep').onclick = () => { if (idx >= 0 && idx < list.length - 1){ S.sel = list[idx + 1].n; renderMap(notice); } };
  det.querySelectorAll('[data-manual]').forEach(b => b.onclick = () => { const [r, id] = b.dataset.manual.split('|'); S.role = r; store.set('obg_role', r); S.view = 'manual'; render(); const el = document.getElementById('task-' + id); if (el) el.scrollIntoView({ block:'start' }); });
  wireRefs();
}

render();

</script>
</body></html>
