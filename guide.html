 {"s": 4, "l": "sales", "t": "Start Dispatch Day, record payments", "w": "Last Mile Ops › Dispatch Day", "d": ["Add payments and submit to Accounts.", "If anything stays unpaid, create the COO / Director approval link."], "next": "Accounts confirms; the COO / Director decides any balance."}, {"s": 4, "l": "accounts", "t": "Confirm payment received", "w": "Last Mile Ops › Dispatch Day", "d": ["Confirm or send back; validate any approval."], "next": "With Supply's numbers in, the invoice step opens."}, {"s": 4, "l": "approver", "opt": true, "t": "Approve dispatch with a balance due", "w": "Approval link · Dispatch Day", "d": ["Only when more than ₹1 is unpaid. Approve, or reject with a comment, within 48 hours."], "next": "Accounts validates the approval."}, {"s": 4, "l": "supply", "t": "Enter ERP dispatch numbers", "w": "Last Mile Ops › Dispatch Day", "d": ["Dispatch sheet number, dispatch PO, installation PO, in parallel with payments."], "next": "Accounts can enter the invoice."}, {"s": 4, "l": "accounts", "t": "Enter invoice and e-way bill", "w": "Last Mile Ops › Dispatch Day", "d": ["Invoice number; 12-digit e-way bill or \"Not required\" with a reason."], "next": "Dispatch unlocks for Supply Chain."}, {"s": 4, "l": "supply", "t": "Mark dispatched, then delivered", "w": "Last Mile Ops › Dispatch", "d": ["Print the packing list, Mark dispatched.", "Upload the handover photo and Mark delivered; complete any installation."], "next": "The order is closed."}], "stepRules": {"1": ["R19"], "5": ["R1", "R2"], "6": ["R3"], "7": ["R4"], "8": ["R4"], "9": ["R10", "R11", "R22"], "10": ["R5", "R6", "R7", "R21"], "11": ["R5", "R7"], "12": ["R13"], "13": ["R13"], "14": ["R13"], "15": ["R12"], "16": ["R12", "R13"], "17": ["R13"], "18": ["R18"], "19": ["R18"], "20": ["R17", "R18", "R26"], "21": ["R17", "R26"], "22": ["R14", "R15"], "23": ["R15", "R16"], "24": ["R15"], "25": ["R16"], "26": ["R16"], "27": ["R14", "R26"], "2": ["R25"], "3": ["R25"], "4": ["R25"]}, "boxes": {"sbTitle  ಹಾಕಲೇಬೇಕು. 45, 60, 75, 90 ಅಥವಾ 120 ದಿನ ಆರಿಸಬಹುದು (ರಿಕ್ವೆಸ್ಟ್ ಹಾಕಿದ ದಿನದಿಂದ ಎಣಿಕೆ, ಆಮೇಲೆ ಬದಲಾಗಲ್ಲ), ಇಲ್ಲವೇ ನೇರವಾಗಿ ಒಂದು ಡೇಟ್ ಆರಿಸಿ."], "R2": ["ಸೇಲ್ಸ್", "SO-ನಲ್ಲಿ ಇರುವ SKU-ಗಳಿಗೆ ಮಾತ್ರ PO ಕೇಳಬಹುದು. SO-ನಲ್ಲಿ ಇಲ್ಲದ್ದಕ್ಕೆ SO Revision Request ಹಾಕಬೇಕು."], "R3": ["ಸಪ್ಲೈ", "ಸಪ್ಲೈ PO ನಂಬರ್ ಟೈಪ್ ಮಾಡಬೇಕಿಲ್ಲ. \"Mark PO raised in ERP\" ಒತ್ತಿದರೆ, ಮುಂದಿನ ಡೇಟಾ ರಿಫ್ರೆಶ್‌ನಲ್ಲಿ PO ಲೈನ್ ತಾನಾಗೇ ಹುಡುಕಿ ಸೇರುತ್ತೆ. ಸೇರದೇ ಇರೋದು PO Progress Tracker › Unmatched-ನಲ್ಲಿ ಕಾಣುತ್ತೆ."], "R4": ["ಫ್ಯಾಕ್ಟರಿ, ಸೇಲ್ಸ್", "PO ಡೇಟ್‌ನಿಂದ 15 ವರ್ಕಿಂಗ್ ಡೇ ಒಳಗೆ ಫ್ಯಾಕ್ಟರಿ ಪ್ರಶ್ನೆ ಕೇಳಬಹುದು. ಯಾವ ಪ್ರಶ್ನೆಯೂ ಬಾಕಿ ಇಲ್ಲದಿದ್ದಾಗ ಮಾತ್ರ ಪ್ರೊಡಕ್ಷನ್ ಶುರು."], "R5": ["ಫ್ಯಾಕ್ಟರಿ, ಸೇಲ್ಸ್", "ಫ್ಯಾಕ್ಟರಿ ಡೇಟ್: MFPL PO ಬಂದು 20 ದಿನದೊಳಗೆ ಫ್ಯಾಕ್ಟರಿ ಕ್ಲೈಂಟ್ ಡೇಟ್ ಒಪ್ಪಿಕೊಳ್ಳಬೇಕು, ಇಲ್ಲವೇ ತನ್ನ ಡೇಟ್ ಹೇಳಬೇಕು — ಒಂದು SKU-ಗೆ ಅಥವಾ ಇಡೀ PO-ಗೆ. ಸೇಲ್ಸ್ ಅದನ್ನ ಒಪ್ಪಿಕೊಳ್ಳುತ್ತೆ, ಇಲ್ಲವೇ ರಿಜೆಕ್ಟ್ ಮಾಡಿ ಬೇರೆ ಡೇಟ್ ಹೇಳುತ್ತೆ. ಫ್ಯಾಕ್ಟರಿ ಇನ್ನೊಂದು ಸಲ ಡೇಟ್ ಹೇಳಬಹುದು; ಅದಾದ ಮೇಲೆ ಸೇಲ್ಸ್ ಇಡೋ ಕೊನೆಯ ಡೇಟೇ ಫೈನಲ್. 20 ದಿನದಲ್ಲಿ ಉತ್ತರ ಬರದಿದ್ದರೆ ಕ್ಲೈಂಟ್ ಡೇಟ್‌ಗಿಂತ 5 ದಿನ ಮುಂಚಿನ ಡೇಟ್ ತಾನಾಗೇ ಬೀಳುತ್ತೆ."], "R6": ["ಎಲ್ಲರೂ", "ಎರಡು ಡೇಟ್‌ಗಳ ನಡುವೆ 5 ದಿನದ ಅಂತರ ಇದೆ: ಫ್ಯಾಕ್ಟರಿ ಡೇಟ್ + 5 ದಿನ = ಕ್ಲೈಂಟ್‌ಗೆ ಮಾಲು ತಲುಪಿಸೋ ಡೇಟ್. ಸೇಲ್ಸ್‌ಗೆ ಕ್ಲೈಂಟ್ ಡೇಟ್ ಕಾಣುತ್ತೆ, ಫ್ಯಾಕ್ಟರಿಗೆ ತನ್ನ ಡೇಟ್, ಸಪ್ಲೈ ಮತ್ತು ಅಡ್ಮಿನ್‌ಗೆ ಎರಡೂ."], "R7": ["ಫ್ಯಾಕ್ಟರಿ, ಸೇಲ್ಸ್", "ಫಿಕ್ಸ್ ಆದ ಫ್ಯಾಕ್ಟರಿ ಡೇಟ್ ಬದಲಾಯಿಸಬೇಕಾದರೆ: ಆ ಡೇಟ್‌ಗೆ 10 ದಿನ ಮುಂಚೆವರೆಗೆ ಫ್ಯಾಕ್ಟರಿ ಡೀವಿಯೇಷನ್ ಕೇಳಬಹುದು (ಒಂದು ಸಲಕ್ಕೆ ಒಂದೇ ರಿಕ್ವೆಸ್ಟ್). ಕೊನೆಯ 10 ದಿನ ಡೇಟ್ ಲಾಕ್ ಆಗಿರುತ್ತೆ. ಒಂದು SKU-ದ ಡೇಟ್ PO ಡೇಟ್‌ಗಿಂತ ತಡವಾಗಿರಬಹುದು: ಸೇಲ್ಸ್ ಒಪ್ಪಿದರೆ ಆ SKU ತನ್ನ ಡೇಟ್ ಪ್ರಕಾರ ಹೋಗುತ್ತೆ, PO-ದ ಬೇರೆ SKU-ಗಳಿಗೆ PO ಡೇಟೇ ಲಿಮಿಟ್. ಅಡ್ಮಿನ್ ಫ್ಯಾಕ್ಟರಿಗೆ ಇನ್ನೊಂದು ಡೀವಿಯೇಷನ್ ಕೇಳೋಕೆ ಅವಕಾಶ ಕೊಡಬಹುದು, ಕೊನೆಯ 10 ದಿನದಲ್ಲೂ; ಒಪ್ಪೋದು ಬಿಡೋದು ಆಗಲೂ ಸೇಲ್ಸ್‌ದೇ."], "R8": ["ಎಲ್ಲರೂ", "MFPL ಫ್ಯಾಕ್ಟರಿ PO-ಗಳಲ್ಲಿ ತಡ ಆಗೋ ಅಪಾಯ ತೋರಿಸುತ್ತೆ: ಕ್ಲೈಂಟ್ ಡೇಟ್ ತಪ್ಪುತ್ತೆ ಅಂತ ಕಂಡಾಗ; ಸ್ಟೇಜ್‌ಗಳು ಹಿಂದೆ ಇದ್ದಾಗ (30 / 15 / 7 ದಿನಕ್ಕಿಂತ ಕಡಿಮೆ ಉಳಿದಿದೆ, ಪಾಲಿಶಿಂಗ್, ಫ್ಯಾಕ್ಟರಿ QC ಅಥವಾ ಪ್ಯಾಕಿಂಗ್ ಶುರುವಾಗಿಲ್ಲ); ಜಾಬ್ ಕಾರ್ಡ್ Post Frame ಅಥವಾ ಅದರ ನಂತರ ತಲುಪಿದೆ ಆದರೆ ಬಟ್ಟೆ ಕಳಿಸಿಲ್ಲ; PO ಆಗಿ 15 ದಿನ ಆದರೂ ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲ; ಫ್ಯಾಕ್ಟರಿ ಡೇಟ್ PO-ಆದ 75 ದಿನಕ್ಕಿಂತ ಜಾಸ್ತಿ ಆಮೇಲೆ."], "R9": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ", "ಅಪ್ರೂವ್ ಆದ ಸ್ಟಾಕ್ ಬ್ಲಾಕ್ ಇದ್ದರೆ ಆ SKU-ಗೆ ಮಾಲು ಇದೆ ಅಂತ ತಗೊಳ್ಳುತ್ತೆ, PO ಬೇಕಿಲ್ಲ. ಅದೇ SO-ನಲ್ಲಿ ಅದೇ ಕೋಡ್ + FIN (ಉದಾ. AARA → AARAFIN) ಇರೋ PO ಲೈನ್ ಬಂದರೆ, ಬ್ಲಾಕ್ ಮೇಲೆ \"Issued to factory — FIN PO …\" ಅಂತ ಕಾಣುತ್ತೆ, ಅದನ್ನ ಬ್ಲಾಕ್ ಸ್ಟಾಕ್ ಅಂತ ಎಣಿಸಲ್ಲ, FIN ಲೈನ್ ಮಾಮೂಲಿ ಫ್ಯಾಕ್ಟರಿ ತರಹ ಹೋಗುತ್ತೆ. ಆ SKU Order Bridge ಮೂಲಕ ಕಸ್ಟಮರ್‌ಗೆ ಡಿಸ್ಪ್ಯಾಚ್ ಆದರೆ (dispatched ಮಾರ್ಕ್ ಆದರೆ), ಬ್ಲಾಕ್ ಮೇಲೆ ಡೇಟ್ ಜೊತೆ \"Dispatched to customer\" ಅಂತ ಕಾಣುತ್ತೆ, ಅದನ್ನ ಬ್ಲಾಕ್ ಸ್ಟಾಕ್ ಅಂತ ಎಣಿಸಲ್ಲ; ಸ್ವಲ್ಪ ಮಾತ್ರ ಡಿಸ್ಪ್ಯಾಚ್ ಆದರೆ ಉಳಿದದ್ದು ಬ್ಲಾಕ್ ಆಗೇ ಇರುತ್ತೆ."], "R10": ["ಫ್ಯಾಕ್ಟರಿ, ಸಪ್ಲೈ", "ಸ್ಕ್ಯಾನ್ ಮಾಡಿದ ಜಾಬ್ ಕಾರ್ಡ್ ಚೆಕ್ ಮಾಡದೆ ಸೇವ್ ಆಗಲ್ಲ. ಪ್ರತಿ ಫೀಲ್ಡ್ ಅನ್ನು ಫೋಟೋ ಜೊತೆ ಹೋಲಿಸಿ ನೋಡಿ, ಮುಖ್ಯವಾಗಿ ಹಳದಿ ಬಣ್ಣದಲ್ಲಿ ಇರೋವು. ಅದೇ ಕಾರ್ಡ್‌ನ ಫೋಟೋ ಮತ್ತೆ ತೆಗೆದರೆ ಅದೇ ಕಾರ್ಡ್ ಅಪ್‌ಡೇಟ್ ಆಗುತ್ತೆ; ಮುಂಚೆ ಸೇವ್ ಮಾಡಿದ ಡೇಟ್‌ಗಳು, ಸೈನ್‌ಗಳು ಹೋಗಲ್ಲ."], "R11": ["ಎಲ್ಲರೂ", "PO Progress Tracker ಮತ್ತು Order Deadlines-ನಲ್ಲಿ ಕಾಣೋ ಜಾಬ್ ಕಾರ್ಡ್ ಸ್ಟೇಜ್: ಶುರುವಾದ ಡೇಟ್, ಮುಗಿದ ಡೇಟ್ ಮತ್ತು ಕನಿಷ್ಠ ಒಂದು ಸೈನ್ — ಈ ಮೂರೂ ಇರೋ ಕೊನೆಯ ಸ್ಟೇಜ್."], "R12": ["ಸಪ್ಲೈ, ಸೇಲ್ಸ್", "ಫ್ಯಾಕ್ಟರಿ ಮಾಡಿದ ಫರ್ನಿಚರ್ SKU ಡಿಸ್ಪ್ಯಾಚ್ ಅಥವಾ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಸ್ಲಾಟ್‌ಗೆ ರೆಡಿ ಆಗೋದು ಸಪ್ಲೈ Order Deadlines ನಲ್ಲಿ \"QC report generated\" ಟಿಕ್ ಮಾಡಿದಾಗ ಮತ್ತು ಜಾಬ್ ಕಾರ್ಡ್‌ನಲ್ಲಿ ಪ್ಯಾಕಿಂಗ್ ಮುಗಿದಿದ್ದಾಗ ಮಾತ್ರ. ಜಾಬ್ ಕಾರ್ಡ್‌ನ Factory-QC ಸ್ಟೇಜ್‌ಗೆ ಶುರುವಾದ ದಿನಾಂಕ ಹಾಕಿದ ಕೂಡಲೇ ಟಿಕ್ ತೆರೆಯುತ್ತೆ. ವೇರ್‌ಹೌಸ್ ಟ್ಯಾಗ್‌ಗಳಿಗೂ ಇದೇ ನಿಯಮ. ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲದ SKU ಅನ್ನು ಸಪ್ಲೈ ಟಿಕ್ ಮಾಡುವಂತಿಲ್ಲ; ಅಡ್ಮಿನ್ ಕಾರಣ ಬರೆದು ಟಿಕ್ ಮಾಡಬಹುದು."], "R13": ["ಸಪ್ಲೈ, ಫ್ಯಾಕ್ಟರಿ", "ಫರ್ನಿಶಿಂಗ್ ಮತ್ತು ವೇರ್‌ಹೌಸ್ ಟ್ಯಾಗ್ ಪೂರ್ತಿಯಾಗಿ ಮಾತ್ರ ಮುಂದೆ ಹೋಗುತ್ತೆ — ಅರ್ಧ ಕ್ವಾಂಟಿಟಿ ಆಗಲ್ಲ. ಚಲನ್ ಮತ್ತು ರಸೀದಿ ನಂಬರ್‌ಗಳನ್ನು ಆ್ಯಪ್ ತಾನೇ ಮಾಡುತ್ತೆ; ಚಲನ್ ಮತ್ತೆ ಪ್ರಿಂಟ್ ಬೇಕಾದರೆ Logbook-ನಿಂದ ತೆಗೆಯಿರಿ."], "R14": ["ಸಪ್ಲೈ, ಅಡ್ಮಿನ್", "Dispatch Day-ದ ಚೆಕ್‌ಗಳೆಲ್ಲ ಮುಗಿಯೋವರೆಗೆ \"Mark dispatched\" ಲಾಕ್ ಆಗಿರುತ್ತೆ. ಅಡ್ಮಿನ್ ಮಾತ್ರ ಓವರ್‌ರೈಡ್ ಮಾಡಬಹುದು, 3 ಅಥವಾ ಜಾಸ್ತಿ ಪದಗಳ ಕಾರಣ ಬರೆದು; ಅದು ರೆಕಾರ್ಡ್‌ಗೆ ಹೋಗುತ್ತೆ. Dispatch Day ಕೆಲಸ ಡಿಸ್ಪ್ಯಾಚ್ ಡೇಟ್‌ಗೆ 48 ಗಂಟೆ ಮುಂಚೆ ಬರುತ್ತೆ; ಚೆಕ್‌ಗಳನ್ನು ಅದಕ್ಕೂ ಮುಂಚೆ ಮಾಡಬಹುದು."], "R15": ["ಸೇಲ್ಸ್, COO / ಡೈರೆಕ್ಟರ್, ಅಕೌಂಟ್ಸ್", "ಡಿಸ್ಪ್ಯಾಚ್ ಟೈಮ್‌ನಲ್ಲಿ ₹1-ಕ್ಕಿಂತ ಜಾಸ್ತಿ ಬಾಕಿ ಇದ್ದರೆ COO / ಡೈರೆಕ್ಟರ್ ಅಪ್ರೂವ್ ಮಾಡಬೇಕು. ಲಿಂಕ್ 48 ಗಂಟೆ ಮಾತ್ರ; ರಿಜೆಕ್ಟ್ ಮಾಡಬೇಕಾದರೆ ಕಮೆಂಟ್ ಬರೆಯಬೇಕು; ಆಮೇಲೆ ಅಕೌಂಟ್ಸ್ ಚೆಕ್ ಮಾಡಿ ಕನ್ಫರ್ಮ್ ಮಾಡುತ್ತೆ. ಬಾಕಿ ಹಣ ಅಪ್ರೂವ್ ಆದ ಹಣಕ್ಕಿಂತ ಜಾಸ್ತಿ ಆದರೆ ಮತ್ತೆ ಅಪ್ರೂವಲ್ ಬೇಕು."], "R16": ["ಅಕೌಂಟ್ಸ್", "ಸಪ್ಲೈಯ ERP ನಂಬರ್‌ಗಳು ಬಂದು ಪೇಮೆಂಟ್ ಮುಗಿದರೆ ಇನ್‌ವಾಯ್ಸ್, ಇ-ವೇ ಬಿಲ್ ಸ್ಟೆಪ್ ತೆರೆಯುತ್ತೆ. ಮುಗಿದಿದೆ ಅಂದರೆ: ಪೂರ್ತಿ ಹಣ ಬಂದು ಕನ್ಫರ್ಮ್ ಆಗಿದೆ; ಅಥವಾ ಏನೂ ಬಂದಿಲ್ಲ ಆದರೆ ಅಪ್ರೂವಲ್ ಚೆಕ್ ಆಗಿದೆ; ಅಥವಾ ಸ್ವಲ್ಪ ಬಂದು ಕನ್ಫರ್ಮ್ ಆಗಿದೆ, ಬಾಕಿಗೆ ಅಪ್ರೂವಲ್ ಚೆಕ್ ಆಗಿದೆ. ಇನ್‌ವಾಯ್ಸ್ ನಂಬರ್ ಯಾವಾಗಲೂ ಬೇಕು. ಇ-ವೇ ಬಿಲ್ 12 ಅಂಕಿ ಇರಬೇಕು, ಇಲ್ಲವೇ ಕಾರಣ ಬರೆದು \"Not required\" ಆರಿಸಿ."], "R17": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ", "ಬ್ಲಾಕ್ ಮಾಡಿದ ಡೇಟ್‌ಗಳಲ್ಲಿ ಡಿಸ್ಪ್ಯಾಚ್ ಅಥವಾ ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಕೇಳೋಕೆ ಆಗಲ್ಲ; Slot settings-ನಲ್ಲಿ ಇಟ್ಟಿರೋ ಟೈಮ್‌ನಲ್ಲಿ ಮಾತ್ರ. ಕ್ಲೈಂಟ್ ಡೇಟ್ ಆದ ಮೇಲೆ ಡಿಸ್ಪ್ಯಾಚ್ ಮಾಡೋಕೆ ಕಾರಣ ಬೇಕು. ಟ್ರ್ಯಾಕಿಂಗ್ ಲಿಂಕ್‌ಗೆ ಲಿಂಕ್ ಅಥವಾ NA ಹಾಕಬಹುದು; ಲಿಂಕ್ ಇಲ್ಲದಿದ್ದರೆ ಟ್ರಾನ್ಸ್‌ಪೋರ್ಟ್ POC ವಿವರ ಹಾಕಿ."], "R18": ["ಸೇಲ್ಸ್, ಕಸ್ಟಮರ್", "ಪ್ರತಿ ಸೈಟ್ ಡೀಟೇಲ್ಸ್ ಲಿಂಕ್ ಒಂದು SO-ಗೆ ಮಾತ್ರ. ಪ್ರತಿ ಪೀಸ್ ಅನ್ನು ಎಲ್ಲಾ ಕಡೆ 5 ಇಂಚು ಜಾಸ್ತಿ ಮಾಡಿ ನೋಡ್ತಾರೆ: ಲಿಫ್ಟ್ ಇದ್ದರೆ ಲಿಫ್ಟ್ ಜೊತೆ, ಲಿಫ್ಟ್ ಇಲ್ಲದಿದ್ದರೆ ಮೆಟ್ಟಿಲು ಜೊತೆ (ಅತಿ ಚಿಕ್ಕ ಬದಿ ಮೆಟ್ಟಿಲಿನ ಅಗಲದಲ್ಲಿ ಹೋಗಬೇಕು, ಮತ್ತು ಪೀಸ್ ಲ್ಯಾಂಡಿಂಗ್‌ನ ಉದ್ದ, ಅಗಲ, ಎತ್ತರದೊಳಗೆ ಹಿಡಿಸಬೇಕು). ಹಿಡಿಸದ ಪೀಸ್‌ಗೆ 3 ಅಥವಾ ಜಾಸ್ತಿ ಪದಗಳ ಓವರ್‌ರೈಡ್ ಕಾರಣ ಬೇಕು."], "R19": ["ಎಲ್ಲರೂ", "ಪೇಜ್ ತಾನಾಗೇ ಅಪ್‌ಡೇಟ್ ಆಗುತ್ತೆ: ಬೇರೆಯವರ ಬದಲಾವಣೆಗಳು 2 ನಿಮಿಷದೊಳಗೆ ಬರುತ್ತವೆ, ಟ್ಯಾಬ್‌ಗೆ ವಾಪಸ್ ಬಂದ ತಕ್ಷಣವೂ. ನೀವು ಟೈಪ್ ಮಾಡ್ತಾ ಇದ್ದರೆ ಅದು ಕಾಯುತ್ತೆ. ಹೊಸ ERP ಡೇಟಾ ಬಂದರೆ, ಅಥವಾ ಬೇರೆಯವರು PO ರಿಕ್ವೆಸ್ಟ್ ಸೇರಿಸಿದರೆ ಅಥವಾ ಲಿಂಕ್ ಮಾಡಿದರೆ, ರಿಫ್ರೆಶ್ ಮಾಡೋಕೆ ಒಂದು ಬಾರ್ ಕಾಣುತ್ತೆ. ನೀವು ನೋಡೋ ERP ಡೇಟಾ ಕೊನೆಯ ಅಪ್‌ಲೋಡ್ ದಿನದ್ದು. CSV ಡೌನ್‌ಲೋಡ್ ಮಾಡಿದಾಗ SO, PO ನಂಬರ್‌ಗಳ ಅಂಕಿಗಳೆಲ್ಲ Excel-ನಲ್ಲಿ ಸರಿಯಾಗಿ ಬರುತ್ತವೆ."], "R20": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ, ಅಕೌಂಟ್ಸ್, COO / ಡೈರೆಕ್ಟರ್", "SO ರಿವಿಷನ್‌ಗೆ ಮೊದಲು COO / ಡೈರೆಕ್ಟರ್ ಅಪ್ರೂವಲ್ ಬೇಕು. ಆಮೇಲೆ ಅಕೌಂಟ್ಸ್ ಆರ್ಡರ್ ಹಣ ಮತ್ತು ಅಡ್ವಾನ್ಸ್ ಹೋಲಿಸಿ ಅಪ್ರೂವ್ ಮಾಡುತ್ತೆ (ಹೊಸ SO ERP-ಯಲ್ಲಿ ಆಗುತ್ತೆ). ಆಮೇಲೆ ಸಪ್ಲೈ PO ಕ್ಯಾನ್ಸಲ್ ಆಗಿದೆ ಅಂತ ಕನ್ಫರ್ಮ್ ಮಾಡುತ್ತೆ. ಸಪ್ಲೈ ಕನ್ಫರ್ಮ್ ಮಾಡೋವರೆಗೆ ರಿವಿಷನ್ ಓಪನ್ ಆಗಿರುತ್ತೆ."], "R21": ["ಎಲ್ಲರೂ", "2 ನವೆಂಬರ್ 2026ಕ್ಕಿಂತ ಮುಂಚೆ ಆದ PO-ಗಳು: ಅವುಗಳ SKU ವಿವರ ಇಮೇಲ್‌ನಲ್ಲಿ ಕೊಟ್ಟಿದ್ದು, ಅದಕ್ಕೇ "], "R25": ["ಸೇಲ್ಸ್, SO ಅಪ್ರೂವರ್, COO / ಡೈರೆಕ್ಟರ್, ಅಕೌಂಟ್ಸ್", "ಪ್ರತಿ ಹೊಸ SO ಮುಂದೆ ಹೋಗೋ ಮುಂಚೆ SO Approval Request ಮೂಲಕ ಹೋಗಬೇಕು. ಸೇಲ್ಸ್ ERP-ಯಿಂದ ಡ್ರಾಫ್ಟ್ SO PDF ಅಪ್‌ಲೋಡ್ ಮಾಡುತ್ತೆ — ಅದರ ನಂಬರ್‌ಗಳನ್ನ Order Bridge-ನಲ್ಲಿ ಟೈಪ್ ಮಾಡೋಕೆ, ಬದಲಾಯಿಸೋಕೆ ಆಗಲ್ಲ. ಡಿಸ್ಕೌಂಟ್ (ಡಿಸ್ಕೌಂಟ್ ಇರೋ ಲೈನ್‌ಗಳ ಮೇಲೆ): ಸೇಲ್ಸ್ ಲಿಮಿಟ್ ಒಳಗೆ ಇದ್ದರೆ ಓಕೆ; SO ಅಪ್ರೂವರ್ ಲಿಮಿಟ್ ಒಳಗೆ ಇದ್ದರೆ SO ಅಪ್ರೂವರ್; ಅದಕ್ಕಿಂತ ಜಾಸ್ತಿ ಆದರೆ COO / ಡೈರೆಕ್ಟರ್. ಫ್ರೈಟ್: SO-ನಲ್ಲಿ ಫ್ರೈಟ್ ಲೈನ್ ಇರಬೇಕು, ಅದು ರೆಡಿ ರೆಕನರ್ ರೇಟ್‌ಗಿಂತ ಕಮ್ಮಿ ಇರಬಾರದು (ಸ್ಟೋರ್, ಡೆಲಿವರಿ PIN-ನ ದೂರ, ಫರ್ನಿಚರ್ ಪೀಸ್ ಸಂಖ್ಯೆ; ದೊಡ್ಡ ಬ್ಯಾಂಡ್‌ಗಿಂತ ಜಾಸ್ತಿ ಪೀಸ್ ಇದ್ದರೆ ಎಕ್ಸ್‌ಟ್ರಾ ಟ್ರಕ್); ಇಲ್ಲದಿದ್ದರೆ, ಕಮ್ಮಿ ಇದ್ದರೆ, ಅಥವಾ ಸಿಟಿ ಲಿಮಿಟ್ ಆಚೆ ಇದ್ದರೆ COO / ಡೈರೆಕ್ಟರ್. ಅಡ್ವಾನ್ಸ್: ಫ್ರೈಟ್ ಸೇರಿ ಬೇಸಿಕ್ ವ್ಯಾಲ್ಯೂನ ಕನಿಷ್ಠ % (70%), ಇಲ್ಲದಿದ್ದರೆ COO / ಡೈರೆಕ್ಟರ್. ಒಂದೇ ರಿಕ್ವೆಸ್ಟ್ ಬೇಕಾದ ಅತಿ ಹಿರಿಯ ಅಪ್ರೂವರ್‌ಗೆ ಹೋಗುತ್ತೆ; ಅವರು ಪ್ರತಿ ಐಟಮ್ ಬೇರೆ ಬೇರೆ ನಿರ್ಧರಿಸುತ್ತಾರೆ. ಎಲ್ಲಾ ಅಪ್ರೂವಲ್ ಬಂದು, ಎಲ್ಲಾ ಪೇಮೆಂಟ್ ಬಂದಿದೆ ಅಂತ ಟಿಕ್ ಆದಮೇಲೆ ಮಾತ್ರ ಅಕೌಂಟ್ಸ್ ಕನ್ಫರ್ಮ್ ಮಾಡುತ್ತೆ. ಲಿಮಿಟ್, ರೇಟ್, PIN ಬ್ಯಾಂಡ್ ಎಲ್ಲಾ ಅಡ್ಮಿನ್ ಸೆಟ್ ಮಾಡುತ್ತಾರೆ."], "R26": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ, ಅಡ್ಮಿನ್", "ಬುಕಿಂಗ್ ಬದಲಾವಣೆ: ಸಪ್ಲೈ ಇನ್ನೂ ಅಪ್ರೂವ್ ಮಾಡದ ಬುಕಿಂಗ್ ಅನ್ನ ಸೇಲ್ಸ್ ತಾವೇ ಬದಲಾಯಿಸಬಹುದು; ಅಪ್ರೂವ್ ಆದ ಬುಕಿಂಗ್‌ಗೆ ಸೇಲ್ಸ್ ಕೇಳುತ್ತೆ, ಸಪ್ಲೈ ಓಕೆ ಅಥವಾ ಬೇಡ ಅನ್ನುತ್ತೆ — ಅಲ್ಲಿವರೆಗೆ ಏನೂ ಬದಲಾಗಲ್ಲ. ಸಪ್ಲೈ ಮತ್ತು ಅಡ್ಮಿನ್ ನೇರವಾಗಿ ಬದಲಾಯಿಸಬಹುದು. ಡಿಸ್ಪ್ಯಾಚ್ ಆದಮೇಲೆ ಬದಲಾವಣೆ ಇಲ್ಲ. ಪ್ರತಿ ಬದಲಾವಣೆಗೆ ಕಾರಣ ಬೇಕು, ಹೊಸ ಡೇಟ್‌ನಲ್ಲಿ ಜಾಗ ಇದೆಯಾ ಅಂತ ಚೆಕ್ ಆಗುತ್ತೆ, ಹಿಸ್ಟರಿ ಬುಕಿಂಗ್ ಮೇಲೆ ಇರುತ್ತೆ. ತಪ್ಪಾಗಿ ಹಾಕಿದ ಸ್ಟೇಟಸ್ ಅನ್ನ ಕಾರಣ ಕೊಟ್ಟು Undo ಮಾಡಬಹುದು: ಸಪ್ಲೈ 24 ಗಂಟೆ ಒಳಗೆ, ಅಡ್ಮಿನ್ ಯಾವಾಗ ಬೇಕಾದರೂ; Delivered ಅನ್ನ Undo ಮಾಡೋದು ಅಡ್ಮಿನ್ ಮಾತ್ರ."], "R27": ["ಅಡ್ಮಿನ್", "Delivery Challan-ನ From / To ಅನ್ನ, ಅದರ ಯಾವ ಟ್ಯಾಗೂ ರಿಸೀವ್ ಆಗದಿದ್ದಾಗ ಮಾತ್ರ ಅಡ್ಮಿನ್ ಸರಿಪಡಿಸಬಹುದು. ಚಲನ್ ನಂಬರ್ ಅದೇ ಇರುತ್ತೆ, Revised ಅಂತ ಬರುತ್ತೆ, ರೀಪ್ರಿಂಟ್‌ನಲ್ಲಿ ಏನು ಬದಲಾಯ್ತು ಅಂತ ಇರುತ್ತೆ. ರಿಸೀವ್ ಆದಮೇಲೆ: ವಾಯ್ಡ್ ಮಾಡಿ ಮತ್ತೆ ಲಾಗ್ ಮಾಡಿ."], "R28": ["ಅಡ್ಮಿನ್", "Open SOs ಲಿಸ್ಟ್‌ನಲ್ಲಿ ಇಲ್ಲದ SO-ಗಳೆಲ್ಲ ಬಿಟ್ಟುಹೋಗುತ್ತವೆ. ಅಡ್ಮಿನ್ ಕಾರಣ ಕೊಟ್ಟು ಬೇಕಾದ SO-ಗಳನ್ನ ಇಟ್ಟುಕೊಳ್ಳಬಹುದು; PI Revenue Report-ನಲ್ಲಿ ಇಲ್ಲದ SO-ಗೆ PO Summary-ಯಿಂದ ಬೇಸಿಕ್ ಸಾಲು ಸಿಗುತ್ತೆ. Open SOs ಲಿಸ್ಟ್ ಮತ್ತು PI Revenue Report ಎರಡರಲ್ಲೂ ಬಂದಮೇಲೆ ಅದು Keep ಲಿಸ್ಟ್‌ನಿಂದ ತಾನೇ ಹೋಗುತ್ತೆ."], "R29": ["ಎಲ್ಲರೂ", "ಯಾರು ಯಾವ ಪೇಜ್ ತೆರೆದರು, ಎಷ್ಟು ಹೊತ್ತು ಅಂತ Order Bridge ರೆಕಾರ್ಡ್ ಮಾಡುತ್ತೆ (ಟೈಪ್ ಮಾಡಿದ್ದನ್ನ ಎಂದೂ ಅಲ್ಲ). Usage-ನಲ್ಲಿ ಅಡ್ಮಿನ್‌ಗೆ ಮಾತ್ರ ಕಾಣುತ್ತೆ; 90 ದಿನ ಇಟ್ಟಿರುತ್ತೆ."], "R30": ["ಸೇಲ್ಸ್, ಸಪ್ಲೈ, ಫ್ಯಾಕ್ಟರಿ", "ಕ್ಲೈಂಟ್ ಶೀಟ್‌ನಲ್ಲಿ ಕ್ಲೈಂಟ್ ಕನ್ಫರ್ಮ್ ಮಾಡಬೇಕಾದದ್ದು ಮಾತ್ರ ಇರುತ್ತೆ: ಆರ್ಟಿಕಲ್, ಕ್ವಾಂಟಿಟಿ, ಫ್ಯಾಬ್ರಿಕ್, ಫಿನಿಶ್, ಕೇನ್, ಸ್ಟೋನ್, ಡಿಸೈನ್, ಸೈಟ್ ವರ್ಕ್, ಸೈಟ್ ಮ್ಯಾಪಿಂಗ್, ನೋಟ್ಸ್ ಮತ್ತು ಸೇಲ್ಸ್ ಟಿಕ್ ಮಾಡಿದ ಕ್ಲ್ಯಾರಿಫಿಕೇಶನ್‌ಗಳು. ಬೆಲೆ, ಡೇಟ್, PO ನಂಬರ್ ಅಥವಾ ಒಳಗಿನವರ ಹೆಸರು ಎಂದಿಗೂ ಇರಲ್ಲ. “Client confirmed” ಕಡ್ಡಾಯ ಅಲ್ಲ: ಡೇಟ್ ಮತ್ತು ಕನ್ಫರ್ಮೇಶನ್ ಎಲ್ಲಿದೆ ಅಂತ ದಾಖಲಿಸುತ್ತೆ (ಫೈಲ್ ಇಡಲ್ಲ), ಎಲ್ಲರಿಗೂ PO ಲೈನ್‌ನಲ್ಲಿ ಕಾಣುತ್ತೆ. ಆಮೇಲೆ ಈ ವಿವರಗಳಲ್ಲಿ ಯಾವುದಾದರೂ ಬದಲಾದರೆ, ಸೇಲ್ಸ್ ಮತ್ತೆ ಕನ್ಫರ್ಮ್ ಮಾಡಿಸೋವರೆಗೆ “Changed since client confirmed” ಮತ್ತು ಏನು ಬದಲಾಯಿತು ಅಂತ ತೋರಿಸುತ್ತೆ. ಕ್ಲ್ಯಾರಿಫಿಕೇಶನ್ ಉತ್ತರ ಕ್ಲೈಂಟ್‌ಗೆ ತೋರಿಸಬಹುದು, ಹಾಗಾಗಿ ಕ್ಲೈಂಟ್‌ಗೆ ಬರೆಯೋ ಹಾಗೆ ಬರೆಯಿರಿ."], "R31": ["ಸೇಲ್ಸ್, SO ಅಪ್ರೂವರ್, COO / ಡೈರೆಕ್ಟರ್, ಅಕೌಂಟ್ಸ್", "ಆರ್ಕಿಟೆಕ್ಟ್, ಡಿಸೈನರ್ ಅಥವಾ ಮಧ್ಯವರ್ತಿಗೆ ಕೊಡುವ ಪ್ರತಿಯೊಂದು ಕಮಿಷನ್‌ಗೂ ಅಪ್ರೂವಲ್ ಬೇಕು: ಅಡ್ಮಿನ್ ಇಟ್ಟ ಮಿತಿಯವರೆಗೆ SO ಅಪ್ರೂವರ್, ಅದಕ್ಕಿಂತ ಹೆಚ್ಚಾದರೆ (ಅಥವಾ ಮಿತಿ ಇಟ್ಟಿಲ್ಲದಿದ್ದರೆ) COO / ಡೈರೆಕ್ಟರ್. ಡಿಸ್ಕೌಂಟ್ ನಂತರದ GST-ಗೆ ಮುಂಚಿನ ಮೌಲ್ಯದ ಮೇಲೆ, ಫ್ರೈಟ್ ಬಿಟ್ಟು ಲೆಕ್ಕ ಹಾಕುತ್ತೆ; ಅಪ್ರೂವರ್‌ಗೆ ಡಿಸ್ಕೌಂಟ್ + ಕಮಿಷನ್ ಒಟ್ಟಿಗೆ ಕಾಣುತ್ತೆ. ಅಪ್ರೂವಲ್ ನಂತರ ಮೊತ್ತ ಅಥವಾ ಯಾರಿಗೆ ಅಂತ ಬದಲಾದರೆ ಮತ್ತೆ ಅಪ್ರೂವಲ್ ಬೇಕು. ಬ್ಯಾಂಕ್ ಅಕೌಂಟ್ ಮತ್ತು PAN ಪೂರ್ತಿ ಕಾಣೋದು ಅಕೌಂಟ್ಸ್, ಅಡ್ಮಿನ್ ಮತ್ತು ಅದನ್ನು ಹಾಕಿದವರಿಗೆ ಮಾತ್ರ. ಹೊಸ ಅಥವಾ ಬದಲಾದ ಬ್ಯಾಂಕ್ ವಿವರ, ಹಾಕಿದವರಲ್ಲದ ಬೇರೆ ಅಕೌಂಟ್ಸ್ ವ್ಯಕ್ತಿ ಚೆಕ್ ಮಾಡೋವರೆಗೆ “Unverified” ಆಗಿರುತ್ತೆ — unverified ವಿವರಕ್ಕೆ ಎಂದಿಗೂ ಪಾವತಿ ಮಾಡಬೇಡಿ; ಇದು SO ಕನ್ಫರ್ಮ್ ಮಾಡೋದನ್ನು ತಡೆಯಲ್ಲ. ರಿವೈಸ್ಡ್ SO ಯಾವುದಾದರೂ SO Revision ರಿಕ್ವೆಸ್ಟ್‌ನಲ್ಲಿ ಇರಬೇಕು, ಮತ್ತು COO / ಡೈರೆಕ್ಟರ್ ಆ ರಿವಿಷನ್ ಅಪ್ರೂವ್ ಮಾಡೋವರೆಗೆ ಅಕೌಂಟ್ಸ್ ಕನ್ಫರ್ಮ್ ಮಾಡೋಕಾಗಲ್ಲ."]}, "man": {"sales": {"day": ["Dashboard ತೆರೆಯಿರಿ: ನಿಮ್ಮ ಕೆಲಸಗಳು \"Needs action\"-ನಲ್ಲಿ ಇರುತ್ತವೆ; ಬೆಲ್ ಐಕಾನ್‌ನಲ್ಲಿ ಸೂಚನೆಗಳೂ ಕಾಣುತ್ತವೆ — ಉದಾ. ಬಟ್ಟೆ ಫ್ಯಾಕ್ಟರಿಗೆ ಕಳಿಸಿದ್ದಾರೆ, ಅಥವಾ ಅಲ್ಲಿಗೆ ತಲುಪಿದೆ.", "PO Progress Tracker-ನಲ್ಲಿ ಹೊಸ SO-ಗಳನ್ನು ನೋಡಿ ಅವುಗಳ SKU-ಗಳನ್ನು PO-ಗೆ ಕಳಿಸಿ.", ]}, {"id": "f-jc", "t": "ಜಾಬ್ ಕಾರ್ಡ್ ಫೋಟೋ ತೆಗೆಯಿರಿ", "when": "ಪ್ರೊಡಕ್ಷನ್ ಶುರುವಾದಾಗ, ಆಮೇಲೆ ಇನ್ನಷ್ಟು ಸ್ಟೇಜ್ ತುಂಬಿದಾಗಲೆಲ್ಲ.", "steps": ["⟦Take photo⟧ (ಅಥವಾ ⟦Upload image⟧) ಒತ್ತಿ. ಕಾರ್ಡ್ ಪೂರ್ತಿ ಬರೋ ಹಾಗೆ, ಚಪ್ಪಟೆಯಾಗಿಟ್ಟು, ಒಳ್ಳೆ ಬೆಳಕಿನಲ್ಲಿ ಫೋಟೋ ತೆಗೆಯಿರಿ.", "ಓದೋಕೆ ಕೆಲವು ಸೆಕೆಂಡ್ ಕಾಯಿರಿ. ಆಮೇಲೆ ಪ್ರತಿ ಫೀಲ್ಡ್ ಅನ್ನು ಫೋಟೋ ಜೊತೆ ಹೋಲಿಸಿ ನೋಡಿ, ಮುಖ್ಯವಾಗಿ ಹಳದಿ ಗೆರೆ ಇರೋವು.", "ಕಾರ್ಡ್ ಅನ್ನು ಅದರ PO ಲೈನ್‌ಗೆ ಸೇರಿಸಿ (PO ನಂಬರ್, ಕಸ್ಟಮರ್ ಅಥವಾ ಆರ್ಟಿಕಲ್‌ನಿಂದ ಹುಡುಕಬಹುದು).", "ಸೇವ್ ಮಾಡಿ. ಆಮೇಲೆ ಅದೇ ಕಾರ್ಡ್‌ನ ಫೋಟೋ ಮತ್ತೆ ತೆಗೆಯಬಹುದು: ಅದು ಅದೇ ಕಾರ್ಡ್ ಅಪ್‌ಡೇಟ್ ಮಾಡುತ್ತೆ, ಹೊಸ ಕಾರ್ಡ್ ಮಾಡಲ್ಲ.", "ಶುರುವಾದ ಡೇಟ್, ಮುಗಿದ ಡೇಟ್ ಮತ್ತು ಕನಿಷ್ಠ ಒಂದು ಸೈನ್ — ಮೂರೂ ಇದ್ದರೆ ಮಾತ್ರ ಆ ಸ್ಟೇಜ್ ಮುಗಿದಿದೆ ಅಂತ ತಗೊಳ್ಳುತ್ತೆ.", "ರಾ ಮೆಟೀರಿಯಲ್: ಕಾರ್ಡ್‌ನ Material Used ಟೇಬಲ್‌ನಲ್ಲಿ ಒಂದು ಸಾಲು ಬರೆಯಿರಿ — \"RM Available\" ಅಥವಾ \"RM Not Available\". ಬದಲಾದರೆ ಹಳೆಯ ಸಾಲು ಹೊಡೆದು ಕೆಳಗೆ ಹೊಸದು ಬರೆಯಿರಿ. ಟಿಕ್ ಕೊನೆಯ ಸಾಲಿನ ಪ್ರಕಾರ ಬರುತ್ತೆ; ಸೇವ್ ಮಾಡೋ ಮೊದಲು ನೋಡಿ."]}, {"id": "f-cat", "t": "ಮೆಟೀರಿಯಲ್ ರೆಡಿನೆಸ್ ನೋಡಿ (C0–C4)", "when": "ದಿನಾ, ಸಪ್ಲೈ ಜೊತೆ.", "steps": ["⟦Mine · Factory to act⟧ ಒತ್ತಿ: ಫ್ಯಾಕ್ಟರಿ ಮೇಲೆ ನಿಂತಿರೋ ಲೈನ್‌ಗಳು ಕಾಣುತ್ತವೆ — ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲ, ರಾ ಮೆಟೀರಿಯಲ್ ಕನ್ಫರ್ಮ್ ಆಗಿಲ್ಲ, ಅಥವಾ ಬಟ್ಟೆ ಬಂತು ಅಂತ ಕನ್ಫರ್ಮ್ ಮಾಡಬೇಕು.", "ಸೇಲ್ಸ್ ಆರ್ಡರ್ ತೆರೆದರೆ ಪ್ರತಿ ಲೈನ್‌ನ ಜಾಬ್ ಕಾರ್ಡ್, ರಾ ಮೆಟೀರಿಯಲ್ (ಸ್ಕ್ಯಾನ್ ಡೇಟ್ ಜೊತೆ), ಬಟ್ಟೆ ಮತ್ತು ಕೆಟಗರಿ ಕಾಣುತ್ತೆ. ನಿಮ್ಮ ಭಾಗ ಮುಗಿಸಿ; ಸಪ್ಲೈಗೂ ಇದೇ ಕಾಣುತ್ತೆ."]}, {"id": "f-fr", "t": "ಫರ್ನಿಶಿಂಗ್ ಬಂತು ಅಂತ ಕನ್ಫರ್ಮ್ ಮಾಡಿ", "when": "ಫರ್ನಿಶಿಂಗ್ ಚಲನ್ ಬಂದಾಗ.", "steps": ["ಪ್ರತಿ ಟ್ಯಾಗ್ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ (⟦Scan a tag⟧), ಅಥವಾ ಟ್ಯಾಗ್ ID ಟೈಪ್ ಮಾಡಿ ⟦Look up⟧ ಒತ್ತಿ.", "\"Received at\" ಸರಿ ಇದೆಯಾ ನೋಡಿ (ಚಲನ್‌ನಲ್ಲಿ ತಲುಪಬೇಕಾದ ಜಾಗವೇ ಮೊದಲು ಬರುತ್ತೆ) ಕನ್ಫರ್ಮ್ ಮಾಡಿ. ಸೇಲ್ಸ್‌ಗೆ ಸೂಚನೆ ಹೋಗುತ್ತೆ."]}, {"id": "f-wt", "t": "ರೆಡಿ ಆದ ಮಾಲಿಗೆ ಟ್ಯಾಗ್ ಹಾಕಿ", "when": "ಪೀಸ್ ಪ್ಯಾಕ್ ಆದ ಮೇಲೆ, ಮತ್ತು ಸಪ್ಲೈ ಅದರ QC ರಿಪೋರ್ಟ್ ಟಿಕ್ ಮಾಡಿದ ಮೇಲೆ.", "steps": ["PO ನಂಬರ್ ಹಾಕಿ Article SKU ಆರಿಸಿ (SO ಮತ್ತು ಕಸ್ಟಮರ್ ತಾನಾಗೇ ಬರುತ್ತವೆ).", "QC ರಿಪೋರ್ಟ್ ಇನ್ನೂ ಕನ್ಫರ್ಮ್ ಆಗಿಲ್ಲ ಅಂತ ಸ್ಕ್ರೀನ್ ಹೇಳಿದರೆ, ಮೊದಲು Order Deadlines-ನಲ್ಲಿ ಟಿಕ್ ಮಾಡೋಕೆ ಸಪ್ಲೈಗೆ ಹೇಳಿ.", "ಈ ಪೀಸ್‌ನ ಎಷ್ಟು ಪ್ಯಾಕೆಟ್ ಅಂತ ಹಾಕಿ. ಇನ್‌ಸ್ಟಾಲೇಶನ್ ಬೇಕಿದ್ದರೆ \"needs installation\" ಟಿಕ್ ಮಾಡಿ.", "⟦Generate tag & log intake⟧ ಒತ್ತಿ, ಆಮೇಲೆ ⟦Print⟧."]}, {"id": "f-wd", "t": "ರೆಡಿ ಆದ ಮಾಲು ವೇರ್‌ಹೌಸ್‌ಗೆ ಕಳಿಸಿ", "when": "ಪ್ರತಿ ಲೋಡ್‌ಗೂ.", "steps": ["ಈ ಲೋಡ್‌ನಲ್ಲಿ ಹೋಗೋ ಪ್ರತಿ ಟ್ಯಾಗ್ ಸ್ಕ್ಯಾನ್ ಮಾಡಿ, ಅಥವಾ \"Tags awaiting dispatch\"-ನಲ್ಲಿ ಟಿಕ್ ಮಾಡಿ.", "⟦Add selected to dispatch⟧ ಒತ್ತಿ ಕನ್ಫರ್ಮ್ ಮಾಡಿ.", "ಟ್ರಕ್‌ಗೆ ⟦Delivery challan⟧ ಮತ್ತು ⟦Packing list⟧ ಪ್ರಿಂಟ್ ಮಾಡಿ."]}, {"id": "f-sb", "t": "ಸ್ಟಾಕ್ ಬ್ಲಾಕ್ ಕೇಳಿ", "when": "ವೇರ್‌ಹೌಸ್ ಸ್ಟಾಕ್ ಒಂದು ಆರ್ಡರ್‌ಗೆ ಬಳಸಬಹುದಾದಾಗ.", "steps": ["ಸೇಲ್ಸ್‌ನದೇ ಫಾರ್ಮ್: Sales order, Article, Warehouse, ಕ್ವಾಂಟಿಟಿ, ಕಾರಣ, ಆಮೇಲೆ Submit request."]}, {"id": "f-ack", "t": "ಬದಲಾದ ಸ್ಪೆಕ್ ನೋಡಿ ಕನ್ಫರ್ಮ್ ಮಾಡಿ", "when": "Needs action-ನಲ್ಲಿ \"Revised spec to acknowledge\" ಬಂದಾಗ.", "steps": ["ಅದನ್ನ ತೆರೆದು ಮುಂಚೆ / ಆಮೇಲೆ ಟೇಬಲ್ ನೋಡಿ.", "⟦Seen revised spec⟧ ಒತ್ತಿ (ಬೇಕಿದ್ದರೆ ನೋಟ್ ಬರೆಯಿರಿ). ಇನ್ಮೇಲೆ ಹೊಸ ಸ್ಪೆಕ್ ಪ್ರಕಾರ ಕೆಲಸ ಮಾಡಿ."]}, {"id": "f-corr", "t": "ತಿದ್ದುಪಡಿ ಒಪ್ಪಿ ಅಥವಾ ಬಿಡಿ", "when": "ವೇರ್‌ಹೌಸ್ ಟ್ಯಾಗ್ ಸ್ಟೇಷನ್ ಅಥವಾ ಜಾಬ್ ಕಾರ್ಡ್ ಸ್ಟೇಷನ್‌ನಲ್ಲಿ Corrections ಕಂಡಾಗ.", "steps": ["“Now” ಮತ್ತು “Corrected” ಹೋಲಿಸಿ ನೋಡಿ.", "⟦Accept⟧ ಒತ್ತಿ, ಇಲ್ಲವೇ ಕಾರಣ ಬರೆದು ⟦Reject⟧ ಒತ್ತಿ. ಕೇಳಿದರೆ ಹೊಸ ಟ್ಯಾಗ್ ಪ್ರಿಂಟ್ ಮಾಡಿ ಹಳೆ ಲೇಬಲ್ ಬದಲಾಯಿಸಿ."]}, {"id": "f-nojc", "t": "ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲದ ಫ್ಯಾಕ್ಟರಿ PO SKU-ಗಳನ್ನು ನೋಡಿ", "when": "ಪ್ರತಿ ಬೆಳಿಗ್ಗೆ, ಯಾವುದಕ್ಕೆ ಇನ್ನೂ ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲ ಅಂತ ನೋಡೋಕೆ.", "steps": ["Orders in Production ಕೆಳಗಿನ ಮೊದಲ ಬಾಕ್ಸ್ MFPL-ಗೆ ಹಾಕಿದ PO-ಗಳಲ್ಲಿ Last Mile Ops ಮೂಲಕ ಇನ್ನೂ ಡಿಸ್ಪ್ಯಾಚ್ ಆಗದ SKU ಲೈನ್‌ಗಳನ್ನು ಎಣಿಸುತ್ತೆ, ಮತ್ತು ಅವುಗಳಲ್ಲಿ ಎಷ್ಟಕ್ಕೆ ಜಾಬ್ ಕಾರ್ಡ್ ಇದೆ ಅಂತ ತೋರಿಸುತ್ತೆ.", "ಅದನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿದರೆ ಜಾಬ್ ಕಾರ್ಡ್ ಇಲ್ಲದ SKU-ಗಳ ಲಿಸ್ಟ್, ಹಳೆಯ PO ಮೊದಲು. ಸಾಲನ್ನು ಕ್ಲಿಕ್ ಮಾಡಿದರೆ PO ಲೈನ್ ತೆರೆಯುತ್ತೆ.", "“Active job cards” ಈಗಲೂ ಎಲ್ಲಾ ಜಾಬ್ ಕಾರ್ಡ್‌ಗಳನ್ನು ಎಣಿಸುತ್ತೆ, PO-ಗೆ ಲಿಂಕ್ ಆಗದವೂ ಸೇರಿ."]}, {"id": "f-jcrm", "t": "ಯಾವ ಜಾಬ್ ಕಾರ್ಡ್‌ಗಳಿಗೆ ಇನ್ನೂ ರಾ ಮೆಟೀರಿಯಲ್ ಬೇಕು ಅಂತ ನೋಡಿ", "when": "ಪ್ರತಿದಿನ, ಅಥವಾ ವಾರದ ಪ್ಲಾನ್ ಮಾಡುವ ಮೊದಲು.", "steps": ["Job Card Station › Dashboard ತೆರೆಯಿರಿ. RM availability ಕಾಲಮ್‌ನಲ್ಲಿ ಪ್ರತಿ ಕಾರ್ಡ್‌ಗೆ: “Available & blocked” (ಯಾರು, ಯಾವಾಗ ಟಿಕ್ ಮಾಡಿದರು), “Card says not availab  (डिस्काउंट, फ़्रेट, एडवांस)।", "admin": "रोज़ का डेटा, यूज़र, परमिशन, लोकेशन, की (keys), जॉब कार्ड इंपोर्ट, बैकअप। SO अप्रूवल के नियम, Keep SOs, Usage।"}, "rules": {"R1": ["सेल्स", "PO के लिए भेजने से पहले SKU की क्लाइंट तारीख डालनी ज़रूरी है। 45, 60, 75, 90 या 120 दिन चुन सकते हैं (रिक्वेस्ट वाले दिन से गिनती होगी, बाद में नहीं बदलेगी), या सीधे कोई तारीख चुन लें।"], "R2": ["सेल्स", "PO सिर्फ़ उन्हीं SKU का माँग सकते हैं जो SO में हैं। जो SO में नहीं है, उसके लिए SO Revision Request डालनी होगी।"], "R3": ["सप्लाई", "सप्लाई को PO नंबर टाइप नहीं करना है। \"Mark PO raised in ERP\" दबाएँ, अगले डेटा रिफ़्रेश में PO लाइन अपने-आप ढूँढकर जुड़ जाएगी। जो न जुड़े, वो PO Progress Tracker › Unmatched में दिखेगी।"], "R4": ["फ़ैक्टरी, सेल्स", "PO की तारीख से 15 वर्किंग डे तक फ़ैक्टरी सवाल पूछ सकती है। जब कोई सवाल बाकी न हो, तभी प्रोडक्शन शुरू होगा।"], "R5": ["फ़ैक्टरी, सेल्स", "फ़ैक्टरी तारीख: MFPL PO आने के 20 दिन के अंदर फ़ैक्टरी या तो क्लाइंट की तारीख मान ले, या अपनी तारीख बताए — एक SKU के लिए या पूरे PO के लिए। सेल्स उसे मान लेगी, या मना करके दूसरी तारीख बताएगी। फ़ैक्टरी एक बार और तारीख बता सकती है; उसके बाद सेल्स जो आख़िरी तारीख रखेगी, वही पक्की। 20 दिन में जवाब न आए तो क्लाइंट तारीख से 5 दिन पहले की तारीख अपने-आप लग जाएगी।"], "R6": ["सब लोग", "दोनों तारीखों में 5 दिन का फ़र्क है: फ़ैक्टरी तारीख + 5 दिन = क्लाइंट तक माल पहुँचाने की तारीख। सेल्स को क्लाइंट की तारीख दिखती है, फ़ैक्टरी को अपनी, और सप्लाई व एडमिन को दोनों।"], "R7": ["फ़ैक्टरी, सेल्स", "पक्की फ़ैक्टरी तारीख बदलनी हो तो: उस तारीख से 10 दिन पहले तक फ़ैक्टरी डेविएशन माँग सकती है (एक बार में एक ही रिक्वेस्ट)। आख़िरी 10 दिन तारीख लॉक रहती है। किसी SKU की तारीख PO की तारीख से बाद की भी हो सकती है: सेल्स मान ले तो वो SKU अपनी तारीख से चलेगा, PO के बाकी SKU के लिए PO की तारीख ही हद है। एडमिन फ़ैक्टरी को एक और डेविएशन माँगने दे सकता है, आख़िरी 10 दिनों में भी; मानना या न मानना फिर भी सेल्स का फ़ैसला है।"], "R8": ["सब लोग", "MFPL फ़ैक्टरी PO पर देरी का ख़तरा दिखेगा जब: क्लाइंट तारीख छूटती दिखे; स्टेज पीछे चल रहे हों (30 / 15 / 7 दिन से कम बचे और पॉलिशिंग, फ़ैक्टरी QC या पैकिंग शुरू न हुई हो); जॉब कार्ड Post Frame या उसके बाद पहुँच गया पर कपड़ा नहीं भेजा; PO के 15 दिन बाद भी जॉब कार्ड नहीं; फ़ैक्टरी तारीख PO से 75 दिन से ज़्यादा बाद की।"], "R9": ["सेल्स, सप्लाई", "अप्रूव हुआ स्टॉक ब्लॉक हो तो उस SKU का माल मौजूद माना जाएगा, PO की ज़रूरत नहीं। अगर उसी SO में उसी कोड + FIN (जैसे AARA → AARAFIN) वाली PO लाइन आ जाए, तो ब्लॉक पर \"Issued to factory — FIN PO …\" दिखेगा, उसे ब्लॉक स्टॉक नहीं गिना जाएगा, और FIN लाइन आम फ़ैक्टरी वाले तरीके से चलेगी। जब वो SKU Order Bridge से कस्टमर को डिस्पैच हो जाए (dispatched मार्क हो), तो ब्लॉक पर तारीख के साथ \"Dispatched to customer\" दिखेगा और उसे ब्लॉक स्टॉक नहीं गिना जाएगा; थोड़ा ही डिस्पैच हुआ तो बाकी ब्लॉक रहेगा।"], "R10": ["फ़ैक्टरी, सप्लाई", "स्कैन किया जॉब कार्ड बिना चेक किए सेव नहीं होगा। हर फ़ील्ड को फ़ोटो से मिलाएँ, ख़ासकर पीले रंग वाले। उसी कार्ड की फ़ोटो दोबारा लेंगे तो वही कार्ड अपडेट होगा; पहले सेव की गई तारीखें और साइन नहीं मिटेंगे।"], "R11": ["सब लोग", "PO Progress Tracker और Order Deadlines में जो जॉब कार्ड स्टेज दिखता है: वो सबसे आख़िरी स्टेज जिसमें शुरू की तारीख, ख़त्म की तारीख और कम से कम एक साइन — तीनों हों।"], "R12": ["सप्लाई, सेल्स", "फ़ैक्ट्री में बना फ़र्नीचर SKU डिस्पैच या इंस्टॉलेशन स्लॉट के लिए तभी तैयार होता है जब सप्लाई ने Order Deadlines में \"QC report generated\" टिक किया हो और जॉब कार्ड पर पैकिंग पूरी दिखे। जॉब कार्ड के Factory-QC स्टेज की शुरुआत की तारीख डलते ही टिक खुल जाता है। वेयरहाउस टैग पर भी यही नियम है। बिना जॉब कार्ड वाले SKU को सप्लाई टिक नहीं कर सकती; एडमिन कारण लिखकर टिक कर सकता है।"], "R13": ["सप्लाई, फ़ैक्टरी", "फ़र्निशिंग और वेयरहाउस टैग पूरे के पूरे ही आगे जाते हैं — आधी मात्रा नहीं चलेगी। चालान और रसीद नंबर ऐप ख़ुद बनाता है; चालान दोबारा प्रिंट करना हो तो Logbook से निकाल लें।"], "R14": ["सप्लाई, एडमिन", "Dispatch Day के सारे चेक पूरे होने तक \"Mark dispatched\" लॉक रहेगा। सिर्फ़ एडमिन इसे ओवरराइड कर सकता है, 3 या ज़्यादा शब्दों का कारण लिखकर; ये रिकॉर्ड में जाता है। Dispatch Day का काम डिस्पैच तारीख से 48 घंटे पहले दिखेगा; चेक उससे पहले भी कर सकते हैं।"], "R15": ["सेल्स, COO / डायरेक्टर, अकाउंट्स", "डिस्पैच के समय ₹1 से ज़्यादा बाकी हो तो COO / डायरेक्टर का अप्रूवल चाहिए। लिंक 48 घंटे चलता है; मना करना हो तो कमेंट लिखना होगा; फिर अकाउंट्स चेक करके पक्का करेगा। बाकी रकम अप्रूव की गई रकम से बढ़ जाए तो दोबारा अप्रूवल लेना होगा।"], "R16": ["अकाउंट्स", "सप्लाई के ERP नंबर आ जाएँ और पेमेंट निपट जाए, तब इनवॉइस और ई-वे बिल वाला स्टेप खुलता है। निपटना मतलब: पूरा पैसा मिला और कन्फ़र्म हुआ; या कुछ नहीं मिला पर अप्रूवल चेक हो गया; या कुछ मिला और कन्फ़र्म हुआ, बाकी पर अप्रूवल चेक हो गया। इनवॉइस नंबर हमेशा चाहिए। ई-वे बिल 12 अंक का हो, या कारण लिखकर \"Not required\" चुनें।"], "R17": ["सेल्स, सप्लाई", "ब्लॉक की गई तारीखों पर डिस्पैच या इंस्टॉलेशन नहीं माँग सकते; सिर्फ़ Slot settings में रखे टाइम पर ही। क्लाइंट तारीख के बाद डिस्पैच के लिए कारण देना होगा। ट्रैकिंग लिंक में लिंक या NA डाल सकते हैं; लिंक न हो तो ट्रांसपोर्ट POC की जानकारी डालें।"], "R18": ["सेल्स, कस्टमर", "हर साइट डिटेल्स लिंक सिर्फ़ एक SO का होता है। हर पीस को हर तरफ़ 5 इंच बढ़ाकर नापा जाता है: लिफ़्ट हो तो लिफ़्ट से, लिफ़्ट न हो तो सीढ़ी से (सबसे छोटी साइड सीढ़ी की चौड़ाई में आनी चाहिए, और पीस लैंडिंग की लंबाई, चौड़ाई, ऊँचाई में समाना चाहिए)। जो पीस न समाए, उसके लिए 3 या ज़्यादा शब्दों का ओवरराइड कारण चाहिए।"], "R19": ["सब लोग", "पेज ख़ुद अपडेट होता है: दूसरों के बदलाव 2 मिनट के अंदर आ जाते हैं, और टैब पर लौटते ही तुरंत भी। आप टाइप कर रहे हों तो ये रुककर इंतज़ार करता है। नया ERP डेटा आए, या कोई और PO रिक्वेस्ट जोड़े या लिंक करे, तो रिफ़्रेश करने के लिए एक पट्टी दिखेगी। आप जो ERP डेटा देखते हैं, वो आख़िरी अपलोड वाले दिन का है। CSV डाउनलोड करने पर SO और PO नंबर के सारे अंक Excel में सही आते हैं।"], "R20": ["सेल्स, सप्लाई, अकाउंट्स, COO / डायरेक्टर", "SO रिवीज़न के लिए पहले COO / डायरेक्टर का अप्रूवल चाहिए। फिर अकाउंट्स ऑर्डर की रकम और एडवांस मिलाकर अप्रूव करेगा (नया SO ERP में बनता है)। फिर सप्लाई PO कैंसल होने की पुष्टि करेगी। जब तक सप्लाई पुष्टि न करे, रिवीज़न खुला रहेगा।"], "R21": ["सब लोग", "2 नवंबर 2026 से पहले बने PO: इनकी SKU जानकारी ईमेल से दी गई थी, इसलिए यहाँ इन नियमों के अंदर सिर्फ़ इनकी तारीखें बदल सकते हैं। इनका 20 दिन का फ़ैक्टरी टाइम और 15 दिन का जॉब कार्ड चेक 2 नवंबर से गिना जाएगा। कपड़ा चाहिए या नहीं, ये PO लाइन के टैग से तय होगा: टैग नहीं तो कपड़ा नहीं।"], "R22": ["फ़ैक्टरी, सप्लाई", "मटीरियल रेडीनेस (PO Progress Tracker › Readiness C0–C4) फ़ैक्टरी और सप्लाई दोनों देखते हैं। हर खुली फ़ैक्टरी SKU लाइन पर C0–C4 और \"Next\" लिखा होता है कि अब किसकी बारी है: फ़ैक्टरी (जॉब कार्ड, रॉ मटीरियल, कपड़ा मिलने की पुष्टि), सप्लाई (कपड़े की एंट्री या भेजना) या सेल्स (कपड़े की जानकारी नहीं भरी)। रॉ मटीरियल का टिक जॉब कार्ड की Material Used टेबल में फ़ैक्टरी की लिखी आख़िरी लाइन से चलता है: \"RM Available\" लिखा तो टिक लगेगा, \"RM Not Available\" लिखा तो टिक हटेगा। बदलना हो तो पुरानी लाइन काटें और नीचे नई लिखें; अगली स्कैन में आ जाएगा। हर लाइन पर उस स्कैन की तारीख दिखती है।"], "R23": ["सेल्स, एडमिन, फ़ैक्टरी, सप्लाई", "PO बनने के बाद कपड़ा, फ़िनिश, केन वीव या पत्थर बदलना: सेल्स कारण लिखकर एडमिन से वो फ़ील्ड खुलवाती है; एडमिन कारण के साथ हाँ या ना करता है। फ़ील्ड तभी खुलेगी जब जॉब कार्ड में उसका स्टेज शुरू न हुआ हो — कपड़े के लिए अपहोल्स्ट्री, फ़िनिश और पत्थर के लिए पॉलिशिंग, केन वीव के लिए पोस्ट फ़्रेम (जॉब कार्ड नहीं = काम शुरू नहीं)। सेल्स सिर्फ़ खुली फ़ील्ड बदलकर सेव करती है; फिर फ़ैक्टरी और सप्लाई दोनों \"Seen revised spec\" दबाते हैं। PO बनने से पहले एडमिन रिक्वेस्ट को वापस ड्राफ़्ट में भेज सकता है।"], "R24": ["एडमिन, फ़ैक्टरी, सप्लाई", "फ़र्निशिंग टैग, वेयरहाउस टैग और जॉब कार्ड में सुधार: एडमिन कारण लिखकर बदलाव भेजता है; जिस टीम का रिकॉर्ड है वो कारण के साथ मानती या ठुकराती है — फ़र्निशिंग टैग के लिए सप्लाई, वेयरहाउस टैग और जॉब कार्ड के लिए फ़ैक्टरी। माने जाने तक कुछ नहीं बदलता। जो टैग आगे जा चुका है उसे सिर्फ़ रद्द (void) किया जा सकता है, फिर नया बनाएँ। मात्रा कभी नहीं बदलती। छपी जानकारी बदले तो टैग दोबारा छापें। बाद की जॉब कार्ड स्कैन एडमिन का सुधार नहीं मिटाती, दोनों वैल्यू दिखाती है।"], "R25": ["सेल्स, SO अप्रूवर, COO / डायरेक्टर, अकाउंट्स", "हर नया SO आगे बढ़ने से पहले SO Approval Request से होकर जाएगा। सेल्स ERP से ड्राफ़्ट SO PDF अपलोड करती है — उसके आँकड़े Order Bridge में टाइप या बदले नहीं जा सकते। डिस्काउंट (डिस्काउंट वाली लाइनों पर): सेल्स की लिमिट तक ठीक है; SO अप्रूवर की लिमिट तक SO अप्रूवर; उससे ज़्यादा पर COO / डायरेक्टर। फ़्रेट: SO में फ़्रेट लाइन होनी चाहिए और वो रेडी रेकनर रेट से कम नहीं होनी चाहिए (स्टोर, डिलीवरी PIN की दूरी, फ़र्नीचर पीस की गिनती; सबसे बड़े बैंड से ज़्यादा पीस हों तो एक्स्ट्रा ट्रक); न हो, कम हो या सिटी लिमिट के बाहर हो तो COO / डायरेक्टर। एडवांस: फ़्रेट समेत बेसिक वैल्यू का कम से कम % (70%), वरना COO / डायरेक्टर। एक ही रिक्वेस्ट सबसे सीनियर ज़रूरी अप्रूवर के पास जाती है, जो हर आइटम पर अलग फ़ैसला करते हैं। सारे अप्रूवल आ जाएँ और हर पेमेंट मिल गया टिक हो जाए, तभी अकाउंट्स कन्फ़र्म करेगा। लिमिट, रेट और PIN बैंड एडमिन तय करते हैं।"], "R26": ["सेल्स, सप्लाई, एडमिन", "बुकिंग में बदलाव: जो बुकिंग सप्लाई ने अभी अप्रूव नहीं की, उसे सेल्स खुद बदल सकती है; अप्रूव हुई बुकिंग के लिए सेल्स पूछती है और सप्लाई हाँ या ना करती है — तब तक कुछ नहीं बदलता। सप्लाई और एडमिन सीधे बदल सकते हैं। डिस्पैच के बाद बदलाव नहीं। हर बदलाव के लिए कारण चाहिए, नई तारीख में जगह है या नहीं चेक होता है, और इतिहास बुकिंग पर रहता है। गलती से लगा स्टेटस कारण देकर Undo हो सकता है: सप्लाई 24 घंटे के अंदर, एडमिन कभी भी; Delivered का Undo सिर्फ़ एडमिन।"], "R27": ["एडमिन", "Delivery Challan का From / To एडमिन तभी ठीक कर सकते हैं जब उसका कोई टैग रिसीव न हुआ हो। चालान का नंबर वही रहता है, Revised लिखा आता है, और दोबारा प्रिंट में लिखा होता है कि क्या बदला। रिसीव होने के बाद: वॉइड करके फिर से लॉग करें।"], "R28": ["एडमिन", "Open SOs लिस्ट में जो SO नहीं हैं, वो सब छूट जाते हैं। एडमिन कारण देकर ज़रूरी SO रख सकते हैं; जो PI Revenue Report में नहीं है, उसे PO Summary से एक बेसिक लाइन मिलती है। Open SOs लिस्ट और PI Revenue Report दोनों में आ जाने पर वो Keep लिस्ट से अपने आप हट जाता है।"], "R29": ["सभी", "कौन-सा पेज किसने खोला और कितनी देर, Order Bridge ये रिकॉर्ड करता है (टाइप किया हुआ कभी नहीं)। ये सिर्फ़ एडमिन को Usage में दिखता है; 90 दिन तक रहता है।"], "R30": ["सेल्स, सप्लाई, फ़ैक्टरी", "क्लाइंट शीट में सिर्फ़ वही होता है जो क्लाइंट को कन्फ़र्म करना है: आर्टिकल, मात्रा, फ़ैब्रिक, फ़िनिश, केन, स्टोन, डिज़ाइन, साइट वर्क, साइट मैपिंग, नोट्स और वे क्लैरिफ़िकेशन जिन पर सेल्स टिक करें। कीमत, तारीख़, PO नंबर या अंदरूनी नाम कभी नहीं। “Client confirmed” ज़रूरी नहीं: इसमें तारीख़ और कन्फ़र्मेशन कहाँ है, यह दर्ज होता है (कोई फ़ाइल नहीं रखी जाती) और यह सबको PO लाइन पर दिखता है। बाद में इनमें से कोई भी विवरण बदले तो, जब तक सेल्स दोबारा कन्फ़र्म न कराएँ, लाइन पर “Changed since client confirmed” और क्या बदला, दिखता है। क्लैरिफ़िकेशन के जवाब क्लाइंट को दिखाए जा सकते हैं, इसलिए उन्हें ऐसे लिखें जैसे क्लाइंट को लिख रहे हों।"], "R31": ["सेल्स, SO अप्रूवर, COO / डायरेक्टर, अकाउंट्स", "आर्किटेक्ट, डिज़ाइनर या बिचौलिए को दिए जाने वाले हर कमीशन को अप्रूवल चाहिए: एडमिन की सीमा तक SO अप्रूवर, उससे ऊपर (या सीमा तय न हो तो) COO / डायरेक्टर। यह डिस्काउंट के बाद GST से पहले के मूल्य पर, फ़्रेट छोड़कर, निकाला जाता है; अप्रूवर को डिस्काउंट + कमीशन साथ में दिखता है। अप्रूवल के बाद रकम या पाने वाला बदले तो फिर से अप्रूवल चाहिए। बैंक अकाउंट और PAN पूरे सिर्फ़ अकाउंट्स, एडमिन और दर्ज करने वाले को दिखते हैं। नए या बदले बैंक विवरण तब तक “Unverified” रहते हैं जब तक दर्ज करने वाले के अलावा अकाउंट्स का कोई व्यक्ति उन्हें जाँच न ले — unverified विवरण पर कभी भुगतान न करें; इससे SO कन्फ़र्म करना नहीं रुकता। रिवाइज़्ड SO किसी SO Revision रिक्वेस्ट में नामित होना चाहिए, और COO / डायरेक्टर उस रिविज़न को अप्रूव करें, तब तक अकाउंट्स उसे कन्फ़र्म नहीं कर सकते।"]}, "man": {"sales": {"day": ["Dashboard खोलें: आपके काम \"Needs action\" में होंगे; घंटी वाले आइकन में सूचनाएँ भी दिखेंगी — जैसे कपड़ा फ़ैक्टरी भेजा गया, या वहाँ पहुँच गया।", "PO Progress Tracker में नए SO देखें और उनके SKU PO के लिए भेजें।", "फ़ैक्टरी जो तारीखें और सवाल भेजे, उनका जवाब दें।", "आख़िरी चरण आगे बढ़ाएँ: साइट की जानकारी, डिस्पैच स्लॉट, Dispatch Day पेमेंट।"], "tasks": [{"id": "s-req", "t": "SKU को PO के लिए भेजें", "when": "नए SO के हर उस SKU के लिए जिसका अभी PO नहीं बना।", "steps": . അഡ്മിന് ഫാക്ടറിക്ക് ഒരു ഡീവിയേഷൻ കൂടി ചോദിക്കാൻ അനുവാദം കൊടുക്കാം, അവസാന 10 ദിവസത്തിലും; സമ്മതിക്കണോ വേണ്ടയോ എന്ന് അപ്പോഴും സെയിൽസ് തീരുമാനിക്കും."], "R8": ["എല്ലാവരും", "MFPL ഫാക്ടറി PO-കളിൽ വൈകൽ സാധ്യത കാണിക്കും: ക്ലയന്റ് തീയതി തെറ്റുമെന്ന് കാണുമ്പോൾ; സ്റ്റേജുകൾ പിന്നിലായാൽ (30 / 15 / 7 ദിവസത്തിൽ കുറവ് ബാക്കി, പോളിഷിംഗോ ഫാക്ടറി QC-യോ പാക്കിംഗോ തുടങ്ങിയിട്ടില്ല); ജോബ് കാർഡ് Post Frame-ലോ അതിനുശേഷമോ എത്തിയിട്ടും തുണി അയച്ചിട്ടില്ല; PO കഴിഞ്ഞ് 15 ദിവസമായിട്ടും ജോബ് കാർഡ് ഇല്ല; ഫാക്ടറി തീയതി PO-യ്ക്ക് ശേഷം 75 ദിവസത്തിൽ കൂടുതൽ."], "R9": ["സെയിൽസ്, സപ്ലൈ", "അപ്രൂവ് ചെയ്ത സ്റ്റോക്ക് ബ്ലോക്ക് ഉണ്ടെങ്കിൽ ആ SKU-യ്ക്ക് സാധനം ഉണ്ടെന്ന് കണക്കാക്കും, PO വേണ്ട. അതേ SO-യിൽ അതേ കോഡ് + FIN (ഉദാ. AARA → AARAFIN) ഉള്ള PO ലൈൻ വന്നാൽ, ബ്ലോക്കിൽ \"Issued to factory — FIN PO …\" എന്ന് കാണിക്കും, അത് ബ്ലോക്ക് ചെയ്ത സ്റ്റോക്കായി എണ്ണില്ല, FIN ലൈൻ പതിവ് ഫാക്ടറി രീതിയിൽ പോകും. ആ SKU Order Bridge വഴി കസ്റ്റമർക്ക് ഡിസ്പാച്ച് ചെയ്താൽ (dispatched മാർക്ക് ചെയ്താൽ), ബ്ലോക്കിൽ തീയതിയോടൊപ്പം \"Dispatched to customer\" എന്ന് കാണിക്കും, പിന്നെ അത് ബ്ലോക്ക് ചെയ്ത സ്റ്റോക്കായി എണ്ണില്ല; കുറച്ച് മാത്രം ഡിസ്പാച്ച് ചെയ്താൽ ബാക്കി ബ്ലോക്കിൽ തന്നെ നിൽക്കും."], "R10": ["ഫാക്ടറി, സപ്ലൈ", "സ്കാൻ ചെയ്ത ജോബ് കാർഡ് പരിശോധിക്കാതെ സേവ് ആകില്ല. ഓരോ ഫീൽഡും ഫോട്ടോയുമായി ഒത്തുനോക്കുക, പ്രത്യേകിച്ച് മഞ്ഞ നിറത്തിൽ കാണിക്കുന്നവ. അതേ കാർഡിന്റെ ഫോട്ടോ വീണ്ടും എടുത്താൽ അതേ കാർഡ് അപ്ഡേറ്റ് ആകും; നേരത്തെ സേവ് ചെയ്ത തീയതികളും ഒപ്പുകളും പോകില്ല."], "R11": ["എല്ലാവരും", "PO Progress Tracker-ലും Order Deadlines-ലും കാണുന്ന ജോബ് കാർഡ് സ്റ്റേജ്: തുടങ്ങിയ തീയതി, തീർന്ന തീയതി, ചുരുങ്ങിയത് ഒരു ഒപ്പ് — ഇവ മൂന്നും ഉള്ള ഏറ്റവും അവസാനത്തെ സ്റ്റേജ്."], "R12": ["സപ്ലൈ, സെയിൽസ്", "ഫാക്ടറി നിർമ്മിച്ച ഫർണിച്ചർ SKU ഡിസ്‌പാച്ചിനോ ഇൻസ്റ്റലേഷൻ സ്ലോട്ടിനോ റെഡിയാകുന്നത് സപ്ലൈ Order Deadlines-ൽ \"QC report generated\" ടിക്ക് ചെയ്യുകയും ജോബ് കാർഡിൽ പാക്കിംഗ് കഴിഞ്ഞതായി കാണുകയും ചെയ്യുമ്പോൾ മാത്രം. ജോബ് കാർഡിലെ Factory-QC സ്റ്റേജിന് തുടങ്ങിയ തീയതി വന്നാൽ ടിക്ക് തുറക്കും. വെയർഹൗസ് ടാഗുകൾക്കും ഇതേ നിയമം. ജോബ് കാർഡില്ലാത്ത SKU സപ്ലൈക്ക് ടിക്ക് ചെയ്യാനാവില്ല; അഡ്മിന് കാരണം എഴുതി ടിക്ക് ചെയ്യാം."], "R13": ["സപ്ലൈ, ഫാക്ടറി", "ഫർണിഷിംഗും വെയർഹൗസ് ടാഗും മുഴുവനായി മാത്രം നീങ്ങും — പാതി അളവ് പറ്റില്ല. ചലാൻ, രസീത് നമ്പറുകൾ ആപ്പ് തന്നെ ഉണ്ടാക്കും; ചലാൻ വീണ്ടും പ്രിന്റ് ചെയ്യണമെങ്കിൽ Logbook-ൽ നിന്ന് എടുക്കാം."], "R14": ["സപ്ലൈ, അഡ്മിൻ", "Dispatch Day-യിലെ ചെക്കുകൾ മുഴുവൻ കഴിയുന്നതുവരെ \"Mark dispatched\" ലോക്ക് ആയിരിക്കും. അഡ്മിന് മാത്രം ഓവർറൈഡ് ചെയ്യാം, 3 വാക്കോ അതിൽ കൂടുതലോ ഉള്ള ഒരു കാരണം കൊടുത്ത്; അത് രേഖയിൽ വരും. Dispatch Day ടു-ഡൂ ഡിസ്പാച്ച് തീയതിക്ക് 48 മണിക്കൂർ മുമ്പ് വരും; ചെക്കുകൾ അതിനു മുമ്പേ ചെയ്യാം."], "R15": ["സെയിൽസ്, COO / ഡയറക്ടർ, അക്കൗണ്ട്സ്", "ഡിസ്പാച്ച് സമയത്ത് ₹1-ൽ കൂടുതൽ ബാക്കിയുണ്ടെങ്കിൽ COO / ഡയറക്ടർ അപ്രൂവ് ചെയ്യണം. ലിങ്കിന് 48 മണിക്കൂർ കാലാവധി; റിജക്ട് ചെയ്യണമെങ്കിൽ ഒരു കമന്റ് വേണം; പിന്നെ അക്കൗണ്ട്സ് അത് ശരിയാണെന്ന് ഉറപ്പിക്കും. ബാക്കി തുക അപ്രൂവ് ചെയ്ത തുകയിൽ കൂടിയാൽ വീണ്ടും അപ്രൂവൽ വേണം."], "R16": ["അക്കൗണ്ട്സ്", "സപ്ലൈയുടെ ERP നമ്പറുകൾ വന്ന് പേയ്മെന്റ് തീർന്നാൽ ഇൻവോയ്സ്, ഇ-വേ ബിൽ സ്റ്റെപ്പ് തുറക്കും. തീർന്നു എന്ന് പറയുന്നത്: മുഴുവൻ തുക കിട്ടി സ്ഥിരീകരിച്ചു; അല്ലെങ്കിൽ ഒന്നും കിട്ടിയില്ല പക്ഷേ അപ്രൂവൽ ഉറപ്പിച്ചു; അല്ലെങ്കിൽ കുറച്ച് കിട്ടി സ്ഥിരീകരിച്ച്, ബാക്കിക്ക് അപ്രൂവൽ ഉറപ്പിച്ചു. ഇൻവോയ്സ് നമ്പർ എപ്പോഴും വേണം. ഇ-വേ ബിൽ 12 അക്കം വേണം, അല്ലെങ്കിൽ കാരണം എഴുതി \"Not required\" കൊടുക്കണം."], "R17": ["സെയിൽസ്, സപ്ലൈ", "ബ്ലോക്ക് ചെയ്ത തീയതികളിൽ ഡിസ്പാച്ചോ ഇൻസ്റ്റലേഷനോ ചോദിക്കാൻ പറ്റില്ല; Slot settings-ൽ വെച്ചിട്ടുള്ള സമയങ്ങളിൽ മാത്രമേ പറ്റും. ക്ലയന്റ് തീയതിക്ക് ശേഷമുള്ള ഡിസ്പാച്ചിന് കാരണം വേണം. ട്രാക്കിംഗ് ലിങ്ക് ആയി ഒരു ലിങ്കോ NA-യോ കൊടുക്കാം; ലിങ്ക് ഇല്ലെങ്കിൽ ട്രാൻസ്പോർട്ട് POC-യുടെ വിവരം കൊടുക്കണം."], "R18": ["സെയിൽസ്, കസ്റ്റമർ", "ഓരോ സൈറ്റ് ഡീറ്റെയിൽസ് ലിങ്കും ഒരു SO-യ്ക്ക് മാത്രമുള്ളതാണ്. ഓരോ പീസും എല്ലാ വശത്തും 5 ഇഞ്ച് കൂട്ടി നോക്കും: ലിഫ്റ്റ് ഉണ്ടെങ്കിൽ ലിഫ്റ്റുമായി, ലിഫ്റ്റ് ഇല്ലെങ്കിൽ പടിയുമായി (ഏറ്റവും ചെറിയ വശം പടിയുടെ വീതിയിൽ കടക്കണം, ലാൻഡിംഗിന്റെ നീളം, വീതി, ഉയരം എന്നിവയ്ക്കുള്ളിൽ ഒതുങ്ങണം). ഒതുങ്ങാത്ത പീസിന് 3 വാക്കോ അതിൽ കൂടുതലോ ഉള്ള ഓവർറൈഡ് കാരണം വേണം."], "R19": ["എല്ലാവരും", "പേജ് തന     <div class="step-ind">${esc(E.step1)}</div>
    <div class="eyebrow">Magari Furniture · Order Bridge</div>
    <h1>${esc(E.pickLang)}<br><span style="font-weight:600;font-size:.7em;">${['kn','hi','ml'].map(l => esc((DATA[l] && DATA[l].ui && DATA[l].ui.pickLang) || '')).filter(Boolean).join(' · ')}</span></h1>
    <p class="lede">${esc(E.pickLangSub)}</p>
    <div class="pick">${LANGS.map(l => `<button data-pick-lang="${l.id}"><span class="big">${esc(l.native)}</span><span class="small">${esc(l.name)}</span></button>`).join('')}</div>
  </section></div>`;
  app.querySelectorAll('[data-pick-lang]').forEach(b => b.onclick = () => { S.lang = b.dataset.pickLang; store.set('obg_lang', S.lang); render(); window.scrollTo(0, 0); });
}
function renderStartRole(){
  bar.hidden = true;
  app.innerHTML = `<div class="wrap"><section class="start">
    <div class="step-ind">${esc(u('step2'))} · <button class="linkbtn" id="backLang">${esc(u('back'))}</button></div>
    <h1>${esc(u('pickRole'))}</h1>
    <p class="lede">${esc(u('pickRoleSub'))}</p>
    <div class="pick">${ROLES.map(r => `<button data-pick-role="${r}" data-lane="${r}"><span class="big">${esc(laneName(r))}</span><span class="small">${esc(D().blurb[r])}</span></button>`).join('')}</div>
    <p class="lede" style="margin-top:22px;"><button class="linkbtn" id="goMap">${esc(u('tabMap'))}</button> · <button class="linkbtn" id="goRules">${esc(u('tabRules'))}</button></p>
  </section></div>`;
  app.querySelector('#backLang').onclick = () => { S.lang = null; render(); };
  app.querySelectorAll('[data-pick-role]').forEach(b => b.onclick = () => { S.role = b.dataset.pickRole; store.set('obg_role', S.role); S.view = 'manual'; render(); window.scrollTo(0, 0); });
  app.querySelector('#goMap').onclick = () => { S.view = 'map'; render(); };
  app.querySelector('#goRules').onclick = () => { S.view = 'rules'; render(); };
}

function renderManual(notice){
  const M = D().man[S.role];
  app.innerHTML = `<div class="wrap view" data-lane="${S.role}">
    <div class="mhead"><div><div class="eyebrow">Order Bridge · ${esc(u('tabManual'))}</div><h1>${esc(laneName(S.role))} ${esc(u('manualTitle'))}</h1></div><div class="mono" style="color:var(--ink-soft);">${esc(u('dates'))}</div></div>
    ${notice}
    <div class="roles" role="group">${ROLES.map(r => `<button class="chip" data-role-chip="${r}" style="--c:var(--d-${r})" aria-pressed="${S.role === r}"><i></i>${esc(laneName(r))}</button>`).join('')}</div>
    <div class="mgrid">
      <nav class="toc" aria-label="${esc(u('tasks'))}"><b>${esc(u('tasks'))}</b>${M.tasks.map(t => `<a href="#" data-goto="${t.id}">${btn(t.t)}</a>`).join('')}</nav>
      <div style="min-width:0;">
        <div class="day"><h2>${esc(u('yourDay'))}</h2><ul>${M.day.map(x => `<li>${btn(x)}</li>`).join('')}</ul>${S.role !== 'approver' ? `<p style="margin:8px 0 0;font-size:14px;color:var(--ink-soft);">${esc(u('goLive'))}</p>` : ''}</div>
        ${M.tasks.map(t => `<article class="task" id="task-${t.id}">
          <h3>${btn(t.t)}</h3><div class="when">${btn(t.when)}</div>
          <div class="where">${esc(t.where)}</div>
          <ol>${t.steps.map(x => `<li>${btn(x)}</li>`).join('')}</ol>
          ${(t.rules && t.rules.length) || (t.map && t.map.length) ? `<div class="refs">${(t.rules || []).map(r => `<button class="ref" data-rule="${r}">${r}</button>`).join('')}${(t.map || []).map(n => `<button class="mapref" data-mapstep="${n}">${esc(u('seeMap'))} ${n}</button>`).join('')}</div>` : ''}
        </article>`).join('')}
      </div>
    </div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
  app.querySelectorAll('[data-role-chip]').forEach(b => b.onclick = () => { S.role = b.dataset.roleChip; store.set('obg_role', S.role); render(); });
  app.querySelectorAll('[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); const el = document.getElementById('task-' + a.dataset.goto); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); });
  wireRefs();
}
function wireRefs(){
  app.querySelectorAll('[data-rule]').forEach(b => b.onclick = () => { S.view = 'rules'; S.hlRule = b.dataset.rule; render(); const row = document.getElementById('rule-' + S.hlRule); if (row) row.scrollIntoView({ block:'center' }); });
  app.querySelectorAll('[data-mapstep]').forEach(b => b.onclick = () => { S.view = 'map'; S.sel = +b.dataset.mapstep; S.mapRole = 'all'; render(); window.scrollTo(0, 0); });
}

function renderRules(notice){
  const R = D().rules;
  app.innerHTML = `<div class="wrap view">
    <div class="eyebrow">Order Bridge</div><h1>${esc(u('rulesTitle'))}</h1><p class="lede">${esc(u('rulesSub'))}</p>${notice}
    <div class="tablewrap"><table class="rtable"><thead><tr><th>${esc(u('thRule'))}</th><th>${esc(u('thWhat'))}</th><th>${esc(u('thWho'))}</th></tr></thead>
      <tbody>${Object.keys(DATA.en.rules).map(id => `<tr id="rule-${id}" class="${S.hlRule === id ? 'hl' : ''}"><td class="id">${id}</td><td>${btn(R[id][1])}</td><td class="who">${esc(R[id][0])}</td></tr>`).join('')}</tbody></table></div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
}

function renderMap(notice){
  const X = D(), Bx = X.boxes, stg = X.stages;
  app.innerHTML = `<div class="wrap view">
    <div class="mhead"><div><div class="eyebrow">Magari Furniture · Order Bridge</div><h1>${esc(u('mapTitle1'))}<span class="tag">${esc(u('mapTitle2'))}</span></h1><p class="lede">${esc(u('mapSub'))}</p></div><div class="mono" style="color:var(--ink-soft);max-width:300px;">${esc(u('dates'))}</div></div>
    ${notice}
    <div class="roles" role="group"><span style="font-weight:600;color:var(--ink-soft);font-size:13px;align-self:center;">${esc(u('showFor'))}</span>
      <button class="chip" data-maprole="all" aria-pressed="${S.mapRole === 'all'}">${esc(u('everyone'))}</button>
      ${ROLES.map(r => `<button class="chip" data-maprole="${r}" style="--c:var(--d-${r})" aria-pressed="${S.mapRole === r}"><i></i>${esc(laneName(r))}</button>`).join('')}</div>
    <div class="mmain"><div class="mapbox"><div class="map ${S.mapRole !== 'all' ? 'filtered' : ''}" id="map"></div></div><aside class="detail" id="detail" aria-live="polite"></aside></div>
    <div class="lower">
      <section class="box"><h3>${esc(Bx.sbTitle)}</h3><p class="sub">${esc(Bx.sbSub)}</p>
        <ol class="flow"><li data-lane="sales"><span class="r">${esc(Bx.sb1r)}</span><span>${esc(Bx.sb1)}</span></li><li data-lane="supply"><span class="r">${esc(Bx.sb2r)}</span><span>${esc(Bx.sb2)}</span></li></ol></section>
      <section class="box"><h3>${esc(Bx.srTitle)}</h3><p class="sub">${esc(Bx.srSub)}</p>
        <ol class="flow"><li data-lane="sales"><span class="r">${esc(Bx.sr1r)}</span><span>${esc(Bx.sr1)}</span></li><li data-lane="approver"><span class="r">${esc(Bx.sr2r)}</span><span>${esc(Bx.sr2)}</span></li><li data-lane="supply"><span class="r">${esc(Bx.sr3r)}</span><span>${esc(Bx.sr3)}</span></li><li data-lane="accounts"><span class="r">${esc(Bx.sr4r)}</span><span>${esc(Bx.sr4)}</span></li></ol></section>
      <section class="box"><h3>${esc(Bx.evTitle)}</h3><ul style="margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;">${Bx.ev.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
    </div>
  </div><footer class="wrap">${esc(u('footer'))}</footer>`;
  const map = document.getElementById('map');
  let h = '<div class="corner"></div>' + stg.map((s, i) => `<div class="sh"><b>${i + 1}. ${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join('');
  LANE_KEYS.forEach(k => {
    const [nm, sub] = X.lanes[k];
    h += `<div class="lane ${S.mapRole !== 'all' && S.mapRole !== k ? 'dim' : ''}" data-lane="${k}">${esc(nm)}${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
    stg.forEach((_, si) => {
      const steps = STEPS.filter(s => s.l === k && s.s === si);
      h += `<div class="cell" data-lane="${k}" data-stage="${si}">${steps.map(s => { const x = X.steps[s.n - 1]; return `<button class="step ${S.mapRole !== 'all' && s.l !== S.mapRole ? 'dim' : ''}" data-n="${s.n}" data-lane="${s.l}" aria-pressed="${s.n === S.sel}"><span class="n">${s.n}</span><span class="t">${esc(x.t)}${s.opt ? ` <span class="opt">${esc(u('ifNeeded'))}</span>` : ''}</span><span class="w" data-who="${esc(laneName(s.l))}">${esc(x.w)}</span></button>`; }).join('')}</div>`;
    });
  });
  map.innerHTML = h;
  if (window.matchMedia('(max-width: 700px)').matches){
    stg.forEach((s, si) => { const hd = document.createElement('div'); hd.className = 'stage-m'; hd.textContent = `${si + 1}. ${s[0]}`; hd.style.order = si * 100; map.appendChild(hd); });
    map.querySelectorAll('.cell').forEach(c => { const first = Math.min(...[...c.querySelectorAll('.step')].map(b => +b.dataset.n), 99); c.style.order = (+c.dataset.stage) * 100 + first; });
  }
  map.querySelectorAll('.step').forEach(b => b.onclick = () => { S.sel = +b.dataset.n; renderMap(notice); if (window.matchMedia('(max-width: 1100px)').matches) document.getElementById('detail').scrollIntoView({ behavior:'smooth', block:'start' }); });
  app.querySelectorAll('[data-maprole]').forEach(b => b.onclick = () => { S.mapRole = b.dataset.maprole; if (S.mapRole !== 'all'){ const f = STEPS.find(s => s.l === S.mapRole); if (f && STEPS[S.sel - 1].l !== S.mapRole) S.sel = f.n; } renderMap(notice); });
  const s = STEPS[S.sel - 1], x = X.steps[s.n - 1];
  const list = S.mapRole === 'all' ? STEPS : STEPS.filter(y => y.l === S.mapRole);
  const idx = list.indexOf(s);
  const det = document.getElementById('detail'); det.setAttribute('data-lane', s.l);
  const mr = s.l === 'customer' ? 'sales' : s.l;
  const manualTask = X.man[mr].tasks.find(t => (t.map || []).includes(s.n));
  det.innerHTML = `<div class="who"><i></i>${esc(u('stepW'))} ${s.n} · ${esc(laneName(s.l))}</div><h2>${esc(x.t)}</h2><div class="where">${esc(x.w)}</div>
    <ul>${x.d.map(y => `<li>${esc(y)}</li>`).join('')}</ul><div class="next"><b>${esc(u('next'))}</b> ${esc(x.next)}</div>
    <div class="refs">${(DATA.en.stepRules[s.n] || []).map(r => `<button class="ref" data-rule="${r}">${r}</button>`).join('')}${manualTask ? `<button class="mapref" data-manual="${mr}|${manualTask.id}">${esc(u('openManual'))}: ${esc(laneName(mr))} › ${btn(manualTask.t)}</button>` : ''}</div>
    <div class="navbtns"><button id="prevStep" ${idx <= 0 ? 'disabled' : ''}>${esc(u('prev'))}</button><button id="nextStep" ${idx < 0 || idx >= list.length - 1 ? 'disabled' : ''}>${esc(u('nextB'))}</button></div>`;
  det.querySelector('#prevStep').onclick = () => { if (idx > 0){ S.sel = list[idx - 1].n; renderMap(notice); } };
  det.querySelector('#nextStep').onclick = () => { if (idx >= 0 && idx < list.length - 1){ S.sel = list[idx + 1].n; renderMap(notice); } };
  det.querySelectorAll('[data-manual]').forEach(b => b.onclick = () => { const [r, id] = b.dataset.manual.split('|'); S.role = r; store.set('obg_role', r); S.view = 'manual'; render(); const el = document.getElementById('task-' + id); if (el) el.scrollIntoView({ block:'start' }); });
  wireRefs();
}

render();

</script>
</body></html>
