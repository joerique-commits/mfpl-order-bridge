<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Bridge Assistant</title>
<style>
:root{--bg:#f6f5f2;--surface:#fff;--ink:#1d1d1b;--muted:#6b6a66;--line:#dedcd6;--accent:#1f5f8b;--good:#1f7a4d;--warn:#a86200;--crit:#b3261e;--chip:#eeece6}
html[data-theme=dark]{--bg:#161615;--surface:#1f1f1e;--ink:#ecebe7;--muted:#a3a29c;--line:#383835;--accent:#7ab8e0;--good:#6fcf97;--warn:#f0b35a;--crit:#f28b82;--chip:#2b2b29}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1}
button{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.link{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
form{display:flex;gap:8px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
input[type=search]{flex:1;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
html[data-theme=dark] button.primary{color:#10202b}
main{flex:1;overflow:auto;padding:14px}
footer{padding:7px 14px;font-size:12px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 2px}
.card h3{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 8px}
.sub{color:var(--muted);font-size:12.5px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 14px;margin-top:10px}
.kv div span{display:block;color:var(--muted);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;background:var(--chip);white-space:nowrap}
.pill.good{color:var(--good)}.pill.warn{color:var(--warn)}.pill.crit{color:var(--crit)}
.line{padding:10px 0;border-bottom:1px solid var(--line)}.line:first-of-type{padding-top:0}.line:last-child{border-bottom:0;padding-bottom:0}.line .kv{margin-top:6px}.warnt{color:var(--warn)}tr.tot td{font-weight:600;border-top:2px solid var(--line)}.ctl{font-size:13px;color:var(--muted)}.ctl select,.ctl input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.note{color:var(--muted);font-size:13px}
.err{color:var(--crit)}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:5px 0;border-bottom:1px solid var(--line)}
ul.plain li:last-child{border-bottom:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
</style>
</head>
<body>
<header>
  <h1>Assistant</h1>
  <button type="button" id="btnWide" aria-pressed="false">Wider</button>
  <button type="button" id="btnClose">Close</button>
</header>
<form id="f" autocomplete="off">
  <input type="search" id="q" placeholder="SO number, PO number, job card or customer name" aria-label="Find an order">
  <button class="primary" type="submit">Find</button>
</form>
<main id="out" aria-live="polite"></main>
<footer id="foot">Read-only. Nothing you do here changes Order Bridge.</footer>
<script src="assistant.js?v=3"></script>
</body>
</html>
