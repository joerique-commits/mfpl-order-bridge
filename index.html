// Reads a QR code out of a captured or uploaded photo (jsQR, vendored above). A plain
// <input type="file" accept="image/*" capture="environment"> is what actually opens the
// camera on a phone and a normal file/folder browser on a laptop or desktop — there's no
// separate code path per device, the browser decides based on what's available.
function decodeQrFromFile(file, cb){
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const maxDim = 1200;
      let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
      if (!w || !h){ cb(null); return; }
      if (w > maxDim || h > maxDim){ const scale = maxDim / Math.max(w, h); w = Math.round(w*scale); h = Math.round(h*scale); }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      let code = null;
      try {
        const imageData = ctx.getImageData(0, 0, w, h);
        code = jsQR(imageData.data, imageData.width, imageData.height);
      } catch (err) { code = null; }
      cb(code ? code.data : null);
    };
    img.onerror = () => cb(null);
    img.src = reader.result;
  };
  reader.onerror = () => cb(null);
  reader.readAsDataURL(file);
}

// Age in whole calendar days since a vendor material PO was raised — this is what
// Payables Forecast escalates on, not the customer-facing sales PO/SO anywhere else.
function payableAgeDays(dateStr){ return Math.round((TODAY - new Date(dateStr)) / 86400000); }
function payableEscalation(days){
  if (days>=15) return { level:'critical', label:`${days}d since PO raised — escalate immediately` };
  if (days>=7) return { level:'warn', label:`${days}d since PO raised — escalate` };
  if (days>=3) return { level:'warn', label:`${days}d since PO raised — flagged` };
  return { level:'good', label:`${days}d since PO raised` };
}
function fmtRupees(n){ return '₹' + Number(n||0).toLocaleString('en-IN'); }
function renderPayablesPreview(){
  // One row per real vendor material PO (Furnishings Tag Station's own entries) — the
  // client-supplied fabric line carries no vendor/amount and is excluded, nothing is owed
  // on it. Oldest (most at-risk) first.
  const rows = FABRIC_ENTRIES.filter(e => e.vendor && e.vendorPoRaisedDate)
    .map(e => ({ e, days: payableAgeDays(e.vendorPoRaisedDate) }))
    .sort((a,b) => b.days - a.days);
  const totalOwed = rows.reduce((s,r) => s + (r.e.vendorPoAmount||0), 0);
  const criticalCount = rows.filter(r => r.days>=15).length;
  const escalateCount = rows.filter(r => r.days>=7 && r.days<15).length;
  return `
    <div class="preview-banner dashed">${icon('coin')} <div><strong>What MFPL owes its fabric/stone vendors</strong> — aged from when each Furnishings PO was raised with the vendor (not from receipt), with escalation flags at 3, 7 and 15 days since raised (15 = worst, needs immediate escalation). Read-only — this surfaces risk, it doesn't record payment.</div></div>
    <div class="stat-grid cols3">
      <div class="card stat-tile"><div class="label">Total owed</div><div class="value">${fmtRupees(totalOwed)}</div><div class="sub">across ${rows.length} open vendor PO(s)</div></div>
      <div class="card stat-tile flag"><div class="label">Needs escalation</div><div class="value">${escalateCount}</div><div class="sub">7–14 days since PO raised</div></div>

      <thead><tr><th>Vendor</th><th>Furnishings PO</th><th>Material</th><th>PO raised</th><th>Amount owed</th><th>Age</th></tr></thead>
      <tbody>${rows.length ? rows.map(({e,days}) => { const esc = payableEscalation(days); return `
        <tr>

        </tr>`; }).join('') : `<tr><td colspan="6"><div class="empty-note">No open vendor payables.</div></td></tr>`}</tbody>
    </table></div>
  `;

function jobCardProgressDots(st){
  return `<div class="progress-dots" title="${st.currentStageLabel}">${STAGE_DEFS.map((d,i)=>{
    let cls = 'pd';
    if (st.furthestIndex > i || (st.furthestIndex===i && st.state==='complete')) cls += ' done';
    else if (st.furthestIndex===i) cls += ' filled';
    return `<span class="${cls}"></span>`;
  }).join('')}</div>`;
}
function newJobcardDraft(){
  return {
    jobCardNumber:'', clientName:'', cardDate:'', deadlineDate:'', workOrderNumber:'', productCode:'', qty:'',
    linkedPo:'', linkQuery:'',
    stages: STAGE_DEFS.map(d => ({ key:d.key, label:d.label, start:'', end:'', sup:false, mgr:false })),
    factoryRemarks:'', designTeamRemarks:'',
    materials:[{ slNo:'1', material:'', qty:'' }],
    uncertain:[],
  };
}
// Simulates what the real tool's AI reader would return from a photo — this session has
// no camera or file access, so Take Photo / Upload Image both show the same sample read,
// with a couple of fields flagged the way the real reader flags anything it wasn't sure
// about. Enter Manually starts from a blank card instead.
function sampleScannedDraft(){
  const d = newJobcardDraft();
  d.jobCardNumber = '1058'; d.clientName = 'Rina Anand'; d.cardDate = '2026-09-18'; d.deadlineDate = '2026-10-10';
  d.workOrderNumber = 'WO-6791'; d.productCode = 'CH-118-DN-WAL'; d.qty = '20 pcs';
  d.stages[0].start = '2026-09-18'; d.stages[0].sup = true;
  d.materials = [{ slNo:'1', material:'', qty:'' }];
  d.uncertain = ['clientName','qty'];
  return d;
}
function jobcardOrderMatches(query){
  if (!query.trim()) return [];
  const q = query.toLowerCase();
  return JOBCARD_ORDERS.filter(r => [r.po,r.customer,r.articleName,r.articleCode].join(' ').toLowerCase().includes(q)).slice(0,6);
}
function saveJobcardDraft(){
  const d = state.jobcardDraft;
  if (!d || !d.jobCardNumber.trim()) return;
  const linkedRow = d.linkedPo ? JOBCARD_ORDERS.find(r=>r.po===d.linkedPo) : null;
  const existing = JOB_CARDS.find(jc => jc.jobCardNumber.trim().toLowerCase() === d.jobCardNumber.trim().toLowerCase());
  const stages = d.stages.map(s => stageRow(s.key, s.label, { start:s.start, end:s.end, sup:s.sup, mgr:s.mgr }));
  const materials = d.materials.filter(m => (m.material||'').trim() || (m.qty||'').trim());
  const nowIsoVal = nowIso();
  const entry = {
    id: existing ? existing.id : 'jc_'+d.jobCardNumber.trim().toLowerCase().replace(/[^a-z0-9]/g,''),
    jobCardNumber: d.jobCardNumber.trim(),
    clientName: d.clientName.trim(),
    cardDateRaw: d.cardDate ? fmtDate(d.cardDate) : (existing ? existing.cardDateRaw : '—'),
    cardDateISO: d.cardDate || (existing ? existing.cardDateISO : ''),
    deadlineDate: d.deadlineDate || (existing ? existing.deadlineDate : ''),
    workOrderNumber: d.workOrderNumber.trim(),
    productCode: d.productCode.trim(),
    qty: d.qty.trim() || '—',
    linkedOrderId: linkedRow ? linkedRow.po : '',
    linkedPo: linkedRow ? linkedRow.po : '',
    linkedCustomerName: linkedRow ? linkedRow.customer : '',
    linkedArticleCode: linkedRow ? linkedRow.articleCode : '',
    linkedArticleName: linkedRow ? linkedRow.articleName : '',
    stages, factoryRemarks: d.factoryRemarks.trim(), designTeamRemarks: d.designTeamRemarks.trim(), materials,
    scanHistory: (existing ? existing.scanHistory : []).concat([{ scannedAt: nowIsoVal, scannedBy: actingUserName() }]),
    scanCount: existing ? existing.scanCount + 1 : 1,
    createdAt: existing ? existing.createdAt : nowIsoVal,
    updatedAt: nowIsoVal,
    confirmedBy: actingUserName(),
  };
  if (existing) Object.assign(existing, entry); else JOB_CARDS.unshift(entry);
  state.jobcardDraft = null; state.jobcardMethod = null;
  state.jobcardTab = 'dashboard'; state.jobcardOpenId = entry.id;
}

function renderJobCards(){
  // Capture & review and Orders are production's own tools for logging/scanning job
  // cards and importing the PO Summary — everyone else (sales, supply, accounts) only
  // ever needs to look up status, so they get the Dashboard tab and nothing else.
  const canCaptureOrOrders = ['production','admin'].includes(state.role);
  const tab = canCaptureOrOrders ? (state.jobcardTab || 'capture') : 'dashboard';
  let body;
  if (tab === 'capture' && canCaptureOrOrders) body = renderJobCardCapture();
  else if (tab === 'orders' && canCaptureOrOrders) body = renderJobCardOrdersTab();
  else body = state.jobcardOpenId ? renderJobCardDetail(state.jobcardOpenId) : renderJobCardDashboard();
  const tabs = canCaptureOrOrders ? ['capture','dashboard','orders'] : ['dashboard'];
  return `
    <div class="subtabs">${tabs.map(t=>`<button data-jctab="${t}" aria-pressed="${tab===t}">${JOBCARD_TAB_LABELS[t]}</button>`).join('')}</div>
    ${body}
  `;
}

function renderJobCardDashboard(){
  const boxes = STAGE_DEFS.map(def => {
    const cards = JOB_CARDS.filter(jc => jobCardStatus(jc).currentStageKey === def.key);
    const qtySum = cards.reduce((s,jc)=>s+parseQtyNum(jc.qty),0);
    return { key:def.key, label:def.label, count:cards.length, qtySum };
  });
  const notStarted = JOB_CARDS.filter(jc => jobCardStatus(jc).state==='not_started');
  const inProgress = JOB_CARDS.filter(jc => jobCardStatus(jc).state==='in_progress');
  const complete = JOB_CARDS.filter(jc => jobCardStatus(jc).state==='complete');
  const flagged = JOB_CARDS.filter(jc => jobCardStageFlags(jc).length);
  const unlinked = JOB_CARDS.filter(jc => !jc.linkedPo);

  let rows = JOB_CARDS.slice();
  if (state.jobcardStageFilter === '__none__') rows = rows.filter(jc => jobCardStatus(jc).state==='not_started');
  else if (state.jobcardStageFilter) rows = rows.filter(jc => jobCardStatus(jc).currentStageKey === state.jobcardStageFilter);
  if (state.jobcardUnlinkedOnly) rows = rows.filter(jc => !jc.linkedPo);
  if (state.jobcardFlaggedOnly) rows = rows.filter(jc => jobCardStageFlags(jc).length);
  if (state.jobcardSearch.trim()){
    const q = state.jobcardSearch.toLowerCase();
    rows = rows.filter(jc => [jc.jobCardNumber,jc.clientName,jc.workOrderNumber,jc.linkedPo,jc.linkedArticleName].join(' ').toLowerCase().includes(q));
  }

  return `
    <div class="preview-banner">${icon('card')} <div><strong>Existing tool, live today on its own system</strong> (Netlify Blobs, with a byte-for-byte identical EdgeOne port confirmed live 17 Sep). Reflects the real jobcard-log schema — 7 fixed stages, upsert-by-Job-Card-#, gap-flagging exactly as computeStatus() in jobcards.js computes it.</div></div>

    <div class="stat-grid cols5">
      <div class="card stat-tile"><div class="label">Total job cards</div><div class="value">${JOB_CARDS.length}</div></div>
      <div class="card stat-tile accent"><div class="label">In progress</div><div class="value">${inProgress.length}</div></div>
      <div class="card stat-tile"><div class="label">Complete</div><div class="value">${complete.length}</div></div>
      <div class="card stat-tile"><div class="label">Unlinked to an order</div><div class="value">${unlinked.length}</div></div>
      <div class="card stat-tile flag"><div class="label">Flagged (skipped stage)</div><div class="value">${flagged.length}</div></div>
    </div>

    <div class="jobcard-stagebar" style="margin-top:16px;">
      ${boxes.map(b => `<button class="stagebox ${state.jobcardStageFilter===b.key?'active':''}" data-stage-filter="${b.key}">
        <div class="sb-count">${b.count} / ${b.qtySum}</div>
        <div class="sb-label">${b.label}</div>
      </button>`).join('')}
      <button class="stagebox ${state.jobcardStageFilter==='__none__'?'active':''}" data-stage-filter="__none__">
        <div class="sb-count">${notStarted.length}</div>
        <div class="sb-label">Not started</div>
      </button>
    </div>
    <div class="hint" style="margin:-2px 0 16px;font-size:11.5px;color:var(--ink-faint);">Total Job Cards / Total Quantities per stage — click a box to filter the table below.</div>

    <div class="toolbar">
      <div class="search">${icon('grid')}<input id="jcSearchInput" placeholder="Search job card #, client, PO, article&hellip;" value="${state.jobcardSearch}"></div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;"><input type="checkbox" id="jcUnlinkedOnly" ${state.jobcardUnlinkedOnly?'checked':''}> Unlinked only</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;"><input type="checkbox" id="jcFlaggedOnly" ${state.jobcardFlaggedOnly?'checked':''}> Flagged only</label>
        ${state.jobcardStageFilter ? `<button class="filter-chip" aria-pressed="true" id="jcClearStage">Clear stage filter</button>` : ''}
        <button class="btn btn-ghost btn-sm" id="jcDownloadCsv">&#8681; CSV</button>
      </div>
    </div>
    <div class="hint" style="margin:-8px 0 12px;font-size:11.5px;color:var(--ink-faint);">Showing ${rows.length} of ${JOB_CARDS.length} job card(s).</div>

    <div class="card table-wrap">
      <table class="grid-table">
        <thead><tr><th>Job Card #</th><th>Client</th><th>Linked order</th><th>Article</th><th>Product code</th><th>Qty</th><th>Deadline</th><th>Progress</th><th>Current stage</th><th>Flags</th><th>Updated</th></tr></thead>
        <tbody>
          ${rows.map(jc => {
            const st = jobCardStatus(jc);
            const flags = jobCardStageFlags(jc);
            return `<tr class="clickable" data-jc-open="${jc.id}">
              <td class="cell-primary mono">${jc.jobCardNumber}</td>
              <td>${jc.clientName||'—'}</td>
              <td>${jc.linkedPo ? `<span class="mono">${jc.linkedPo}</span>` : `<span class="pill warn">unlinked</span>`}</td>
              <td>${jc.linkedArticleName || '—'}</td>
              <td class="mono">${jc.productCode || '—'}</td>
              <td class="num">${jc.qty}</td>
              <td>${jc.deadlineDate ? fmtDate(jc.deadlineDate) : '—'}</td>
              <td>${jobCardProgressDots(st)}</td>
              <td>${stagePill(st)}</td>
              <td>${flags.length ? `<span class="pill critical">${flags.length} flag${flags.length>1?'s':''}</span>` : `<span class="pill good">Clean</span>`}</td>
              <td class="cell-sub">${fmtDT(jc.updatedAt)}</td>
            </tr>`;
          }).join('') || `<tr><td colspan="11"><div class="empty-note">No job cards match.</div></td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

/* ============================= module: last mile ops (dispatch + installation bookings) ============================= */
function slotStatusPill(s){
  if (s==='confirmed') return `<span class="pill good"><span class="dot"></span>Confirmed</span>`;
  if (s==='requested') return `<span class="pill warn"><span class="dot"></span>Requested</span>`;
  if (s==='completed') return `<span class="pill neutral"><span class="dot"></span>Completed</span>`;
  return `<span class="pill critical"><span class="dot"></span>Cancelled</span>`;
}
function lastMileTypeLabel(type){ return type==='dispatch' ? 'Dispatch' : 'Installation'; }
// Maps a booking type to the flat state-field names that hold its own booking-form
// inputs — Dispatch and Installation each have their own so/orderId/date/window/
// location/notes/vendor, so switching tabs never clobbers the other leg's in-progress form.
const LM_STATE_KEYS = {
  dispatch:     { so:'lmDispatchSo', orderId:'lmDispatchOrderId', date:'lmDispatchDate', window:'lmDispatchWindow', location:'lmDispatchLocation', notes:'lmDispatchNotes', vendor:'lmDispatchVendor' },
  installation: { so:'lmInstallSo',  orderId:'lmInstallOrderId',  date:'lmInstallDate',  window:'lmInstallWindow',  location:'lmInstallLocation',  notes:'lmInstallNotes',  vendor:'lmInstallVendor' },
};
// Public, no-login customer delivery-details link. The customer fills in their own contact,
// address and access notes — no MFPL account needed — via a URL hash route the boot code
// checks before the internal app even renders (see renderPublicDeliveryPage / the bottom of
// this script). In this in-memory mock, opening that link in the SAME browser tab writes
// straight into the shared ORDERS record, which is why the staff-side booking tab below can
// show what the customer submitted immediately — a real deployment would post it to a server.
function publicDeliveryLinkFor(orderId){
  return location.origin + location.pathname + '#delivery-form/' + encodeURIComponent(orderId);
}
function preferredWindowLabel(v){ return v==='morning' ? 'Morning' : v==='afternoon' ? 'Afternoon' : 'No preference'; }

function wirePublicDeliveryForm(orderId, redraw){
  const submit = document.getElementById('pdSubmit');
  if (submit) submit.addEventListener('click', () => {
    const o = ORDERS.find(x=>x.id===orderId);
    if (!o) return;
    const contactName = document.getElementById('pdContactName').value.trim();
    const contactPhone = document.getElementById('pdContactPhone').value.trim();
    const altPhone = document.getElementById('pdAltPhone').value.trim();
    const preferredWindow = document.getElementById('pdPreferredWindow').value;
    const address = document.getElementById('pdAddress').value.trim();
    const accessNotes = document.getElementById('pdAccessNotes').value.trim();
    if (!contactName || !contactPhone || !address){
      state.pdError = 'Please fill in your contact name, phone number and delivery address.'; state.pdSaved = false; redraw(); return;
    }
    o.customerDeliveryDetails = { contactName, contactPhone, altPhone, preferredWindow, address, accessNotes, submittedAt: nowIso() };
    state.pdError = ''; state.pdSaved = true;
    redraw();
  });

function renderLastMileOps(){

function renderLastMileBookingTab(type){

  const windowsToday = slotsForDate(state[keys.date]);
  if (!state[keys.window] || !windowsToday.some(t=>t.window===state[keys.window])) state[keys.window] = windowsToday[0] ? windowsToday[0].window : null;
  const chosenCapacity = state[keys.date] && state[keys.window] ? slotCapacityFor(state[keys.date], state[keys.window]) : 0;

  const vendors = vendorsForType(type);

  const canSubmit = selectedOrder && !conflictingBooking && state[keys.date] && state[keys.window] && !slotFull && state[keys.location].trim() && state[keys.vendor];

            return `<option value="${t.window}" ${t.window===state[keys.window]?'selected':''} ${full?'disabled':''}>${t.window} — ${booked}/${t.capacity} booked${full?' (full)':''}</option>`;
          }).join('')}</select>` : `<div class="cell-sub" style="padding-top:9px;">${state[keys.date] ? 'No windows on this day.' : 'Pick a date to see windows.'}</div>`}
        </div>
        <div class="field"><label>${lastMileTypeLabel(type)} vendor</label><select id="lm_vendor_${type}"><option value="">Choose a vendor…</option>${vendors.map(v=>`<option value="${v}" ${v===state[keys.vendor]?'selected':''}>${v}</option>`).join('')}</select></div>

        <div class="field span2"><label>Notes <span class="opt">(optional)</span></label><input id="lm_notes_${type}" placeholder="Access constraints, contact person, etc." value="${state[keys.notes]}"></div>
      </div>
      ${conflictingBooking ? `<div class="cell-sub" style="color:var(--critical);margin-top:8px;">${selectedOrder.so} already has an active ${lastMileTypeLabel(type).toLowerCase()} booking (${fmtDate(conflictingBooking.date)}, ${conflictingBooking.window}, ${slotStatusPill(conflictingBooking.status)}) — cancel or complete it before booking another.</div>` : ''}
      ${slotFull && !conflictingBooking ? `<div class="cell-sub" style="color:var(--critical);margin-top:8px;">This window is fully booked (${chosenBooked}/${chosenCapacity}) — pick another date or window.</div>` : ''}
      <button class="btn btn-primary" data-submit-lm="${type}" style="margin-top:14px;" ${canSubmit?'':'disabled'}>Request slot</button>
    </div>
    ${selectedOrder ? renderCustomerDeliveryCard(selectedOrder) : ''}` : ''}

function stockBlockStatusPill(status){

function renderStockBlockStation(){
  const canRequest = ['sales','supply','production','admin'].includes(state.role) && canEditSection('stockblock', state.role);
  const canDecide = ['supply','admin'].includes(state.role) && canEditSection('stockblock', state.role);
  const rows = STOCK_BLOCK_REQUESTS.slice().sort((a,b)=>b.requestedAt.localeCompare(a.requestedAt));
  // SO-then-SKU cascade: pick the sales order first, then the SKU narrows to that SO's own lines.
  const sos = [...new Set(ORDERS.map(o=>o.so))];
  if (!state.sbSo || !sos.includes(state.sbSo)) state.sbSo = sos[0] || null;
  const linesForSo = ORDERS.filter(o=>o.so===state.sbSo);
  if (!state.sbOrderId || !linesForSo.some(o=>o.id===state.sbOrderId)) state.sbOrderId = linesForSo[0] ? linesForSo[0].id : null;
  if (!state.sbWarehouse || !WAREHOUSES.some(w=>w.id===state.sbWarehouse)) state.sbWarehouse = WAREHOUSES[0].id;
  const selectedOrder = ORDERS.find(o=>o.id===state.sbOrderId);
  const skus = [...new Set(ORDERS.map(o=>o.sku))].map(sku=>({ sku, article: ORDERS.find(o=>o.sku===sku).article }));
  const onHand = selectedOrder ? onHandQty(selectedOrder.sku, state.sbWarehouse) : 0;
  const blocked = selectedOrder ? blockedQty(selectedOrder.sku, state.sbWarehouse) : 0;

  const exceedsAvail = selectedOrder && qtyTyped > 0 && qtyTyped > avail;
  return `
    <div class="preview-banner dashed">${icon('box')} <div><strong>New — routes every stock-block request through one place.</strong> Sales, supply or production can ask to block existing warehouse stock against a client order instead of waiting on a fresh PO or production run. It's fundamentally a supply-team call, so every request — whoever raises it — is approved, rejected, or later released by supply (or admin) here.</div></div>
    ${canRequest ? `

      <div class="ac-title">Request a stock block</div>
      <div class="field-grid">
        <div class="field"><label>Sales order</label><select id="sb_so">${sos.map(so=>`<option value="${so}" ${so===state.sbSo?'selected':''}>${so} — ${ORDERS.find(o=>o.so===so).customer}</option>`).join('')}</select></div>
        <div class="field"><label>Article / SKU</label><select id="sb_orderId">${linesForSo.map(o=>`<option value="${o.id}" ${o.id===state.sbOrderId?'selected':''}>${o.article} (${o.sku})</option>`).join('')}</select></div>
        <div class="field"><label>Warehouse</label><select id="sb_warehouse">${WAREHOUSES.map(w=>`<option value="${w.id}" ${w.id===state.sbWarehouse?'selected':''}>${w.label}</option>`).join('')}</select></div>
        <div class="field">
          <label>Quantity to block</label>
          <input id="sb_qty" type="number" min="1" placeholder="e.g. 4" value="${state.sbQty}">
          ${selectedOrder ? `<div class="cell-sub" id="sbAvailHint" style="margin-top:4px;">${avail} ${selectedOrder.uom} available at ${warehouseLabel(state.sbWarehouse)} (${onHand} on hand${blocked?`, ${blocked} already blocked`:''})</div>` : ''}
          ${exceedsAvail ? `<div class="cell-sub" style="color:var(--critical);margin-top:2px;">Exceeds what's on hand at this warehouse — supply will need to confirm before approving.</div>` : ''}
        </div>
        <div class="field span2"><label>Reason</label><textarea id="sb_reason" rows="2" placeholder="Why block from stock rather than wait on production">${state.sbReason}</textarea></div>
      </div>
      <button class="btn btn-primary" id="submitStockBlock" style="margin-top:14px;">Submit request</button>
    </div>` : ''}
    <div class="group-label">Stock on hand</div>
    <div class="card table-wrap"><table class="grid-table">
      <thead><tr><th>Article / SKU</th>${WAREHOUSES.map(w=>`<th class="num">${w.label}</th>`).join('')}</tr></thead>
      <tbody>${skus.map(({sku,article}) => `
        <tr>
          <td><div class="cell-primary">${article}</div><div class="cell-sub">${sku}</div></td>
          ${WAREHOUSES.map(w=>{
            const on = onHandQty(sku, w.id); const blk = blockedQty(sku, w.id);
            return `<td class="num">${on}${blk?`<div class="cell-sub">${blk} blocked</div>`:''}</td>`;
          }).join('')}
        </tr>`).join('')}</tbody>
    </table></div>
    <div class="group-label">Requests</div>
    <div class="card table-wrap"><table class="grid-table">
      <thead><tr><th>SO / Article</th><th>Warehouse</th><th>Qty</th><th>Requested by</th><th>Reason</th><th>Status</th>${canDecide?'<th></th>':''}</tr></thead>
      <tbody>${rows.length ? rows.map(r => `
        <tr>
          <td><div class="cell-primary">${r.so}</div><div class="cell-sub">${r.article} · ${r.sku}</div></td>
          <td>${warehouseLabel(r.warehouse)}</td>
          <td class="num">${r.qtyRequested} ${r.uom}</td>
          <td><div class="cell-primary">${r.requestedBy}</div><div class="cell-sub">${ROLES[r.requestedByRole]?.label||r.requestedByRole} · ${fmtDT(r.requestedAt)}</div></td>
          <td>${r.reason}${r.notes?`<div class="cell-sub" style="margin-top:4px;">${r.notes}</div>`:''}</td>
          <td>${stockBlockStatusPill(r.status)}</td>
          ${canDecide ? `<td>${
            r.status==='requested' ? `<button class="btn-text" data-sb-approve="${r.id}">Approve</button> · <button class="btn-text" data-sb-reject="${r.id}">Reject</button>`
            : r.status==='approved' ? `<button class="btn-text" data-sb-release="${r.id}">Release</button>`
            : ''
          }</td>` : ''}
        </tr>`).join('') : `<tr><td colspan="${canDecide?7:6}"><div class="empty-note">No stock block requests yet.</div></td></tr>`}</tbody>
    </table></div>
  `;
}

function warehouseTagStatusPill(status){

// A real, scannable QR code (vendored qrcode-generator, see top of file) encoding the
// tag's own ID — this is what a printed tag actually carries, and what the Dispatch/
// Receive "scan" flows below resolve back to a specific FABRIC_ENTRIES/WAREHOUSE_TAGS
// row. Cached per tag ID since the encoding is pure and the same tag is drawn many times
// across Intake, the reference lists and the Logbook.
const _qrCache = {};
function qrSvg(text, cellSize){
  const key = text + '@' + cellSize;
  if (!_qrCache[key]){
    const q = qrcode(0, 'M');
    q.addData(String(text));
    q.make();
    _qrCache[key] = q.createSvgTag({ cellSize, margin: cellSize, alt: 'QR code for tag ' + text });
  }
  return _qrCache[key];
}
function renderQR(text){ return `<div class="qr-mini" title="${text}">${qrSvg(text, 2.6)}</div>`; }
function renderQRLarge(text){ return `<div class="qr-large" title="${text}">${qrSvg(text, 6)}</div>`; }

// Standalone records — a revision request never writes back into ORDERS/JOB_CARDS/anything

// typed). Two gates run in parallel before it can be approved: Supply validates whatever
// PO-cancellation answer sales gave (Yes, No, or NA — validated regardless of which), and
// Accounts reconciles it against the order's original value and the advance already

  else if (state.module==='warehousetag') content.innerHTML = renderWarehouseTagStation();
  else if (state.module==='slots') content.innerHTML = renderLastMileOps();
  else if (state.module==='sorevision') content.innerHTML = renderSoRevision();
  else if (state.module==='adminuploads') content.innerHTML = renderAdminUploads();
  else if (state.module==='userpermissions') content.innerHTML = renderUserPermissions();

  const modalRoot = document.getElementById('modalRoot');
  if (modalRoot) modalRoot.innerHTML = renderFabViewModal() || renderDeadlineHistoryModal() || renderPodCaptureModal() || renderPodViewModal() || renderUserEditModal();

  wireContentEvents();
}

function wireContentEvents(){
  document.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => { state.module='confirmations'; state.openOrderId = el.dataset.open; renderAll(); }));
  const back = document.getElementById('backToList');

  document.querySelectorAll('[data-attn-nav]').forEach(el => el.addEventListener('click', () => {
    state.module = el.dataset.attnModule;

  const searchInput = document.getElementById('searchInput');

  // SO expand/collapse, PO raise / supply-confirm from the sub-table
  document.querySelectorAll('[data-so-toggle]').forEach(el => el.addEventListener('click', () => {

    state.soExpanded.has(so) ? state.soExpanded.delete(so) : state.soExpanded.add(so);
    renderAll();
  }));
  // The checkbox itself is pointer-events:none (purely visual) — the real click lands on
  // the wrapping label, which the browser then forwards to the checkbox as a second,
  // synthetic click. Both clicks bubble from inside the row's <tr data-open="…">, so
  // without stopping the label's own click here, opening the order detail (the row's
  // click-to-open behavior) would fire on every raise, not just the checkbox's own handler.
  document.querySelectorAll('label.ready-check').forEach(el => el.addEventListener('click', (ev) => ev.stopPropagation()));
  document.querySelectorAll('[data-submit-po]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const o = ORDERS.find(x=>x.id===el.dataset.submitPo);
    if (!o || !detailComplete(o) || o.lifecycle!=='draft') return;
    o.lifecycle='submitted'; o.submittedAt=nowIso(); o.submittedBy=actingUserName();
    renderAll();
  }));
  document.querySelectorAll('[data-confirm-po]').forEach(el => el.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const o = ORDERS.find(x=>x.id===el.dataset.confirmPo);
    if (!o || o.lifecycle!=='submitted') return;
    o.lifecycle='po_confirmed'; o.poRaisedDate = todayStr(); o.poConfirmedBy = actingUserName(); o.poConfirmedAt = nowIso();
    renderAll();
  }));

  // Dashboard drill-down + stat-tile navigation + attention tabs
  document.querySelectorAll('[data-drill]').forEach(el => el.addEventListener('click', () => {
    const key = el.dataset.drill;
    state.dashboardDrill = state.dashboardDrill === key ? null : key;
    renderAll();
  }));
  const clearDrill = document.getElementById('clearDrill');
  if (clearDrill) clearDrill.addEventListener('click', () => { state.dashboardDrill = null; renderAll(); });
  document.querySelectorAll('[data-nav-tile]').forEach(el => el.addEventListener('click', () => goTo(el.dataset.navTile)));
  document.querySelectorAll('[data-attn-tab]').forEach(el => el.addEventListener('click', () => { state.attnTab = el.dataset.attnTab; renderAll(); }));

  // CSV bulk-fill
  const downloadCsvTemplate = document.getElementById('downloadCsvTemplate');
  if (downloadCsvTemplate) downloadCsvTemplate.addEventListener('click', () => {
    downloadCsv('po-confirmation-template.csv', csvTemplateFor(ORDERS.filter(o=>o.lifecycle==='draft')));
  });
  const uploadCsvInput = document.getElementById('uploadCsvInput');
  if (uploadCsvInput) uploadCsvInput.addEventListener('change', (e) => { const file = e.target.files[0]; if (file) handleCsvUpload(file); });

  // Order detail — detail fields update the order live as sales types, without a full
  // re-render (which would drop focus mid-field). This keeps the Raise PO button's
  // enabled state and helper text in sync with what's actually been filled in.
  const detailFieldMap = { f_fabricSku:'fabricSku', f_fabricName:'fabricName', f_placement:'placement', f_finish:'finish', f_stone:'stoneType', f_design:'design', f_siteReq:'siteReq', f_siteMap:'siteMap', f_notes:'notes' };
  Object.keys(detailFieldMap).forEach(fieldId => {
    const el = document.getElementById(fieldId);
    if (!el) return;
    el.addEventListener('input', () => {
      const o = ORDERS.find(x=>x.id===state.openOrderId);
      if (!o || o.lifecycle!=='draft') return;
      o.detail[detailFieldMap[fieldId]] = el.value;
      const ready = detailComplete(o);
      const note = document.getElementById('poReadyNote');
      if (note) note.textContent = ready ? 'All required details are filled in.' : 'Fill fabric SKU, fabric name, placement, finish and design confirmation before this can be raised.';
      const btn = document.getElementById('submitPoDetail');
      if (btn) btn.disabled = !ready;
    });
  });

  const submitPoDetail = document.getElementById('submitPoDetail');
  if (submitPoDetail) submitPoDetail.addEventListener('click', () => {
    const o = ORDERS.find(x=>x.id===state.openOrderId);
    const g = id => document.getElementById(id)?.value ?? '';
    if (!o || o.lifecycle!=='draft') return;
    o.detail = { fabricSku:g('f_fabricSku'), fabricName:g('f_fabricName'), placement:g('f_placement'), finish:g('f_finish'), stoneType:g('f_stone'), design:g('f_design'), siteReq:g('f_siteReq'), siteMap:g('f_siteMap'), notes:g('f_notes') };
    if (!detailComplete(o)) return;
    o.lifecycle='submitted'; o.submittedAt=nowIso(); o.submittedBy=actingUserName();
    renderAll();
  });
  const confirmPoDetail = document.getElementById('confirmPoDetail');
  if (confirmPoDetail) confirmPoDetail.addEventListener('click', () => {
    const o = ORDERS.find(x=>x.id===state.openOrderId);
    const dateVal = document.getElementById('po_raised_date').value || todayStr();
    if (!o || o.lifecycle!=='submitted') return;
    o.lifecycle='po_confirmed'; o.poRaisedDate=dateVal; o.poConfirmedBy=actingUserName(); o.poConfirmedAt=nowIso();
    renderAll();
  });
  const submitClarification = document.getElementById('submitClarification');
  if (submitClarification) submitClarification.addEventListener('click', () => {
    const text = document.getElementById('new_clarification').value.trim();
    if (!text) return;
    const o = ORDERS.find(x=>x.id===state.openOrderId);
    o.clarifications = o.clarifications || [];
    o.clarifications.push({ id:'CL-'+Math.floor(1000+Math.random()*9000), question:text, raisedBy:actingUserName(), raisedAt:nowIso(), status:'open', response:'', respondedBy:'', respondedAt:'' });
    renderAll();
  });
  document.querySelectorAll('[data-close-clarification]').forEach(b => b.addEventListener('click', () => {
    const cid = b.dataset.closeClarification;
    const textarea = document.querySelector(`[data-clarification-response="${cid}"]`);
    const response = textarea ? textarea.value.trim() : '';
    if (!response) return;
    const o = ORDERS.find(x=>x.id===state.openOrderId);
    const c = (o.clarifications||[]).find(x=>x.id===cid);
    if (c){ c.status='closed'; c.response=response; c.respondedBy=actingUserName(); c.respondedAt=nowIso(); renderAll(); }
  }));
  document.querySelectorAll('[data-goto-deadlines]').forEach(b => b.addEventListener('click', () => {
    state.module = 'deadlines'; state.openOrderId = b.dataset.gotoDeadlines; renderAll();
  }));

  // Fabric station
  document.querySelectorAll('[data-fab-toggle]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.fabToggle;
    state.orderFabricExpanded.has(id) ? state.orderFabricExpanded.delete(id) : state.orderFabricExpanded.add(id);
    renderAll();
  }));
  document.querySelectorAll('[data-fabtab]').forEach(b => b.addEventListener('click', () => {
    state.fabricTab = b.dataset.fabtab; state.fabricDispatchCart = new Set(); state.fabricReceiveCart = new Set();
    state.fabricDispatchScan = ''; state.fabricDispatchScanError = '';
    state.fabricReceiveScan = ''; state.fabricReceiveScanError = ''; state.fabricReceiveLookupId = null;
    renderAll();
  }));

  // Dispatch — scan/type one tag ID at a time, rather than checking boxes off a list, so a
  // tag can only enter the batch if someone actually has it (or its ID) in hand.
  function tryAddDispatchScan(){
    const input = document.getElementById('dispatchScanInput');
    const raw = (input ? input.value : '').trim();
    if (!raw) return;
    const e = FABRIC_ENTRIES.find(x => x.id.toLowerCase() === raw.toLowerCase());
    if (!e){ state.fabricDispatchScanError = `No tag found with ID "${raw}".`; state.fabricDispatchScan = raw; renderAll(); return; }
    if (entryStatus(e) !== 'awaiting_dispatch'){ state.fabricDispatchScanError = `${e.id} is not awaiting dispatch right now (status: ${entryStatus(e).replace('_',' ')}).`; state.fabricDispatchScan = raw; renderAll(); return; }
    if (state.fabricDispatchCart.has(e.id)){ state.fabricDispatchScanError = `${e.id} is already in this batch.`; state.fabricDispatchScan = raw; renderAll(); return; }
    state.fabricDispatchCart.add(e.id);
    state.fabricDispatchScan = ''; state.fabricDispatchScanError = '';
    renderAll();
  }
  const dispatchScanAdd = document.getElementById('dispatchScanAdd');
  if (dispatchScanAdd) dispatchScanAdd.addEventListener('click', tryAddDispatchScan);
  const dispatchScanInput = document.getElementById('dispatchScanInput');
  if (dispatchScanInput){
    dispatchScanInput.addEventListener('input', (e) => { state.fabricDispatchScan = e.target.value; });
    dispatchScanInput.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); tryAddDispatchScan(); } });
    dispatchScanInput.focus();
  }
  document.querySelectorAll('[data-dispatch-cart-remove]').forEach(b => b.addEventListener('click', () => {
    state.fabricDispatchCart.delete(b.dataset.dispatchCartRemove); renderAll();
  }));
  const dispatchScanCamera = document.getElementById('dispatchScanCamera');
  const dispatchScanFile = document.getElementById('dispatchScanFile');
  if (dispatchScanCamera && dispatchScanFile){
    dispatchScanCamera.addEventListener('click', () => dispatchScanFile.click());
    dispatchScanFile.addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      dispatchScanFile.value = '';
      if (!file) return;
      decodeQrFromFile(file, (text) => {
        if (!text){ state.fabricDispatchScanError = 'Could not read a QR code from that photo — try again, or type the tag ID.'; renderAll(); return; }
        const input = document.getElementById('dispatchScanInput');
        if (input) input.value = text.trim();
        tryAddDispatchScan();
      });
    });
  }

  // Receive — a two-step look-up-then-add, same reasoning: you check the looked-up tag is
  // the right one before it lands in the batch, instead of picking a row off a list.
  function tryLookupReceiveScan(){
    const input = document.getElementById('receiveScanInput');
    const raw = (input ? input.value : '').trim();
    if (!raw) return;
    const e = FABRIC_ENTRIES.find(x => x.id.toLowerCase() === raw.toLowerCase());
    if (!e){ state.fabricReceiveScanError = `No tag found with ID "${raw}".`; state.fabricReceiveLookupId = null; renderAll(); return; }
    if (entryStatus(e) !== 'in_transit'){ state.fabricReceiveScanError = `${e.id} is not in transit right now (status: ${entryStatus(e).replace('_',' ')}).`; state.fabricReceiveLookupId = null; renderAll(); return; }
    if (state.fabricReceiveCart.has(e.id)){ state.fabricReceiveScanError = `${e.id} is already in this batch.`; state.fabricReceiveLookupId = null; renderAll(); return; }
    state.fabricReceiveScanError = ''; state.fabricReceiveLookupId = e.id;
    renderAll();
  }
  const receiveScanLookup = document.getElementById('receiveScanLookup');
  if (receiveScanLookup) receiveScanLookup.addEventListener('click', tryLookupReceiveScan);
  const receiveScanInput = document.getElementById('receiveScanInput');
  if (receiveScanInput){
    receiveScanInput.addEventListener('input', (e) => { state.fabricReceiveScan = e.target.value; });
    receiveScanInput.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); tryLookupReceiveScan(); } });
    receiveScanInput.focus();
  }
  const receiveScanConfirmAdd = document.getElementById('receiveScanConfirmAdd');
  if (receiveScanConfirmAdd) receiveScanConfirmAdd.addEventListener('click', () => {
    if (state.fabricReceiveLookupId) state.fabricReceiveCart.add(state.fabricReceiveLookupId);
    state.fabricReceiveLookupId = null; state.fabricReceiveScan = '';
    renderAll();
  });
  document.querySelectorAll('[data-receive-cart-remove]').forEach(b => b.addEventListener('click', () => {
    state.fabricReceiveCart.delete(b.dataset.receiveCartRemove); renderAll();
  }));
  const receiveScanCamera = document.getElementById('receiveScanCamera');
  const receiveScanFile = document.getElementById('receiveScanFile');
  if (receiveScanCamera && receiveScanFile){
    receiveScanCamera.addEventListener('click', () => receiveScanFile.click());
    receiveScanFile.addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      receiveScanFile.value = '';
      if (!file) return;
      decodeQrFromFile(file, (text) => {
        if (!text){ state.fabricReceiveScanError = 'Could not read a QR code from that photo — try again, or type the tag ID.'; renderAll(); return; }
        const input = document.getElementById('receiveScanInput');
        if (input) input.value = text.trim();
        tryLookupReceiveScan();
      });
    });
  }

  const printTagBtn = document.getElementById('printTagBtn');
  if (printTagBtn) printTagBtn.addEventListener('click', () => {
    const e = FABRIC_ENTRIES.find(x=>x.id===state.fabricLastTagId);
    if (e) printDocument(printableTagHtml(e));
  });
  const copyTagDetailsBtn = document.getElementById('copyTagDetailsBtn');
  if (copyTagDetailsBtn) copyTagDetailsBtn.addEventListener('click', () => {
    const e = FABRIC_ENTRIES.find(x=>x.id===state.fabricLastTagId);
    if (!e) return;
    const o = ORDERS.find(x=>x.po===e.po);
    const text = [`Tag ${e.id}`,`${e.fabricName}`,`SKU: ${e.sku==='NA'?'Client-supplied':e.sku}`,`Qty: ${e.qty} ${e.unit}`,`Furn PO: ${e.po}`,`Customer: ${o?o.customer:'—'}`,`Product: ${e.product||'—'}`,`Fnsh PO: ${e.furnishingsPo}`,`Recv'd: ${fmtDate(e.received)}`].join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(()=>{});
    state.fabricCopyDetailsFlash = true; renderAll();
    setTimeout(() => { state.fabricCopyDetailsFlash = false; renderAll(); }, 1400);
  });
  document.querySelectorAll('[data-fab-log-toggle]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.fabLogToggle;
    state.fabricLogExpanded.has(id) ? state.fabricLogExpanded.delete(id) : state.fabricLogExpanded.add(id);
    renderAll();
  }));
  document.querySelectorAll('[data-fab-view-tag]').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    state.fabViewModal = { type:'tag', id: b.dataset.fabViewTag };
    renderAll();
  }));
  document.querySelectorAll('[data-fab-print-tag]').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const e = FABRIC_ENTRIES.find(x=>x.id===b.dataset.fabPrintTag);
    if (e) printDocument(printableTagHtml(e));
  }));
  document.querySelectorAll('[data-fab-view-challan]').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    state.fabViewModal = { type:'challan', id: b.dataset.fabViewChallan };
    renderAll();
  }));
  document.querySelectorAll('[data-fab-print-challan]').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    const c = FABRIC_CHALLANS.find(x=>x.id===b.dataset.fabPrintChallan);
    if (c) printDocument(printableChallanHtml(c), {top:true});
  }));
  document.querySelectorAll('[data-fab-view-receipt]').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation();
    state.fabViewModal = { type:'receipt', id: b.dataset.fabViewReceipt };
    renderAll();
  }));
  const fabModalOverlay = document.getElementById('fabModalOverlay');
  if (fabModalOverlay) fabModalOverlay.addEventListener('click', (ev) => { if (ev.target === fabModalOverlay){ state.fabViewModal = null; renderAll(); } });
  const fabModalClose = document.getElementById('fabModalClose');
  if (fabModalClose) fabModalClose.addEventListener('click', () => { state.fabViewModal = null; renderAll(); });
  const fabModalCloseBtn = document.getElementById('fabModalCloseBtn');
  if (fabModalCloseBtn) fabModalCloseBtn.addEventListener('click', () => { state.fabViewModal = null; renderAll(); });
  const fabModalPrint = document.getElementById('fabModalPrint');
  if (fabModalPrint) fabModalPrint.addEventListener('click', () => {
    const m = state.fabViewModal;
    if (!m) return;
    if (m.type === 'tag'){ const e = FABRIC_ENTRIES.find(x=>x.id===m.id); if (e) printDocument(printableTagHtml(e)); }
    else if (m.type === 'challan'){ const c = FABRIC_CHALLANS.find(x=>x.id===m.id); if (c) printDocument(printableChallanHtml(c), {top:true}); }
  });
  const fabLogSearch = document.getElementById('fabLogSearch');
  if (fabLogSearch) fabLogSearch.addEventListener('input', (e) => { state.fabricLogSearch = e.target.value; renderAll(); fabLogSearch.focus(); fabLogSearch.setSelectionRange(fabLogSearch.value.length, fabLogSearch.value.length); });
  const fabLogDownloadCsv = document.getElementById('fabLogDownloadCsv');
  if (fabLogDownloadCsv) fabLogDownloadCsv.addEventListener('click', () => {
    const headers = ['Material','SKU','Furniture PO','Furnishings PO','Qty','Unit','Received','Status'];
    const rows = FABRIC_ENTRIES.map(e => [e.fabricName, e.sku, e.po, e.furnishingsPo, e.qty, e.unit, e.received||'', entryStatus(e)]);
    downloadCsv('furnishings-tag-log.csv', [headers, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n'));
  });

  // Intake form fields all write straight into state.fabricDraft and re-render, so the
  // Tag Preview panel (built from that same object) stays live as the live tool's does.
  // 'change' rather than 'input' on free-text fields — updates on blur/commit instead of
  // every keystroke, so a full renderAll() never yanks focus out from under mid-word typing.
  const inClientSupplied = document.getElementById('in_clientSupplied');
  if (inClientSupplied) inClientSupplied.addEventListener('change', (e) => { state.fabricDraft.clientSupplied = e.target.checked; state.fabricDraft.furnishingsPo=''; renderAll(); });
  const inFurnishingsPo = document.getElementById('in_furnishingsPo');
  if (inFurnishingsPo) inFurnishingsPo.addEventListener('change', (e) => { state.fabricDraft.furnishingsPo = e.target.value; renderAll(); });
  const inMaterial = document.getElementById('in_material');
  if (inMaterial) inMaterial.addEventListener('change', (e) => { state.fabricDraft.material = e.target.value; renderAll(); });
  const inQty = document.getElementById('in_qty');
  if (inQty) inQty.addEventListener('change', (e) => { state.fabricDraft.qty = e.target.value; renderAll(); });
  const inUnit = document.getElementById('in_unit');
  if (inUnit) inUnit.addEventListener('change', (e) => { state.fabricDraft.unit = e.target.value; renderAll(); });
  const inReceived = document.getElementById('in_received');
  if (inReceived) inReceived.addEventListener('change', (e) => { state.fabricDraft.received = e.target.value; renderAll(); });
  const inFurniturePo = document.getElementById('in_furniturePo');
  if (inFurniturePo) inFurniturePo.addEventListener('change', (e) => { state.fabricDraft.furniturePo = e.target.value; renderAll(); });
  const inComponent = document.getElementById('in_component');
  if (inComponent) inComponent.addEventListener('change', (e) => { state.fabricDraft.component = e.target.value; renderAll(); });

  const submitIntake = document.getElementById('submitIntake');
  if (submitIntake) submitIntake.addEventListener('click', () => {
    const d = state.fabricDraft;
    const materialRaw = d.material.trim();
    if (!materialRaw) return;
    let sku, fabricName;
    if (d.clientSupplied){ sku = 'NA'; fabricName = materialRaw; }
    else if (materialRaw.includes('—')) { const parts = materialRaw.split('—').map(s=>s.trim()); sku = parts[0]; fabricName = parts[1] || parts[0]; }
    else { sku = materialRaw; fabricName = materialRaw; }
    const qty = Number(d.qty) || 0;
    if (qty<=0) return;
    const unit = d.unit;
    const po = d.furniturePo;
    if (!po) return;
    const o = ORDERS.find(x=>x.po===po);
    const component = d.component.trim();
    const received = d.received || todayStr();
    const furnishingsPo = d.clientSupplied ? 'Fabric sent by client' : d.furnishingsPo;
    // Duplicate-SKU advisory — matches the live Intake tab: it warns, but never blocks
    // logging a second tag for a SKU already pending against the same Furnishings PO.
    const dupCount = !d.clientSupplied ? FABRIC_ENTRIES.filter(e => e.sku===sku && e.furnishingsPo===furnishingsPo).length : 0;
    state.fabricIntakeMessage = dupCount ? `This SKU has already been logged against this Furnishings PO. Adding this created a second tag for it — fine for a partial delivery, otherwise check the Logbook tab.` : '';
    const newTag = {
      id:'FTS-'+Math.floor(1000+Math.random()*9000),
      fabricName, sku, materialUom:unit, furnishingsPo,
      po, qty, unit,
      product:o?o.article:'', productCode:o?o.sku:'', customer:o?o.customer:'', component,
      received, addedAt:new Date().toISOString(),
      loggedByName:actingUserName(), loggedByPhone:'—', loggedByLocation:'MFPL-Upholstery',
      destReceivedAt:null, destReceivedBy:null, destLocation:null,
      dispatches:[], receipts:[]
    };
    FABRIC_ENTRIES.unshift(newTag);
    state.fabricLastTagId = newTag.id;
    state.fabricDraft = { clientSupplied:false, furnishingsPo:'', material:'', qty:'', unit:'metres', received:todayStr(), furniturePo:'', component:'' };
    renderAll();
  });

  const submitDispatch = document.getElementById('submitDispatch');
  if (submitDispatch) submitDispatch.addEventListener('click', () => {
    const ids = [...state.fabricDispatchCart];
    if (!ids.length) return;
    const from = document.getElementById('disp_from').value;
    const to = document.getElementById('disp_to').value;
    if (!to) return;
    const challanNo = 'CHL-'+Math.floor(2000+Math.random()*900);
    const nowIsoVal = nowIso();
    const entries = ids.map(id=>FABRIC_ENTRIES.find(e=>e.id===id)).filter(Boolean);
    entries.forEach(e => { e.dispatches.push({ dispatchedAt:nowIsoVal, dispatchedBy:actingUserName(), dispatchedPhone:'—', location:from, challanNo }); });
    FABRIC_CHALLANS.unshift({
      id:challanNo, challanNo, date:nowIsoVal.slice(0,10), createdAt:nowIsoVal, createdBy:actingUserName(), createdByPhone:'—',
      fromLabel:from, fromAddress:addressFor(from), toLabel:to, toAddress:addressFor(to),
      items: entries.map(e=>({ id:e.id, sku:e.sku, fabricName:e.fabricName, qty:e.qty, unit:e.unit }))
    });
    state.fabricDispatchCart = new Set();
    renderAll();
  });
  const cancelDispatch = document.getElementById('cancelDispatch');
  if (cancelDispatch) cancelDispatch.addEventListener('click', () => { state.fabricDispatchCart = new Set(); renderAll(); });

  const submitReceive = document.getElementById('submitReceive');
  if (submitReceive) submitReceive.addEventListener('click', () => {
    const ids = [...state.fabricReceiveCart];
    if (!ids.length) return;
    const location = document.getElementById('recv_location').value.trim() || 'Factory';
    const receiptNo = 'RCV-'+Math.floor(500+Math.random()*400);
    const nowIsoVal = nowIso();
    const entries = ids.map(id=>FABRIC_ENTRIES.find(e=>e.id===id)).filter(Boolean);
    entries.forEach(e => {
      e.receipts.push({ receivedAt:nowIsoVal, receivedBy:actingUserName(), receivedPhone:'—', location, receiptNo });
      e.destReceivedAt = nowIsoVal; e.destReceivedBy = actingUserName(); e.destLocation = location;
    });
    FABRIC_RECEIPTS.unshift({
      id:receiptNo, receiptNo, date:nowIsoVal.slice(0,10), createdAt:nowIsoVal, createdBy:actingUserName(), createdByPhone:'—', location,
      items: entries.map(e=>({ id:e.id, sku:e.sku, fabricName:e.fabricName, qty:e.qty, unit:e.unit }))

      id:'REV-'+Math.floor(3000+Math.random()*900), so, customer: customerForSo(so), poRaised: poRaisedForSo(so), poCancellation,

    renderAll();
  }));
  document.querySelectorAll('[data-dl-history]').forEach(b => b.addEventListener('click', () => {
    state.deadlineHistoryModal = b.dataset.dlHistory; state.fabViewModal = null; renderAll();
  }));
  const dlModalOverlay = document.getElementById('dlModalOverlay');
  if (dlModalOverlay) dlModalOverlay.addEventListener('click', (ev) => { if (ev.target === dlModalOverlay){ state.deadlineHistoryModal = null; renderAll(); } });
  const dlModalClose = document.getElementById('dlModalClose');
  if (dlModalClose) dlModalClose.addEventListener('click', () => { state.deadlineHistoryModal = null; renderAll(); });
  const dlModalCloseBtn = document.getElementById('dlModalCloseBtn');
  if (dlModalCloseBtn) dlModalCloseBtn.addEventListener('click', () => { state.deadlineHistoryModal = null; renderAll(); });

  // Warehouse Tag Station
  document.querySelectorAll('[data-whtab]').forEach(b => b.addEventListener('click', () => {
    state.whTab = b.dataset.whtab;
    state.whDispatchCart = new Set(); state.whDispatchScan = ''; state.whDispatchScanError = '';
    state.whReceiveCart = new Set(); state.whReceiveScan = ''; state.whReceiveScanError = ''; state.whReceiveLookupId = null;
    renderAll();
  }));
  // Intake form fields write straight into state.whDraft and re-render, same reasoning
  // as the Furnishings Tag Station's fabricDraft (see its wiring comment above) — the Tag
  // preview panel reads from this same object, so it stays live as the form is filled in.
  const wh_orderId = document.getElementById('wh_orderId');
  if (wh_orderId) wh_orderId.addEventListener('change', (e) => { state.whDraft.orderId = e.target.value; renderAll(); });
  const wh_qty = document.getElementById('wh_qty');
  if (wh_qty) wh_qty.addEventListener('change', (e) => { state.whDraft.qty = e.target.value; renderAll(); });
  const wh_unit = document.getElementById('wh_unit');
  if (wh_unit) wh_unit.addEventListener('change', (e) => { state.whDraft.unit = e.target.value; renderAll(); });
  const submitWarehouseIntake = document.getElementById('submitWarehouseIntake');
  if (submitWarehouseIntake) submitWarehouseIntake.addEventListener('click', () => {
    const d = state.whDraft;
    const o = ORDERS.find(x=>x.id===d.orderId);
    const qty = Number(d.qty);
    if (!o || !qty || qty<1) return;
    WAREHOUSE_TAGS.unshift({ id:'WHT-'+Math.floor(1000+Math.random()*9000), tagNo:'WHT-'+Math.floor(1000+Math.random()*9000), so:o.so, po:o.po,
      article:o.article, sku:o.sku, qty, uom:d.unit, packedBy:actingUserName(), packedAt:nowIso(), dispatches:[], receipts:[] });
    state.whDraft = { orderId:'', qty:'', unit:'PCS' };
    renderAll();
  });

  // Dispatch — scan/type one tag ID at a time, mirroring Furnishings' pattern exactly, minus
  // any From/To address selection since the destination is always the single Brand Warehouse.
  function tryAddWhDispatchScan(){
    const input = document.getElementById('whDispatchScanInput');
    const raw = (input ? input.value : '').trim();
    if (!raw) return;
    const t = WAREHOUSE_TAGS.find(x => x.id.toLowerCase() === raw.toLowerCase() || x.tagNo.toLowerCase() === raw.toLowerCase());
    if (!t){ state.whDispatchScanError = `No tag found with ID "${raw}".`; state.whDispatchScan = raw; renderAll(); return; }
    if (warehouseTagStatus(t) !== 'awaiting_dispatch'){ state.whDispatchScanError = `${t.tagNo} is not awaiting dispatch right now (status: ${warehouseTagStatus(t).replace('_',' ')}).`; state.whDispatchScan = raw; renderAll(); return; }
    if (state.whDispatchCart.has(t.id)){ state.whDispatchScanError = `${t.tagNo} is already in this batch.`; state.whDispatchScan = raw; renderAll(); return; }
    state.whDispatchCart.add(t.id);
    state.whDispatchScan = ''; state.whDispatchScanError = '';
    renderAll();
  }
  const whDispatchScanAdd = document.getElementById('whDispatchScanAdd');
  if (whDispatchScanAdd) whDispatchScanAdd.addEventListener('click', tryAddWhDispatchScan);
  const whDispatchScanInput = document.getElementById('whDispatchScanInput');
  if (whDispatchScanInput){
    whDispatchScanInput.addEventListener('input', (e) => { state.whDispatchScan = e.target.value; });
    whDispatchScanInput.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); tryAddWhDispatchScan(); } });
    whDispatchScanInput.focus();
  }
  document.querySelectorAll('[data-wh-dispatch-cart-remove]').forEach(b => b.addEventListener('click', () => {
    state.whDispatchCart.delete(b.dataset.whDispatchCartRemove); renderAll();
  }));
  const whDispatchScanCamera = document.getElementById('whDispatchScanCamera');
  const whDispatchScanFile = document.getElementById('whDispatchScanFile');
  if (whDispatchScanCamera && whDispatchScanFile){
    whDispatchScanCamera.addEventListener('click', () => whDispatchScanFile.click());
    whDispatchScanFile.addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      whDispatchScanFile.value = '';
      if (!file) return;
      decodeQrFromFile(file, (text) => {
        if (!text){ state.whDispatchScanError = 'Could not read a QR code from that photo — try again, or type the tag ID.'; renderAll(); return; }
        const input = document.getElementById('whDispatchScanInput');
        if (input) input.value = text.trim();
        tryAddWhDispatchScan();
      });
    });
  }
  const submitWhDispatch = document.getElementById('submitWhDispatch');
  if (submitWhDispatch) submitWhDispatch.addEventListener('click', () => {
    const ids = [...state.whDispatchCart];
    if (!ids.length) return;
    const dispatchBatchNo = 'WDP-'+Math.floor(300+Math.random()*600);
    const nowIsoVal = nowIso();
    ids.map(id=>WAREHOUSE_TAGS.find(t=>t.id===id)).filter(Boolean).forEach(t => {
      t.dispatches.push({ dispatchedAt:nowIsoVal, dispatchedBy:actingUserName(), dispatchBatchNo });
    });
    state.whDispatchCart = new Set(); state.whDispatchScanError = '';
    renderAll();
  });
  const cancelWhDispatch = document.getElementById('cancelWhDispatch');
  if (cancelWhDispatch) cancelWhDispatch.addEventListener('click', () => { state.whDispatchCart = new Set(); state.whDispatchScanError = ''; renderAll(); });

  // Receive — a two-step look-up-then-add, same reasoning as Furnishings' receive flow.
  function tryLookupWhReceiveScan(){
    const input = document.getElementById('whReceiveScanInput');
    const raw = (input ? input.value : '').trim();
    if (!raw) return;
    const t = WAREHOUSE_TAGS.find(x => x.id.toLowerCase() === raw.toLowerCase() || x.tagNo.toLowerCase() === raw.toLowerCase());
    if (!t){ state.whReceiveScanError = `No tag found with ID "${raw}".`; state.whReceiveLookupId = null; renderAll(); return; }
    if (warehouseTagStatus(t) !== 'in_transit'){ state.whReceiveScanError = `${t.tagNo} is not in transit right now (status: ${warehouseTagStatus(t).replace('_',' ')}).`; state.whReceiveLookupId = null; renderAll(); return; }
    if (state.whReceiveCart.has(t.id)){ state.whReceiveScanError = `${t.tagNo} is already in this batch.`; state.whReceiveLookupId = null; renderAll(); return; }
    state.whReceiveScanError = ''; state.whReceiveLookupId = t.id;
    renderAll();
  }
  const whReceiveScanLookup = document.getElementById('whReceiveScanLookup');
  if (whReceiveScanLookup) whReceiveScanLookup.addEventListener('click', tryLookupWhReceiveScan);
  const whReceiveScanInput = document.getElementById('whReceiveScanInput');
  if (whReceiveScanInput){
    whReceiveScanInput.addEventListener('input', (e) => { state.whReceiveScan = e.target.value; });
    whReceiveScanInput.addEventListener('keydown', (e) => { if (e.key === 'Enter'){ e.preventDefault(); tryLookupWhReceiveScan(); } });
    whReceiveScanInput.focus();
  }
  const whReceiveScanConfirmAdd = document.getElementById('whReceiveScanConfirmAdd');
  if (whReceiveScanConfirmAdd) whReceiveScanConfirmAdd.addEventListener('click', () => {
    if (state.whReceiveLookupId) state.whReceiveCart.add(state.whReceiveLookupId);
    state.whReceiveLookupId = null; state.whReceiveScan = '';
    renderAll();
  });
  document.querySelectorAll('[data-wh-receive-cart-remove]').forEach(b => b.addEventListener('click', () => {
    state.whReceiveCart.delete(b.dataset.whReceiveCartRemove); renderAll();
  }));
  const whReceiveScanCamera = document.getElementById('whReceiveScanCamera');
  const whReceiveScanFile = document.getElementById('whReceiveScanFile');
  if (whReceiveScanCamera && whReceiveScanFile){
    whReceiveScanCamera.addEventListener('click', () => whReceiveScanFile.click());
    whReceiveScanFile.addEventListener('change', (ev) => {
      const file = ev.target.files && ev.target.files[0];
      whReceiveScanFile.value = '';
      if (!file) return;
      decodeQrFromFile(file, (text) => {
        if (!text){ state.whReceiveScanError = 'Could not read a QR code from that photo — try again, or type the tag ID.'; renderAll(); return; }
        const input = document.getElementById('whReceiveScanInput');
        if (input) input.value = text.trim();
        tryLookupWhReceiveScan();
      });
    });
  }
  const submitWhReceive = document.getElementById('submitWhReceive');
  if (submitWhReceive) submitWhReceive.addEventListener('click', () => {
    const ids = [...state.whReceiveCart];
    if (!ids.length) return;
    const receiptBatchNo = 'WRC-'+Math.floor(500+Math.random()*500);
    const nowIsoVal = nowIso();
    ids.map(id=>WAREHOUSE_TAGS.find(t=>t.id===id)).filter(Boolean).forEach(t => {
      t.receipts.push({ receivedAt:nowIsoVal, receivedBy:actingUserName(), receiptBatchNo });
    });
    state.whReceiveCart = new Set(); state.whReceiveScanError = '';
    renderAll();
  });
  const cancelWhReceive = document.getElementById('cancelWhReceive');
  if (cancelWhReceive) cancelWhReceive.addEventListener('click', () => { state.whReceiveCart = new Set(); state.whReceiveScanError = ''; renderAll(); });

  const whLogSearch = document.getElementById('whLogSearch');
  if (whLogSearch) whLogSearch.addEventListener('input', (e) => { state.whLogSearch = e.target.value; renderAll(); whLogSearch.focus(); whLogSearch.setSelectionRange(whLogSearch.value.length, whLogSearch.value.length); });
  const whLogDownloadCsv = document.getElementById('whLogDownloadCsv');
  if (whLogDownloadCsv) whLogDownloadCsv.addEventListener('click', () => {
    const headers = ['Tag','Article','SKU','SO','PO','Qty','Unit','Packed','Status'];
    const rows = WAREHOUSE_TAGS.map(t => [t.tagNo, t.article, t.sku, t.so, t.po, t.qty, t.uom, t.packedAt||'', warehouseTagStatus(t)]);
    downloadCsv('warehouse-tag-log.csv', [headers, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n'));
  });

  // Admin Uploads (admin only, shell) — clicking the button opens the hidden file picker;
  // picking a file just records its name and when, nothing is read or parsed.
  document.querySelectorAll('[data-upload-trigger]').forEach(b => b.addEventListener('click', () => {
    const inp = document.querySelector(`[data-upload-section="${b.dataset.uploadTrigger}"]`);
    if (inp) inp.click();
  }));
  document.querySelectorAll('[data-upload-section]').forEach(inp => inp.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    state.adminUploads[inp.dataset.uploadSection] = { filename: file.name, uploadedAt: nowIso(), uploadedBy: actingUserName() };
    renderAll();
  }));

  // User Permissions (admin only)
  document.querySelectorAll('[data-permtab]').forEach(b => b.addEventListener('click', () => { state.permTab = b.dataset.permtab; renderAll(); }));
  const submitAddUser = document.getElementById('submitAddUser');
  if (submitAddUser) submitAddUser.addEventListener('click', () => {
    const name = document.getElementById('nu_name').value.trim();
    const email = document.getElementById('nu_email').value.trim();
    const role = document.getElementById('nu_role').value;
    if (!name || !email) return;
    USERS.push({ id:'U-'+Math.floor(100+Math.random()*900), name, email, password:'1234', role });
    renderAll();
  });
  document.querySelectorAll('[data-user-reset]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.userReset;
    const u = USERS.find(x=>x.id===id);
    const temp = Math.random().toString(36).slice(2,8).toUpperCase();
    if (u) u.password = temp;
    state.userResetNotices[id] = temp;
    renderAll();
  }));
  document.querySelectorAll('[data-user-edit]').forEach(b => b.addEventListener('click', () => {
    const u = USERS.find(x=>x.id===b.dataset.userEdit);
    if (!u) return;
    state.userEditFor = u.id;
    state.userEditName = u.name;
    state.userEditEmail = u.email;
    state.userEditRole = u.role;
    state.userEditError = '';
    renderAll();
  }));
  const ueModalOverlay = document.getElementById('ueModalOverlay');
  if (ueModalOverlay) ueModalOverlay.addEventListener('click', (ev) => { if (ev.target === ueModalOverlay){ state.userEditFor = null; renderAll(); } });
  const ueModalClose = document.getElementById('ueModalClose');
  if (ueModalClose) ueModalClose.addEventListener('click', () => { state.userEditFor = null; renderAll(); });
  const ueModalCancel = document.getElementById('ueModalCancel');
  if (ueModalCancel) ueModalCancel.addEventListener('click', () => { state.userEditFor = null; renderAll(); });
  const ue_name = document.getElementById('ue_name');
  if (ue_name) ue_name.addEventListener('input', (e) => { state.userEditName = e.target.value; });
  const ue_email = document.getElementById('ue_email');
  if (ue_email) ue_email.addEventListener('input', (e) => { state.userEditEmail = e.target.value; });
  const ue_role = document.getElementById('ue_role');
  if (ue_role) ue_role.addEventListener('change', (e) => { state.userEditRole = e.target.value; });
  const ueModalSave = document.getElementById('ueModalSave');
  if (ueModalSave) ueModalSave.addEventListener('click', () => {
    const u = USERS.find(x=>x.id===state.userEditFor);
    if (!u) return;
    const name = (document.getElementById('ue_name').value || '').trim();
    const email = (document.getElementById('ue_email').value || '').trim();
    const role = document.getElementById('ue_role').value;
    if (!name){ state.userEditError = 'Name is required.'; renderAll(); return; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ state.userEditError = 'Enter a valid email address.'; renderAll(); return; }
    if (USERS.some(x => x.id !== u.id && x.email.toLowerCase() === email.toLowerCase())){ state.userEditError = 'Another user already has that email.'; renderAll(); return; }
    u.name = name; u.email = email; u.role = role;
    state.userEditFor = null; state.userEditError = '';
    renderAll();
  });
  document.querySelectorAll('[data-perm-vis]').forEach(el => el.addEventListener('change', () => {
    const [navId, role] = el.dataset.permVis.split(':');
    const v = state.permissions.visibility[navId] || (state.permissions.visibility[navId] = {});
    v[role] = el.checked;
    renderAll();
  }));
  document.querySelectorAll('[data-perm-edit]').forEach(el => el.addEventListener('change', () => {
    const [navId, role] = el.dataset.permEdit.split(':');
    const e = state.permissions.editAccess[navId] || (state.permissions.editAccess[navId] = {});
    e[role] = el.checked;
    renderAll();
  }));
}

const _publicOrderId = publicDeliveryFormOrderId();
if (_publicOrderId) renderPublicDeliveryPage(_publicOrderId);
else boot();
</script>
