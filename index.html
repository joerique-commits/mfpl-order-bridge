<title>Order Bridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --ink:#17212B; --ink-soft:#4B5561; --ink-faint:#8992A0;
    --paper:#EDEBE3; --surface:#FFFFFF; --surface-sunken:#E2DFD4;
    --line:#D9D5C8; --line-strong:#C4BFAE;
    --accent:#3B4C8C; --accent-strong:#2C3A6E; --accent-tint:#E4E7F3; --on-accent:#FFFFFF;
    --good:#3E7D52; --good-tint:#DEEEE2;
    --warn:#A66A1A; --warn-tint:#F3E4CC;
    --critical:#A3372C; --critical-tint:#F5DEDE;
    --neutral-tint:#E9E7DE;
    --domain-conf:#3B4C8C; --domain-conf-tint:#E4E7F3;
    --domain-fab:#7A5A1E; --domain-fab-tint:#F0E3C8;
    --domain-prod:#5C3E7D; --domain-prod-tint:#EBE2F2;
    --domain-stock:#1E7A6E; --domain-stock-tint:#D7EDE9;
    --domain-wh:#8C4A2E; --domain-wh-tint:#F1E0D6;
    --domain-lm:#2E6E8C; --domain-lm-tint:#DCE9EE;
    --domain-sr:#8C2E5C; --domain-sr-tint:#F1DCE6;
    --shadow: 0 1px 2px rgba(23,33,43,.07), 0 8px 22px -10px rgba(23,33,43,.20);
    --radius: 12px;
    --font-body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
    --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#ECEAE2; --ink-soft:#AFB6BE; --ink-faint:#7A828C;
      --paper:#161A1E; --surface:#1F252B; --surface-sunken:#262D33;
      --line:#333B42; --line-strong:#414B53;
      --accent:#8C9EE0; --accent-strong:#AAB9EC; --accent-tint:#242B47; --on-accent:#141A2E;
      --good:#7FC498; --good-tint:#1B3324;
      --warn:#E3A85C; --warn-tint:#3A2C15;
      --critical:#E38B82; --critical-tint:#3A1F1D;
      --neutral-tint:#2A2F35;
      --domain-conf:#8C9EE0; --domain-conf-tint:#242B47;
      --domain-fab:#E0B267; --domain-fab-tint:#362B15;
      --domain-prod:#BFA0DE; --domain-prod-tint:#2E263A;
      --domain-stock:#6FC2B4; --domain-stock-tint:#163330;
      --domain-wh:#E0A47E; --domain-wh-tint:#3A2417;
      --domain-lm:#8FC4DE; --domain-lm-tint:#1C333D;
      --domain-sr:#E08FB8; --domain-sr-tint:#3A1F2C;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -10px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --ink:#ECEAE2; --ink-soft:#AFB6BE; --ink-faint:#7A828C;
    --paper:#161A1E; --surface:#1F252B; --surface-sunken:#262D33;
    --line:#333B42; --line-strong:#414B53;
    --accent:#8C9EE0; --accent-strong:#AAB9EC; --accent-tint:#242B47; --on-accent:#141A2E;
    --good:#7FC498; --good-tint:#1B3324;
    --warn:#E3A85C; --warn-tint:#3A2C15;
    --critical:#E38B82; --critical-tint:#3A1F1D;
    --neutral-tint:#2A2F35;
    --domain-conf:#8C9EE0; --domain-conf-tint:#242B47;
    --domain-fab:#E0B267; --domain-fab-tint:#362B15;
    --domain-prod:#BFA0DE; --domain-prod-tint:#2E263A;
    --domain-stock:#6FC2B4; --domain-stock-tint:#163330;
    --domain-wh:#E0A47E; --domain-wh-tint:#3A2417;
    --domain-lm:#8FC4DE; --domain-lm-tint:#1C333D;
    --domain-sr:#E08FB8; --domain-sr-tint:#3A1F2C;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -10px rgba(0,0,0,.55);
  }

  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  button, input, select, textarea{ font-family:inherit; font-size:14px; color:inherit; }
  .num, .mono{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  @media (prefers-reduced-motion: reduce){ *{ animation-duration:.01ms !important; transition-duration:.01ms !important; } }

  /* ---------- shell ---------- */
  #app{ display:flex; min-height:100dvh; }
  nav.rail{
    width:236px; flex:none; background:var(--surface); border-right:1px solid var(--line);
    display:flex; flex-direction:column; padding:18px 12px; gap:2px;
  }
  .brand{ display:flex; align-items:center; gap:9px; padding:6px 10px 18px; }
  .brand .mark{
    width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .brand .mark svg{ width:17px; height:17px; }
  .brand .name{ font-weight:700; font-size:15.5px; letter-spacing:-.01em; }
  .brand .sub{ font-size:10.5px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; margin-top:1px; }

  .navitem{
    display:flex; align-items:center; gap:9px; padding:9px 11px; border-radius:8px;
    color:var(--ink-soft); font-weight:500; font-size:13.2px; cursor:pointer; border:none; background:none;
    text-align:left; width:100%;
  }
  .navitem svg{ width:17px; height:17px; flex:none; }
  .navitem span.label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .navitem:hover{ background:var(--surface-sunken); color:var(--ink); }
  .navitem[aria-current="true"]{ background:var(--accent-tint); color:var(--accent-strong); font-weight:600; }
  .navitem .badge{
    margin-left:auto; font-family:var(--font-mono); font-size:10.5px; font-weight:600;
    background:var(--critical-tint); color:var(--critical); border-radius:999px; padding:1px 6px; flex:none;
  }
  .navitem-viewonly{
    font-size:8.6px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint);
    border:1px solid var(--line); border-radius:4px; padding:1px 5px; flex:none; white-space:nowrap;
  }
  .rail-foot{ margin-top:auto; padding:12px 10px 4px; border-top:1px solid var(--line); }
  .rail-foot .link{ font-size:12px; color:var(--ink-faint); padding:6px 4px; line-height:1.5; }
  .rail-foot .link strong{ color:var(--ink-soft); }

  .navstrip{ display:none; }

  main.stage{ flex:1; min-width:0; display:flex; flex-direction:column; }
  header.topbar{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:16px 26px; border-bottom:1px solid var(--line); background:var(--surface);
    position:sticky; top:0; z-index:5;
  }
  header.topbar .titles h1{ font-size:19px; font-weight:700; letter-spacing:-.01em; }
  header.topbar .titles p{ margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); }

  .role-switch{ display:flex; align-items:center; gap:10px; }
  .role-seg{ display:flex; background:var(--surface-sunken); border-radius:9px; padding:3px; gap:2px; }
  .role-seg button{
    border:none; background:none; padding:6px 11px; border-radius:7px; font-size:12.5px; font-weight:600;
    color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .role-seg button[aria-pressed="true"]{ background:var(--surface); color:var(--accent-strong); box-shadow:var(--shadow); }
  .whoami{ text-align:right; display:flex; align-items:center; gap:10px; }
  .whoami .who-text{ text-align:right; }
  .whoami .name{ font-size:12.5px; font-weight:600; }
  .whoami .role{ font-size:11px; color:var(--ink-faint); }
  #logoutBtn{ font-size:12px; }

  .content{ flex:1; padding:24px 26px 60px; max-width:1180px; width:100%; margin:0 auto; }

  /* ---------- login screen ---------- */
  .login-screen{
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:var(--paper); padding:24px;
  }
  .login-card{
    width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 26px;
  }
  .login-brand{ display:flex; align-items:center; gap:9px; margin-bottom:22px; }
  .login-brand .mark{
    width:32px; height:32px; border-radius:8px; background:var(--accent); color:var(--on-accent);
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .login-brand .mark svg{ width:18px; height:18px; }
  .login-brand .name{ font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .login-brand .sub{ font-size:10.5px; color:var(--ink-faint); letter-spacing:.06em; text-transform:uppercase; margin-top:1px; }
  .login-card h2{ font-size:16px; margin:0 0 16px; }
  .login-card .field{ margin-bottom:14px; }
  .login-error{ color:var(--critical); font-size:12.5px; margin:-4px 0 12px; }
  .login-hint{ font-size:11.5px; color:var(--ink-faint); margin-top:14px; text-align:center; }

  /* ---------- generic pieces ---------- */
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
    padding:3px 9px; border-radius:999px; white-space:nowrap;
  }
  .pill.good{ background:var(--good-tint); color:var(--good); }
  .pill.warn{ background:var(--warn-tint); color:var(--warn); }
  .pill.critical{ background:var(--critical-tint); color:var(--critical); }
  .pill.neutral{ background:var(--neutral-tint); color:var(--ink-soft); }
  .pill .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }

  .domain-tag{
    display:inline-flex; align-items:center; font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; padding:3px 8px; border-radius:6px; white-space:nowrap;
  }
  .domain-tag.confirmation{ background:var(--domain-conf-tint); color:var(--domain-conf); }
  .domain-tag.fabric{ background:var(--domain-fab-tint); color:var(--domain-fab); }
  .domain-tag.production{ background:var(--domain-prod-tint); color:var(--domain-prod); }
  .domain-tag.stockblock{ background:var(--domain-stock-tint); color:var(--domain-stock); }
  .domain-tag.warehouse{ background:var(--domain-wh-tint); color:var(--domain-wh); }
  .domain-tag.lastmile{ background:var(--domain-lm-tint); color:var(--domain-lm); }
  .domain-tag.sorevision{ background:var(--domain-sr-tint); color:var(--domain-sr); }

  .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .section-head h2{ font-size:16.5px; font-weight:700; }
  .section-head .hint{ font-size:12.5px; color:var(--ink-faint); }
  .group-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); margin:22px 0 10px; display:flex; align-items:center; gap:8px; }
  .group-label:first-child{ margin-top:0; }

  .preview-banner{
    display:flex; align-items:flex-start; gap:10px; background:var(--accent-tint); color:var(--accent-strong);
    border:1px solid var(--accent); border-radius:10px; padding:11px 14px; font-size:12.8px; line-height:1.55;
    margin-bottom:18px;
  }
  .preview-banner.dashed{ border-style:dashed; }
  .preview-banner svg{ flex:none; margin-top:1px; }
  .preview-banner strong{ font-weight:700; }

  /* ---------- dashboard ---------- */
  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; }
  .stat-grid.cols3{ grid-template-columns:repeat(3,1fr); }
  .stat-grid.cols5{ grid-template-columns:repeat(5,1fr); }
  .stat-tile{ padding:16px 17px; }
  .stat-tile.clickable-tile{ cursor:pointer; transition:border-color .12s ease, transform .12s ease; }
  .stat-tile.clickable-tile:hover{ border-color:var(--line-strong); }
  .stat-tile .label{ font-size:11.5px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .stat-tile .value{ font-family:var(--font-mono); font-size:28px; font-weight:600; margin-top:7px; line-height:1; }
  .stat-tile .sub{ font-size:12px; color:var(--ink-soft); margin-top:6px; }
  .stat-tile.accent .value{ color:var(--accent-strong); }
  .stat-tile.flag .value{ color:var(--critical); }

  .attn-list .row{
    display:grid; grid-template-columns:.7fr 1.5fr 1fr 1.3fr .9fr; gap:12px; align-items:center;
    padding:12px 18px; border-bottom:1px solid var(--line); font-size:13px;
  }
  .attn-list .row:last-child{ border-bottom:none; }
  .attn-list .row.head{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; padding-bottom:9px; }
  .attn-list .cust{ font-weight:600; }
  .attn-list .meta{ color:var(--ink-faint); font-size:11.5px; margin-top:1px; }
  .attn-list .row > div{ overflow:hidden; text-overflow:ellipsis; }
  .attn-list .row.clickable{ cursor:pointer; }
  .attn-list .row.clickable:hover{ background:var(--surface-sunken); }

  /* ---------- table ---------- */
  .table-wrap{ overflow-x:auto; }
  /* NOTE: this file has no <!DOCTYPE html>, so the browser renders it in quirks mode, where
     <table> elements famously do NOT inherit `color` from their ancestors (a legacy quirk
     preserved for backward compatibility) even though every other element does. That's
     invisible everywhere the table's default color happens to match the ambient theme, but
     it breaks visibly the moment a table sits inside a locally re-themed scope (e.g. the
     Furnishings/Warehouse Tag Station's dark .fts-scope/.wts-scope wrapper) — the table resets
     to the page's outer (light-theme) ink color and its text becomes unreadable against the
     dark background. `color:inherit` below forces it to actually inherit like every other
     element, without touching the DOCTYPE (which risks much wider layout changes app-wide). */
  table.grid-table{ width:100%; border-collapse:collapse; min-width:760px; color:inherit; }
  table.grid-table th{
    text-align:left; font-size:10.8px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint);
    font-weight:600; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.grid-table td{ padding:11px 14px; border-bottom:1px solid var(--line); font-size:13.2px; vertical-align:middle; }
  table.grid-table tbody tr:last-child td{ border-bottom:none; }
  table.grid-table tbody tr.clickable{ cursor:pointer; transition:background .1s ease; }
  table.grid-table tbody tr.clickable:hover{ background:var(--surface-sunken); }
  table.grid-table tbody tr.selected{ background:var(--accent-tint); }
  table.grid-table td input[type="checkbox"]{ width:15px; height:15px; }
  .cell-primary{ font-weight:600; }
  .cell-sub{ font-size:11.5px; color:var(--ink-faint); margin-top:1px; }

  .progress-track{ width:100%; height:6px; border-radius:99px; background:var(--surface-sunken); overflow:hidden; }
  .progress-fill{ height:100%; border-radius:99px; background:var(--accent); }
  .progress-fill.warn{ background:var(--warn); }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
  .search{ position:relative; width:min(300px,100%); }
  .search input{ width:100%; padding:8px 12px 8px 32px; border:1px solid var(--line); border-radius:9px; background:var(--surface); }
  .search svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--ink-faint); }
  .filter-chip{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:999px;
    padding:6px 12px; font-size:12px; font-weight:600; cursor:pointer;
  }
  .filter-chip[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  .filter-row{ display:flex; gap:7px; flex-wrap:wrap; }

  .btn{
    appearance:none; border:none; cursor:pointer; border-radius:9px; font-weight:600; font-size:13.4px;
    padding:9px 15px; display:inline-flex; align-items:center; gap:7px; transition:filter .12s ease,background .12s ease;
  }
  .btn-primary{ background:var(--accent); color:var(--on-accent); }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--line); }
  .btn-ghost:hover{ border-color:var(--line-strong); color:var(--ink); }
  .btn-text{ background:none; border:none; color:var(--accent-strong); font-weight:600; cursor:pointer; padding:6px 4px; font-size:13px; }
  .btn-sm{ padding:6px 11px; font-size:12.5px; }

  .ready-check{ display:inline-flex; align-items:center; gap:6px; font-size:12.2px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .ready-check.disabled{ color:var(--ink-faint); cursor:not-allowed; }

  /* ---------- confirmation / generic detail ---------- */
  .detail-head{
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:20px 22px;
    border-bottom:1px solid var(--line); flex-wrap:wrap;
  }
  .detail-head h2{ font-size:18px; font-weight:700; }
  .detail-head .ref{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-faint); margin-top:3px; }
  .order-facts{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px 20px; padding:18px 22px; background:var(--surface-sunken); border-bottom:1px solid var(--line); }
  .order-facts .f-k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; }
  .order-facts .f-v{ font-size:13.6px; font-weight:600; margin-top:3px; }
  .order-facts .f-v.mono{ font-family:var(--font-mono); font-weight:600; }

  .form-body{ padding:22px; display:flex; flex-direction:column; gap:22px; }
  .form-section .fs-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .form-section .fs-head .fs-num{
    width:20px; height:20px; border-radius:50%; background:var(--accent-tint); color:var(--accent-strong);
    font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex:none;
  }
  .form-section .fs-head h3{ font-size:13.6px; font-weight:700; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field.span2{ grid-column:1 / -1; }
  .field label{ font-size:11.5px; font-weight:600; color:var(--ink-soft); }
  .field label .opt{ font-weight:400; color:var(--ink-faint); text-transform:none; }
  .field input, .field textarea, .field select{
    border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:8px;
    padding:8.5px 10px; width:100%; resize:vertical;
  }
  .field input:focus, .field textarea:focus, .field select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); }
  .field.uncertain input, .field.uncertain select{ border-color:var(--warn); box-shadow:0 0 0 2px var(--warn-tint); }
  .field-note{ font-size:11px; color:var(--ink-faint); }
  .part-po-note{
    display:flex; gap:9px; align-items:flex-start; background:var(--warn-tint); color:var(--warn);
    border-radius:9px; padding:10px 12px; font-size:12.5px; line-height:1.5;
  }

  .detail-foot{
    display:flex; align-items:center; justify-content:space-between; gap:14px; padding:16px 22px;
    border-top:1px solid var(--line); background:var(--surface-sunken); flex-wrap:wrap;
  }
  .detail-foot .confirmed-meta{ font-size:12px; color:var(--ink-soft); }
  .detail-foot .actions{ display:flex; gap:9px; margin-left:auto; }
  .readonly-banner{
    display:flex; align-items:center; gap:9px; background:var(--neutral-tint); color:var(--ink-soft);
    padding:10px 14px; border-radius:9px; font-size:12.5px; margin:18px 22px 0;
  }

  /* ---------- fabric status block (inside order detail) ---------- */
  .fabric-status-card{ border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .fabric-status-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--surface);
    border-bottom:1px solid var(--line);
  }
  .fabric-status-row:last-child{ border-bottom:none; }
  .fabric-status-row .fs-name{ font-weight:600; flex:1; min-width:0; }
  .fabric-status-row .fs-qty{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); }
  .fabric-empty{ padding:14px; font-size:12.5px; color:var(--ink-faint); background:var(--surface); }

  /* ---------- timeline ---------- */
  .timeline{ padding:6px 14px 14px; background:var(--surface-sunken); }
  .tl-item{ display:flex; gap:12px; }
  .tl-marker{ display:flex; flex-direction:column; align-items:center; width:14px; flex:none; }
  .tl-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); margin-top:5px; flex:none; }
  .tl-line{ flex:1; width:2px; background:var(--line-strong); margin:2px 0; }
  .tl-body{ padding:0 0 16px; }
  .tl-item:last-child .tl-body{ padding-bottom:2px; }
  .tl-label{ font-weight:600; font-size:13px; }
  .tl-meta{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); margin-top:1px; }

  /* ---------- module sub-tabs (fabric station / needs attention) ---------- */
  .subtabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }

  /* ---------- tag stations: real QR codes + scan cart ---------- */

  /* ---------- modal (view / reprint) ---------- */
  #modalRoot:empty{ display:none; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(23,33,43,0.55); z-index:200;

  .modal-card{
    background:var(--surface); border-radius:14px; max-width:640px; width:100%;

  }
  .modal-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;

  .modal-head h3{ font-size:15px; margin:0 0 2px; }

  .modal-items-table{ width:100%; border-collapse:collapse; margin-top:14px; font-size:12.5px; }

  .modal-items-table th{ color:var(--ink-faint); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:.03em; }

  /* ---------- print (tag / delivery challan) ---------- */
  #printArea{ display:none; }
  .print-doc{ font-family:var(--font-sans); color:#111; }
  .print-doc .p-tag{ display:flex; align-items:center; gap:34px; justify-content:center; }
  .print-doc .p-tag .p-qr svg{ display:block; width:230px; height:230px; }
  .print-doc .p-challan-head .p-qr svg{ display:block; width:100px; height:100px; }
  .print-doc .p-tag-id{ font-family:var(--font-mono); font-size:26px; font-weight:700; letter-spacing:.02em; margin-bottom:6px; }
  .print-doc .p-tag-name{ font-size:17px; font-weight:600; margin-bottom:10px; }
  .print-doc table{ border-collapse:collapse; font-size:13px; }
  .print-doc table td{ padding:3px 0; }
  .print-doc table td:first-child{ color:#555; padding-right:16px; white-space:nowrap; }
  .print-doc .p-challan-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:24px; margin-bottom:16px; }
  .print-doc .p-challan-title{ font-size:20px; font-weight:700; }
  .print-doc .p-challan-meta{ font-size:12.5px; color:#444; margin-top:4px; }
  .print-doc .p-addr-row{ display:flex; gap:40px; margin-bottom:14px; font-size:12.5px; }

  .print-doc .p-items-table th, .print-doc .p-items-table td{ border-bottom:1px solid #ccc; padding:6px 8px; text-align:left; }
  .print-doc .p-items-table th{ font-size:10px; text-transform:uppercase; color:#666; letter-spacing:.03em; }
  .print-doc .p-items-table .p-item-qr svg{ width:34px; height:34px; display:block; }
  @media print {
    body > *:not(#printArea){ display:none !important; }
    #printArea{ display:block !important; }
    #printArea .print-page{ width:100%; min-height:95vh; display:flex; align-items:center; justify-content:center; padding:6mm; box-sizing:border-box; }
    #printArea .print-page.print-doc-top{ align-items:flex-start; }
    @page { size: landscape; margin: 6mm; }

  /* ---------- preview modules ---------- */
  .jobcard-tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .empty-note{ padding:40px 20px; text-align:center; color:var(--ink-faint); font-size:13px; }

  /* ---------- job card stage bar + detail ---------- */
  .jobcard-stagebar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .stagebox{
    flex:1; min-width:98px; border:1px solid var(--line); background:var(--surface); border-radius:10px;
    padding:10px 12px; cursor:pointer; text-align:left; color:inherit;

  .stagebox .sb-count{ font-family:var(--font-mono); font-weight:700; font-size:16px; }
  .stagebox .sb-label{ font-size:10.5px; color:var(--ink-faint); margin-top:2px; line-height:1.3; }
  .jc-stages{ border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .jc-stage-row{
    display:grid; grid-template-columns:1.1fr 1.3fr 1.4fr; gap:10px; align-items:center;

  .jc-stage-dates{ font-family:var(--font-mono); color:var(--ink-soft); font-size:11.5px; }

  /* ---------- job card capture (method chooser, stage-edit table, link search) ---------- */
  .method-cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .method-card{
    border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:18px 14px;
    text-align:center; cursor:pointer; color:inherit;
  }
  .method-card:hover{ border-color:var(--line-strong); background:var(--surface-sunken); }
  .method-card.active{ border-color:var(--accent); background:var(--accent-tint); }
  .method-card .mc-emoji{ font-size:22px; }
  .method-card .mc-title{ font-weight:700; font-size:13px; margin-top:6px; }
  .method-card .mc-sub{ font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .signed-in-row{ font-size:12.5px; color:var(--ink-soft); margin-top:8px; }
  .signed-in-row .chg{ color:var(--accent-strong); font-weight:600; }

  .link-search-box{ border:1px solid var(--line); border-radius:10px; padding:12px; background:var(--surface-sunken); }
  .link-results{ display:flex; flex-direction:column; gap:6px; margin-top:8px; max-height:220px; overflow-y:auto; }
  .link-result-row{
    display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 10px;
    background:var(--surface); border:1px solid var(--line); border-radius:8px; cursor:pointer; font-size:12.5px;
  }
  .link-result-row:hover{ border-color:var(--accent); }
  .link-result-row .lr-main{ font-weight:600; }
  .link-result-row .lr-sub{ color:var(--ink-faint); font-size:11px; }
  .linked-chip{
    display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px;
    background:var(--good-tint); color:var(--good); border-radius:9px; font-size:12.8px;
  }
  .linked-chip .lc-sub{ color:var(--ink-soft); font-size:11.5px; margin-top:2px; }

  .jc-edit-stages{ border:1px solid var(--line); border-radius:10px; overflow-x:auto; }
  table.jc-edit-table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; color:inherit; }
  table.jc-edit-table th{ text-align:left; padding:8px 10px; background:var(--surface-sunken); font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint); border-bottom:1px solid var(--line); }
  table.jc-edit-table td{ padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.jc-edit-table tr:last-child td{ border-bottom:none; }
  table.jc-edit-table input[type="date"]{ border:1px solid var(--line); border-radius:6px; padding:5px 7px; background:var(--paper); color:var(--ink); width:100%; }
  table.jc-edit-table input[type="checkbox"]{ width:16px; height:16px; }

  .material-row-grid{ display:grid; grid-template-columns:50px 1fr 110px 32px; gap:8px; align-items:center; margin-bottom:8px; }
  .material-row-grid input{ border:1px solid var(--line); border-radius:7px; padding:7px 9px; background:var(--paper); color:var(--ink); width:100%; }
  .mat-remove{ border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:14px; }
  .mat-remove:hover{ color:var(--critical); }

  .progress-dots{ display:flex; gap:3px; align-items:center; }
  .progress-dots .pd{ width:7px; height:7px; border-radius:50%; background:var(--line-strong); flex:none; }
  .progress-dots .pd.filled{ background:var(--accent); }
  .progress-dots .pd.done{ background:var(--good); }

  .dropzone{
    border:1.5px dashed var(--line-strong); border-radius:10px; padding:26px 18px; text-align:center;
    font-size:13px; color:var(--ink-soft); cursor:pointer; background:var(--surface-sunken);
  }
  .dropzone:hover{ border-color:var(--accent); color:var(--ink); }
  .dropzone.dragover{ border-color:var(--accent); background:var(--accent-tint); }

  @media (max-width: 980px){
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .stat-grid.cols3{ grid-template-columns:repeat(2,1fr); }
    .stat-grid.cols5{ grid-template-columns:repeat(2,1fr); }
    .order-facts{ grid-template-columns:repeat(2,1fr); }
    .field-grid{ grid-template-columns:1fr; }
    .attn-list .row{ grid-template-columns:.8fr 1.4fr 1fr; }

    .jc-stage-row{ grid-template-columns:1fr; gap:4px; }
    .method-cards{ grid-template-columns:1fr; }
  }
  @media (max-width: 860px){
    nav.rail{ display:none; }
    .navstrip{
      display:flex; gap:6px; overflow-x:auto; padding:10px 14px; border-bottom:1px solid var(--line);
      background:var(--surface); -webkit-overflow-scrolling:touch;
    }
    .navstrip button{
      flex:none; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft);
      padding:7px 13px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap;

  /* ---------- Furnishings Tag Station — replica of the live tool's own UI ----------
     magariupholsterytagstation.edgeone.dev is a real tool already in daily use by
     supply-chain/production staff. Everything in here is scoped to .fts-scope, which
     overrides the shared design tokens locally so every existing primitive (.card,
     .btn, .pill, .field input, .grid-table, .subtabs...) repaints to match the live
     tool's own dark theme without needing its own bespoke markup. See the project doc
     "furnishings-tag-station-ui-reference.md" for the captured source-of-truth.

     Warehouse Tag Station (below) reuses these same *structural* classes (header/stats/
     tabs/two-col intake+preview/tag card/scan+lookup row) so the app's two "tag station"
     modules share one interaction pattern — but it has no external live tool of its own to
     pixel-match, so it deliberately does NOT opt into .fts-scope's dark palette override;
     it stays in Order Bridge's own ambient theme. Only the shared selectors below are
     written as ".fts-x, .wts-x" for that reason; .fts-scope, .fts-cta-gold and .fts-scan-btn
     stay Furnishings-only (gold is a live-tool-specific brand color, not a house style), and
     Warehouse Tag Station uses the ordinary .btn.btn-primary / .wts-scan-btn (accent, not
     gold) instead. */
  .fts-scope{
    --paper:#14181A; --surface:#1B2022; --surface-sunken:#20262A;
    --ink:#E9ECE6; --ink-soft:#B7BEC0; --ink-faint:#7C8684;
    --line:#333B3B; --line-strong:#454F4F;
    --accent:#8FB0DE; --accent-strong:#AFC6E8; --accent-tint:#1E2733; --on-accent:#10151D;
    --good:#7FC498; --good-tint:#16261C;
    --warn:#D9A85A; --warn-tint:#332711;
    --critical:#E38B82; --critical-tint:#301715;
    --radius:8px;
    background:var(--paper); color:var(--ink); border-radius:14px;
    padding:20px; margin:-4px -4px 0;
  }
  .fts-scope .card{ box-shadow:none; }
  .fts-scope table.grid-table{ min-width:680px; }
  .fts-head, .wts-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .fts-eyebrow, .wts-eyebrow{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); }
  .fts-title, .wts-title{ font-size:30px; font-weight:700; margin-top:4px; font-family:var(--font-mono); letter-spacing:-.01em; }
  .fts-title .accent, .wts-title .accent{ color:var(--accent); }
  .fts-sub, .wts-sub{ font-size:13px; color:var(--ink-soft); margin-top:6px; max-width:480px; line-height:1.5; }
  .fts-stats, .wts-stats{ display:flex; gap:8px; flex-wrap:wrap; }
  .fts-stat-pill, .wts-stat-pill{
    display:inline-flex; align-items:baseline; gap:5px; background:var(--surface); border:1px solid var(--line);
    border-radius:999px; padding:7px 14px; font-size:12.5px; color:var(--ink-faint); white-space:nowrap;
  }
  .fts-stat-pill b, .wts-stat-pill b{ font-family:var(--font-mono); font-size:14px; color:var(--accent); font-weight:600; }
  .fts-tabs, .wts-tabs{ display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
  .fts-tabs button, .wts-tabs button{
    border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); border-radius:999px;
    padding:7px 15px; font-size:12.8px; font-weight:600; cursor:pointer;
  }
  .fts-tabs button[aria-pressed="true"], .wts-tabs button[aria-pressed="true"]{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .fts-divider, .wts-divider{ border:none; border-top:1px solid var(--line); margin:0 0 20px; }
  .fts-scope .action-card{ padding:20px 22px; }
  .fts-two-col, .wts-two-col{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start; }
  .fts-preview, .wts-preview{ position:sticky; top:16px; }
  .fts-tag, .wts-tag{
    border:1px solid var(--line); border-radius:10px; padding:18px 20px; background:var(--paper);
  }
  .fts-tag-top, .wts-tag-top{ display:flex; justify-content:space-between; align-items:flex-start; }
  .fts-tag-id, .wts-tag-id{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-faint); }
  .fts-tag-title, .wts-tag-title{ font-size:19px; font-weight:700; margin-top:2px; color:var(--ink); }
  .fts-tag-title.placeholder, .wts-tag-title.placeholder{ color:var(--ink-faint); font-weight:600; }
  .fts-tag-body, .wts-tag-body{ display:flex; gap:16px; align-items:flex-start; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .fts-tag-fields, .wts-tag-fields{ flex:1; display:flex; flex-direction:column; gap:9px; min-width:0; }
  .fts-tag-fields .row, .wts-tag-fields .row{ display:flex; justify-content:space-between; gap:10px; font-size:12.8px; }
  .fts-tag-fields .k, .wts-tag-fields .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); font-weight:600; flex:none; align-self:center; }
  .fts-tag-fields .v, .wts-tag-fields .v{ font-family:var(--font-mono); font-weight:600; text-align:right; }
  .fts-tag-qr, .wts-tag-qr{ flex:none; text-align:center; }

  .fts-tag-qr .qr-cap, .wts-tag-qr .qr-cap{ font-size:9.5px; color:var(--ink-faint); margin-top:6px; max-width:90px; line-height:1.3; }
  .fts-tag-actions, .wts-tag-actions{ display:flex; gap:9px; margin-top:16px; }
  .fts-cta-gold{ background:var(--warn); color:#1C1102; }

  .fts-scan-btn{
    width:100%; background:var(--warn); color:#1C1102; border:none; border-radius:8px; padding:13px 16px;
    font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .fts-scan-btn:hover{ filter:brightness(1.06); }
  .wts-scan-btn{
    width:100%; background:var(--accent); color:var(--on-accent); border:none; border-radius:8px; padding:13px 16px;
    font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;

  .wts-scan-btn:hover{ filter:brightness(1.08); }
  .fts-or-divider, .wts-or-divider{ display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--ink-faint); font-size:12px; }
  .fts-or-divider::before, .fts-or-divider::after, .wts-or-divider::before, .wts-or-divider::after{ content:''; flex:1; border-top:1px solid var(--line); }
  .fts-lookup-row, .wts-lookup-row{ display:flex; gap:8px; }

  .fts-warn-banner, .wts-warn-banner{
    display:flex; gap:8px; align-items:flex-start; background:var(--warn-tint); border:1px solid var(--warn);
    color:var(--warn); border-radius:8px; padding:11px 13px; font-size:12.3px; line-height:1.5; margin-top:4px;
  }
  .fts-location-pill, .wts-location-pill{ display:inline-flex; font-family:var(--font-mono); font-size:11px; font-weight:700; background:var(--accent-tint); color:var(--accent-strong); border-radius:6px; padding:2px 8px; }
  @media (max-width: 980px){ .fts-two-col, .wts-two-col{ grid-template-columns:1fr; } .fts-preview, .wts-preview{ position:static; } }
</style>

const TODAY = new Date('2026-09-17');
function todayStr(){ return TODAY.toISOString().slice(0,10); }
function nowIso(){ return new Date().toISOString(); }

// ---- working-day math (Mon–Fri assumed; no holiday calendar — flag if wrong) ----
function isWorkingDay(d){ const day = d.getDay(); return day !== 0 && day !== 6; }
function addWorkingDays(dateStr, n){
  let d = new Date(dateStr);
  const step = n >= 0 ? 1 : -1;
  let remaining = Math.abs(n);
  while (remaining > 0){ d.setDate(d.getDate() + step); if (isWorkingDay(d)) remaining--; }
  return d.toISOString().slice(0,10);
}
// working days strictly between two dates (positive if `to` is after `from`)
function workingDaysBetween(fromStr, toStr){
  const from = new Date(fromStr), to = new Date(toStr);
  const sign = to >= from ? 1 : -1;
  let a = sign === 1 ? new Date(from) : new Date(to);
  const b = sign === 1 ? to : from;
  let count = 0;
  while (a < b){ a.setDate(a.getDate() + 1); if (isWorkingDay(a)) count++; }
  return sign * count;
}

const REQUIRED_DETAIL_FIELDS = ['fabricSku','fabricName','placement','finish','design'];
function detailComplete(o){ return REQUIRED_DETAIL_FIELDS.every(k => (o.detail[k]||'').trim()); }
function openClarifications(o){ return (o.clarifications||[]).filter(c=>c.status==='open'); }
function productionCanStart(o){ return o.lifecycle==='po_confirmed' && openClarifications(o).length===0; }
function clarificationWindowEnd(o){ return o.poRaisedDate ? addWorkingDays(o.poRaisedDate, 15) : null; }
function clarificationWindowOpen(o){ const end = clarificationWindowEnd(o); return o.lifecycle==='po_confirmed' && !!end && todayStr() <= end; }
function readinessDate(o){ return o.productionDeadline ? addWorkingDays(o.productionDeadline, 5) : null; }
// The production deadline is no longer typed in — it's read off the linked Job Card's own
// Packing-stage end date. No Job Card, or Packing not yet recorded complete, means nothing
// to compute yet.
function computedProductionDeadline(o){
  const jc = JOB_CARDS.find(j => j.linkedPo === o.po);
  if (!jc) return null;
  const packing = jc.stages.find(s => s.key === 'packing');
  return (packing && packing.endDateISO) ? packing.endDateISO : null;
}
// A change becomes proposable once the Job Card's computed date differs from whatever's
// currently in effect on the order, and nothing is already sitting in admin's queue for it.
function deadlineChangeAvailable(o){
  const computed = computedProductionDeadline(o);
  if (!computed || o.pendingDeadlineChange) return null;
  return computed !== o.productionDeadline ? computed : null;
}
// On-track / tight / at-risk, based on whether the computed sales-readiness date leaves any
// working-day buffer before the customer's committed deadline — replaces the old lifecycle-
// only risk read, which said nothing once a PO was confirmed.
function deadlineRiskPill(o){
  if (!o.productionDeadline) return `<span class="pill neutral"><span class="dot"></span>Awaiting Job Card</span>`;
  const gap = workingDaysBetween(readinessDate(o), o.committedDeadline);
  if (gap < 0) return `<span class="pill critical"><span class="dot"></span>Misses committed date</span>`;
  if (gap === 0) return `<span class="pill warn"><span class="dot"></span>Tight — no buffer</span>`;
  return `<span class="pill good"><span class="dot"></span>On track</span>`;
}
function lifecyclePill(o){
  if (o.lifecycle==='po_confirmed') return `<span class="pill good"><span class="dot"></span>PO Confirmed</span>`;
  if (o.lifecycle==='submitted') return `<span class="pill warn"><span class="dot"></span>Submitted — awaiting supply</span>`;
  return detailComplete(o) ? `<span class="pill neutral"><span class="dot"></span>Ready to raise</span>` : `<span class="pill critical"><span class="dot"></span>Draft</span>`;
}

// Job Card Station — the 7-stage schema and merge/status logic (sanitizeEntry,
// computeStatus) ported verbatim from the live jobcards.js (Netlify Blobs), verified
// 17 Sep to be identical on the EdgeOne port, and cross-checked 17 Sep against the live
// EdgeOne deployment's own Capture & Review / Dashboard / Orders flow.
const STAGE_DEFS = [
  { key:'preFrame', label:'Pre Frame' },
  { key:'postFrame', label:'Post Frame' },
  { key:'fabricationQc', label:'Fabrication QC' },
  { key:'polishingQc', label:'Polishing - QC' },
  { key:'upholsteryQc', label:'Upholstery - QC' },
  { key:'factoryQc', label:'Factory - QC' },
  { key:'packing', label:'Packing' },
];
function stageRow(key, label, opts){
  opts = opts || {};
  return { key, label, startDateRaw:opts.start||'', startDateISO:opts.start||'', endDateRaw:opts.end||'', endDateISO:opts.end||'', supervisorSigned:!!opts.sup, managerSigned:!!opts.mgr };
}
function emptyStages(){ return STAGE_DEFS.map(d => stageRow(d.key, d.label)); }
// Ported verbatim from jobcards.js's computeStatus — furthest-reached stage counts as
// current, and any earlier stage with nothing filled in at all is flagged as a gap.
function computeStatus(stages){
  const reachedIdx = [];
  stages.forEach((s,i) => { if (s.startDateRaw || s.endDateRaw || s.supervisorSigned || s.managerSigned) reachedIdx.push(i); });
  if (reachedIdx.length === 0) return { currentStageKey:null, currentStageLabel:'Not started', state:'not_started', furthestIndex:-1, gapIndexes:[] };
  const furthest = Math.max(...reachedIdx);
  const gapIndexes = [];
  for (let i=0;i<furthest;i++) if (!reachedIdx.includes(i)) gapIndexes.push(i);
  const furthestStage = stages[furthest];
  const isLast = furthest === stages.length - 1;
  const state = (isLast && furthestStage.endDateRaw) ? 'complete' : 'in_progress';
  return { currentStageKey:furthestStage.key, currentStageLabel:furthestStage.label, state, furthestIndex:furthest, gapIndexes };
}

// Last Mile Ops — booking core. Real order linking: a booking references a specific
// ORDERS line (orderId), not a free-typed PO string, so it can only ever be raised
// against an order that actually exists and has actually reached po_confirmed. Real
// capacity: bookable windows come from a fixed WEEKLY template rather than a free-text
// time box, and every template slot has a capacity — the number of concurrent bookings
// (requested + confirmed) it can hold — so a slot that's full is a hard block, not a
// warning. Dispatch and Installation are two independent booking types against the same
// weekly template: each has its own date/window, its own status lifecycle, and its own
// vendor — so an order can have an active Dispatch booking and an active Installation
// booking open at the same time (they don't conflict with each other), but can't be
// double-booked into a second active booking of the SAME type without cancelling the first.
const SLOT_TEMPLATE = [
  { dow:1, dayLabel:'Monday',    window:'10:00–12:00', capacity:2 },
  { dow:1, dayLabel:'Monday',    window:'14:00–16:00', capacity:2 },
  { dow:2, dayLabel:'Tuesday',   window:'10:00–12:00', capacity:2 },
  { dow:2, dayLabel:'Tuesday',   window:'14:00–16:00', capacity:2 },
  { dow:3, dayLabel:'Wednesday', window:'10:00–12:00', capacity:2 },
  { dow:3, dayLabel:'Wednesday', window:'14:00–16:00', capacity:2 },
  { dow:4, dayLabel:'Thursday',  window:'10:00–12:00', capacity:2 },
  { dow:4, dayLabel:'Thursday',  window:'14:00–16:00', capacity:2 },
  { dow:5, dayLabel:'Friday',    window:'10:00–12:00', capacity:2 },
  { dow:5, dayLabel:'Friday',    window:'14:00–16:00', capacity:1 },
  { dow:6, dayLabel:'Saturday',  window:'10:00–13:00', capacity:1 },
];
function slotsForDate(dateStr){
  if (!dateStr) return [];
  const d = new Date(dateStr+'T00:00:00');
  if (isNaN(d)) return [];
  return SLOT_TEMPLATE.filter(t => t.dow === d.getDay());
}
// Capacity is tracked per (date, window, type) — a Dispatch booking and an Installation
// booking on the same date/window draw against separate capacity, since they use
// different resources (a delivery vehicle vs an install crew), not the same truck slot.
function slotBookingsFor(dateStr, windowVal, type){
  return SLOT_BOOKINGS.filter(b => b.date===dateStr && b.window===windowVal && b.type===type && b.status!=='cancelled');
}
function slotCapacityFor(dateStr, windowVal){
  const t = slotsForDate(dateStr).find(t=>t.window===windowVal);
  return t ? t.capacity : 0;
}
function activeBookingForOrder(orderId, type){
  return SLOT_BOOKINGS.find(b => b.orderId===orderId && b.type===type && (b.status==='requested' || b.status==='confirmed'));
}
function lastMileBadgeForType(type){
  return SLOT_BOOKINGS.filter(b => b.type===type && b.status==='requested').length;
}
// Nav-rail badge: supply coordinates dispatch slots (see ROLES.supply's own emphasis), so
// it's the role that needs to know how many bookings — of either type — are still sitting
// in "requested" and waiting on a confirm.
function lastMileBadgeForRole(role){
  if (role==='supply' || role==='admin') return SLOT_BOOKINGS.filter(b=>b.status==='requested').length;
  return 0;
}

function riskPill(days, lifecycle){

const CSV_HEADERS = ['SO Number','PO Number','Customer','Article Code','Article Name','Qty','UOM','Fabric SKU','Fabric Name','Placement','Finish','Stone Type','Design Confirmation','Site Requirements','Site Mapping','Notes'];
function csvCell(v){ v = v==null?'':String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }

  return [CSV_HEADERS, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');

function downloadCsv(filename, text){
  const blob = new Blob(["﻿"+text], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
// Minimal RFC4180-ish parser — handles quoted fields with embedded commas/quotes, which
// is as far as a client-only mock needs to go.
function parseCsv(text){
  const rows = []; let row = []; let field = ''; let inQuotes = false;
  for (let i=0;i<text.length;i++){
    const c = text[i];
    if (inQuotes){
      if (c === '"'){ if (text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r'){ if (c === '\r' && text[i+1] === '\n') i++; row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r[0]||'').trim()!=='');
}
function handleCsvUpload(file){
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    if (!rows.length){ state.csvMessage = 'That file had no rows to read.'; renderAll(); return; }
    const headers = rows[0].map(h=>h.trim());
    const idx = name => headers.indexOf(name);
    let matched = 0, skipped = 0;
    rows.slice(1).forEach(r => {
      if (!r.length) return;
      const soNum = (r[idx('SO Number')]||'').trim();
      const artCode = (r[idx('Article Code')]||'').trim();
      const o = ORDERS.find(x => x.so===soNum && x.sku===artCode);
      if (!o || o.lifecycle !== 'draft'){ skipped++; return; }
      const get = name => { const i = idx(name); return i===-1 ? '' : (r[i]||'').trim(); };
      if (get('Fabric SKU')) o.detail.fabricSku = get('Fabric SKU');
      if (get('Fabric Name')) o.detail.fabricName = get('Fabric Name');
      if (get('Placement')) o.detail.placement = get('Placement');
      if (get('Finish')) o.detail.finish = get('Finish');
      if (get('Stone Type')) o.detail.stoneType = get('Stone Type');
      if (get('Design Confirmation')) o.detail.design = get('Design Confirmation');
      if (get('Site Requirements')) o.detail.siteReq = get('Site Requirements');
      if (get('Site Mapping')) o.detail.siteMap = get('Site Mapping');
      if (get('Notes')) o.detail.notes = get('Notes');
      matched++;
    });
    state.csvMessage = `Matched ${matched} line${matched===1?'':'s'} from the file` + (skipped ? `, skipped ${skipped} (already submitted, or no matching SO + Article Code found).` : '.');
    renderAll();
  };
  reader.readAsText(file);
}
// Job Card Station's "Import PO Summary" — replaces JOBCARD_ORDERS wholesale, same as the
// real tool's import. Column order is flexible (matched by header name); only "PO Number" is required.
function handleJobcardCsvImport(file){
  const reader = new FileReader();
  reader.onload = () => {
    const rows = parseCsv(String(reader.result));
    if (!rows.length){ state.csvMessage = 'That file had no rows to read.'; renderAll(); return; }
    const headers = rows[0].map(h=>h.trim());
    const idx = name => headers.indexOf(name);
    const iPo = idx('PO Number');
    if (iPo === -1){ state.csvMessage = 'That file is missing a "PO Number" column.'; renderAll(); return; }
    const get = (r, name) => { const i = idx(name); return i===-1 ? '' : (r[i]||'').trim(); };
    const parsed = rows.slice(1).map(r => ({
      po:(r[iPo]||'').trim(), poDate:get(r,'PO Date'), customer:get(r,'Customer'), vertical:get(r,'Vertical'),
      articleCode:get(r,'Article Code'), articleName:get(r,'Article Name'), uom:get(r,'UOM'),
      poQty: Number(get(r,'PO Qty')) || 0,
    })).filter(r => r.po);
    if (!parsed.length){ state.csvMessage = 'No valid PO rows found in that file.'; renderAll(); return; }
    JOBCARD_ORDERS = parsed;
    jobcardOrdersImportedAt = nowIso();
    state.csvMessage = `Imported ${parsed.length} row(s).`;
    renderAll();
  };
  reader.readAsText(file);
}

// The app shell only ever renders once someone has signed in — mock auth against
// the USERS directory (email as username, password '1234' for every seeded account).
// state.currentUser is the real signed-in identity; state.role is the ACTING role,
// which for admin can be switched to impersonate any function (see renderShell's
// role-seg), and for everyone else is simply fixed to their own account's role.
function renderLoginScreen(){
  const appEl = document.getElementById('app');
  if (appEl) appEl.style.display = 'none';
  const root = document.getElementById('loginScreen');
  if (!root) return;
  root.style.display = 'flex';
  root.className = 'login-screen';
  root.innerHTML = `
    <div class="login-card">
      <div class="login-brand">
        <div class="mark">${icon('grid')}</div>
        <div><div class="name">Order Bridge</div><div class="sub">MFPL Lifecycle</div></div>
      </div>
      <h2>Sign in</h2>
      <div class="field"><label>Email</label><input id="li_email" type="email" placeholder="name@magari.in" value="${state.loginEmail}" autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="li_password" type="password" placeholder="••••" autocomplete="current-password"></div>
      ${state.loginError ? `<div class="login-error">${state.loginError}</div>` : ''}
      <button class="btn btn-primary" id="loginSubmit" style="width:100%;">Sign in</button>
      <div class="login-hint">Password for every account is <span class="mono">1234</span> — email is the username.</div>
    </div>
  `;
  wireLoginEvents();
}
function wireLoginEvents(){
  const emailInput = document.getElementById('li_email');
  const passwordInput = document.getElementById('li_password');
  if (emailInput) emailInput.addEventListener('input', (e) => { state.loginEmail = e.target.value; });
  if (passwordInput) passwordInput.addEventListener('input', (e) => { state.loginPassword = e.target.value; });
  const tryLogin = () => {
    const email = ((emailInput && emailInput.value) || '').trim().toLowerCase();
    const password = (passwordInput && passwordInput.value) || '';
    const user = USERS.find(u => u.email.toLowerCase() === email && u.password === password);
    if (!user){
      state.loginError = 'Incorrect email or password.';
      state.loginPassword = '';
      renderLoginScreen();
      return;
    }
    state.currentUser = user;
    state.role = user.role;
    state.loginEmail = ''; state.loginPassword = ''; state.loginError = '';
    boot();
  };
  const submitBtn = document.getElementById('loginSubmit');
  if (submitBtn) submitBtn.addEventListener('click', tryLogin);
  [emailInput, passwordInput].forEach(inp => { if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryLogin(); }); });
}
function logout(){
  state.currentUser = null;

  ORDERS.filter(o=>o.lifecycle==='draft').forEach(o => allRows.push({ owner:'sales', domain:'confirmation', item:o.customer, itemSub:o.article, ref:o.so, detail: detailComplete(o) ? 'Ready — not yet submitted' : 'Details incomplete', status: lifecyclePill(o), sortKey:daysOut(o.committedDeadline), nav:{module:'confirmations', orderId:o.id} }));
  ORDERS.filter(o=>o.lifecycle==='submitted').forEach(o => allRows.push({ owner:'supply', domain:'confirmation', item:o.customer, itemSub:o.article, ref:o.so, detail:`Submitted by ${o.submittedBy} — needs PO-raised confirmation`, status: lifecyclePill(o), sortKey:daysOut(o.committedDeadline), nav:{module:'confirmations', orderId:o.id} }));
  ORDERS.filter(o=>o.lifecycle==='po_confirmed' && openClarifications(o).length).forEach(o => allRows.push({ owner:'sales', domain:'confirmation', item:o.customer, itemSub:o.article, ref:o.so, detail:`${openClarifications(o).length} open clarification(s) awaiting your response`, status:`<span class="pill critical">Response needed</span>`, sortKey:-5, nav:{module:'confirmations', orderId:o.id} }));
  ORDERS.filter(o=>deadlineChangeAvailable(o)).forEach(o => allRows.push({ owner:'production', domain:'production', item:o.customer, itemSub:o.article, ref:o.po, detail:`Job Card packing now shows ${fmtDate(deadlineChangeAvailable(o))} — propose adopting it as the production deadline`, status:`<span class="pill warn">Deadline update</span>`, sortKey:0, nav:{module:'deadlines', orderId:o.id} }));
  FABRIC_ENTRIES.filter(e=>entryStatus(e)==='awaiting_dispatch').forEach(e => { const o=ORDERS.find(x=>x.po===e.po); allRows.push({ owner:'supply', domain:'fabric', item:e.fabricName, itemSub:o?o.customer:e.furnishingsPo, ref:e.id, detail:`${e.qty} ${e.unit} awaiting dispatch`, status:fabricStatusPill('awaiting_dispatch'), sortKey:100, nav:{module:'fabric'} }); });
  FABRIC_ENTRIES.filter(e=>entryStatus(e)==='in_transit').forEach(e => { const o=ORDERS.find(x=>x.po===e.po); allRows.push({ owner:'production', domain:'fabric', item:e.fabricName, itemSub:o?o.customer:e.furnishingsPo, ref:e.id, detail:`${e.qty} ${e.unit} in transit`, status:fabricStatusPill('in_transit'), sortKey:100, nav:{module:'fabric'} }); });
  JOB_CARDS.filter(jc=>jobCardStageFlags(jc).length).forEach(jc => allRows.push({ owner:'production', domain:'production', item:jc.linkedArticleName||jc.jobCardNumber, itemSub:jc.jobCardNumber, ref:jc.linkedPo||jc.workOrderNumber||'—', detail:jobCardStageFlags(jc).join(' · '), status:`<span class="pill warn">Flagged</span>`, sortKey:100, nav:{module:'jobcards', jcId:jc.id} }));
  // Stock Block Station — it's fundamentally a supply-team call (see the section's own
  // banner), so every open request lands on supply's tab regardless of who raised it.
  STOCK_BLOCK_REQUESTS.filter(r=>r.status==='requested').forEach(r => allRows.push({ owner:'supply', domain:'stockblock', item:r.article, itemSub:r.so, ref:r.sku, detail:`${r.qtyRequested} ${r.uom} requested from ${warehouseLabel(r.warehouse)} by ${r.requestedBy} — ${r.reason}`, status: stockBlockStatusPill(r.status), sortKey:100, nav:{module:'stockblock'} }));
  // Warehouse Tag Station — production packs and dispatches a tag to the brand warehouse;
  // supply is the one who receives it there (mirrors the Furnishings Tag Station split above).
  WAREHOUSE_TAGS.filter(t=>warehouseTagStatus(t)==='awaiting_dispatch').forEach(t => allRows.push({ owner:'production', domain:'warehouse', item:t.article, itemSub:t.so, ref:t.tagNo, detail:`${t.qty} ${t.uom} packed, awaiting dispatch to the brand warehouse`, status:warehouseTagStatusPill('awaiting_dispatch'), sortKey:100, nav:{module:'warehousetag'} }));
  WAREHOUSE_TAGS.filter(t=>warehouseTagStatus(t)==='in_transit').forEach(t => allRows.push({ owner:'supply', domain:'warehouse', item:t.article, itemSub:t.so, ref:t.tagNo, detail:`${t.qty} ${t.uom} dispatched, awaiting receipt at the brand warehouse`, status:warehouseTagStatusPill('in_transit'), sortKey:100, nav:{module:'warehousetag'} }));
  // Last Mile Ops — supply coordinates dispatch slots (see ROLES.supply's own emphasis), so
  // a freshly requested booking of either type lands on its tab, needing confirmation.
  SLOT_BOOKINGS.filter(b=>b.status==='requested').forEach(b => { const o=ORDERS.find(x=>x.id===b.orderId); allRows.push({ owner:'supply', domain:'lastmile', item:o?o.article:b.orderId, itemSub:`${lastMileTypeLabel(b.type)} · ${o?o.customer:''}`, ref:b.id, detail:`${fmtDate(b.date)}, ${b.window} — awaiting confirmation`, status:slotStatusPill(b.status), sortKey:100, nav:{module:'slots'} }); });
  // SO Revision Request — Accounts reconciles value + advance (see ROLES.accounts' own
  // emphasis), and Supply separately validates the PO-cancellation answer. A pending
  // request lands on whichever of those two still has work left to do on it.
  SO_REVISION_REQUESTS.filter(r=>r.status==='pending').forEach(r => {
    const detail = `${reasonForRevisionText(r)} — value check ${r.valueCheck.done?'done':'pending'}, advance check ${r.advanceCheck.done?'done':'pending'}`;
    if (!r.supplyValidation.done) allRows.push({ owner:'supply', domain:'sorevision', item:r.so, itemSub:r.customer, ref:r.so, detail:`PO cancellation (${r.poCancellation}) needs validating — ${detail}`, status:soRevisionStatusPill(r.status), sortKey:100, nav:{module:'sorevision'} });
    allRows.push({ owner:'accounts', domain:'sorevision', item:r.so, itemSub:r.customer, ref:r.so, detail, status:soRevisionStatusPill(r.status), sortKey:100, nav:{module:'sorevision'} });
  });
  // A role that's had a menu section removed doesn't see attention rows pointing
  // at that section either — same rule the tile groups above apply, and it avoids
  // a needs-attention row that navigates to a module the viewer would just bounce out of.
  const visibleRows = allRows.filter(r => canViewSection(r.nav.module, state.role));
  visibleRows.sort((a,b)=>a.sortKey-b.sortKey);

  const attnRoles = canSeeSoRevision ? ['sales','supply','production','accounts'] : ['sales','supply','production'];
  if (!state.attnTab || !attnRoles.includes(state.attnTab)) state.attnTab = attnRoles.includes(state.role) ? state.role : 'sales';
  const rows = visibleRows.filter(r => r.owner === state.attnTab);

  return `
    ${canSeeConfirmations ? `
    <div class="group-label">Orders Yet to go into Production</div>
    <div class="stat-grid">
      <div class="card stat-tile clickable-tile" data-drill="all"><div class="label">Open order lines</div><div class="value">${total}</div><div class="sub">across ${new Set(ORDERS.map(o=>o.so)).size} sales orders</div></div>
      <div class="card stat-tile clickable-tile" data-drill="draft"><div class="label">Draft</div><div class="value">${draft}</div><div class="sub">not yet submitted</div></div>
      <div class="card stat-tile clickable-tile flag" data-drill="submitted"><div class="label">Submitted</div><div class="value">${submitted}</div><div class="sub">awaiting supply's PO-raised confirmation</div></div>
      <div class="card stat-tile clickable-tile accent" data-drill="po_confirmed"><div class="label">PO Confirmed</div><div class="value">${confirmed}</div><div class="sub">${partPOs} are part-POs with qty still pending</div></div>
    </div>

    ${state.dashboardDrill ? `
    <div class="group-label">${dashboardDrillLabel(state.dashboardDrill)} <button class="btn-text" id="clearDrill">Clear</button></div>
    ${renderSoTable(state.dashboardDrill==='all' ? ORDERS : ORDERS.filter(o=>o.lifecycle===state.dashboardDrill))}
    ` : ''}
    ` : ''}

    ${canSeeJobcards ? `
    <div class="group-label">Orders in Production</div>
    <div class="stat-grid">
      <div class="card stat-tile clickable-tile" data-nav-tile="jobcards"><div class="label">Active job cards</div><div class="value">${JOB_CARDS.length}</div><div class="sub">across ${jcLinkedPOs} linked POs</div></div>
      <div class="card stat-tile clickable-tile flag" data-nav-tile="jobcards"><div class="label">Missing a stage</div><div class="value">${jcFlagged}</div><div class="sub">skipped stage, nothing filled in</div></div>
      <div class="card stat-tile clickable-tile" data-nav-tile="jobcards"><div class="label">Not linked to a PO</div><div class="value">${jcUnlinked}</div><div class="sub">scanned but not yet matched</div></div>
      <div class="card stat-tile clickable-tile accent" data-nav-tile="jobcards"><div class="label">Order Deadlines</div><div class="value">${jcWithDeadline}</div><div class="sub">of ${JOB_CARDS.length} job cards have a deadline set</div></div>
    </div>
    ` : ''}

    <div class="card" style="margin-top:22px;">
      <div class="section-head" style="padding:18px 18px 0;">
        <h2>Needs attention — by function</h2>
        <span class="hint">${ROLES[state.role].emphasis}</span>
      </div>
      <div class="subtabs" style="padding:0 18px;">
        ${attnRoles.map(f => `<button data-attn-tab="${f}" aria-pressed="${state.attnTab===f}">${ROLES[f].label} (${visibleRows.filter(r=>r.owner===f).length})</button>`).join('')}
      </div>
      <div class="attn-list" style="padding:8px 0 4px;">
        <div class="row head"><div>Area</div><div>Item</div><div>Reference</div><div>Detail</div><div>Status</div></div>
        ${rows.map(r => `
          <div class="row clickable" data-attn-nav="1" data-attn-module="${r.nav.module}" data-attn-order="${r.nav.orderId||''}" data-attn-jc="${r.nav.jcId||''}">
            <div><span class="domain-tag ${r.domain}">${r.domain}</span></div>
            <div><div class="cust">${r.item}</div><div class="meta">${r.itemSub}</div></div>
            <div class="mono">${r.ref}</div>
            <div>${r.detail}</div>
            <div>${r.status}</div>
          </div>`).join('') || `<div class="empty-note">Nothing outstanding for ${ROLES[state.attnTab].label} right now.</div>`}
      </div>
    </div>
  `;
}

/* ============================= module: orders / PO confirmations list ============================= */
// A sales order counts as a "Part PO" the moment at least one of its SKU lines has
// already had a PO raised while at least one other line (or that same line's own
// remaining quantity) still hasn't — i.e. the SO has been raised in part, not in full,
// so there's still SKU-level action outstanding on it.
function soPartPOStatus(so){
  const group = ORDERS.filter(o=>o.so===so);
  const anyConfirmed = group.some(o=>o.lifecycle==='po_confirmed');
  const anyIncomplete = group.some(o=>o.lifecycle!=='po_confirmed' || o.poQty<o.qty);
  return anyConfirmed && anyIncomplete;
}
function partPoSOs(){ return new Set([...new Set(ORDERS.map(o=>o.so))].filter(soPartPOStatus)); }

function renderOrdersList(){
  let rows = ORDERS.slice();
  if (state.search.trim()){
    const q = state.search.toLowerCase();
    rows = rows.filter(o => [o.customer,o.so,o.po,o.article,o.sku].join(' ').toLowerCase().includes(q));
  }
  const partSOs = partPoSOs();
  if (state.statusFilter === 'part_po') rows = rows.filter(o => partSOs.has(o.so));
  else if (state.statusFilter !== 'all') rows = rows.filter(o => o.lifecycle === state.statusFilter);
  const canEditDetail = ['sales','admin'].includes(state.role) && canEditSection('confirmations', state.role);

  return `
    <div class="preview-banner">${icon('check')} <div><strong>Sales orders extended down to SKU/PO lines.</strong> Expand a sales order below to see and act on each line. A line only becomes raisable once every required field is filled in, and locks from sales' edits the moment supply confirms it's actually raised in the ERP. <strong>Part POs</strong> below flags any sales order that's been raised for some of its SKUs but not all — click it open to pick up the SKUs still pending.</div></div>

    ${canEditDetail ? `
    <div class="card action-card">
      <div class="ac-title">Bulk-fill via CSV</div>
      <div class="ac-sub">Download a template pre-filled with every draft line's identity columns, fill in the detail columns offline, then upload it back — this only pre-fills the form here. Raising the PO is still a separate, deliberate step on this screen.</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-ghost btn-sm" id="downloadCsvTemplate">Download CSV template</button>
        <label class="btn btn-ghost btn-sm" style="cursor:pointer;">Upload filled CSV<input type="file" id="uploadCsvInput" accept=".csv" style="display:none;"></label>
      </div>
      ${state.csvMessage ? `<div class="cell-sub" style="margin-top:8px;">${state.csvMessage}</div>` : ''}
    </div>` : ''}

    <div class="toolbar" style="margin-top:18px;">
      <div class="search">${icon('grid')}<input id="searchInput" placeholder="Search customer, SO, PO, article, SKU" value="${state.search}"></div>
      <div class="filter-row">
        ${['all','draft','submitted','po_confirmed','part_po'].map(f => `
          <button class="filter-chip" data-filter="${f}" aria-pressed="${state.statusFilter===f}">
            ${({all:'All',draft:'Draft',submitted:'Submitted',po_confirmed:'PO Confirmed',part_po:'Part POs'})[f]}${f==='part_po' && partSOs.size ? ` (${partSOs.size})` : ''}
          </button>`).join('')}
      </div>
    </div>

    ${renderSoTable(rows)}
  `;
}

function renderOrderFabricStatus(orderId){
  const o = ORDERS.find(x=>x.id===orderId);
  // Real linkage is by matching furniture PO text (entry.po), not a synthetic order id —
  // the live tool has no order foreign key at all.
  const entries = FABRIC_ENTRIES.filter(e=>e.po===o.po);
  if (!entries.length){
    return `<div class="fabric-status-card"><div class="fabric-empty">No fabric logged for this order's PO (${o.po}) yet in Furnishings Tag Station.</div></div>`;
  }
  return `<div class="fabric-status-card">
    ${entries.map(e => {
      const open = state.orderFabricExpanded.has(e.id);
      return `<div>
        <div class="fabric-status-row">
          <div class="fs-name">${e.fabricName} <span class="cell-sub">(${e.sku})</span></div>
          <div class="fs-qty">${e.qty} ${e.unit}</div>
          ${fabricStatusPill(entryStatus(e))}
          <button class="btn-text" data-fab-toggle="${e.id}">${open?'Hide history':'View movement history'}</button>
        </div>
        ${open ? renderTimeline(fabricTimelineForEntry(e)) : ''}
      </div>`;
    }).join('')}
  </div>`;
}

function renderClarifications(o, canRespond){
  const list = o.clarifications || [];
  if (!list.length) return `<div class="empty-note" style="padding:14px;">No clarifications raised.</div>`;
  return `<div class="fabric-status-card">${list.map(c => `
    <div class="fabric-status-row" style="flex-direction:column;align-items:stretch;gap:6px;">
      <div style="display:flex;justify-content:space-between;gap:10px;">
        <div><strong>${c.question}</strong><div class="cell-sub">Raised by ${c.raisedBy} · ${fmtDT(c.raisedAt)}</div></div>
        ${c.status==='open' ? `<span class="pill critical">Open</span>` : `<span class="pill good">Closed</span>`}
      </div>
      ${c.status==='closed'
        ? `<div class="tl-detail">Response: ${c.response} <span class="cell-sub">— ${c.respondedBy}, ${fmtDT(c.respondedAt)}</span></div>`
        : canRespond
          ? `<div class="field-grid"><div class="field span2"><textarea rows="2" data-clarification-response="${c.id}" placeholder="Your response — closes this clarification"></textarea></div></div><button class="btn btn-ghost btn-sm" data-close-clarification="${c.id}">Close clarification</button>`
          : ''}
    </div>`).join('')}</div>`;
}

/* ============================= module: order line detail ============================= */
function renderOrderDetail(orderId){
  const o = ORDERS.find(x=>x.id===orderId);
  const editableSection = canEditSection('confirmations', state.role);
  const canEditDetail = ['sales','admin'].includes(state.role) && o.lifecycle==='draft' && editableSection;
  const canConfirmSupply = ['supply','admin'].includes(state.role) && o.lifecycle==='submitted' && editableSection;
  const canRaiseClarification = ['production','admin'].includes(state.role) && o.lifecycle==='po_confirmed' && clarificationWindowOpen(o);
  const canRespondClarification = ['sales','admin'].includes(state.role) && editableSection;
  const isPartPO = o.poQty < o.qty;

  return `
    <button class="btn-text" id="backToList">&larr; All sales orders</button>
    <div class="card" style="margin-top:10px;">
      <div class="detail-head">
        <div><h2>${o.customer} — ${o.article}</h2><div class="ref">${o.so} &nbsp;·&nbsp; ${o.po} &nbsp;·&nbsp; ${o.sku}</div></div>
        ${lifecyclePill(o)}
      </div>
      <div class="order-facts">
        <div><div class="f-k">Vertical</div><div class="f-v">${o.vertical}</div></div>
        <div><div class="f-k">Quantity</div><div class="f-v mono">${o.poQty} of ${o.qty} ${o.uom}</div></div>
        <div><div class="f-k">Committed deadline</div><div class="f-v">${fmtDate(o.committedDeadline)}</div></div>
        <div><div class="f-k">Source</div><div class="f-v" style="font-weight:500;color:var(--ink-faint);">RFT Cloud Suite (read-only)</div></div>
      </div>

      ${o.lifecycle==='po_confirmed' ? `<div class="readonly-banner" style="margin:18px 22px 0;">${icon('lock')} PO raised ${fmtDate(o.poRaisedDate)} (confirmed by ${o.poConfirmedBy}). Sales can no longer revise these details — only respond to open clarifications below.</div>` : ''}

      <div class="form-body">
        ${isPartPO ? `<div class="part-po-note">${icon('split')}<div><strong>Part PO:</strong> ${o.poQty} of ${o.qty} ${o.uom} raised so far — ${o.qty-o.poQty} ${o.uom} still outstanding on this sales order.</div></div>` : ''}

        <div class="form-section">
          <div class="fs-head"><div class="fs-num">1</div><h3>Fabric &amp; placement</h3></div>
          <div class="field-grid">
            <div class="field"><label>Fabric / material SKU</label><input id="f_fabricSku" ${canEditDetail?'':'disabled'} value="${o.detail.fabricSku}" placeholder="e.g. WARBURWOODCLAY"></div>
            <div class="field"><label>Fabric name <span class="opt">(auto-fills from catalog)</span></label><input id="f_fabricName" ${canEditDetail?'':'disabled'} value="${o.detail.fabricName}" placeholder="e.g. Burwood Clay"></div>
            <div class="field span2"><label>Placement on furniture</label><textarea id="f_placement" rows="2" ${canEditDetail?'':'disabled'} placeholder="Which parts of the piece this fabric covers">${o.detail.placement}</textarea></div>
          </div>
        </div>
        <div class="form-section">
          <div class="fs-head"><div class="fs-num">2</div><h3>Finish &amp; design</h3></div>
          <div class="field-grid">
            <div class="field"><label>Polish / finish</label><input id="f_finish" ${canEditDetail?'':'disabled'} value="${o.detail.finish}" placeholder="e.g. Matte walnut stain, satin topcoat"></div>
            <div class="field"><label>Stone type <span class="opt">(if applicable)</span></label><input id="f_stone" ${canEditDetail?'':'disabled'} value="${o.detail.stoneType}" placeholder="e.g. Honed Carrara marble"></div>
            <div class="field span2"><label>Design confirmation</label><textarea id="f_design" rows="2" ${canEditDetail?'':'disabled'} placeholder="What's been approved, and by whom / which email">${o.detail.design}</textarea></div>
          </div>
        </div>
        <div class="form-section">
          <div class="fs-head"><div class="fs-num">3</div><h3>Site requirements</h3></div>
          <div class="field-grid">
            <div class="field span2"><label>Site work requirements <span class="opt">(optional)</span></label><textarea id="f_siteReq" rows="2" ${canEditDetail?'':'disabled'} placeholder="On-site assembly, access, install crew needs">${o.detail.siteReq}</textarea></div>
            <div class="field span2"><label>Site mapping <span class="opt">(optional)</span></label><textarea id="f_siteMap" rows="2" ${canEditDetail?'':'disabled'} placeholder="Zone / floor / room mapping for delivery">${o.detail.siteMap}</textarea></div>
          </div>
        </div>
        <div class="form-section">
          <div class="fs-head"><div class="fs-num">4</div><h3>Fabric status <span class="opt" style="text-transform:none;font-weight:500;">— from Furnishings Tag Station</span></h3></div>
          ${renderOrderFabricStatus(orderId)}
        </div>
        <div class="form-section">
          <div class="fs-head"><div class="fs-num">5</div><h3>Notes</h3></div>
          <div class="field-grid"><div class="field span2"><textarea id="f_notes" rows="2" ${canEditDetail?'':'disabled'} placeholder="Anything else supply or production should know">${o.detail.notes}</textarea></div></div>
        </div>

        <div class="form-section">
          <div class="fs-head"><div class="fs-num">6</div><h3>PO raise &amp; supply confirmation</h3></div>
          ${o.lifecycle==='draft' ? `
            <div class="part-po-note" id="poReadyNote" style="background:var(--neutral-tint);color:var(--ink-soft);">${detailComplete(o) ? 'All required details are filled in.' : 'Fill fabric SKU, fabric name, placement, finish and design confirmation before this can be raised.'}</div>
            ${canEditDetail ? `<button class="btn btn-primary" id="submitPoDetail" ${detailComplete(o)?'':'disabled'} style="margin-top:10px;">Raise PO</button>` : ''}
          ` : o.lifecycle==='submitted' ? `
            <div class="part-po-note" style="background:var(--warn-tint);color:var(--warn);">Submitted by ${o.submittedBy} on ${fmtDT(o.submittedAt)} — waiting on supply to raise this in the ERP and confirm back here.</div>
            ${canConfirmSupply ? `<div class="field-grid" style="margin-top:10px;"><div class="field"><label>PO raised on</label><input id="po_raised_date" type="date" value="${todayStr()}"></div></div><button class="btn btn-primary" id="confirmPoDetail" style="margin-top:10px;">Confirm PO raised</button>` : ''}
          ` : `
            <div class="part-po-note" style="background:var(--good-tint);color:var(--good);">PO raised ${fmtDate(o.poRaisedDate)}, confirmed by ${o.poConfirmedBy}.</div>
          `}
        </div>

        ${o.lifecycle==='po_confirmed' ? `
        <div class="form-section">
          <div class="fs-head"><div class="fs-num">7</div><h3>Clarifications <span class="opt" style="text-transform:none;font-weight:500;">— production's review window ${clarificationWindowOpen(o) ? `closes ${fmtDate(clarificationWindowEnd(o))}` : `closed ${fmtDate(clarificationWindowEnd(o))}`}</span></h3></div>
          ${renderClarifications(o, canRespondClarification)}
          ${canRaiseClarification ? `
            <div class="field-grid" style="margin-top:12px;"><div class="field span2"><textarea id="new_clarification" rows="2" placeholder="What needs clarifying on this SKU before production can start?"></textarea></div></div>
            <button class="btn btn-ghost btn-sm" id="submitClarification" style="margin-top:8px;">Raise clarification</button>
          ` : ''}
        </div>
        <div class="form-section">
          <div class="fs-head"><div class="fs-num">8</div><h3>Production planning</h3></div>
          <div class="part-po-note" style="background:${productionCanStart(o)?'var(--good-tint)':'var(--warn-tint)'};color:${productionCanStart(o)?'var(--good)':'var(--warn)'};">
            ${productionCanStart(o) ? 'All clarifications closed — factory can begin production on this SKU.' : `Blocked — ${openClarifications(o).length} open clarification(s) must be closed by sales before factory can start.`}
          </div>
          ${o.productionDeadline ? `
            <div class="order-facts" style="margin-top:10px;border-radius:9px;">
              <div><div class="f-k">Production deadline</div><div class="f-v">${fmtDate(o.productionDeadline)}</div></div>
              <div><div class="f-k">Sales readiness date</div><div class="f-v mono">${fmtDate(readinessDate(o))}</div></div>
              <div><div class="f-k">Earliest dispatch</div><div class="f-v" style="font-weight:500;color:var(--ink-faint);">Deadline + 5 working days</div></div>
            </div>
          ` : `<div class="empty-note" style="padding:14px;">No production deadline yet — it's read automatically off this SKU's linked Job Card once its Packing stage records a completion date.</div>`}
          ${o.pendingDeadlineChange ? `<div class="readonly-banner" style="margin-top:10px;">${icon('lock')} A deadline change (${o.pendingDeadlineChange.oldValue?fmtDate(o.pendingDeadlineChange.oldValue):'—'} &rarr; ${fmtDate(o.pendingDeadlineChange.newValue)}) is awaiting admin sign-off.</div>` : ''}
          <button class="btn-text" data-goto-deadlines="${o.id}" style="margin-top:10px;">Manage in Order Deadlines &rarr;</button>
        </div>` : ''}
      </div>

      <div class="detail-foot">

function fabricTabsForRole(){
  const t = canEditSection('fabric', state.role) ? (FABRIC_TABS_ACCESS[state.role] || []) : [];
  return [...t, 'log'];
}
function renderFabricStation(){
  const tabs = fabricTabsForRole();
  if (!state.fabricTab || !tabs.includes(state.fabricTab)) state.fabricTab = tabs[0];
  // Live tool's own tab names — "Intake / Dispatch / Receiving / Logbook" — kept exact so
  // staff who already know that tool aren't looking at renamed controls here.
  const tabLabels = { intake:'Intake', dispatch:'Dispatch', receive:'Receiving', log:'Logbook' };

  let body = '';
  if (state.fabricTab === 'intake') body = renderFabricIntake();
  else if (state.fabricTab === 'dispatch') body = renderFabricDispatch();
  else if (state.fabricTab === 'receive') body = renderFabricReceive();
  else body = renderFabricLog();

  const totalLogged = FABRIC_ENTRIES.length;
  const addedToday = FABRIC_ENTRIES.filter(e => (e.addedAt||'').slice(0,10) === todayStr()).length;

  return `
    <div class="fts-scope">
      <div class="fts-head">

          <div class="fts-title">Furnishings Tag <span class="accent">Station</span></div>

        </div>
        <div class="fts-stats">

      </div>
      <div class="fts-tabs">${tabs.map(t => `<button data-fabtab="${t}" aria-pressed="${state.fabricTab===t}">${tabLabels[t]}${t==='receive'&&fabricBadgeForRole('production')>0?` (${fabricBadgeForRole('production')})`:''}</button>`).join('')}</div>

  `;
}
